itle=\"在物品大全中打開\">赤龍牙</span>（攻擊 +270，敏捷 +2，炎灼 8 回合）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"水象晶礦@3080\" title=\"在物品大全中打開\">水象晶礦</span>：<span class=\"jump items\" data-view=\"items\" data-detail=\"封雪刃@3218\" title=\"在物品大全中打開\">封雪刃</span>（攻擊 +270，防禦 +2，冰凍 4 回合）</li></ul>"}, {"chapter": "赤貫星", "title": "伏羲宮殿", "text": "伏羲宮殿\n# 流程\n1. 往東到伏羲宮殿，進去前先把阿雪全身的裝備卸下。\n2. 靖仇想起古月聖說過，這裡可以用天女白玉輪復活死者。古月聖說只要過世七天內、還沒投胎轉世就可以。玉兒去世到今天剛好第七天，靖仇懇求復活玉兒。\n3. 古月聖不贊成：要借伏羲琴與女媧石之力，以阿雪現在的狀態再耗損下去，重則影響封印大計，輕則阿雪會被打回原形，至少一甲子無法恢復。\n4. 和眾人說話後靖仇決定放棄，阿雪卻苦求古月聖。這時依好感度分成兩種結局，見結局與好感度：\n   - 阿雪結局：靖仇顧全大局，勸阿雪放棄，阿雪含淚放棄。兩人和玉兒道別，收起水晶棺，玉兒永久離隊。\n   - 玉兒結局：古月聖拗不過阿雪，答應事後盡力幫她恢復。把伏羲琴放在八卦的右上角，水晶棺放在中央，古月聖發動天女白玉輪，玉兒復活，阿雪昏倒，雖經古月聖調養仍極為虛弱。玉兒加入，阿雪永久離隊。\n5. 往右出伏羲宮殿到水晶迷宮。", "html": "<h3>流程</h3><ol><li>往東到伏羲宮殿，進去前先把阿雪全身的裝備卸下。</li><li>靖仇想起古月聖說過，這裡可以用天女白玉輪復活死者。古月聖說只要過世七天內、還沒投胎轉世就可以。玉兒去世到今天剛好第七天，靖仇懇求復活玉兒。</li><li>古月聖不贊成：要借伏羲琴與女媧石之力，以阿雪現在的狀態再耗損下去，重則影響封印大計，輕則阿雪會被打回原形，至少一甲子無法恢復。</li><li>和眾人說話後靖仇決定放棄，阿雪卻苦求古月聖。這時依好感度分成兩種結局，見<span class=\"goto\" data-title=\"結局與好感度\">結局與好感度</span>：<ul><li>阿雪結局：靖仇顧全大局，勸阿雪放棄，阿雪含淚放棄。兩人和玉兒道別，收起水晶棺，玉兒永久離隊。</li><li>玉兒結局：古月聖拗不過阿雪，答應事後盡力幫她恢復。把伏羲琴放在八卦的右上角，水晶棺放在中央，古月聖發動天女白玉輪，玉兒復活，阿雪昏倒，雖經古月聖調養仍極為虛弱。玉兒加入，阿雪永久離隊。</li></ul></li><li>往右出伏羲宮殿到水晶迷宮。</li></ol>"}, {"chapter": "赤貫星", "title": "水晶迷宮", "text": "水晶迷宮\n# 第一區\n- 蟠桃：寶箱\n- 地脈血泉：寶箱\n- 千年蔘心丹：寶箱\n- 天珠武鎧：寶箱（每回合恢復 5% 靈力）\n# 第二區\n- 仙魄香：寶箱\n- 打倒孫悟空得工布。\n- 相柳可偷雨皇花。\n- 要按掉機關火焰。\n# 第三區\n- 雨皇花：寶箱\n- 鳳凰羽衣：寶箱，阿雪在隊上時是光紗天衣\n- 破星之閻：寶箱\n- 黃龍雲紋珮：寶箱（男性最好的飾品）\n# 第四區（右）\n- 空夢殘月：寶箱，阿雪在隊上時是三境仙環\n- 泰阿：寶箱\n- 麒麟竭：寶箱\n- 經右下的傳送點到第二區，按掉機關火焰，回頭進中央之柱。\n# 中央之柱\n- 鬼雲：柱子後面（隱藏）（最好的頭盔）\n- 這時通天塔頂，陳輔正為靖仇的轉變傷心，寧珂出現給他撒旦之果，帶他也上了赤貫星。往左進第四區（左）。\n# 第四區（左）\n- 鹿茸膏：寶箱\n- 龍睛法戒：寶箱\n- 修羅膀腕：寶箱\n- 帶火風輪：寶箱\n- 閻后鞋：寶箱，阿雪在隊上時是流光鞋\n- 經左下的傳送點到第二區，按掉機關火焰，進左邊的傳送點，就會出現新的傳送點，傳到第五區。\n# 第五區\n- 蟠桃：寶箱\n- 混天泥鞋：寶箱\n- 千佛鐲：寶箱\n- 天烈雲氣：寶箱，阿雪在隊上時是神霄金圈\n- 進失卻之陣，宇文拓先去佈陣，和眾人說話後把神器放進陣中。接下來見結局。", "html": "<h3>第一區</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"蟠桃@3019\" title=\"在物品大全中打開\">蟠桃</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"地脈血泉@3033\" title=\"在物品大全中打開\">地脈血泉</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"千年蔘心丹@3005\" title=\"在物品大全中打開\">千年蔘心丹</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天珠武鎧@3321\" title=\"在物品大全中打開\">天珠武鎧</span>：寶箱（每回合恢復 5% 靈力）</li></ul><h3>第二區</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"仙魄香@3014\" title=\"在物品大全中打開\">仙魄香</span>：寶箱</li><li>打倒<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"孫悟空@112\" title=\"在神魔異事錄中打開\">孫悟空</span>得<span class=\"jump items\" data-view=\"items\" data-detail=\"工布@3216\" title=\"在物品大全中打開\">工布</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"相柳@145\" title=\"在神魔異事錄中打開\">相柳</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"雨皇花@3089\" title=\"在物品大全中打開\">雨皇花</span>。</li><li>要按掉機關火焰。</li></ul><h3>第三區</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"雨皇花@3089\" title=\"在物品大全中打開\">雨皇花</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鳳凰羽衣@3322\" title=\"在物品大全中打開\">鳳凰羽衣</span>：寶箱，阿雪在隊上時是<span class=\"jump items\" data-view=\"items\" data-detail=\"光紗天衣@3324\" title=\"在物品大全中打開\">光紗天衣</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"破星之閻@3241\" title=\"在物品大全中打開\">破星之閻</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"黃龍雲紋珮@3396\" title=\"在物品大全中打開\">黃龍雲紋珮</span>：寶箱（男性最好的飾品）</li></ul><h3>第四區（右）</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"空夢殘月@3253\" title=\"在物品大全中打開\">空夢殘月</span>：寶箱，阿雪在隊上時是<span class=\"jump items\" data-view=\"items\" data-detail=\"三境仙環@3230\" title=\"在物品大全中打開\">三境仙環</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"泰阿@3215\" title=\"在物品大全中打開\">泰阿</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"麒麟竭@3010\" title=\"在物品大全中打開\">麒麟竭</span>：寶箱</li><li>經右下的傳送點到第二區，按掉機關火焰，回頭進中央之柱。</li></ul><h3>中央之柱</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鬼雲@3292\" title=\"在物品大全中打開\">鬼雲</span>：柱子後面（隱藏）（最好的頭盔）</li><li>這時通天塔頂，陳輔正為靖仇的轉變傷心，寧珂出現給他撒旦之果，帶他也上了赤貫星。往左進第四區（左）。</li></ul><h3>第四區（左）</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"龍睛法戒@3397\" title=\"在物品大全中打開\">龍睛法戒</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"修羅膀腕@3351\" title=\"在物品大全中打開\">修羅膀腕</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"帶火風輪@3374\" title=\"在物品大全中打開\">帶火風輪</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"閻后鞋@3377\" title=\"在物品大全中打開\">閻后鞋</span>：寶箱，阿雪在隊上時是<span class=\"jump items\" data-view=\"items\" data-detail=\"流光鞋@3375\" title=\"在物品大全中打開\">流光鞋</span></li><li>經左下的傳送點到第二區，按掉機關火焰，進左邊的傳送點，就會出現新的傳送點，傳到第五區。</li></ul><h3>第五區</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"蟠桃@3019\" title=\"在物品大全中打開\">蟠桃</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"混天泥鞋@3376\" title=\"在物品大全中打開\">混天泥鞋</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"千佛鐲@3353\" title=\"在物品大全中打開\">千佛鐲</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天烈雲氣@3255\" title=\"在物品大全中打開\">天烈雲氣</span>：寶箱，阿雪在隊上時是<span class=\"jump items\" data-view=\"items\" data-detail=\"神霄金圈@3231\" title=\"在物品大全中打開\">神霄金圈</span></li><li>進失卻之陣，宇文拓先去佈陣，和眾人說話後把神器放進陣中。接下來見<span class=\"goto\" data-title=\"結局\">結局</span>。</li></ul>"}, {"chapter": "赤貫星", "title": "結局", "text": "結局\n# 共同\n1. 要開始行陣時，獨孤寧珂出現阻止，打倒她（獨孤寧珂可偷活靈芝），得到：\n   - 霞雲彩綾（最好的鞋）\n   - 天仙神衣\n   - 天神戰袍\n   - 九龍雲生冑\n   - 無空霸海（張烈最強的武器）\n   - 神術（玉兒最強的武器，只有玉兒結局）\n2. 寧珂臨死希望宇文拓帶她回西方的故鄉，古月聖把她收進伏羲琴，淨化她的靈魂，讓她轉世時不受魔界污染（她就是三代的妮可）。\n3. 有人在破壞赤貫星的中央支柱，前去一看竟是陳輔。他吃下整顆撒旦魔果後發狂，靖仇只好打倒魔化師父（魔化師父可偷蟠桃）。靖仇為師父的死悲痛不已。\n# 阿雪結局\n1. 靖仇忽然進入幻境：玉兒為了告訴靖仇真相，願以七世陽壽都只到二十歲為代價，求天神讓她前來。兩人回憶前塵往事後，玉兒投胎轉世，不再有前生的記憶。\n2. 臨走前玉兒為靖仇彈了一曲。靖仇回到現實，怕忘了這首曲子，求古月聖幫忙記下樂譜。\n3. 和眾人說話後行陣，封補赤貫星劃破的天空裂痕，靖仇對玉兒的記憶從此消失。\n4. 天上一日，人間十年，回到人界時已是隋亡唐興。張烈找到為他守候十年的月兒，兩人結伴遊歷神州。宇文拓自認罪孽深重，帶著寧珂的靈魂西行，臨行前和靖仇互換軒轅劍與煉妖壺做紀念。\n5. 靖仇和阿雪在終南山下為師父立了衣冠塚。兩人奏起玉兒臨別的曲子，一個貌似玉兒的女童經過，阿雪只能衷心盼望玉兒將來幸福。\n# 玉兒結局\n1. 回到失卻之陣，和古月聖說話後發動失卻之陣，封補赤貫星劃破的天空裂痕。\n2. 朦朧中靖仇看到阿雪：失卻之陣吃掉了靖仇對師父的記憶。阿雪向靖仇道別，她已撐不下去了。\n3. 行陣完後阿雪果然變回女媧石。阿雪用神器之力和靖仇接觸，以六百年的功力恢復靖仇對師父的記憶，從此永別。\n4. 天上一日，人間十年，回到人界時已是隋亡唐興。張烈和月兒結伴遊歷神州，宇文拓帶著寧珂的靈魂西行。\n5. 靖仇和玉兒結為連理，在終南山下供奉女媧石與師父的衣冠塚，時人稱為劍俠夫妻。六百年後，常有人看到一位白髮仙女在劍俠夫妻墓前獻花。", "html": "<h3>共同</h3><ol><li>要開始行陣時，<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"獨孤寧珂@10\" title=\"在神魔異事錄中打開\">獨孤寧珂</span>出現阻止，打倒她（<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"獨孤寧珂@10\" title=\"在神魔異事錄中打開\">獨孤寧珂</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"活靈芝@3039\" title=\"在物品大全中打開\">活靈芝</span>），得到：<ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"霞雲彩綾@3378\" title=\"在物品大全中打開\">霞雲彩綾</span>（最好的鞋）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天仙神衣@3327\" title=\"在物品大全中打開\">天仙神衣</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天神戰袍@3326\" title=\"在物品大全中打開\">天神戰袍</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"九龍雲生冑@3323\" title=\"在物品大全中打開\">九龍雲生冑</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"無空霸海@3242\" title=\"在物品大全中打開\">無空霸海</span>（張烈最強的武器）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神術@3256\" title=\"在物品大全中打開\">神術</span>（玉兒最強的武器，只有玉兒結局）</li></ul></li><li>寧珂臨死希望宇文拓帶她回西方的故鄉，古月聖把她收進伏羲琴，淨化她的靈魂，讓她轉世時不受魔界污染（她就是三代的妮可）。</li><li>有人在破壞赤貫星的中央支柱，前去一看竟是陳輔。他吃下整顆撒旦魔果後發狂，靖仇只好打倒<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"魔化師父@6\" title=\"在神魔異事錄中打開\">魔化師父</span>（<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"魔化師父@6\" title=\"在神魔異事錄中打開\">魔化師父</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"蟠桃@3019\" title=\"在物品大全中打開\">蟠桃</span>）。靖仇為師父的死悲痛不已。</li></ol><h3>阿雪結局</h3><ol><li>靖仇忽然進入幻境：玉兒為了告訴靖仇真相，願以七世陽壽都只到二十歲為代價，求天神讓她前來。兩人回憶前塵往事後，玉兒投胎轉世，不再有前生的記憶。</li><li>臨走前玉兒為靖仇彈了一曲。靖仇回到現實，怕忘了這首曲子，求古月聖幫忙記下樂譜。</li><li>和眾人說話後行陣，封補赤貫星劃破的天空裂痕，靖仇對玉兒的記憶從此消失。</li><li>天上一日，人間十年，回到人界時已是隋亡唐興。張烈找到為他守候十年的月兒，兩人結伴遊歷神州。宇文拓自認罪孽深重，帶著寧珂的靈魂西行，臨行前和靖仇互換軒轅劍與煉妖壺做紀念。</li><li>靖仇和阿雪在終南山下為師父立了衣冠塚。兩人奏起玉兒臨別的曲子，一個貌似玉兒的女童經過，阿雪只能衷心盼望玉兒將來幸福。</li></ol><h3>玉兒結局</h3><ol><li>回到失卻之陣，和古月聖說話後發動失卻之陣，封補赤貫星劃破的天空裂痕。</li><li>朦朧中靖仇看到阿雪：失卻之陣吃掉了靖仇對師父的記憶。阿雪向靖仇道別，她已撐不下去了。</li><li>行陣完後阿雪果然變回女媧石。阿雪用神器之力和靖仇接觸，以六百年的功力恢復靖仇對師父的記憶，從此永別。</li><li>天上一日，人間十年，回到人界時已是隋亡唐興。張烈和月兒結伴遊歷神州，宇文拓帶著寧珂的靈魂西行。</li><li>靖仇和玉兒結為連理，在終南山下供奉女媧石與師父的衣冠塚，時人稱為劍俠夫妻。六百年後，常有人看到一位白髮仙女在劍俠夫妻墓前獻花。</li></ol>"}, {"chapter": "系列任務", "title": "DOMO工作室", "text": "DOMO工作室\n# 概要\n- 工作室在天外村左上的水井下面。第一次下井和郭炳宏說話，他會請你把失散的十五名組員找回來。\n- 組員在遊戲一開始就被藏起來，接下任務後才出現在各地。\n- 十五人歸隊後再和郭炳宏說話，得玉佛印（可以無限使用）和投幣式鎧甲，只給一次。\n- 青衫的攻略說要在通天塔頂和宇文拓開打之前完成，之後就做不了了。\n# 原版的錯字：羅國成可以不找\n- 郭炳宏清點十五個人時，羅國成那一項的旗標號碼寫錯了，檢查的是森林軍營主線一定會設上的旗標。\n- 所以羅國成找不找都不影響領獎，另外十四人到齊就能領。OpenSWD3e 照原版保留這個錯誤。\n# 白天與夜晚\n- 每次下井，一半機會是白天、一半是夜晚，看窗外的景色就知道。拿不到想要的東西，就出去再下一次。\n- 白天：最右邊的角落有呼拉圈（隱藏）（阿雪最強的武器，熟練後攻擊力很高，但不容易練）。\n- 夜晚：左上的電腦有怪圖二，中央的電腦有怪圖一（隱藏）。小業子歸隊後坐在最右邊，也只有夜晚找得到他。\n- 郭炳宏白天、夜晚都在，接任務、領獎都可以。\n- 中央電腦旁那台電腦要四位數密碼，輸入 1202 可以看一組圖片。\n# 工作室裡的其他獎勵\n- 小業子（夜晚）：問你會不會買《軒轅伏魔錄》，只問一次。\n   - 選「一定會去買」：得白色藥材\n   - 選「不去買」：全隊每人扣 500 點生命\n- 鮑弘修：歸隊後和他說話可以加入「阿鮑壽險」，要交 10 個神祕果。青衫的攻略說，隊伍全滅時他會跳出來理賠，但遊戲照樣結束，所以沒有實際用處。", "html": "<h3>概要</h3><ul><li>工作室在天外村左上的水井下面。第一次下井和郭炳宏說話，他會請你把失散的十五名組員找回來。</li><li>組員在遊戲一開始就被藏起來，接下任務後才出現在各地。</li><li>十五人歸隊後再和郭炳宏說話，得<span class=\"jump items\" data-view=\"items\" data-detail=\"玉佛印@3048\" title=\"在物品大全中打開\">玉佛印</span>（可以無限使用）和<span class=\"jump items\" data-view=\"items\" data-detail=\"投幣式鎧甲@3180\" title=\"在物品大全中打開\">投幣式鎧甲</span>，只給一次。</li><li>青衫的攻略說要在通天塔頂和宇文拓開打之前完成，之後就做不了了。</li></ul><h3>原版的錯字：羅國成可以不找</h3><ul><li>郭炳宏清點十五個人時，羅國成那一項的旗標號碼寫錯了，檢查的是森林軍營主線一定會設上的旗標。</li><li>所以羅國成找不找都不影響領獎，另外十四人到齊就能領。OpenSWD3e 照原版保留這個錯誤。</li></ul><h3>白天與夜晚</h3><ul><li>每次下井，一半機會是白天、一半是夜晚，看窗外的景色就知道。拿不到想要的東西，就出去再下一次。</li><li>白天：最右邊的角落有<span class=\"jump items\" data-view=\"items\" data-detail=\"呼拉圈@3232\" title=\"在物品大全中打開\">呼拉圈</span>（隱藏）（阿雪最強的武器，熟練後攻擊力很高，但不容易練）。</li><li>夜晚：左上的電腦有<span class=\"jump items\" data-view=\"items\" data-detail=\"怪圖二@3193\" title=\"在物品大全中打開\">怪圖二</span>，中央的電腦有<span class=\"jump items\" data-view=\"items\" data-detail=\"怪圖一@3192\" title=\"在物品大全中打開\">怪圖一</span>（隱藏）。小業子歸隊後坐在最右邊，也只有夜晚找得到他。</li><li>郭炳宏白天、夜晚都在，接任務、領獎都可以。</li><li>中央電腦旁那台電腦要四位數密碼，輸入 1202 可以看一組圖片。</li></ul><h3>工作室裡的其他獎勵</h3><ul><li>小業子（夜晚）：問你會不會買《軒轅伏魔錄》，只問一次。<ul><li>選「一定會去買」：得<span class=\"jump items\" data-view=\"items\" data-detail=\"白色藥材@3086\" title=\"在物品大全中打開\">白色藥材</span></li><li>選「不去買」：全隊每人扣 500 點生命</li></ul></li><li>鮑弘修：歸隊後和他說話可以加入「阿鮑壽險」，要交 10 個<span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>。青衫的攻略說，隊伍全滅時他會跳出來理賠，但遊戲照樣結束，所以沒有實際用處。</li></ul>"}, {"chapter": "系列任務", "title": "DOMO組員", "text": "DOMO組員\n十五名組員，按劇情能走到的先後排列。每人歸隊後會回到 DOMO 工作室。\n# 楊淵升（天外村）\n1. 第一次從工作室出井，和井邊的楊淵升說話，他說迷路了回不了 DOMO。\n2. 再下一次水井，他就跟著回工作室，歸隊。\n# 黃志榮（仙山島小灣）\n1. 坐小鯨魚到仙山島右下角的小灣，找到黃志榮。\n2. 第一次說話他不肯回去，再和他說一次，他就答應歸隊。\n# 楊志豪（龍宮密道）\n1. 到氐人國轉進東海海底，進龍宮左邊的貝殼（龍宮密道），找到楊志豪。\n2. 他要你猜他最喜歡的活動，四個選項是跳舞、聯誼、游泳、爬山，選「游泳」就歸隊。\n3. 猜錯會被傳到密道的別處，回去找他可以再猜。\n- 龍宮密道裡還有神祕果（寶箱）。\n# 羅國成（江都）\n這一位可以不找，見DOMO工作室。\n1. 在江都河邊和羅國成說話，他想要一個江南美女當女朋友。\n2. 和左下玩球的小女孩說話，再到東邊的屋子找雨虹。\n3. 雨虹答應見面後會搬到江都搭小船的地方，回河邊和羅國成說話，他就帶雨虹回工作室。\n# 小業子（大梁城）\n1. 用石敢神石回大梁，和掛著的小業子說話。\n2. 他先開玩笑要一千萬兩，兩個選項都可以選。（只有銀兩真的超過 9,999,999 兩，也就是改過錢的時候，選「給你一千萬！」他會說你用改的，然後永遠離開。）\n3. 猜拳要連贏三次，他每一拳都是隨機出的。輸了就重來，也可以先存檔，輸了讀檔。\n4. 連贏三次得金塊，小業子歸隊。\n# 陳盈君（大梁客棧二樓）\n1. 到大梁客棧二樓，花 2000 兩向老闆的女兒買下石貓。銀兩不到 2000 買不了。\n2. 調查石貓，使用溶石魔羽，石貓變回小貓，就是陳盈君，歸隊。\n- 溶石魔羽：\n   1. 天外村藥鋪、洛陽雜貨店，120 兩\n   2. 海中建木（寶箱）\n# 王福生（寒音剎）\n1. 從長沙西北的神樹進寒音剎祕密水道，到寒音剎裡面找到王福生，他被巫山神女關住了。\n2. 四個選項選「送給他一隻符紙鶴」，身上要有符紙鶴，他用符紙鶴出去，歸隊。選其他選項他不會回去。\n- 符紙鶴：各地雜貨店 50 兩。\n# 林克敏（巴蜀古王墓）\n1. 進古王墓後，第一個彎道右轉直走，進黑色背景的隱藏步道傳送，找到林克敏。\n2. 他要你打贏他的寵物。打贏後歸隊。\n3. 檮杌的條件都達成的話，出現的寵物是檮杌，見隱藏頭目。\n# 林耀元（天外村）\n1. 進天外村入口左邊的房子，牆上有個看不見的人，就是林耀元，他身上的貼圖不見了。\n2. 帶三滴材質片回來給他，歸隊。\n- 三滴材質片：大興利人市蘭律閣猜謎第四題「爆竹」，見大興的支線。\n# 鮑弘修（煉妖壺）\n1. 工作室裡有個一直「哇哈哈哈」笑的組員，和他說話，聽他笑完，他會告訴你鮑弘修被困在煉妖壺裡。這一步可以跳過。\n2. 拿到糖葫蘆：大興，依序調查四塊招牌，見大興的支線。\n3. 用煉妖壺收一隻黏怪，豆子坑、魔王砦一帶遇得到。\n4. 在煉妖壺裡用糖葫蘆加黏怪，煉出「鮑弘修」（固定配方）。\n5. 帶著煉出的鮑弘修回 DOMO 工作室，他回到自己的位子上，歸隊。\n# 張孝全（靈武迷津沙）\n1. 在靈武和賀連碧說話，到迷津沙綠洲找她的父親，回靈武再說話，得渡沙之珠，見靈武與玉兒之死。\n2. 回迷津沙綠洲往右穿過迷津沙（沒有渡沙之珠要多走五個畫面），找到張孝全。\n3. 他要七千兩。選「可恨，不給就不能達成DOMO任務」，身上要有 7000 兩，付錢後歸隊。選另一個或錢不夠，就不會回去。\n# 吳東興（雲崗石窟）\n1. 雲崗石窟入口前一團黑黑的地方，左轉進隱藏的洞穴，找到吳東興。\n2. 他要三種慧星碎片，選「有」，三種都在身上就收下，歸隊。\n- 綠色慧星碎片：大興獨孤郡王府涼亭的右下（隱藏），要先聽利人市酒樓二樓的奸商和貪官說話，見大興的支線。\n- 黃色慧星碎片：巴蜀古王墓，上下分岔路走上面，下一個場景箱子右邊的牆中間附近穿過去（寶箱），見巴蜀古王墓。\n- 藍色慧星碎片：巴蜀古王墓映月之光以後、遇得到布妖的場景，地仙問「移動一個數字讓 62-60=4 成立」，選最左邊的「６」（2 的 6 次方減 60 等於 4）。\n# 高玉玫（洛陽上御客棧）\n1. 到洛陽的上御客棧找高玉玫，她要你念對一首迴文詩。\n2. 詩是「南飛雁過樓，雁過樓前去，前樓過雁飛，過雁飛南遠」。依序點選這二十個字，全部點對就歸隊；點錯可以再試。\n3. 身上有 50 個以上的神祕果時（正常玩最多只有 11 個），她會說你改過遊戲，永遠不回去。\n# 劉馨韓（大興獨孤家道觀）\n1. 和洛陽怡春院的老鴇說話幾次，得知月娃被郡主關住了。\n2. 到大興的獨孤家道觀（宇文太師府後面），打倒怪物救出月娃，得 99 套軒轅伏魔錄。\n3. 和道觀裡的劉馨韓說話，交出九種果子各一個，她會收走，歸隊。果子哪裡拿見DOMO的果子。\n# 朱榮敏（長沙海灘）\n1. 到長沙往右走到海灘，找到朱榮敏。\n2. 他問你有沒有 99 套軒轅伏魔錄，身上有 99 套時選「有」就歸隊。書不會收走。", "html": "<p>十五名組員，按劇情能走到的先後排列。每人歸隊後會回到 DOMO 工作室。</p><h3>楊淵升（天外村）</h3><ol><li>第一次從工作室出井，和井邊的楊淵升說話，他說迷路了回不了 DOMO。</li><li>再下一次水井，他就跟著回工作室，歸隊。</li></ol><h3>黃志榮（仙山島小灣）</h3><ol><li>坐小鯨魚到仙山島右下角的小灣，找到黃志榮。</li><li>第一次說話他不肯回去，再和他說一次，他就答應歸隊。</li></ol><h3>楊志豪（龍宮密道）</h3><ol><li>到氐人國轉進東海海底，進龍宮左邊的貝殼（龍宮密道），找到楊志豪。</li><li>他要你猜他最喜歡的活動，四個選項是跳舞、聯誼、游泳、爬山，選「游泳」就歸隊。</li><li>猜錯會被傳到密道的別處，回去找他可以再猜。</li></ol><ul><li>龍宮密道裡還有<span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>（寶箱）。</li></ul><h3>羅國成（江都）</h3><p>這一位可以不找，見<span class=\"goto\" data-title=\"DOMO工作室\">DOMO工作室</span>。</p><ol><li>在江都河邊和羅國成說話，他想要一個江南美女當女朋友。</li><li>和左下玩球的小女孩說話，再到東邊的屋子找雨虹。</li><li>雨虹答應見面後會搬到江都搭小船的地方，回河邊和羅國成說話，他就帶雨虹回工作室。</li></ol><h3>小業子（大梁城）</h3><ol><li>用<span class=\"jump items\" data-view=\"items\" data-detail=\"石敢神石@3046\" title=\"在物品大全中打開\">石敢神石</span>回大梁，和掛著的小業子說話。</li><li>他先開玩笑要一千萬兩，兩個選項都可以選。（只有銀兩真的超過 9,999,999 兩，也就是改過錢的時候，選「給你一千萬！」他會說你用改的，然後永遠離開。）</li><li>猜拳要連贏三次，他每一拳都是隨機出的。輸了就重來，也可以先存檔，輸了讀檔。</li><li>連贏三次得<span class=\"jump items\" data-view=\"items\" data-detail=\"金塊@3063\" title=\"在物品大全中打開\">金塊</span>，小業子歸隊。</li></ol><h3>陳盈君（大梁客棧二樓）</h3><ol><li>到大梁客棧二樓，花 2000 兩向老闆的女兒買下石貓。銀兩不到 2000 買不了。</li><li>調查石貓，使用<span class=\"jump items\" data-view=\"items\" data-detail=\"溶石魔羽@3030\" title=\"在物品大全中打開\">溶石魔羽</span>，石貓變回小貓，就是陳盈君，歸隊。</li></ol><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"溶石魔羽@3030\" title=\"在物品大全中打開\">溶石魔羽</span>：<ol><li>天外村藥鋪、洛陽雜貨店，120 兩</li><li>海中建木（寶箱）</li></ol></li></ul><h3>王福生（寒音剎）</h3><ol><li>從長沙西北的神樹進寒音剎祕密水道，到寒音剎裡面找到王福生，他被巫山神女關住了。</li><li>四個選項選「送給他一隻符紙鶴」，身上要有<span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span>，他用符紙鶴出去，歸隊。選其他選項他不會回去。</li></ol><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span>：各地雜貨店 50 兩。</li></ul><h3>林克敏（巴蜀古王墓）</h3><ol><li>進古王墓後，第一個彎道右轉直走，進黑色背景的隱藏步道傳送，找到林克敏。</li><li>他要你打贏他的寵物。打贏後歸隊。</li><li>檮杌的條件都達成的話，出現的寵物是<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"檮杌@55\" title=\"在神魔異事錄中打開\">檮杌</span>，見<span class=\"goto\" data-title=\"隱藏頭目\">隱藏頭目</span>。</li></ol><h3>林耀元（天外村）</h3><ol><li>進天外村入口左邊的房子，牆上有個看不見的人，就是林耀元，他身上的貼圖不見了。</li><li>帶<span class=\"jump items\" data-view=\"items\" data-detail=\"三滴材質片@3150\" title=\"在物品大全中打開\">三滴材質片</span>回來給他，歸隊。</li></ol><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"三滴材質片@3150\" title=\"在物品大全中打開\">三滴材質片</span>：大興利人市蘭律閣猜謎第四題「爆竹」，見<span class=\"goto\" data-title=\"大興的支線\">大興的支線</span>。</li></ul><h3>鮑弘修（煉妖壺）</h3><ol><li>工作室裡有個一直「哇哈哈哈」笑的組員，和他說話，聽他笑完，他會告訴你鮑弘修被困在煉妖壺裡。這一步可以跳過。</li><li>拿到<span class=\"jump items\" data-view=\"items\" data-detail=\"糖葫蘆@3191\" title=\"在物品大全中打開\">糖葫蘆</span>：大興，依序調查四塊招牌，見<span class=\"goto\" data-title=\"大興的支線\">大興的支線</span>。</li><li>用煉妖壺收一隻<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"黏怪@216\" title=\"在神魔異事錄中打開\">黏怪</span>，豆子坑、魔王砦一帶遇得到。</li><li>在煉妖壺裡用<span class=\"jump items\" data-view=\"items\" data-detail=\"糖葫蘆@3191\" title=\"在物品大全中打開\">糖葫蘆</span>加<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"黏怪@216\" title=\"在神魔異事錄中打開\">黏怪</span>，煉出「鮑弘修」（固定配方）。</li><li>帶著煉出的鮑弘修回 DOMO 工作室，他回到自己的位子上，歸隊。</li></ol><h3>張孝全（靈武迷津沙）</h3><ol><li>在靈武和賀連碧說話，到迷津沙綠洲找她的父親，回靈武再說話，得<span class=\"jump items\" data-view=\"items\" data-detail=\"渡沙之珠@3142\" title=\"在物品大全中打開\">渡沙之珠</span>，見<span class=\"goto\" data-title=\"靈武與玉兒之死\">靈武與玉兒之死</span>。</li><li>回迷津沙綠洲往右穿過迷津沙（沒有渡沙之珠要多走五個畫面），找到張孝全。</li><li>他要七千兩。選「可恨，不給就不能達成DOMO任務」，身上要有 7000 兩，付錢後歸隊。選另一個或錢不夠，就不會回去。</li></ol><h3>吳東興（雲崗石窟）</h3><ol><li>雲崗石窟入口前一團黑黑的地方，左轉進隱藏的洞穴，找到吳東興。</li><li>他要三種慧星碎片，選「有」，三種都在身上就收下，歸隊。</li></ol><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"綠色慧星碎片@3187\" title=\"在物品大全中打開\">綠色慧星碎片</span>：大興獨孤郡王府涼亭的右下（隱藏），要先聽利人市酒樓二樓的奸商和貪官說話，見<span class=\"goto\" data-title=\"大興的支線\">大興的支線</span>。</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"黃色慧星碎片@3188\" title=\"在物品大全中打開\">黃色慧星碎片</span>：巴蜀古王墓，上下分岔路走上面，下一個場景箱子右邊的牆中間附近穿過去（寶箱），見<span class=\"goto\" data-title=\"巴蜀古王墓\">巴蜀古王墓</span>。</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"藍色慧星碎片@3189\" title=\"在物品大全中打開\">藍色慧星碎片</span>：巴蜀古王墓映月之光以後、遇得到<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"布妖@160\" title=\"在神魔異事錄中打開\">布妖</span>的場景，<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"地仙@129\" title=\"在神魔異事錄中打開\">地仙</span>問「移動一個數字讓 62-60=4 成立」，選最左邊的「６」（2 的 6 次方減 60 等於 4）。</li></ul><h3>高玉玫（洛陽上御客棧）</h3><ol><li>到洛陽的上御客棧找高玉玫，她要你念對一首迴文詩。</li><li>詩是「南飛雁過樓，雁過樓前去，前樓過雁飛，過雁飛南遠」。依序點選這二十個字，全部點對就歸隊；點錯可以再試。</li><li>身上有 50 個以上的<span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>時（正常玩最多只有 11 個），她會說你改過遊戲，永遠不回去。</li></ol><h3>劉馨韓（大興獨孤家道觀）</h3><ol><li>和洛陽怡春院的老鴇說話幾次，得知月娃被郡主關住了。</li><li>到大興的獨孤家道觀（宇文太師府後面），打倒怪物救出月娃，得 99 套<span class=\"jump items\" data-view=\"items\" data-detail=\"軒轅伏魔錄@3190\" title=\"在物品大全中打開\">軒轅伏魔錄</span>。</li><li>和道觀裡的劉馨韓說話，交出九種果子各一個，她會收走，歸隊。果子哪裡拿見<span class=\"goto\" data-title=\"DOMO的果子\">DOMO的果子</span>。</li></ol><h3>朱榮敏（長沙海灘）</h3><ol><li>到長沙往右走到海灘，找到朱榮敏。</li><li>他問你有沒有 99 套<span class=\"jump items\" data-view=\"items\" data-detail=\"軒轅伏魔錄@3190\" title=\"在物品大全中打開\">軒轅伏魔錄</span>，身上有 99 套時選「有」就歸隊。書不會收走。</li></ol>"}, {"chapter": "系列任務", "title": "DOMO的果子", "text": "DOMO的果子\n劉馨韓要九種果子，各交一個。這裡列出遊戲裡所有拿得到的地方。\n# 桑果\n- 月河村左邊民房門旁的籃子（隱藏）\n- 龍舟屋樑第一區（寶箱）\n- 月河村雜貨店、貨郎楊七 50 兩\n- 偷食屍鬼\n# 蟠桃\n- 巴蜀古王墓第三場景左下方，整面牆中間附近穿過去（寶箱）\n- 偷魔化師父（最後的頭目）。另外三個寶箱在第二次通天塔與水晶迷宮，都在宇文拓之戰以後。\n# 野石榴\n- 月河村雜貨店、黑山鎮藥鋪、大梁藥鋪 20 兩\n- 餓死鬼、飛頭蠻掉落\n# 嘉果\n- 仙山島崖下橋頭左邊上方（隱藏）\n- 巴蜀古王墓、海中建木、寒音剎祕密水道（寶箱）\n- 黑山鎮李瞳兒的藥材任務（只交四種時）\n- 巴蜀古王墓的古墓守護神 480 兩\n- 偷雲生獸、魔劍客\n# 凌霄果\n- 仙山島山道第二場景山崖右邊的樹（隱藏）\n- 第一次通天塔四樓（寶箱）\n- 偷英招\n# 三葉雪桑果\n- 氐人國左下屋內左上的櫃子（隱藏）\n- 大興蘭律閣猜謎第二題「風箏」\n- 天外村、江都、大興藥鋪 110 兩\n- 偷龍王、蜃氣精\n- 化蛇掉落\n# 海檬果\n- 響馬的船第三艙房（隱藏）\n- 仙山島往百草澗的路上（寶箱）\n- 大興獨孤家道觀（寶箱）\n# 山蛇莓\n- 大雁嶺第二個帳篷（隱藏）\n- 巴蜀古王墓（寶箱）\n- 全遊戲只有這兩個。黑山鎮李瞳兒的藥材任務也要一個，交給她以後記得留一個給劉馨韓。\n# 神祕果\n一共十一個，用在：\n- 劉馨韓：一個。\n- 阿鮑壽險：十個，可以不參加。\n- 高玉玫歸隊前，身上不能有 50 個以上（正常玩拿不到這麼多）。\n# 神祕果哪裡拿\n- 伏魔山內（寶箱）\n- 月河村西南民房的桶子（隱藏）\n- 大梁路口的小孩，回答「小四」\n- 響馬的船第二艙房（寶箱）\n- 貝殼海第二區（寶箱）\n- 龍宮密道（寶箱）\n- 長沙西北的寒音剎祕密水道（寶箱）\n- 洛陽市集的古維然，五色藥材各給一份\n- 第一次通天塔五樓（寶箱）\n- 螫魂塔（寶箱），宇文拓之戰以後\n- 虛空之門血腥地獄通道（寶箱），宇文拓之戰以後", "html": "<p>劉馨韓要九種果子，各交一個。這裡列出遊戲裡所有拿得到的地方。</p><h3>桑果</h3><ul><li>月河村左邊民房門旁的籃子（隱藏）</li><li>龍舟屋樑第一區（寶箱）</li><li>月河村雜貨店、貨郎楊七 50 兩</li><li>偷<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"食屍鬼@180\" title=\"在神魔異事錄中打開\">食屍鬼</span></li></ul><h3>蟠桃</h3><ul><li>巴蜀古王墓第三場景左下方，整面牆中間附近穿過去（寶箱）</li><li>偷<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"魔化師父@6\" title=\"在神魔異事錄中打開\">魔化師父</span>（最後的頭目）。另外三個寶箱在第二次通天塔與水晶迷宮，都在宇文拓之戰以後。</li></ul><h3>野石榴</h3><ul><li>月河村雜貨店、黑山鎮藥鋪、大梁藥鋪 20 兩</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"餓死鬼@182\" title=\"在神魔異事錄中打開\">餓死鬼</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"飛頭蠻@197\" title=\"在神魔異事錄中打開\">飛頭蠻</span>掉落</li></ul><h3>嘉果</h3><ul><li>仙山島崖下橋頭左邊上方（隱藏）</li><li>巴蜀古王墓、海中建木、寒音剎祕密水道（寶箱）</li><li>黑山鎮李瞳兒的藥材任務（只交四種時）</li><li>巴蜀古王墓的古墓守護神 480 兩</li><li>偷<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"雲生獸@142\" title=\"在神魔異事錄中打開\">雲生獸</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"魔劍客@157\" title=\"在神魔異事錄中打開\">魔劍客</span></li></ul><h3>凌霄果</h3><ul><li>仙山島山道第二場景山崖右邊的樹（隱藏）</li><li>第一次通天塔四樓（寶箱）</li><li>偷<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"英招@138\" title=\"在神魔異事錄中打開\">英招</span></li></ul><h3>三葉雪桑果</h3><ul><li>氐人國左下屋內左上的櫃子（隱藏）</li><li>大興蘭律閣猜謎第二題「風箏」</li><li>天外村、江都、大興藥鋪 110 兩</li><li>偷<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"龍王@139\" title=\"在神魔異事錄中打開\">龍王</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蜃氣精@171\" title=\"在神魔異事錄中打開\">蜃氣精</span></li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"化蛇@148\" title=\"在神魔異事錄中打開\">化蛇</span>掉落</li></ul><h3>海檬果</h3><ul><li>響馬的船第三艙房（隱藏）</li><li>仙山島往百草澗的路上（寶箱）</li><li>大興獨孤家道觀（寶箱）</li></ul><h3>山蛇莓</h3><ul><li>大雁嶺第二個帳篷（隱藏）</li><li>巴蜀古王墓（寶箱）</li><li>全遊戲只有這兩個。黑山鎮李瞳兒的藥材任務也要一個，交給她以後記得留一個給劉馨韓。</li></ul><h3>神祕果</h3><p>一共十一個，用在：</p><ul><li>劉馨韓：一個。</li><li>阿鮑壽險：十個，可以不參加。</li><li>高玉玫歸隊前，身上不能有 50 個以上（正常玩拿不到這麼多）。</li></ul><h3>神祕果哪裡拿</h3><ul><li>伏魔山內（寶箱）</li><li>月河村西南民房的桶子（隱藏）</li><li>大梁路口的小孩，回答「小四」</li><li>響馬的船第二艙房（寶箱）</li><li>貝殼海第二區（寶箱）</li><li>龍宮密道（寶箱）</li><li>長沙西北的寒音剎祕密水道（寶箱）</li><li>洛陽市集的古維然，五色藥材各給一份</li><li>第一次通天塔五樓（寶箱）</li><li>螫魂塔（寶箱），宇文拓之戰以後</li><li>虛空之門血腥地獄通道（寶箱），宇文拓之戰以後</li></ul>"}, {"chapter": "系列任務", "title": "黑山鎮的藥材", "text": "黑山鎮的藥材\n# 做法\n- 黑山鎮藥鋪的李瞳兒要九種藥材，兩種交法：\n   1. 九種全給：得天山雪蓮\n   2. 只給山蛇莓、紫藤葉、博落迴之根、大葉合歡散四種：得嘉果\n- 兩樣獎勵都不算好，收集部分就夠了。只給四種的話，拿到大葉合歡散（採藥洞窟）就能換。\n- 九種都要的話，菟絲魔子要到仙山島才拿得到，之後用石敢神石回黑山鎮換。\n# 藥材哪裡拿\n- 山蛇莓\n   1. 大雁嶺第二個帳篷（隱藏）\n   2. 巴蜀古王墓（寶箱）\n- 紫藤葉\n   1. 大梁藥鋪，80 兩\n- 博落迴之根\n   1. 大雁嶺左下的旗子（隱藏）\n   2. 魔王砦上山的小路（隱藏）\n- 大葉合歡散\n   1. 採藥洞窟的白菇（隱藏）\n   2. 殤魂塔（寶箱）\n- 龍舌蘭\n   1. 月河村張老伯旁的水缸（隱藏）\n   2. 森林軍營的樹下（隱藏）\n   3. 黑山鎮藥鋪，35 兩\n- 海檬果\n   1. 響馬的船第三艙房（隱藏）\n   2. 仙山島往百草澗的路上（寶箱）\n- 龍骨木\n   1. 仙山島山道寶箱上方的樹（隱藏）\n   2. 海中建木（寶箱）\n- 延胡索之花\n   1. 大雁嶺第一個帳篷（隱藏）\n   2. 魚肚（地上）\n- 菟絲魔子\n   1. 仙山島山道（地上）", "html": "<h3>做法</h3><ul><li>黑山鎮藥鋪的李瞳兒要九種藥材，兩種交法：<ol><li>九種全給：得<span class=\"jump items\" data-view=\"items\" data-detail=\"天山雪蓮@3013\" title=\"在物品大全中打開\">天山雪蓮</span></li><li>只給<span class=\"jump items\" data-view=\"items\" data-detail=\"山蛇莓@3067\" title=\"在物品大全中打開\">山蛇莓</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"紫藤葉@3069\" title=\"在物品大全中打開\">紫藤葉</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"博落迴之根@3065\" title=\"在物品大全中打開\">博落迴之根</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"大葉合歡散@3071\" title=\"在物品大全中打開\">大葉合歡散</span>四種：得<span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@3023\" title=\"在物品大全中打開\">嘉果</span></li></ol></li><li>兩樣獎勵都不算好，收集部分就夠了。只給四種的話，拿到大葉合歡散（採藥洞窟）就能換。</li><li>九種都要的話，菟絲魔子要到仙山島才拿得到，之後用<span class=\"jump items\" data-view=\"items\" data-detail=\"石敢神石@3046\" title=\"在物品大全中打開\">石敢神石</span>回黑山鎮換。</li></ul><h3>藥材哪裡拿</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"山蛇莓@3067\" title=\"在物品大全中打開\">山蛇莓</span><ol><li>大雁嶺第二個帳篷（隱藏）</li><li>巴蜀古王墓（寶箱）</li></ol></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"紫藤葉@3069\" title=\"在物品大全中打開\">紫藤葉</span><ol><li>大梁藥鋪，80 兩</li></ol></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"博落迴之根@3065\" title=\"在物品大全中打開\">博落迴之根</span><ol><li>大雁嶺左下的旗子（隱藏）</li><li>魔王砦上山的小路（隱藏）</li></ol></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"大葉合歡散@3071\" title=\"在物品大全中打開\">大葉合歡散</span><ol><li>採藥洞窟的白菇（隱藏）</li><li>殤魂塔（寶箱）</li></ol></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"龍舌蘭@3064\" title=\"在物品大全中打開\">龍舌蘭</span><ol><li>月河村張老伯旁的水缸（隱藏）</li><li>森林軍營的樹下（隱藏）</li><li>黑山鎮藥鋪，35 兩</li></ol></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"海檬果@3066\" title=\"在物品大全中打開\">海檬果</span><ol><li>響馬的船第三艙房（隱藏）</li><li>仙山島往百草澗的路上（寶箱）</li></ol></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"龍骨木@3068\" title=\"在物品大全中打開\">龍骨木</span><ol><li>仙山島山道寶箱上方的樹（隱藏）</li><li>海中建木（寶箱）</li></ol></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"延胡索之花@3070\" title=\"在物品大全中打開\">延胡索之花</span><ol><li>大雁嶺第一個帳篷（隱藏）</li><li>魚肚（地上）</li></ol></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"菟絲魔子@3072\" title=\"在物品大全中打開\">菟絲魔子</span><ol><li>仙山島山道（地上）</li></ol></li></ul>"}, {"chapter": "系列任務", "title": "隱藏頭目", "text": "隱藏頭目\n三隻隱藏頭目，每隻有幾個條件，全部達成才會出現；漏掉任何一個，出現的就是普通的怪物。\n# 窮奇\n- 傳說的「四凶」是渾沌、窮奇、檮杌、饕餮，遊戲裡四隻都有，但只有檮杌、饕餮、渾沌是隱藏頭目。\n- 窮奇是普通的魔獸，30 級、生命 700，可偷五色石南葉，可以收作護駕，也能煉化出來（配方見煉妖大全）。青衫的攻略說牠出現在仙山島山道和西母峰。\n# 檮杌\n出現的地方：巴蜀古王墓，林克敏的寵物（見巴蜀古王墓）。\n- 龍舟船艙遇到兩個隋軍隊長，先打倒上面的，下面的選擇饒過。見龍舟。\n- 龍舟屋樑遇到隋軍變成的石骨飛魚。見龍舟。\n- 採藥洞窟遇到兩個冥府獄卒和一個夜叉時選擇離開。見大梁與採藥洞窟。\n- 貝殼海第一區放過求饒的貓鬼屍。見貝殼海與黑龍王。\n- 仙山島遇到兩個樂仙女時選擇不解釋。見仙山島與百草澗。\n- 西母峰花妖的問題答對：不是同一種族，蝠精妖。見西母峰。\n- 巴蜀古王墓的地仙問題答對，得藍色慧星碎片。見巴蜀古王墓。\n- 檮杌屬性金、水、土。\n# 饕餮\n出現的地方：虛空之門血腥地獄通道出口前的寶箱，丁格招來的怪物（見虛空之門）。打贏另得泥蚣袍。\n- 魔王砦通道選擇跟丁格搶寶物。見豆子坑與魔王砦。\n- 江都原野遇到兩隻火光獸和丁格時選擇離開，不救他。見江都與大禹水道。\n- 饕餮屬性金、木、水。\n# 渾沌\n出現的地方：第二次通天塔之後回寒音剎。渾沌可偷七合龍爪花。善用借物代形奇術或玉佛印。\n- 皇家寶庫遇到飛賊王時選擇阻止他。見皇家寶庫。\n- 雲崗石窟的木橋上要和劍仙戰鬥過。見雲崗石窟。\n- 通天塔（第一次）三樓的寶箱不讓給飛賊王。見通天塔（第一次）。\n- 通天塔（第一次）四樓要遇到張烈說「宇文拓為了護塔竟召來那麼多妖魔鬼怪」的那場戰鬥。見通天塔（第一次）。\n- 赤貫星劃破天空後，原野上要遇到三隻雪球怪。見魔界傳送點。", "html": "<p>三隻隱藏頭目，每隻有幾個條件，全部達成才會出現；漏掉任何一個，出現的就是普通的怪物。</p><h3>窮奇</h3><ul><li>傳說的「四凶」是渾沌、窮奇、檮杌、饕餮，遊戲裡四隻都有，但只有檮杌、饕餮、渾沌是隱藏頭目。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"窮奇@152\" title=\"在神魔異事錄中打開\">窮奇</span>是普通的魔獸，30 級、生命 700，可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"五色石南葉@3035\" title=\"在物品大全中打開\">五色石南葉</span>，可以收作護駕，也能煉化出來（配方見煉妖大全）。青衫的攻略說牠出現在仙山島山道和西母峰。</li></ul><h3>檮杌</h3><p>出現的地方：巴蜀古王墓，林克敏的寵物（見<span class=\"goto\" data-title=\"巴蜀古王墓\">巴蜀古王墓</span>）。</p><ul><li>龍舟船艙遇到兩個隋軍隊長，先打倒上面的，下面的選擇饒過。見<span class=\"goto\" data-title=\"龍舟\">龍舟</span>。</li><li>龍舟屋樑遇到隋軍變成的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"石骨飛魚@154\" title=\"在神魔異事錄中打開\">石骨飛魚</span>。見<span class=\"goto\" data-title=\"龍舟\">龍舟</span>。</li><li>採藥洞窟遇到兩個<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"冥府獄卒@122\" title=\"在神魔異事錄中打開\">冥府獄卒</span>和一個<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"夜叉@164\" title=\"在神魔異事錄中打開\">夜叉</span>時選擇離開。見<span class=\"goto\" data-title=\"大梁與採藥洞窟\">大梁與採藥洞窟</span>。</li><li>貝殼海第一區放過求饒的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"貓鬼屍@195\" title=\"在神魔異事錄中打開\">貓鬼屍</span>。見<span class=\"goto\" data-title=\"貝殼海與黑龍王\">貝殼海與黑龍王</span>。</li><li>仙山島遇到兩個<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"樂仙女@132\" title=\"在神魔異事錄中打開\">樂仙女</span>時選擇不解釋。見<span class=\"goto\" data-title=\"仙山島與百草澗\">仙山島與百草澗</span>。</li><li>西母峰花妖的問題答對：不是同一種族，蝠精妖。見<span class=\"goto\" data-title=\"西母峰\">西母峰</span>。</li><li>巴蜀古王墓的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"地仙@129\" title=\"在神魔異事錄中打開\">地仙</span>問題答對，得<span class=\"jump items\" data-view=\"items\" data-detail=\"藍色慧星碎片@3189\" title=\"在物品大全中打開\">藍色慧星碎片</span>。見<span class=\"goto\" data-title=\"巴蜀古王墓\">巴蜀古王墓</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"檮杌@55\" title=\"在神魔異事錄中打開\">檮杌</span>屬性金、水、土。</li></ul><h3>饕餮</h3><p>出現的地方：虛空之門血腥地獄通道出口前的寶箱，丁格招來的怪物（見<span class=\"goto\" data-title=\"虛空之門\">虛空之門</span>）。打贏另得<span class=\"jump items\" data-view=\"items\" data-detail=\"泥蚣袍@3319\" title=\"在物品大全中打開\">泥蚣袍</span>。</p><ul><li>魔王砦通道選擇跟<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"丁格@24\" title=\"在神魔異事錄中打開\">丁格</span>搶寶物。見<span class=\"goto\" data-title=\"豆子坑與魔王砦\">豆子坑與魔王砦</span>。</li><li>江都原野遇到兩隻<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"火光獸@172\" title=\"在神魔異事錄中打開\">火光獸</span>和丁格時選擇離開，不救他。見<span class=\"goto\" data-title=\"江都與大禹水道\">江都與大禹水道</span>。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"饕餮@56\" title=\"在神魔異事錄中打開\">饕餮</span>屬性金、木、水。</li></ul><h3>渾沌</h3><p>出現的地方：第二次通天塔之後回寒音剎。<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"渾沌@57\" title=\"在神魔異事錄中打開\">渾沌</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"七合龍爪花@3044\" title=\"在物品大全中打開\">七合龍爪花</span>。善用借物代形奇術或<span class=\"jump items\" data-view=\"items\" data-detail=\"玉佛印@3048\" title=\"在物品大全中打開\">玉佛印</span>。</p><ul><li>皇家寶庫遇到<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"飛賊王@203\" title=\"在神魔異事錄中打開\">飛賊王</span>時選擇阻止他。見<span class=\"goto\" data-title=\"皇家寶庫\">皇家寶庫</span>。</li><li>雲崗石窟的木橋上要和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"劍仙@128\" title=\"在神魔異事錄中打開\">劍仙</span>戰鬥過。見<span class=\"goto\" data-title=\"雲崗石窟\">雲崗石窟</span>。</li><li>通天塔（第一次）三樓的寶箱不讓給<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"飛賊王@203\" title=\"在神魔異事錄中打開\">飛賊王</span>。見<span class=\"goto\" data-title=\"通天塔（第一次）\">通天塔（第一次）</span>。</li><li>通天塔（第一次）四樓要遇到張烈說「宇文拓為了護塔竟召來那麼多妖魔鬼怪」的那場戰鬥。見<span class=\"goto\" data-title=\"通天塔（第一次）\">通天塔（第一次）</span>。</li><li>赤貫星劃破天空後，原野上要遇到三隻<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"雪球怪@174\" title=\"在神魔異事錄中打開\">雪球怪</span>。見<span class=\"goto\" data-title=\"魔界傳送點\">魔界傳送點</span>。</li></ul>"}, {"chapter": "系列任務", "title": "結局與好感度", "text": "結局與好感度\n# 結局怎麼決定\n- 到伏羲宮殿時，阿雪和玉兒誰的好感度高，就是誰的結局，見伏羲宮殿。\n- 想要誰的結局，劇情裡有選擇時就先和她說話，或照她喜歡的方式做。\n# 加好感度的地方\n按劇情先後排列。「先和誰說話」是指劇情停下來時，先找她說話。\n- 河邊破屋（龍舟之後），見龍舟\n   1. 先問阿雪：阿雪 +1\n   2. 先問玉兒：玉兒 +1\n- 魔王砦進寨的方法，見豆子坑與魔王砦\n   1. 運糧車：玉兒 +3\n   2. 潛水：玉兒 −4\n- 東萊救齊二郎，見東萊與泰山\n   1. 先和阿雪說話：阿雪 +1\n   2. 先和玉兒說話：玉兒 +1\n- 東萊打倒楊碩\n   1. 先和阿雪說話：阿雪 +1\n   2. 先和玉兒說話：玉兒 +1\n- 響馬的船，打倒火蝠魚精後，見響馬的船\n   1. 先和阿雪說話：阿雪 +3\n   2. 先和玉兒說話：玉兒 +1\n- 響馬的船，下樓遇到寧珂\n   1. 先和阿雪說話：阿雪 +3\n   2. 先和玉兒說話：玉兒 +1\n- 上船出海，見魚肚與氐人國\n   1. 先和阿雪說話：阿雪 +1\n   2. 先和玉兒說話：玉兒 +1\n- 被鯨魚吞下\n   1. 先和阿雪說話：阿雪 +1\n   2. 先和玉兒說話：玉兒 +1\n- 仙山島晚上休息，見仙山島與百草澗\n   1. 先去看阿雪：阿雪 +5\n   2. 先和玉兒說話：玉兒 +1\n- 然翁居第一次，求古月聖被拒，見天外村\n   1. 先和阿雪說話：阿雪 +1\n   2. 先和玉兒說話：玉兒 +1\n- 然翁居第二次，玉兒又發燒\n   1. 先和阿雪說話：阿雪 +1\n   2. 先和玉兒說話：玉兒 +4\n- 然翁居第三次，深夜玉兒傷勢惡化\n   1. 先和阿雪說話：阿雪 +2\n   2. 先和玉兒說話：玉兒 +1\n- 西母峰之後，到莫支灘吹海笛，見西母峰\n   1. 先和阿雪說話：阿雪 +5\n- 海中建木之後，然翁送眾人去伏魔山，見海中建木\n   1. 先和阿雪說話：阿雪 +1\n   2. 先和玉兒說話：玉兒 +1\n- 伏魔山，古月聖治療陳輔，見伏魔山救師\n   1. 先和阿雪說話：阿雪 +1\n   2. 先和玉兒說話：玉兒 +1\n- 伏魔山，取得崑崙古鏡\n   1. 先和阿雪說話：阿雪 +1\n   2. 先和玉兒說話：玉兒 +1\n- 江都客棧休息，見江都與大禹水道\n   1. 先和阿雪說話：阿雪 +1\n   2. 先和玉兒說話：玉兒 +1\n- 天外村商量救師父，見大興\n   1. 先和阿雪說話：阿雪 +1\n   2. 先和玉兒說話：玉兒 +1", "html": "<h3>結局怎麼決定</h3><ul><li>到伏羲宮殿時，阿雪和玉兒誰的好感度高，就是誰的結局，見<span class=\"goto\" data-title=\"伏羲宮殿\">伏羲宮殿</span>。</li><li>想要誰的結局，劇情裡有選擇時就先和她說話，或照她喜歡的方式做。</li></ul><h3>加好感度的地方</h3><p>按劇情先後排列。「先和誰說話」是指劇情停下來時，先找她說話。</p><ul><li>河邊破屋（龍舟之後），見<span class=\"goto\" data-title=\"龍舟\">龍舟</span><ol><li>先問阿雪：阿雪 +1</li><li>先問玉兒：玉兒 +1</li></ol></li><li>魔王砦進寨的方法，見<span class=\"goto\" data-title=\"豆子坑與魔王砦\">豆子坑與魔王砦</span><ol><li>運糧車：玉兒 +3</li><li>潛水：玉兒 −4</li></ol></li><li>東萊救齊二郎，見<span class=\"goto\" data-title=\"東萊與泰山\">東萊與泰山</span><ol><li>先和阿雪說話：阿雪 +1</li><li>先和玉兒說話：玉兒 +1</li></ol></li><li>東萊打倒楊碩<ol><li>先和阿雪說話：阿雪 +1</li><li>先和玉兒說話：玉兒 +1</li></ol></li><li>響馬的船，打倒火蝠魚精後，見<span class=\"goto\" data-title=\"響馬的船\">響馬的船</span><ol><li>先和阿雪說話：阿雪 +3</li><li>先和玉兒說話：玉兒 +1</li></ol></li><li>響馬的船，下樓遇到寧珂<ol><li>先和阿雪說話：阿雪 +3</li><li>先和玉兒說話：玉兒 +1</li></ol></li><li>上船出海，見<span class=\"goto\" data-title=\"魚肚與氐人國\">魚肚與氐人國</span><ol><li>先和阿雪說話：阿雪 +1</li><li>先和玉兒說話：玉兒 +1</li></ol></li><li>被鯨魚吞下<ol><li>先和阿雪說話：阿雪 +1</li><li>先和玉兒說話：玉兒 +1</li></ol></li><li>仙山島晚上休息，見<span class=\"goto\" data-title=\"仙山島與百草澗\">仙山島與百草澗</span><ol><li>先去看阿雪：阿雪 +5</li><li>先和玉兒說話：玉兒 +1</li></ol></li><li>然翁居第一次，求古月聖被拒，見<span class=\"goto\" data-title=\"天外村\">天外村</span><ol><li>先和阿雪說話：阿雪 +1</li><li>先和玉兒說話：玉兒 +1</li></ol></li><li>然翁居第二次，玉兒又發燒<ol><li>先和阿雪說話：阿雪 +1</li><li>先和玉兒說話：玉兒 +4</li></ol></li><li>然翁居第三次，深夜玉兒傷勢惡化<ol><li>先和阿雪說話：阿雪 +2</li><li>先和玉兒說話：玉兒 +1</li></ol></li><li>西母峰之後，到莫支灘吹海笛，見<span class=\"goto\" data-title=\"西母峰\">西母峰</span><ol><li>先和阿雪說話：阿雪 +5</li></ol></li><li>海中建木之後，然翁送眾人去伏魔山，見<span class=\"goto\" data-title=\"海中建木\">海中建木</span><ol><li>先和阿雪說話：阿雪 +1</li><li>先和玉兒說話：玉兒 +1</li></ol></li><li>伏魔山，古月聖治療陳輔，見<span class=\"goto\" data-title=\"伏魔山救師\">伏魔山救師</span><ol><li>先和阿雪說話：阿雪 +1</li><li>先和玉兒說話：玉兒 +1</li></ol></li><li>伏魔山，取得崑崙古鏡<ol><li>先和阿雪說話：阿雪 +1</li><li>先和玉兒說話：玉兒 +1</li></ol></li><li>江都客棧休息，見<span class=\"goto\" data-title=\"江都與大禹水道\">江都與大禹水道</span><ol><li>先和阿雪說話：阿雪 +1</li><li>先和玉兒說話：玉兒 +1</li></ol></li><li>天外村商量救師父，見<span class=\"goto\" data-title=\"大興\">大興</span><ol><li>先和阿雪說話：阿雪 +1</li><li>先和玉兒說話：玉兒 +1</li></ol></li></ul>"}]};

// The sound is on unless the address says ?sound=off; the switch keeps it there (and, shown in the home page, tells
// the home page, which keeps it in its own address and passes it to the other pages).
const SOUND_PARAMETER = 'sound';
const SOUND_OFF = 'off';
let soundOn = new URLSearchParams(location.search).get(SOUND_PARAMETER) !== SOUND_OFF;

function beep() {
  if (MOVE_SOUND && soundOn) {
    const sound = new Audio(MOVE_SOUND);
    sound.volume = 0.6;
    sound.play().catch(() => {});
  }
}

let chapter = 0;
let chosen = 0;
let shown = [];

const $ = id => document.getElementById(id);

function escape(text) {
  return text.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}

function query() {
  return $('search').value.trim().toLowerCase().split(/\s+/).filter(word => word);
}

function drawTabs() {
  $('tabs').innerHTML = CHAPTERS.map((name, at) =>
    `<div class="tab${at === chapter ? ' chosen' : ''}" data-at="${at}">${escape(name)}</div>`).join('');
}

function list() {
  const words = query();
  shown = words.length ? SECTIONS.filter(section => words.every(word => section.text.toLowerCase().includes(word))) :
    SECTIONS.filter(section => section.chapter === CHAPTERS[chapter]);
  chosen = Math.min(chosen, Math.max(shown.length - 1, 0));
  $('list').innerHTML = shown.length ? shown.map((section, at) =>
    `<div class="row${at === chosen ? ' chosen' : ''}" data-at="${at}">${escape(section.title)}</div>`).join('') :
    '<div class="empty">找不到</div>';
  show();
}

// The words searched marked in the text of the page (not inside its tags).
function highlight(root, words) {
  if (!words.length) {
    return;
  }

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];

  while (walker.nextNode()) {
    nodes.push(walker.currentNode);
  }

  const pattern = new RegExp(words.map(word => word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi');

  for (const node of nodes) {
    if (!pattern.test(node.data)) {
      continue;
    }

    pattern.lastIndex = 0;
    const span = document.createElement('span');
    span.innerHTML = escape(node.data).replace(pattern, found => `<mark>${found}</mark>`);
    node.replaceWith(...span.childNodes);
  }
}

function show() {
  document.querySelectorAll('.row').forEach((row, at) => row.classList.toggle('chosen', at === chosen));
  const row = document.querySelector('.row.chosen');

  if (row) {
    row.scrollIntoView({ block: 'nearest' });
  }

  const section = shown[chosen];
  const words = query();
  document.querySelectorAll('.tab').forEach((tab, at) => {
    tab.classList.toggle('chosen', !words.length && at === chapter);
    tab.classList.toggle('found', words.length > 0 && section !== undefined && CHAPTERS[at] === section.chapter);
  });

  if (!section) {
    $('title').innerHTML = '';
    $('body').innerHTML = '';
    return;
  }

  keepPlace(section.title);
  $('title').innerHTML = `${escape(section.title)}<small>${escape(section.chapter)}</small>`;
  $('body').innerHTML = section.html;
  highlight($('body'), words);
  const mark = $('body').querySelector('mark');
  $('body').scrollTop = mark ? mark.offsetTop - $('body').offsetTop - 60 : 0;
}

function move(by) {
  if (!shown.length) {
    return;
  }

  const before = chosen;
  chosen = Math.max(0, Math.min(shown.length - 1, chosen + by));

  if (chosen !== before) {
    beep();
  }

  show();
}

function turn(by) {
  beep();
  chapter = (chapter + by + CHAPTERS.length) % CHAPTERS.length;
  chosen = 0;
  $('search').value = '';
  drawTabs();
  list();
}

$('search').addEventListener('input', () => {
  chosen = 0;
  list();
});

$('tabs').addEventListener('click', event => {
  const tab = event.target.closest('.tab');

  if (tab) {
    turn(Number(tab.dataset.at) - chapter);
  }
});

$('list').addEventListener('click', event => {
  const row = event.target.closest('.row');

  if (row) {
    if (Number(row.dataset.at) !== chosen) {
      beep();
    }

    chosen = Number(row.dataset.at);
    show();
  }
});

// A name opens the items page or the bestiary on it: the home page shows it beside its menu, alone the page itself.
$('body').addEventListener('click', event => {
  const goto = event.target.closest('.goto');

  if (goto) {
    chooseNamed(goto.dataset.title);
    return;
  }

  const jump = event.target.closest('.jump');

  if (!jump) {
    return;
  }

  const { view, detail } = jump.dataset;

  if (window.parent !== window) {
    window.parent.postMessage({ open: view, detail }, '*');
    return;
  }

  location.href = `${view}.html${location.search}#${encodeURIComponent(detail)}`;
});

document.addEventListener('keydown', event => {
  const typing = event.target === $('search');

  if (typing && event.key === 'Escape') {
    $('search').value = '';
    $('search').dispatchEvent(new Event('input'));
    return;
  }

  if (typing && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) {
    return;
  }

  const keys = {
    ArrowUp: () => move(-1),
    ArrowDown: () => move(1),
    Home: () => move(-shown.length),
    End: () => move(shown.length),
    ArrowLeft: () => turn(-1),
    ArrowRight: () => turn(1),
    PageUp: () => { $('body').scrollTop -= $('body').clientHeight - 40; },
    PageDown: () => { $('body').scrollTop += $('body').clientHeight - 40; },
  };

  if (keys[event.key]) {
    keys[event.key]();
    event.preventDefault();
  }
});

// The book keeps its size: scaled whole to fit the window, centred.
function fit() {
  const book = document.querySelector('.book');
  const scale = Math.min(innerWidth / book.offsetWidth, innerHeight / book.offsetHeight);
  const left = (innerWidth - book.offsetWidth * scale) / 2;
  const top = (innerHeight - book.offsetHeight * scale) / 2;
  book.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
}

// The section shown kept in the address (and in the home page's) in place, so that going back returns here.
function keepPlace(detail) {
  history.replaceState(null, '', `${location.search}#${encodeURIComponent(detail)}`);

  if (window.parent !== window) {
    window.parent.postMessage({ shown: 'walkthrough', detail }, '*');
  }
}

function addressed() {
  try {
    return decodeURIComponent(location.hash.slice(1));
  } catch {
    return '';
  }
}

// A section named in the address (walkthrough.html#月河村) is chosen in its chapter.
function chooseNamed(text = addressed()) {
  const section = SECTIONS.find(each => each.title === text);

  if (!section) {
    return;
  }

  chapter = CHAPTERS.indexOf(section.chapter);
  $('search').value = '';
  drawTabs();
  list();
  chosen = shown.indexOf(section);
  show();
}

function drawSound() {
  const button = document.getElementById('sound');
  button.textContent = soundOn ? '音效 開' : '音效 關';
  button.classList.toggle('off', !soundOn);
}

function setSound(on, fromHome = false) {
  soundOn = on;
  const query = new URLSearchParams(location.search);

  if (soundOn) {
    query.delete(SOUND_PARAMETER);
  } else {
    query.set(SOUND_PARAMETER, SOUND_OFF);
  }

  const text = query.toString();
  history.replaceState(null, '', `${location.pathname}${text ? `?${text}` : ''}${location.hash}`);
  drawSound();

  if (!fromHome && window.parent !== window) {
    window.parent.postMessage({ sound: soundOn }, '*');
  }
}

document.getElementById('sound').addEventListener('click', event => {
  setSound(!soundOn);
  beep();
  event.currentTarget.blur();
});

addEventListener('message', event => {
  const { sound } = event.data || {};

  if (typeof sound === 'boolean' && event.source === window.parent) {
    setSound(sound, true);
  }
});

drawSound();
addEventListener('resize', fit);
addEventListener('hashchange', () => chooseNamed());
const place = addressed();
fit();
drawTabs();
list();
chooseNamed(place);
</script>
</body>
</html>
