<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流程攻略</title>
<style>
:root {
  --gold: #a89048;
  --gold-dark: #6a5420;
  --gold-light: #f0e848;
  --text: #c8b888;
  --dim: #988a62;
  --panel: #100f08;
  --panel-list: #181010;
  --ink: #3a2008;
  --jade-light: #a8d890;
  --kai: "BiauKai", "DFKai-SB", "標楷體", "KaiTi", "STKaiti", "Kaiti TC", serif;
  --ming: "PMingLiU", "MingLiU", "新細明體", "Songti TC", "Noto Serif TC", "Noto Serif CJK TC", serif;
}

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; overflow: hidden; }

body {
  font-family: var(--ming);
  color: var(--text);
  background:
    radial-gradient(ellipse at 15% 20%, rgba(255, 220, 150, 0.45), transparent 50%),
    radial-gradient(ellipse at 85% 80%, rgba(110, 50, 10, 0.4), transparent 55%),
    radial-gradient(ellipse at 50% 55%, rgba(150, 80, 20, 0.25), transparent 45%),
    radial-gradient(ellipse at 5% 90%, rgba(90, 40, 10, 0.35), transparent 40%),
    repeating-linear-gradient(90deg, rgba(90, 40, 10, 0.12) 0 1px, transparent 1px 80px),
    linear-gradient(160deg, #e0b070 0%, #cc9450 45%, #b07834 100%);
}

.book {
  position: absolute;
  left: 0;
  top: 0;
  width: 1180px;
  height: 870px;
  padding: 12px 12px 8px;
  display: flex;
  flex-direction: column;
  transform-origin: 0 0;
}

.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  border-top: 2px solid rgba(255, 230, 180, 0.5);
  background: repeating-linear-gradient(90deg, rgba(255, 230, 180, 0.3) 0 1px, transparent 1px 80px);
  height: 64px;
  flex: none;
  padding: 0 12px 4px 6px;
}

h1 {
  margin: 0;
  font-family: var(--kai);
  font-size: 44px;
  letter-spacing: 6px;
  color: var(--ink);
  text-shadow: 2px 2px 0 rgba(255, 230, 180, 0.45), 0 0 8px rgba(255, 230, 180, 0.35);
  font-weight: bold;
}

.tools { display: flex; align-items: flex-end; gap: 10px; }

.search, .sound {
  height: 34px;
  margin: 0 0 6px;
  font: inherit;
  font-size: 18px;
  color: var(--text);
  background: var(--panel);
  border: 2px solid var(--gold);
  box-shadow: 0 0 0 1px #000, inset 0 0 0 1px #000;
  outline: none;
}

.search { width: 360px; margin-left: 6px; padding: 0 10px; }
.search::placeholder { color: var(--dim); }
.search:focus { border-color: var(--gold-light); }
.sound { padding: 0 12px; font-family: var(--kai); cursor: pointer; white-space: nowrap; }
.sound:hover { border-color: var(--gold-light); }
.sound.off { color: var(--dim); }

.layout {
  display: grid;
  grid-template-columns: 290px 1fr;
  grid-template-rows: 40px 1fr;
  gap: 0 14px;
  margin-top: 8px;
  flex: 1;
  min-height: 0;
}

/* The bright corner marks of the game's frames, inside the frame line. */
.frame {
  --corner: linear-gradient(var(--gold-light), var(--gold-light));
  --fill: var(--panel);
  background:
    var(--corner) left top / 9px 3px no-repeat,
    var(--corner) left top / 3px 9px no-repeat,
    var(--corner) right top / 9px 3px no-repeat,
    var(--corner) right top / 3px 9px no-repeat,
    var(--corner) left bottom / 9px 3px no-repeat,
    var(--corner) left bottom / 3px 9px no-repeat,
    var(--corner) right bottom / 9px 3px no-repeat,
    var(--corner) right bottom / 3px 9px no-repeat,
    var(--fill);
  background-origin: padding-box;
  border: 2px solid var(--gold);
  box-shadow: inset 0 0 0 1px #000, 0 0 0 1px #000;
  position: relative;
}

.tabs {
  grid-column: 1 / span 2;
  display: flex;
  gap: 2px;
  padding-left: 12px;
  margin-bottom: -3px;
  z-index: 1;
}

.tab {
  font-family: var(--kai);
  font-size: 20px;
  min-width: 64px;
  height: 40px;
  line-height: 38px;
  padding: 0 12px;
  color: #2c3410;
  background: linear-gradient(180deg, #889c58, #5c7034);
  --edge: #b89838;
  border: 1px solid #000;
  border-bottom: none;
  border-radius: 10px 10px 0 0;
  box-shadow: inset 0 0 0 2px var(--edge);
  cursor: pointer;
  user-select: none;
  text-align: center;
  white-space: nowrap;
}

.tab.chosen {
  color: #181800;
  background: linear-gradient(180deg, #eef488, #b8d050);
  --edge: #b07818;
  font-weight: bold;
}

.tab.found {
  color: #20280c;
  background: linear-gradient(180deg, #a8bc68, #7c9444);
  --edge: #d0b040;
  box-shadow: inset 0 0 0 2px var(--edge), inset 0 6px 0 #e0c048;
}

.list {
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  scrollbar-gutter: stable both-edges;
  padding: 12px 0;
  scrollbar-color: var(--gold) #000;
  --fill: var(--panel-list);
}

.row {
  font-family: var(--kai);
  font-size: 23px;
  line-height: 38px;
  padding: 0 10px 0 16px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 1px 1px 0 #302018;
}

/* The game's highlight: a band brightest in the middle, fading to the top and bottom edges. */
.row.chosen {
  color: #fff0b0;
  background: linear-gradient(180deg, rgba(160, 104, 0, 0), rgba(200, 130, 10, 0.95) 50%, rgba(160, 104, 0, 0));
}

.empty { font-family: var(--kai); font-size: 20px; color: var(--dim); padding: 8px 16px; }

.page { display: flex; flex-direction: column; min-height: 0; padding: 14px 8px 12px 24px; }

.page .title {
  flex: none;
  font-family: var(--kai);
  font-size: 32px;
  line-height: 44px;
  color: #f0e0a8;
  border-bottom: 1px solid var(--gold-dark);
  margin-right: 16px;
  padding-bottom: 4px;
}

.page .title small { font-size: 18px; color: var(--dim); margin-left: 14px; }

.page .body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  scrollbar-gutter: stable;
  padding: 4px 14px 10px 0;
  scrollbar-color: var(--gold) #000;
  font-size: 18px;
  line-height: 31px;
}

.page h3 { font-family: var(--kai); font-size: 23px; font-weight: normal; color: var(--gold-light); margin: 14px 0 2px; }
.page p { margin: 2px 0 6px; }
.page ul, .page ol { margin: 0 0 6px; padding-left: 26px; }
.page li > ul, .page li > ol { margin: 0 0 2px; padding-left: 24px; }
.page ol li::marker { font-size: 16px; }
.page li::marker { color: var(--gold); }

.jump { color: #f0e0a8; cursor: pointer; border-bottom: 1px dotted rgba(240, 232, 72, 0.5); }
.jump.bestiary { color: #f0c8a0; }
.jump:hover { color: var(--gold-light); border-bottom-style: solid; }
.goto { color: var(--jade-light); cursor: pointer; border-bottom: 1px dotted rgba(168, 216, 144, 0.6); }
.goto:hover { border-bottom-style: solid; }
.out { color: var(--gold-light); }
.out:hover { color: #fff0b0; }

.tag {
  display: inline-block;
  font-family: var(--kai);
  font-size: 15px;
  line-height: 21px;
  padding: 0 7px;
  margin: 0 3px;
  border-radius: 9px;
  vertical-align: 1px;
  white-space: nowrap;
}

.tag.domo { color: #fff0c0; background: linear-gradient(180deg, #4a7a3a, #24401c); border: 1px solid var(--jade-light); }
.tag.herb { color: #fff0c0; background: linear-gradient(180deg, #8a6a1c, #4a3608); border: 1px solid var(--gold); }
.tag.beast { color: #ffd8c8; background: #4a1e14; border: 1px solid #a05a40; }

mark { background: rgba(232, 168, 56, 0.45); color: inherit; }

.hint { flex: none; margin-top: 6px; font-size: 13px; color: #3a2008; text-align: right; }
</style>
</head>
<body>
<div class="book">
  <div class="top">
    <div class="tools">
      <input class="search" id="search" type="search" placeholder="搜尋地點、物品、支線" autocomplete="off">
      <button class="sound" id="sound" type="button"></button>
    </div>
    <h1>流程攻略</h1>
  </div>
  <div class="layout">
    <div class="tabs" id="tabs"></div>
    <div class="frame list" id="list"></div>
    <div class="frame page"><div class="title" id="title"></div><div class="body" id="body"></div></div>
  </div>
  <div class="hint">↑↓ 選擇　Home / End 首尾　←→ 切換篇章　點物品或怪物的名字可打開物品大全、神魔異事錄，點綠色的條目名跳到那一頁　搜尋可空格分隔多個關鍵字，Esc 清除</div>
</div>
<script>
const DATA = {"chapters": ["說明", "江北", "東海", "江南", "北方", "魔界", "赤貫星", "系列任務"], "sections": [{"chapter": "說明", "title": "攻略說明", "text": "攻略說明\n# 適用版本\n- 《軒轅劍參外傳 天之痕》，也就是 OpenSWD3e 對應的版本。\n- 原版 swd3e.exe 和 OpenSWD3e 的流程、物品完全一樣。\n# 攻略來源\n- 【青衫《軒轅劍3外傳天之痕攻略》｜https://chiuinan.github.io/game/game/intro/ch/c11/swd3e/swd3e/swd3e.htm】：流程、支線、物品位置、商店。本攻略按它的順序重新整理。\n# 整合與核對\n- 由 OpenSWD3e 整合。\n- 每張地圖的寶箱、隱藏物品、地上物品和銀兩，都從遊戲的地圖資料與劇情腳本導出核對過，補上了舊攻略漏掉的，改正了錯字。\n- 物品名、怪物名、偷竊目標、商店價格都和遊戲資料核對過。\n- 位置描述照舊攻略寫，沒有逐一在遊戲裡走過。\n# 物品的寫法\n每行一件，冒號後面是取得方式和位置。\n- 寶箱：打開寶箱得到。\n- 地上：看得到的東西，走過去調查就拿到。\n- 隱藏：看不見，要面對罈子、櫃子、草叢等按鍵調查才拿到。OpenSWD3e 的「道具提示」設定會在這些地方顯示箭頭。\n- 銀兩直接寫數目，例如「300 兩：寶箱」。\n# 名詞\n- 映月之光：地圖上的光點，可以存檔。\n- 靈契：用煉妖壺收服怪物。收服的怪物可以煉化，也可以裝備成護駕。\n- 煉化：在煉妖壺裡把兩樣東西煉成新的物品或怪物，配方見主頁的「煉妖大全」。\n- 護駕：裝備在角色「護駕」欄的怪物，戰鬥中可以召喚出來幫忙作戰。\n- 偷竊：用偷竊指令從怪物身上拿東西，要先拿到乾坤袋。\n- 好感度：阿雪和玉兒各有一個好感度，決定結局，見結局與好感度。\n# 標籤\n- DOMO：DOMO 工作室的組員要的東西，見DOMO組員與DOMO的果子。\n- 藥材：黑山鎮李瞳兒要的藥材，見黑山鎮的藥材。\n- 檮杌、饕餮、渾沌：這隻隱藏頭目的出現條件之一，見隱藏頭目。\n# 連結\n- 點物品名或怪物名，打開物品大全或神魔異事錄的那一項。\n- 點綠色的條目名，跳到攻略裡的那一頁。\n- 左邊的篇章照遊戲流程排列，最後的「系列任務」是貫穿全程的支線。", "html": "<h3>適用版本</h3><ul><li>《軒轅劍參外傳 天之痕》，也就是 OpenSWD3e 對應的版本。</li><li>原版 swd3e.exe 和 OpenSWD3e 的流程、物品完全一樣。</li></ul><h3>攻略來源</h3><ul><li><a class=\"out\" href=\"https://chiuinan.github.io/game/game/intro/ch/c11/swd3e/swd3e/swd3e.htm\" target=\"_blank\" rel=\"noopener\">青衫《軒轅劍3外傳天之痕攻略》</a>：流程、支線、物品位置、商店。本攻略按它的順序重新整理。</li></ul><h3>整合與核對</h3><ul><li>由 OpenSWD3e 整合。</li><li>每張地圖的寶箱、隱藏物品、地上物品和銀兩，都從遊戲的地圖資料與劇情腳本導出核對過，補上了舊攻略漏掉的，改正了錯字。</li><li>物品名、怪物名、偷竊目標、商店價格都和遊戲資料核對過。</li><li>位置描述照舊攻略寫，沒有逐一在遊戲裡走過。</li></ul><h3>物品的寫法</h3><p>每行一件，冒號後面是取得方式和位置。</p><ul><li>寶箱：打開寶箱得到。</li><li>地上：看得到的東西，走過去調查就拿到。</li><li>隱藏：看不見，要面對罈子、櫃子、草叢等按鍵調查才拿到。OpenSWD3e 的「道具提示」設定會在這些地方顯示箭頭。</li><li>銀兩直接寫數目，例如「300 兩：寶箱」。</li></ul><h3>名詞</h3><ul><li>映月之光：地圖上的光點，可以存檔。</li><li>靈契：用煉妖壺收服怪物。收服的怪物可以煉化，也可以裝備成護駕。</li><li>煉化：在煉妖壺裡把兩樣東西煉成新的物品或怪物，配方見主頁的「煉妖大全」。</li><li>護駕：裝備在角色「護駕」欄的怪物，戰鬥中可以召喚出來幫忙作戰。</li><li>偷竊：用偷竊指令從怪物身上拿東西，要先拿到乾坤袋。</li><li>好感度：阿雪和玉兒各有一個好感度，決定結局，見<span class=\"goto\" data-title=\"結局與好感度\">結局與好感度</span>。</li></ul><h3>標籤</h3><ul><li>DOMO：DOMO 工作室的組員要的東西，見<span class=\"goto\" data-title=\"DOMO組員\">DOMO組員</span>與<span class=\"goto\" data-title=\"DOMO的果子\">DOMO的果子</span>。</li><li>藥材：黑山鎮李瞳兒要的藥材，見<span class=\"goto\" data-title=\"黑山鎮的藥材\">黑山鎮的藥材</span>。</li><li>檮杌、饕餮、渾沌：這隻隱藏頭目的出現條件之一，見<span class=\"goto\" data-title=\"隱藏頭目\">隱藏頭目</span>。</li></ul><h3>連結</h3><ul><li>點物品名或怪物名，打開物品大全或神魔異事錄的那一項。</li><li>點綠色的條目名，跳到攻略裡的那一頁。</li><li>左邊的篇章照遊戲流程排列，最後的「系列任務」是貫穿全程的支線。</li></ul>"}, {"chapter": "江北", "title": "伏魔山", "text": "伏魔山\n# 流程\n1. 陳輔要靖仇獨自打妖怪跟上來。\n2. 天狗蝕日，陳輔帶靖仇進山洞找崑崙古鏡，遇上饕餮。陳輔把靖仇打出洞外，以元神化成冰絲，和饕餮一起封在洞中。\n3. 冰絲只能撐一年，陳輔要靖仇去雷夏澤找師伯公山先生。\n4. 到山腳打開符鬼之符，在金、木、水、火、土裡選一種做符鬼的屬性，符鬼會在戰鬥中助戰。\n5. 出伏魔山，往月河村。\n# 物品\n- 洞察光環：寶箱，進森林下樓梯的左下\n- 布帽：寶箱\n- 銅戒指：寶箱", "html": "<h3>流程</h3><ol><li>陳輔要靖仇獨自打妖怪跟上來。</li><li>天狗蝕日，陳輔帶靖仇進山洞找崑崙古鏡，遇上饕餮。陳輔把靖仇打出洞外，以元神化成冰絲，和饕餮一起封在洞中。</li><li>冰絲只能撐一年，陳輔要靖仇去雷夏澤找師伯公山先生。</li><li>到山腳打開符鬼之符，在金、木、水、火、土裡選一種做符鬼的屬性，符鬼會在戰鬥中助戰。</li><li>出伏魔山，往月河村。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"洞察光環@3181\" title=\"在物品大全中打開\">洞察光環</span>：寶箱，進森林下樓梯的左下</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"布帽@3272\" title=\"在物品大全中打開\">布帽</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"銅戒指@3379\" title=\"在物品大全中打開\">銅戒指</span>：寶箱</li></ul>"}, {"chapter": "江北", "title": "月河村", "text": "月河村\n# 流程\n1. 和水井上方的張老伯說話，得知雷夏澤在北方。過橋時被村民攔下：村裡要辦河神祭，封橋幾天。\n2. 到客棧住一晚（30 兩），認識于小雪。\n3. 第二天到大夫家，得知抽中的是大夫的女兒。\n4. 回客棧和老闆說話，得知阿雪自願替她獻祭，換大夫治好弟弟小朔的腿。\n5. 出客棧到下方和小朔說話，答應救出姐姐，往下穿過樹林進月河樹林秘道。\n# 物品\n- 神祕果：西南民房木板上的桶子（隱藏）DOMO\n- 龍舌蘭：張老伯旁的水缸（隱藏）藥材\n- 桑果：左邊民房門旁的籃子（隱藏）\n- 藍格怪衣：寶箱，客棧後面：往上、往右、再往下走到盡頭\n# 藍格怪衣\n法寶，8000 成長，龍飄指令：傷害高、不看防禦。出現的數字有額外獎勵，同一場戰鬥可以累計：\n- 數字一樣時法寶經驗多加：\n   1. 11、22、33、44、55、66、88、99：多 10 點\n   2. 三位數：多 20 點\n   3. 四位數：多 30 點\n- 00、000、0000：戰鬥經驗值多 20%、30%、40%。\n- 77、777、7777：戰鬥銀兩乘 2、4、6。\n- 0730：敵人全滅，頭目除外，同一場只有一次。\n- 按 F8 暫停看數字，解除暫停的同時按空白鍵，有機會打出暫停時的數字。\n# 支線：乞丐與水井\n1. 和客棧旁的乞丐說話，他要 15 個清水。\n2. 調查水井打水，每次得一個清水。打滿 15 次以後再一直按，另得 150 兩。\n3. 拿 15 個清水給乞丐，得金創藥。\n# 商店\n- 雜貨店：鐵劍 120、解病萬靈丹 30、符紙鶴 50、飛斧 70、羅勒草 35、鳳尾草液 80、桑果 50、野石榴 20", "html": "<h3>流程</h3><ol><li>和水井上方的張老伯說話，得知雷夏澤在北方。過橋時被村民攔下：村裡要辦河神祭，封橋幾天。</li><li>到客棧住一晚（30 兩），認識于小雪。</li><li>第二天到大夫家，得知抽中的是大夫的女兒。</li><li>回客棧和老闆說話，得知阿雪自願替她獻祭，換大夫治好弟弟小朔的腿。</li><li>出客棧到下方和小朔說話，答應救出姐姐，往下穿過樹林進月河樹林秘道。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>：西南民房木板上的桶子（隱藏）<span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"龍舌蘭@3064\" title=\"在物品大全中打開\">龍舌蘭</span>：張老伯旁的水缸（隱藏）<span class=\"tag herb\">藥材</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"桑果@3006\" title=\"在物品大全中打開\">桑果</span>：左邊民房門旁的籃子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"藍格怪衣@3182\" title=\"在物品大全中打開\">藍格怪衣</span>：寶箱，客棧後面：往上、往右、再往下走到盡頭</li></ul><h3>藍格怪衣</h3><p>法寶，8000 成長，龍飄指令：傷害高、不看防禦。出現的數字有額外獎勵，同一場戰鬥可以累計：</p><ul><li>數字一樣時法寶經驗多加：<ol><li>11、22、33、44、55、66、88、99：多 10 點</li><li>三位數：多 20 點</li><li>四位數：多 30 點</li></ol></li><li>00、000、0000：戰鬥經驗值多 20%、30%、40%。</li><li>77、777、7777：戰鬥銀兩乘 2、4、6。</li><li>0730：敵人全滅，頭目除外，同一場只有一次。</li><li>按 F8 暫停看數字，解除暫停的同時按空白鍵，有機會打出暫停時的數字。</li></ul><h3>支線：乞丐與水井</h3><ol><li>和客棧旁的乞丐說話，他要 15 個<span class=\"jump items\" data-view=\"items\" data-detail=\"清水@3090\" title=\"在物品大全中打開\">清水</span>。</li><li>調查水井打水，每次得一個清水。打滿 15 次以後再一直按，另得 150 兩。</li><li>拿 15 個清水給乞丐，得<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span>。</li></ol><h3>商店</h3><ul><li>雜貨店：<span class=\"jump items\" data-view=\"items\" data-detail=\"鐵劍@3202\" title=\"在物品大全中打開\">鐵劍</span> 120、<span class=\"jump items\" data-view=\"items\" data-detail=\"解病萬靈丹@3025\" title=\"在物品大全中打開\">解病萬靈丹</span> 30、<span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span> 50、<span class=\"jump items\" data-view=\"items\" data-detail=\"飛斧@3257\" title=\"在物品大全中打開\">飛斧</span> 70、<span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span> 35、<span class=\"jump items\" data-view=\"items\" data-detail=\"鳳尾草液@3002\" title=\"在物品大全中打開\">鳳尾草液</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"桑果@3006\" title=\"在物品大全中打開\">桑果</span> 50、<span class=\"jump items\" data-view=\"items\" data-detail=\"野石榴@3020\" title=\"在物品大全中打開\">野石榴</span> 20</li></ul>"}, {"chapter": "江北", "title": "月河樹林秘道與河洞", "text": "月河樹林秘道與河洞\n# 月河樹林秘道\n- 銅戒指：寶箱\n- 解病萬靈丹：寶箱\n- 羅勒草：寶箱\n- 皮靴：寶箱\n- 皮手套：寶箱\n- 還靈丹：寶箱\n- 星君眼：寶箱（法寶，3000 成長，攻擊 +50%）\n- 入地金牛粉：寶箱\n- 銀月簪：寶箱\n- 順手收一隻幽靈練符鬼，收六隻飛僵當護駕。\n# 月河河畔\n1. 秘道盡頭是月河河畔，可以存檔。\n2. 靖仇勸村民不要獻祭，村民不聽，把阿雪推進洞裡。\n3. 左邊的石碑可以無限次全員恢復，之後同樣的石碑都一樣。\n4. 靖仇跳進洞裡救阿雪。\n- 炸藥：桌上（隱藏）\n# 河洞\n1. 救醒阿雪，被鮫精偷襲。鮫精想吃阿雪反被燙到舌頭，靖仇醒來把牠打跑。\n2. 到河洞５，靖仇發現阿雪會治癒，教她簡單的法術，阿雪加入。\n- 鳳尾草液：河洞１，上方柱子後面（隱藏）\n- 羅勒草：河洞１，左上（隱藏）\n- 還魄丹：河洞１，左下石柱前（隱藏）\n- 不老之泉水：寶箱，右邊河洞２（生命 +40）\n- 羅勒草：河洞２，下方（隱藏）\n- 飛斧：河洞３，左上（隱藏）\n- 青龍靈珠：寶箱，河洞４，通道下方被擋住的箱子（法寶，2500 成長，木抗 80%）\n- 雨皇花：地上，河洞５\n# 回到月河村\n1. 出洞回村，鮫魚精報復，村民死傷遍地。打倒怒意鮫精。\n2. 賀老闆和小朔都死了，村民把兩人趕出村，往北到雷夏澤。\n3. 之後想回月河村，在原野點選河洞出口，進去再出來就行。", "html": "<h3>月河樹林秘道</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"銅戒指@3379\" title=\"在物品大全中打開\">銅戒指</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"解病萬靈丹@3025\" title=\"在物品大全中打開\">解病萬靈丹</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"皮靴@3355\" title=\"在物品大全中打開\">皮靴</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"皮手套@3328\" title=\"在物品大全中打開\">皮手套</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@3011\" title=\"在物品大全中打開\">還靈丹</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"星君眼@3161\" title=\"在物品大全中打開\">星君眼</span>：寶箱（法寶，3000 成長，攻擊 +50%）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"入地金牛粉@3021\" title=\"在物品大全中打開\">入地金牛粉</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"銀月簪@3273\" title=\"在物品大全中打開\">銀月簪</span>：寶箱</li><li>順手收一隻<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"幽靈@186\" title=\"在神魔異事錄中打開\">幽靈</span>練符鬼，收六隻<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"飛僵@196\" title=\"在神魔異事錄中打開\">飛僵</span>當護駕。</li></ul><h3>月河河畔</h3><ol><li>秘道盡頭是月河河畔，可以存檔。</li><li>靖仇勸村民不要獻祭，村民不聽，把阿雪推進洞裡。</li><li>左邊的石碑可以無限次全員恢復，之後同樣的石碑都一樣。</li><li>靖仇跳進洞裡救阿雪。</li></ol><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"炸藥@3073\" title=\"在物品大全中打開\">炸藥</span>：桌上（隱藏）</li></ul><h3>河洞</h3><ol><li>救醒阿雪，被<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"鮫精@42\" title=\"在神魔異事錄中打開\">鮫精</span>偷襲。鮫精想吃阿雪反被燙到舌頭，靖仇醒來把牠打跑。</li><li>到河洞５，靖仇發現阿雪會治癒，教她簡單的法術，阿雪加入。</li></ol><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鳳尾草液@3002\" title=\"在物品大全中打開\">鳳尾草液</span>：河洞１，上方柱子後面（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span>：河洞１，左上（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span>：河洞１，左下石柱前（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"不老之泉水@3036\" title=\"在物品大全中打開\">不老之泉水</span>：寶箱，右邊河洞２（生命 +40）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span>：河洞２，下方（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"飛斧@3257\" title=\"在物品大全中打開\">飛斧</span>：河洞３，左上（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"青龍靈珠@3166\" title=\"在物品大全中打開\">青龍靈珠</span>：寶箱，河洞４，通道下方被擋住的箱子（法寶，2500 成長，木抗 80%）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"雨皇花@3089\" title=\"在物品大全中打開\">雨皇花</span>：地上，河洞５</li></ul><h3>回到月河村</h3><ol><li>出洞回村，鮫魚精報復，村民死傷遍地。打倒<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"怒意鮫精@43\" title=\"在神魔異事錄中打開\">怒意鮫精</span>。</li><li>賀老闆和小朔都死了，村民把兩人趕出村，往北到雷夏澤。</li><li>之後想回月河村，在原野點選河洞出口，進去再出來就行。</li></ol>"}, {"chapter": "江北", "title": "雷夏澤", "text": "雷夏澤\n# 流程\n1. 進屋和師伯母、師伯說話，師伯病重，幫不上忙。\n2. 師伯敗在宇文拓劍下，劍氣難消，要用神農鼎煉藥才能治好。神農鼎原本由北方鮮卑族拓跋部保管，先去那裡打聽。\n3. 往北到黑山鎮。\n# 物品\n- 鐵戒指：房子右前方的籬笆（隱藏）\n# 支線：猜數字\n- 和門口的小女孩公山夢玩猜數字，猜對得不老之泉水（生命 +40）。錯過的話，以後在大梁最右邊的民房還能玩。", "html": "<h3>流程</h3><ol><li>進屋和師伯母、師伯說話，師伯病重，幫不上忙。</li><li>師伯敗在宇文拓劍下，劍氣難消，要用神農鼎煉藥才能治好。神農鼎原本由北方鮮卑族拓跋部保管，先去那裡打聽。</li><li>往北到黑山鎮。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鐵戒指@3380\" title=\"在物品大全中打開\">鐵戒指</span>：房子右前方的籬笆（隱藏）</li></ul><h3>支線：猜數字</h3><ul><li>和門口的小女孩公山夢玩猜數字，猜對得<span class=\"jump items\" data-view=\"items\" data-detail=\"不老之泉水@3036\" title=\"在物品大全中打開\">不老之泉水</span>（生命 +40）。錯過的話，以後在大梁最右邊的民房還能玩。</li></ul>"}, {"chapter": "江北", "title": "黑山鎮", "text": "黑山鎮\n# 流程\n1. 進客棧吃飯，官差在外面抓男童，要殺童取血給郡主養顏。\n2. 拓跋玉兒出現殺了官差，高尉官變成邪屍骷髏打傷玉兒，靖仇和阿雪打倒牠。\n3. 玉兒的姐夫張烈趕來，在客棧請客，得知拓跋部已被隋軍滅掉，神農鼎大概落入朝廷手中。\n4. 手下回報發現可疑的隋軍，張烈加入，一起去森林軍營。進去前最好先在外面練到 14 級。\n# 支線：李瞳兒的藥材\n- 藥鋪的李瞳兒要九種藥材，見黑山鎮的藥材。\n# 支線：馨馨的數字拳\n- 到東北民宅找馨馨玩數字拳，贏了得翠玉金釵。\n# 提示\n- 記得買一個野石榴，DOMO 組員要。\n- 可以先往東到蘆家渡買好一點的武器防具。\n# 商店\n- 藥鋪：解病萬靈丹 30、解僵針 40、黃色藥材 100、符紙鶴 50、龍舌蘭 35、羅勒草 35、鳳尾草液 80、金創藥 150、野石榴 20、入地金牛粉 70、還魄丹 70\n- 武器店：銀月簪 50、皮帽 80、皮手套 30、鋼鐵護腕 90、貂皮衣 120、虎皮衣 250、鋼靴 80", "html": "<h3>流程</h3><ol><li>進客棧吃飯，官差在外面抓男童，要殺童取血給郡主養顏。</li><li>拓跋玉兒出現殺了官差，高尉官變成<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"邪屍骷髏@225\" title=\"在神魔異事錄中打開\">邪屍骷髏</span>打傷玉兒，靖仇和阿雪打倒牠。</li><li>玉兒的姐夫張烈趕來，在客棧請客，得知拓跋部已被隋軍滅掉，神農鼎大概落入朝廷手中。</li><li>手下回報發現可疑的隋軍，張烈加入，一起去森林軍營。進去前最好先在外面練到 14 級。</li></ol><h3>支線：李瞳兒的藥材</h3><ul><li>藥鋪的李瞳兒要九種藥材，見<span class=\"goto\" data-title=\"黑山鎮的藥材\">黑山鎮的藥材</span>。</li></ul><h3>支線：馨馨的數字拳</h3><ul><li>到東北民宅找馨馨玩數字拳，贏了得<span class=\"jump items\" data-view=\"items\" data-detail=\"翠玉金釵@3275\" title=\"在物品大全中打開\">翠玉金釵</span>。</li></ul><h3>提示</h3><ul><li>記得買一個<span class=\"jump items\" data-view=\"items\" data-detail=\"野石榴@3020\" title=\"在物品大全中打開\">野石榴</span>，DOMO 組員要。</li><li>可以先往東到蘆家渡買好一點的武器防具。</li></ul><h3>商店</h3><ul><li>藥鋪：<span class=\"jump items\" data-view=\"items\" data-detail=\"解病萬靈丹@3025\" title=\"在物品大全中打開\">解病萬靈丹</span> 30、<span class=\"jump items\" data-view=\"items\" data-detail=\"解僵針@3026\" title=\"在物品大全中打開\">解僵針</span> 40、<span class=\"jump items\" data-view=\"items\" data-detail=\"黃色藥材@3085\" title=\"在物品大全中打開\">黃色藥材</span> 100、<span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span> 50、<span class=\"jump items\" data-view=\"items\" data-detail=\"龍舌蘭@3064\" title=\"在物品大全中打開\">龍舌蘭</span> 35、<span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span> 35、<span class=\"jump items\" data-view=\"items\" data-detail=\"鳳尾草液@3002\" title=\"在物品大全中打開\">鳳尾草液</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"野石榴@3020\" title=\"在物品大全中打開\">野石榴</span> 20、<span class=\"jump items\" data-view=\"items\" data-detail=\"入地金牛粉@3021\" title=\"在物品大全中打開\">入地金牛粉</span> 70、<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span> 70</li><li>武器店：<span class=\"jump items\" data-view=\"items\" data-detail=\"銀月簪@3273\" title=\"在物品大全中打開\">銀月簪</span> 50、<span class=\"jump items\" data-view=\"items\" data-detail=\"皮帽@3274\" title=\"在物品大全中打開\">皮帽</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"皮手套@3328\" title=\"在物品大全中打開\">皮手套</span> 30、<span class=\"jump items\" data-view=\"items\" data-detail=\"鋼鐵護腕@3330\" title=\"在物品大全中打開\">鋼鐵護腕</span> 90、<span class=\"jump items\" data-view=\"items\" data-detail=\"貂皮衣@3294\" title=\"在物品大全中打開\">貂皮衣</span> 120、<span class=\"jump items\" data-view=\"items\" data-detail=\"虎皮衣@3295\" title=\"在物品大全中打開\">虎皮衣</span> 250、<span class=\"jump items\" data-view=\"items\" data-detail=\"鋼靴@3356\" title=\"在物品大全中打開\">鋼靴</span> 80</li></ul>"}, {"chapter": "江北", "title": "森林軍營", "text": "森林軍營\n# 流程\n1. 出黑山鎮往右進樹林。等隋軍隊長走後，打倒守衛。\n2. 進營區放走所有小孩。\n3. 隊長回來變成邪屍骷髏，打倒後又變成惡虎魔魅，再打倒，其他士兵四散。\n4. 回到鎮上，張烈邀靖仇到營寨，往上到大雁嶺。\n# 樹林\n- 還魄丹：寶箱，第一場景\n- 飛斧：寶箱\n- 雨皇花：寶箱，第一場景出口前下方，被樹葉擋住\n- 羅勒草：寶箱\n- 還靈丹：寶箱，第二場景出口前右邊，被樹葉擋住\n- 還魄丹：寶箱\n- 鳳尾草液：三叉路口三顆小石頭左上的樹下（隱藏）\n- 龍舌蘭：大寶箱上方的樹下（隱藏）藥材\n- 羅勒草：寶箱\n- 玉靈鐲：寶箱\n- 電光聖鐲：映月之光前一個場景的小石柱（隱藏）（法寶，2800 成長，連擊指令）\n# 營區\n- 還靈丹：寶箱，映月之光右下\n- 姜黃粉：營區的爐子（隱藏）", "html": "<h3>流程</h3><ol><li>出黑山鎮往右進樹林。等隋軍隊長走後，打倒守衛。</li><li>進營區放走所有小孩。</li><li>隊長回來變成<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"邪屍骷髏@225\" title=\"在神魔異事錄中打開\">邪屍骷髏</span>，打倒後又變成<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"惡虎魔魅@44\" title=\"在神魔異事錄中打開\">惡虎魔魅</span>，再打倒，其他士兵四散。</li><li>回到鎮上，張烈邀靖仇到營寨，往上到大雁嶺。</li></ol><h3>樹林</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span>：寶箱，第一場景</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"飛斧@3257\" title=\"在物品大全中打開\">飛斧</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"雨皇花@3089\" title=\"在物品大全中打開\">雨皇花</span>：寶箱，第一場景出口前下方，被樹葉擋住</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@3011\" title=\"在物品大全中打開\">還靈丹</span>：寶箱，第二場景出口前右邊，被樹葉擋住</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鳳尾草液@3002\" title=\"在物品大全中打開\">鳳尾草液</span>：三叉路口三顆小石頭左上的樹下（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"龍舌蘭@3064\" title=\"在物品大全中打開\">龍舌蘭</span>：大寶箱上方的樹下（隱藏）<span class=\"tag herb\">藥材</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"玉靈鐲@3331\" title=\"在物品大全中打開\">玉靈鐲</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"電光聖鐲@3154\" title=\"在物品大全中打開\">電光聖鐲</span>：映月之光前一個場景的小石柱（隱藏）（法寶，2800 成長，連擊指令）</li></ul><h3>營區</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@3011\" title=\"在物品大全中打開\">還靈丹</span>：寶箱，映月之光右下</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"姜黃粉@3007\" title=\"在物品大全中打開\">姜黃粉</span>：營區的爐子（隱藏）</li></ul>"}, {"chapter": "江北", "title": "大雁嶺", "text": "大雁嶺\n# 流程\n1. 和帳篷前的守衛說話，進帳篷見拓跋月兒，到裡面找玉兒，玉兒還是不服氣。\n2. 出來和張烈說話，張烈請靖仇暫住，派人打聽神農鼎。\n3. 六天後到主帳篷找張烈：神農鼎確實在宇文拓手上，正運往朝廷。\n4. 月兒來報，玉兒留書出走，要自己奪回神農鼎。張烈和靖仇一起去找她，出黑山鎮往東到蘆家渡。\n# 物品\n- 靈神天藥：中央的鼎（隱藏）\n- 博落迴之根：左下的旗子（隱藏）藥材\n- 延胡索之花：右邊第一個帳篷，右下（隱藏）藥材\n- 山蛇莓：第二個帳篷，左下（隱藏）藥材\n- 飛刀：中央主帳篷，左上（隱藏）", "html": "<h3>流程</h3><ol><li>和帳篷前的守衛說話，進帳篷見拓跋月兒，到裡面找玉兒，玉兒還是不服氣。</li><li>出來和張烈說話，張烈請靖仇暫住，派人打聽神農鼎。</li><li>六天後到主帳篷找張烈：神農鼎確實在宇文拓手上，正運往朝廷。</li><li>月兒來報，玉兒留書出走，要自己奪回神農鼎。張烈和靖仇一起去找她，出黑山鎮往東到蘆家渡。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈神天藥@3012\" title=\"在物品大全中打開\">靈神天藥</span>：中央的鼎（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"博落迴之根@3065\" title=\"在物品大全中打開\">博落迴之根</span>：左下的旗子（隱藏）<span class=\"tag herb\">藥材</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"延胡索之花@3070\" title=\"在物品大全中打開\">延胡索之花</span>：右邊第一個帳篷，右下（隱藏）<span class=\"tag herb\">藥材</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"山蛇莓@3067\" title=\"在物品大全中打開\">山蛇莓</span>：第二個帳篷，左下（隱藏）<span class=\"tag herb\">藥材</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"飛刀@3258\" title=\"在物品大全中打開\">飛刀</span>：中央主帳篷，左上（隱藏）</li></ul>"}, {"chapter": "江北", "title": "蘆家渡與運輸船", "text": "蘆家渡與運輸船\n# 流程\n1. 和船上的衛兵說話：韓公公在抓民女獻給皇上，阿雪猜玉兒故意被抓混上船。\n2. 再和衛兵說話，靖仇決定扮成民女混上船。\n3. 到右邊杜大娘家找小蘭，用皮靴換烏蠻簪子。\n4. 到左上屋找殷婆婆，用鐵戒指和手鐲換細絲綢。\n5. 拿船旁的胭脂，進客棧找張烈換裝，再和衛兵說話上船。\n# 蘆家渡\n- 胭脂：地上，船旁\n# 支線：老張回家\n- 和客棧外的老張說話幾次，資助他回家：給 300 兩得映霞鋼環，給 100 兩得紫玉冰晶。紫玉冰晶後面煉化用得上。\n# 支線：杜大娘的寶藏\n1. 和右邊屋的杜大娘說話，得知有寶藏。\n2. 依序調查船頭前的地面、階梯旁的石頭、旁邊的傘、下方的五個罐子，得地稔根。\n# 運輸船\n1. 進第二艙房和民女們說話，出來告訴張烈沒看到玉兒。\n2. 進第三艙房被韓公公識破，打退衛兵，韓公公逃走。\n3. 回甲板打退衛兵，到第二艙房放走民女，再回甲板打倒衛兵。\n4. 韓公公招出神農鼎正運往皇上的龍舟，張烈殺了他，一行人開船到大梁。\n- 靈界指標：甲板的甕堆（隱藏）\n- 羅勒草：寶箱，第一艙房\n- 還靈丹：第二艙房右邊的櫃子（隱藏）\n- 鳳尾草液：寶箱，往下的第一艙房\n- 還魄丹：寶箱，往下的第二艙房\n- 金象晶礦：第三艙房右上（隱藏）\n# 商店\n- 劍師老吳：鐵劍 120、長劍 250、青鋼劍 520、白虹鐵環 180、映霞鋼環 400、蒺藜杵棒 540、飛斧 70、飛刀 100\n- 雜貨商楊老闆：手鐲 50、皮靴 50、銅戒指 20、鐵戒指 35、銀戒指 60、神草結 50", "html": "<h3>流程</h3><ol><li>和船上的衛兵說話：韓公公在抓民女獻給皇上，阿雪猜玉兒故意被抓混上船。</li><li>再和衛兵說話，靖仇決定扮成民女混上船。</li><li>到右邊杜大娘家找小蘭，用<span class=\"jump items\" data-view=\"items\" data-detail=\"皮靴@3355\" title=\"在物品大全中打開\">皮靴</span>換<span class=\"jump items\" data-view=\"items\" data-detail=\"烏蠻簪子@3112\" title=\"在物品大全中打開\">烏蠻簪子</span>。</li><li>到左上屋找殷婆婆，用<span class=\"jump items\" data-view=\"items\" data-detail=\"鐵戒指@3380\" title=\"在物品大全中打開\">鐵戒指</span>和<span class=\"jump items\" data-view=\"items\" data-detail=\"手鐲@3329\" title=\"在物品大全中打開\">手鐲</span>換<span class=\"jump items\" data-view=\"items\" data-detail=\"細絲綢@3113\" title=\"在物品大全中打開\">細絲綢</span>。</li><li>拿船旁的<span class=\"jump items\" data-view=\"items\" data-detail=\"胭脂@3111\" title=\"在物品大全中打開\">胭脂</span>，進客棧找張烈換裝，再和衛兵說話上船。</li></ol><h3>蘆家渡</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"胭脂@3111\" title=\"在物品大全中打開\">胭脂</span>：地上，船旁</li></ul><h3>支線：老張回家</h3><ul><li>和客棧外的老張說話幾次，資助他回家：給 300 兩得<span class=\"jump items\" data-view=\"items\" data-detail=\"映霞鋼環@3221\" title=\"在物品大全中打開\">映霞鋼環</span>，給 100 兩得<span class=\"jump items\" data-view=\"items\" data-detail=\"紫玉冰晶@3054\" title=\"在物品大全中打開\">紫玉冰晶</span>。紫玉冰晶後面煉化用得上。</li></ul><h3>支線：杜大娘的寶藏</h3><ol><li>和右邊屋的杜大娘說話，得知有寶藏。</li><li>依序調查船頭前的地面、階梯旁的石頭、旁邊的傘、下方的五個罐子，得<span class=\"jump items\" data-view=\"items\" data-detail=\"地稔根@3022\" title=\"在物品大全中打開\">地稔根</span>。</li></ol><h3>運輸船</h3><ol><li>進第二艙房和民女們說話，出來告訴張烈沒看到玉兒。</li><li>進第三艙房被韓公公識破，打退衛兵，韓公公逃走。</li><li>回甲板打退衛兵，到第二艙房放走民女，再回甲板打倒衛兵。</li><li>韓公公招出神農鼎正運往皇上的龍舟，張烈殺了他，一行人開船到大梁。</li></ol><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@3094\" title=\"在物品大全中打開\">靈界指標</span>：甲板的甕堆（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span>：寶箱，第一艙房</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@3011\" title=\"在物品大全中打開\">還靈丹</span>：第二艙房右邊的櫃子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鳳尾草液@3002\" title=\"在物品大全中打開\">鳳尾草液</span>：寶箱，往下的第一艙房</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span>：寶箱，往下的第二艙房</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金象晶礦@3078\" title=\"在物品大全中打開\">金象晶礦</span>：第三艙房右上（隱藏）</li></ul><h3>商店</h3><ul><li>劍師老吳：<span class=\"jump items\" data-view=\"items\" data-detail=\"鐵劍@3202\" title=\"在物品大全中打開\">鐵劍</span> 120、<span class=\"jump items\" data-view=\"items\" data-detail=\"長劍@3203\" title=\"在物品大全中打開\">長劍</span> 250、<span class=\"jump items\" data-view=\"items\" data-detail=\"青鋼劍@3204\" title=\"在物品大全中打開\">青鋼劍</span> 520、<span class=\"jump items\" data-view=\"items\" data-detail=\"白虹鐵環@3220\" title=\"在物品大全中打開\">白虹鐵環</span> 180、<span class=\"jump items\" data-view=\"items\" data-detail=\"映霞鋼環@3221\" title=\"在物品大全中打開\">映霞鋼環</span> 400、<span class=\"jump items\" data-view=\"items\" data-detail=\"蒺藜杵棒@3234\" title=\"在物品大全中打開\">蒺藜杵棒</span> 540、<span class=\"jump items\" data-view=\"items\" data-detail=\"飛斧@3257\" title=\"在物品大全中打開\">飛斧</span> 70、<span class=\"jump items\" data-view=\"items\" data-detail=\"飛刀@3258\" title=\"在物品大全中打開\">飛刀</span> 100</li><li>雜貨商楊老闆：<span class=\"jump items\" data-view=\"items\" data-detail=\"手鐲@3329\" title=\"在物品大全中打開\">手鐲</span> 50、<span class=\"jump items\" data-view=\"items\" data-detail=\"皮靴@3355\" title=\"在物品大全中打開\">皮靴</span> 50、<span class=\"jump items\" data-view=\"items\" data-detail=\"銅戒指@3379\" title=\"在物品大全中打開\">銅戒指</span> 20、<span class=\"jump items\" data-view=\"items\" data-detail=\"鐵戒指@3380\" title=\"在物品大全中打開\">鐵戒指</span> 35、<span class=\"jump items\" data-view=\"items\" data-detail=\"銀戒指@3381\" title=\"在物品大全中打開\">銀戒指</span> 60、<span class=\"jump items\" data-view=\"items\" data-detail=\"神草結@3387\" title=\"在物品大全中打開\">神草結</span> 50</li></ul>"}, {"chapter": "江北", "title": "大梁（第一次）", "text": "大梁（第一次）\n# 流程\n1. 和客棧旁的徐老頭說話，得知神農鼎已運上主龍舟。\n2. 到碼頭，趁衛兵背對時溜進港口右邊、有兩個衛兵來回走動的那艘船，接下來見龍舟。\n# 支線：小孩的問題\n- 和客棧旁路口的小孩說話，回答「小四」，得神祕果。第二次來大梁時回答「呂公」，得玉山佛甲草（靈力 +15）。\n# 提示\n- 大梁藥鋪的白色藥材只有這一次能買，至少買三份，以後支線要用。\n- 再買一個紫藤葉，李瞳兒要。\n# 商店\n- 雜貨店：銅戒指 20、鐵戒指 35、銀戒指 60、銀項鍊 105、神草結 50、太極護符 120、符紙鶴 50\n- 藥鋪：解病萬靈丹 30、解僵針 40、白色藥材 120、紫藤葉 80、羅勒草 35、鳳尾草液 80、金創藥 150、野石榴 20、入地金牛粉 70、還魄丹 70", "html": "<h3>流程</h3><ol><li>和客棧旁的徐老頭說話，得知神農鼎已運上主龍舟。</li><li>到碼頭，趁衛兵背對時溜進港口右邊、有兩個衛兵來回走動的那艘船，接下來見<span class=\"goto\" data-title=\"龍舟\">龍舟</span>。</li></ol><h3>支線：小孩的問題</h3><ul><li>和客棧旁路口的小孩說話，回答「小四」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>。第二次來大梁時回答「呂公」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"玉山佛甲草@3043\" title=\"在物品大全中打開\">玉山佛甲草</span>（靈力 +15）。</li></ul><h3>提示</h3><ul><li>大梁藥鋪的<span class=\"jump items\" data-view=\"items\" data-detail=\"白色藥材@3086\" title=\"在物品大全中打開\">白色藥材</span>只有這一次能買，至少買三份，以後支線要用。</li><li>再買一個<span class=\"jump items\" data-view=\"items\" data-detail=\"紫藤葉@3069\" title=\"在物品大全中打開\">紫藤葉</span>，李瞳兒要。</li></ul><h3>商店</h3><ul><li>雜貨店：<span class=\"jump items\" data-view=\"items\" data-detail=\"銅戒指@3379\" title=\"在物品大全中打開\">銅戒指</span> 20、<span class=\"jump items\" data-view=\"items\" data-detail=\"鐵戒指@3380\" title=\"在物品大全中打開\">鐵戒指</span> 35、<span class=\"jump items\" data-view=\"items\" data-detail=\"銀戒指@3381\" title=\"在物品大全中打開\">銀戒指</span> 60、<span class=\"jump items\" data-view=\"items\" data-detail=\"銀項鍊@3382\" title=\"在物品大全中打開\">銀項鍊</span> 105、<span class=\"jump items\" data-view=\"items\" data-detail=\"神草結@3387\" title=\"在物品大全中打開\">神草結</span> 50、<span class=\"jump items\" data-view=\"items\" data-detail=\"太極護符@3390\" title=\"在物品大全中打開\">太極護符</span> 120、<span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span> 50</li><li>藥鋪：<span class=\"jump items\" data-view=\"items\" data-detail=\"解病萬靈丹@3025\" title=\"在物品大全中打開\">解病萬靈丹</span> 30、<span class=\"jump items\" data-view=\"items\" data-detail=\"解僵針@3026\" title=\"在物品大全中打開\">解僵針</span> 40、<span class=\"jump items\" data-view=\"items\" data-detail=\"白色藥材@3086\" title=\"在物品大全中打開\">白色藥材</span> 120、<span class=\"jump items\" data-view=\"items\" data-detail=\"紫藤葉@3069\" title=\"在物品大全中打開\">紫藤葉</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span> 35、<span class=\"jump items\" data-view=\"items\" data-detail=\"鳳尾草液@3002\" title=\"在物品大全中打開\">鳳尾草液</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"野石榴@3020\" title=\"在物品大全中打開\">野石榴</span> 20、<span class=\"jump items\" data-view=\"items\" data-detail=\"入地金牛粉@3021\" title=\"在物品大全中打開\">入地金牛粉</span> 70、<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span> 70</li></ul>"}, {"chapter": "江北", "title": "龍舟", "text": "龍舟\n# 偏船\n1. 一路閃過衛兵往前走，衛兵背對時才能過，被看到就從碼頭重來。\n2. 到神農鼎的房間，阿雪一碰，鼎的把手斷了。進來的公公招出：真鼎被一群響馬搶走，這是假鼎。\n3. 張烈想殺他，靖仇求情放了他，結果他引衛兵來圍捕，一行人從另一頭的小道逃走。\n- 飛刀：寶箱\n- 銀項鍊：左上房間，左邊的床（隱藏）\n- 入地金牛粉：放袋子的房間（隱藏）\n- 鼠槌：放木桶的房間（隱藏）（法寶，2000 成長，鼠槌指令：滑鼠和空白鍵一起連按效率較好）\n- 蒺藜杵棒：放武器的房間（隱藏）\n- 護心鏡：寶箱，再往前\n- 蛟鱗衣：第二個鼎房，右上的屏風（隱藏）\n# 船艙\n- 流雲針：寶箱，下樓梯後\n- 還靈丹：寶箱\n- 飛刀：寶箱\n- 鳳尾草液：寶箱\n- 金塊：寶箱\n- 還魄丹：寶箱\n- 鳳尾草液：寶箱\n- 羅勒草：寶箱\n- 還魄丹：寶箱，映月之光之後\n- 武兜：觀景臺外面的左邊（隱藏）\n# 屋樑\n1. 爬上屋樑，看到一個很像玉兒的人端著盤子走過，跟上去。\n2. 走到屋樑盡頭，先把張烈身上重要的法寶卸下。\n3. 依序和張烈、阿雪、張烈說話，看到玉兒扮成宮女行刺楊廣，被宇文拓擊退。\n4. 靖仇用鬼谷道術放煙霧救出玉兒，張烈四處放火製造混亂。\n5. 逃到龍舟船頭，玉兒不會游泳不肯跳水；靖仇勸她時中箭，玉兒只好跳下水。\n6. 靖仇醒來已在河邊破屋。\n   - 先問阿雪：阿雪好感度 +1\n   - 先問玉兒：玉兒好感度 +1\n7. 靖仇決定繼續追神農鼎，玉兒堅持同行，張烈先回部落。\n- 金創藥：寶箱，第一區\n- 羅勒草：寶箱，第一區\n- 解病萬靈丹：寶箱，第一區\n- 桑果：寶箱，第一區 DOMO\n- 翠玉金釵：寶箱，第二區\n- 飛刀：寶箱，第二區\n- 解病萬靈丹：寶箱，第二區\n- 五色石南葉：第二區往第三區、被柱子擋住的地方（隱藏）（體力 +20）\n- 金戒指：寶箱，第三區\n- 還魄丹：寶箱，第四區（可存檔）\n- 飛刀：寶箱，第四區\n# 河邊破屋\n- 玉靈鐲：屋外下方的石頭（隱藏）\n# 檮杌的條件\n- 船艙要遇到兩個隋軍隊長：先打倒上面那個，下面那個選擇饒過他。之後會遇到隋軍隊長帶著兩隻邪屍骷髏回來找碴。檮杌\n- 屋樑要遇到隋軍變成的石骨飛魚。檮杌", "html": "<h3>偏船</h3><ol><li>一路閃過衛兵往前走，衛兵背對時才能過，被看到就從碼頭重來。</li><li>到神農鼎的房間，阿雪一碰，鼎的把手斷了。進來的公公招出：真鼎被一群響馬搶走，這是假鼎。</li><li>張烈想殺他，靖仇求情放了他，結果他引衛兵來圍捕，一行人從另一頭的小道逃走。</li></ol><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"飛刀@3258\" title=\"在物品大全中打開\">飛刀</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"銀項鍊@3382\" title=\"在物品大全中打開\">銀項鍊</span>：左上房間，左邊的床（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"入地金牛粉@3021\" title=\"在物品大全中打開\">入地金牛粉</span>：放袋子的房間（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鼠槌@3160\" title=\"在物品大全中打開\">鼠槌</span>：放木桶的房間（隱藏）（法寶，2000 成長，鼠槌指令：滑鼠和空白鍵一起連按效率較好）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"蒺藜杵棒@3234\" title=\"在物品大全中打開\">蒺藜杵棒</span>：放武器的房間（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"護心鏡@3296\" title=\"在物品大全中打開\">護心鏡</span>：寶箱，再往前</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"蛟鱗衣@3298\" title=\"在物品大全中打開\">蛟鱗衣</span>：第二個鼎房，右上的屏風（隱藏）</li></ul><h3>船艙</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"流雲針@3259\" title=\"在物品大全中打開\">流雲針</span>：寶箱，下樓梯後</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@3011\" title=\"在物品大全中打開\">還靈丹</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"飛刀@3258\" title=\"在物品大全中打開\">飛刀</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鳳尾草液@3002\" title=\"在物品大全中打開\">鳳尾草液</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金塊@3063\" title=\"在物品大全中打開\">金塊</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鳳尾草液@3002\" title=\"在物品大全中打開\">鳳尾草液</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span>：寶箱，映月之光之後</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"武兜@3276\" title=\"在物品大全中打開\">武兜</span>：觀景臺外面的左邊（隱藏）</li></ul><h3>屋樑</h3><ol><li>爬上屋樑，看到一個很像玉兒的人端著盤子走過，跟上去。</li><li>走到屋樑盡頭，先把張烈身上重要的法寶卸下。</li><li>依序和張烈、阿雪、張烈說話，看到玉兒扮成宮女行刺楊廣，被宇文拓擊退。</li><li>靖仇用鬼谷道術放煙霧救出玉兒，張烈四處放火製造混亂。</li><li>逃到龍舟船頭，玉兒不會游泳不肯跳水；靖仇勸她時中箭，玉兒只好跳下水。</li><li>靖仇醒來已在河邊破屋。<ul><li>先問阿雪：阿雪好感度 +1</li><li>先問玉兒：玉兒好感度 +1</li></ul></li><li>靖仇決定繼續追神農鼎，玉兒堅持同行，張烈先回部落。</li></ol><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span>：寶箱，第一區</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span>：寶箱，第一區</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"解病萬靈丹@3025\" title=\"在物品大全中打開\">解病萬靈丹</span>：寶箱，第一區</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"桑果@3006\" title=\"在物品大全中打開\">桑果</span>：寶箱，第一區 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"翠玉金釵@3275\" title=\"在物品大全中打開\">翠玉金釵</span>：寶箱，第二區</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"飛刀@3258\" title=\"在物品大全中打開\">飛刀</span>：寶箱，第二區</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"解病萬靈丹@3025\" title=\"在物品大全中打開\">解病萬靈丹</span>：寶箱，第二區</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"五色石南葉@3035\" title=\"在物品大全中打開\">五色石南葉</span>：第二區往第三區、被柱子擋住的地方（隱藏）（體力 +20）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金戒指@3383\" title=\"在物品大全中打開\">金戒指</span>：寶箱，第三區</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span>：寶箱，第四區（可存檔）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"飛刀@3258\" title=\"在物品大全中打開\">飛刀</span>：寶箱，第四區</li></ul><h3>河邊破屋</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"玉靈鐲@3331\" title=\"在物品大全中打開\">玉靈鐲</span>：屋外下方的石頭（隱藏）</li></ul><h3>檮杌的條件</h3><ul><li>船艙要遇到兩個隋軍隊長：先打倒上面那個，下面那個選擇饒過他。之後會遇到隋軍隊長帶著兩隻<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"邪屍骷髏@225\" title=\"在神魔異事錄中打開\">邪屍骷髏</span>回來找碴。<span class=\"tag beast\">檮杌</span></li><li>屋樑要遇到隋軍變成的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"石骨飛魚@154\" title=\"在神魔異事錄中打開\">石骨飛魚</span>。<span class=\"tag beast\">檮杌</span></li></ul>"}, {"chapter": "江北", "title": "豆子坑與魔王砦", "text": "豆子坑與魔王砦\n# 流程\n1. 出河邊破屋往上到豆子坑。和左邊的湯老九說話：神農鼎被魔王砦的土匪劫走了。\n2. 進客棧吃飯，隋兵在外面欺壓百姓，出手打倒他們，認識程咬金和秦叔寶。\n3. 上山到魔王砦寨門口，玉兒提議潛進寨裡。調查下方的水池，出來時看到運糧車。\n4. 兩種進寨的方法，選一種：\n- 運糧車（玉兒好感度 +3）：找豆子坑左下的小葉子說話，到右上的岩石拿蟾琢香包給小葉子，再到寨門口和小葉子說話。\n- 潛水（玉兒好感度 −4）：和豆子坑的小孩玩躲貓貓，找到六個小孩換竹管，到水池邊用竹管。\n# 豆子坑\n- 靈界指標：寶箱，右邊岩石旁\n- 蟾琢香包：右上的岩石（隱藏）\n- 木象晶礦：左邊民房，左下的木堆（隱藏）\n# 魔王砦\n1. 進通道，遇到搶寶箱的丁格，選擇跟他搶，打倒他得暗殺寶錄（法寶，4500 成長，投擲指令）。饕餮\n2. 通道盡頭遇到程咬金，原來他就是混世魔王。玉兒和他爭神鼎的所有權時，宇文拓帶人搶走神鼎，還嫁禍給靖仇等人。\n3. 打倒程咬金，玉兒答應十五天內把神鼎找回來。\n4. 出豆子坑往東北到東萊。\n- 博落迴之根：上山小路的左側（隱藏）藥材\n- 解僵針：寶箱，通道\n- 金創藥：寶箱，通道\n- 流雲針：寶箱，通道\n- 青鋼劍：寶箱，通道\n- 羅勒草：寶箱，通道\n- 記得收一隻黏怪，DOMO 組員要。DOMO\n# 商店\n- 武器商長孫休：皮帽 80、武兜 130、玉靈鐲 150、聖輪法鐲 200、鋼鐵護腕 90、龍鱗手套 120、鐵縷甲 380、蛟鱗衣 450、鋼靴 80、鷹爪靴 110\n- 貨郎楊七：翠玉金釵 150、五結簪 180、銀戒指 60、銀項鍊 105、金戒指 90、太極護符 120、解病萬靈丹 30、解僵針 40、茴香茶 20、符紙鶴 50、羅勒草 35、金創藥 150、桑果 50、柴胡乾葛草 200、還靈丹 80", "html": "<h3>流程</h3><ol><li>出河邊破屋往上到豆子坑。和左邊的湯老九說話：神農鼎被魔王砦的土匪劫走了。</li><li>進客棧吃飯，隋兵在外面欺壓百姓，出手打倒他們，認識程咬金和秦叔寶。</li><li>上山到魔王砦寨門口，玉兒提議潛進寨裡。調查下方的水池，出來時看到運糧車。</li><li>兩種進寨的方法，選一種：</li></ol><ul><li>運糧車（玉兒好感度 +3）：找豆子坑左下的小葉子說話，到右上的岩石拿<span class=\"jump items\" data-view=\"items\" data-detail=\"蟾琢香包@3114\" title=\"在物品大全中打開\">蟾琢香包</span>給小葉子，再到寨門口和小葉子說話。</li><li>潛水（玉兒好感度 −4）：和豆子坑的小孩玩躲貓貓，找到六個小孩換<span class=\"jump items\" data-view=\"items\" data-detail=\"竹管@3115\" title=\"在物品大全中打開\">竹管</span>，到水池邊用竹管。</li></ul><h3>豆子坑</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@3094\" title=\"在物品大全中打開\">靈界指標</span>：寶箱，右邊岩石旁</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"蟾琢香包@3114\" title=\"在物品大全中打開\">蟾琢香包</span>：右上的岩石（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"木象晶礦@3079\" title=\"在物品大全中打開\">木象晶礦</span>：左邊民房，左下的木堆（隱藏）</li></ul><h3>魔王砦</h3><ol><li>進通道，遇到搶寶箱的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"丁格@24\" title=\"在神魔異事錄中打開\">丁格</span>，選擇跟他搶，打倒他得<span class=\"jump items\" data-view=\"items\" data-detail=\"暗殺寶錄@3172\" title=\"在物品大全中打開\">暗殺寶錄</span>（法寶，4500 成長，投擲指令）。<span class=\"tag beast\">饕餮</span></li><li>通道盡頭遇到程咬金，原來他就是混世魔王。玉兒和他爭神鼎的所有權時，宇文拓帶人搶走神鼎，還嫁禍給靖仇等人。</li><li>打倒<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"程咬金@13\" title=\"在神魔異事錄中打開\">程咬金</span>，玉兒答應十五天內把神鼎找回來。</li><li>出豆子坑往東北到東萊。</li></ol><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"博落迴之根@3065\" title=\"在物品大全中打開\">博落迴之根</span>：上山小路的左側（隱藏）<span class=\"tag herb\">藥材</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"解僵針@3026\" title=\"在物品大全中打開\">解僵針</span>：寶箱，通道</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span>：寶箱，通道</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"流雲針@3259\" title=\"在物品大全中打開\">流雲針</span>：寶箱，通道</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"青鋼劍@3204\" title=\"在物品大全中打開\">青鋼劍</span>：寶箱，通道</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span>：寶箱，通道</li><li>記得收一隻<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"黏怪@216\" title=\"在神魔異事錄中打開\">黏怪</span>，DOMO 組員要。<span class=\"tag domo\">DOMO</span></li></ul><h3>商店</h3><ul><li>武器商長孫休：<span class=\"jump items\" data-view=\"items\" data-detail=\"皮帽@3274\" title=\"在物品大全中打開\">皮帽</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"武兜@3276\" title=\"在物品大全中打開\">武兜</span> 130、<span class=\"jump items\" data-view=\"items\" data-detail=\"玉靈鐲@3331\" title=\"在物品大全中打開\">玉靈鐲</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"聖輪法鐲@3333\" title=\"在物品大全中打開\">聖輪法鐲</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"鋼鐵護腕@3330\" title=\"在物品大全中打開\">鋼鐵護腕</span> 90、<span class=\"jump items\" data-view=\"items\" data-detail=\"龍鱗手套@3332\" title=\"在物品大全中打開\">龍鱗手套</span> 120、<span class=\"jump items\" data-view=\"items\" data-detail=\"鐵縷甲@3297\" title=\"在物品大全中打開\">鐵縷甲</span> 380、<span class=\"jump items\" data-view=\"items\" data-detail=\"蛟鱗衣@3298\" title=\"在物品大全中打開\">蛟鱗衣</span> 450、<span class=\"jump items\" data-view=\"items\" data-detail=\"鋼靴@3356\" title=\"在物品大全中打開\">鋼靴</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"鷹爪靴@3357\" title=\"在物品大全中打開\">鷹爪靴</span> 110</li><li>貨郎楊七：<span class=\"jump items\" data-view=\"items\" data-detail=\"翠玉金釵@3275\" title=\"在物品大全中打開\">翠玉金釵</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"五結簪@3277\" title=\"在物品大全中打開\">五結簪</span> 180、<span class=\"jump items\" data-view=\"items\" data-detail=\"銀戒指@3381\" title=\"在物品大全中打開\">銀戒指</span> 60、<span class=\"jump items\" data-view=\"items\" data-detail=\"銀項鍊@3382\" title=\"在物品大全中打開\">銀項鍊</span> 105、<span class=\"jump items\" data-view=\"items\" data-detail=\"金戒指@3383\" title=\"在物品大全中打開\">金戒指</span> 90、<span class=\"jump items\" data-view=\"items\" data-detail=\"太極護符@3390\" title=\"在物品大全中打開\">太極護符</span> 120、<span class=\"jump items\" data-view=\"items\" data-detail=\"解病萬靈丹@3025\" title=\"在物品大全中打開\">解病萬靈丹</span> 30、<span class=\"jump items\" data-view=\"items\" data-detail=\"解僵針@3026\" title=\"在物品大全中打開\">解僵針</span> 40、<span class=\"jump items\" data-view=\"items\" data-detail=\"茴香茶@3029\" title=\"在物品大全中打開\">茴香茶</span> 20、<span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span> 50、<span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span> 35、<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"桑果@3006\" title=\"在物品大全中打開\">桑果</span> 50、<span class=\"jump items\" data-view=\"items\" data-detail=\"柴胡乾葛草@3008\" title=\"在物品大全中打開\">柴胡乾葛草</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@3011\" title=\"在物品大全中打開\">還靈丹</span> 80</li></ul>"}, {"chapter": "江北", "title": "東萊與泰山", "text": "東萊與泰山\n# 流程\n1. 從東萊左邊出去，到西邊的泰山下叢林救齊二郎。\n2. 回東萊和門口的小孩說話，進屋找齊二郎，得知隋軍在泰山設了法壇。\n   - 先和阿雪說話：阿雪好感度 +1\n   - 先和玉兒說話：玉兒好感度 +1\n3. 出東萊往西到泰山，打倒門口的守衛，往上到法壇。\n4. 韓騰和楊碩來了，眾人躲起來看：楊碩發動萬靈血陣把東萊化為灰燼，取得萬靈血珠交給韓騰帶走。\n5. 玉兒出來質問，打倒楊碩，楊碩咬舌自盡。\n   - 先和阿雪說話：阿雪好感度 +1\n   - 先和玉兒說話：玉兒好感度 +1\n6. 從楊碩身上找到秘密地圖和信：宇文拓要部下去大梁查神農鼎的下落。\n# 東萊\n- 火筒：右上通道盡頭（隱藏）\n- 珍珠：盆樹左邊的房子，上邊的櫃子（隱藏）\n# 練功\n- 東萊上方凸出的海灘有鬼蛙，生命 600，每隻經驗 500（激怒後 650）。一般攻擊和奇術很難打傷，多用龍飄、鼠槌、暗器（翔羽葉、流雲針）或投擲指令。\n- 先練到 40 級就好，後面有必敗的戰鬥，不要練太高。", "html": "<h3>流程</h3><ol><li>從東萊左邊出去，到西邊的泰山下叢林救齊二郎。</li><li>回東萊和門口的小孩說話，進屋找齊二郎，得知隋軍在泰山設了法壇。<ul><li>先和阿雪說話：阿雪好感度 +1</li><li>先和玉兒說話：玉兒好感度 +1</li></ul></li><li>出東萊往西到泰山，打倒門口的守衛，往上到法壇。</li><li>韓騰和楊碩來了，眾人躲起來看：楊碩發動萬靈血陣把東萊化為灰燼，取得萬靈血珠交給韓騰帶走。</li><li>玉兒出來質問，打倒<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"楊碩@17\" title=\"在神魔異事錄中打開\">楊碩</span>，楊碩咬舌自盡。<ul><li>先和阿雪說話：阿雪好感度 +1</li><li>先和玉兒說話：玉兒好感度 +1</li></ul></li><li>從楊碩身上找到<span class=\"jump items\" data-view=\"items\" data-detail=\"秘密地圖@3116\" title=\"在物品大全中打開\">秘密地圖</span>和信：宇文拓要部下去大梁查神農鼎的下落。</li></ol><h3>東萊</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"火筒@3077\" title=\"在物品大全中打開\">火筒</span>：右上通道盡頭（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"珍珠@3093\" title=\"在物品大全中打開\">珍珠</span>：盆樹左邊的房子，上邊的櫃子（隱藏）</li></ul><h3>練功</h3><ul><li>東萊上方凸出的海灘有<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"鬼蛙@250\" title=\"在神魔異事錄中打開\">鬼蛙</span>，生命 600，每隻經驗 500（激怒後 650）。一般攻擊和奇術很難打傷，多用龍飄、鼠槌、暗器（翔羽葉、流雲針）或投擲指令。</li><li>先練到 40 級就好，後面有必敗的戰鬥，不要練太高。</li></ul>"}, {"chapter": "江北", "title": "響馬的船", "text": "響馬的船\n# 流程\n1. 出泰山到豆子坑南邊的碼頭，看到一艘船，直接殺進去。\n2. 打倒火蝠魚精，寧珂公主出現殺了牠，告訴眾人神農鼎在船的最底層。玉兒怕是陷阱，要靖仇先去看。\n   - 先和阿雪說話：阿雪好感度 +3\n   - 先和玉兒說話：玉兒好感度 +1\n3. 下樓遇到寧珂，靖仇說玉兒不相信她，寧珂要三人拿她當人質。\n   - 先和阿雪說話：阿雪好感度 +3\n   - 先和玉兒說話：玉兒好感度 +1\n4. 在第二艙房找到神農銅鼎，收進煉妖壺。寧珂把船送給眾人，說宇文拓也在收集上古神器，臨走送阿雪鈴鐺髮簪。\n5. 不知道去哪裡找治師伯的藥材，玉兒提議開船去大梁。\n# 物品\n- 硝石：寶箱，第一艙房\n- 神祕果：寶箱，第二艙房 DOMO\n- 炭粉：寶箱，下樓後的第一艙房\n- 海檬果：第三艙房右邊的櫃子（隱藏）藥材", "html": "<h3>流程</h3><ol><li>出泰山到豆子坑南邊的碼頭，看到一艘船，直接殺進去。</li><li>打倒<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"火蝠魚精@226\" title=\"在神魔異事錄中打開\">火蝠魚精</span>，寧珂公主出現殺了牠，告訴眾人神農鼎在船的最底層。玉兒怕是陷阱，要靖仇先去看。<ul><li>先和阿雪說話：阿雪好感度 +3</li><li>先和玉兒說話：玉兒好感度 +1</li></ul></li><li>下樓遇到寧珂，靖仇說玉兒不相信她，寧珂要三人拿她當人質。<ul><li>先和阿雪說話：阿雪好感度 +3</li><li>先和玉兒說話：玉兒好感度 +1</li></ul></li><li>在第二艙房找到<span class=\"jump items\" data-view=\"items\" data-detail=\"神農銅鼎@3107\" title=\"在物品大全中打開\">神農銅鼎</span>，收進煉妖壺。寧珂把船送給眾人，說宇文拓也在收集上古神器，臨走送阿雪<span class=\"jump items\" data-view=\"items\" data-detail=\"鈴鐺髮簪@3117\" title=\"在物品大全中打開\">鈴鐺髮簪</span>。</li><li>不知道去哪裡找治師伯的藥材，玉兒提議開船去大梁。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"硝石@3074\" title=\"在物品大全中打開\">硝石</span>：寶箱，第一艙房</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>：寶箱，第二艙房 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"炭粉@3076\" title=\"在物品大全中打開\">炭粉</span>：寶箱，下樓後的第一艙房</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"海檬果@3066\" title=\"在物品大全中打開\">海檬果</span>：第三艙房右邊的櫃子（隱藏）<span class=\"tag herb\">藥材</span></li></ul>"}, {"chapter": "江北", "title": "大梁與採藥洞窟", "text": "大梁與採藥洞窟\n# 流程\n1. 和藥鋪老闆說話，花 300 兩買下藥材（先拒絕再說一次是 250 兩），只差鵁肉。老闆說西方的山洞有鵁鳥出沒。\n2. 出大梁往西進採藥洞窟。到兩根柱子那裡發射長矛打下三隻鵁，再打倒鵁精，得鵁肉和天山雪蓮。\n3. 回船上煉好治師伯的藥，到魔王砦：程咬金已歸降張須駝，不再需要神農鼎，但玉兒堅持守約。\n4. 三人大戰程咬金和秦叔寶，贏了得朱雀火羽（法寶，2500 成長，抗火 80%）。程咬金會強化攻防，攻擊又高，先打倒他。\n5. 經蘆家渡回雷夏澤，屋裡沒人。和河邊的老人說話：師伯已經過世，師母搬到大梁。\n6. 到大梁，先在藥鋪前和公山夢說話，再到最右邊的房子找師母，得到師伯的遺書：東海仙島的仙人或許能救師父，出海要有海船。\n7. 和隔壁的船匠趙四說話，花 400 兩改造船隻。\n# 支線：小孩的問題\n- 和路口的小孩說話，回答「呂公」，得玉山佛甲草（靈力 +15）。\n# 採藥洞窟\n- 羅勒草：地上，路旁\n- 化雪奇石：寶箱\n- 大葉合歡散：調查白色的菇（隱藏）藥材\n- 硫磺：寶箱\n- 金創藥：寶箱\n- 金戒指：寶箱\n- 遇到兩個冥府獄卒和一個夜叉時，選擇離開。檮杌\n# 商店\n- 雜貨店：銀戒指 60、銀項鍊 105、金戒指 90、金項鍊 150、太極護符 120、八卦護符 250、遁影浮沙 250、符紙鶴 50\n- 藥鋪：解病萬靈丹 30、解僵針 40、茴香茶 20、青色藥材 150、紫藤葉 80、羅勒草 35、鳳尾草液 80、金創藥 150、姜黃粉 100、柴胡乾葛草 200、還靈丹 80、還魄丹 70\n- 武器店：青鋼劍 520、昆吾劍 640、映霞鋼環 400、柳葉刀 450、飛斧 70、飛刀 100、流雲針 180", "html": "<h3>流程</h3><ol><li>和藥鋪老闆說話，花 300 兩買下藥材（先拒絕再說一次是 250 兩），只差鵁肉。老闆說西方的山洞有鵁鳥出沒。</li><li>出大梁往西進採藥洞窟。到兩根柱子那裡發射長矛打下三隻鵁，再打倒<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"鵁精@48\" title=\"在神魔異事錄中打開\">鵁精</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"鵁肉@3118\" title=\"在物品大全中打開\">鵁肉</span>和<span class=\"jump items\" data-view=\"items\" data-detail=\"天山雪蓮@3013\" title=\"在物品大全中打開\">天山雪蓮</span>。</li><li>回船上煉好治師伯的藥，到魔王砦：程咬金已歸降張須駝，不再需要神農鼎，但玉兒堅持守約。</li><li>三人大戰<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"程咬金@13\" title=\"在神魔異事錄中打開\">程咬金</span>和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"秦叔寶@14\" title=\"在神魔異事錄中打開\">秦叔寶</span>，贏了得<span class=\"jump items\" data-view=\"items\" data-detail=\"朱雀火羽@3157\" title=\"在物品大全中打開\">朱雀火羽</span>（法寶，2500 成長，抗火 80%）。程咬金會強化攻防，攻擊又高，先打倒他。</li><li>經蘆家渡回雷夏澤，屋裡沒人。和河邊的老人說話：師伯已經過世，師母搬到大梁。</li><li>到大梁，先在藥鋪前和公山夢說話，再到最右邊的房子找師母，得到師伯的遺書：東海仙島的仙人或許能救師父，出海要有海船。</li><li>和隔壁的船匠趙四說話，花 400 兩改造船隻。</li></ol><h3>支線：小孩的問題</h3><ul><li>和路口的小孩說話，回答「呂公」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"玉山佛甲草@3043\" title=\"在物品大全中打開\">玉山佛甲草</span>（靈力 +15）。</li></ul><h3>採藥洞窟</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span>：地上，路旁</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"化雪奇石@3028\" title=\"在物品大全中打開\">化雪奇石</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"大葉合歡散@3071\" title=\"在物品大全中打開\">大葉合歡散</span>：調查白色的菇（隱藏）<span class=\"tag herb\">藥材</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"硫磺@3075\" title=\"在物品大全中打開\">硫磺</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金戒指@3383\" title=\"在物品大全中打開\">金戒指</span>：寶箱</li><li>遇到兩個<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"冥府獄卒@122\" title=\"在神魔異事錄中打開\">冥府獄卒</span>和一個<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"夜叉@164\" title=\"在神魔異事錄中打開\">夜叉</span>時，選擇離開。<span class=\"tag beast\">檮杌</span></li></ul><h3>商店</h3><ul><li>雜貨店：<span class=\"jump items\" data-view=\"items\" data-detail=\"銀戒指@3381\" title=\"在物品大全中打開\">銀戒指</span> 60、<span class=\"jump items\" data-view=\"items\" data-detail=\"銀項鍊@3382\" title=\"在物品大全中打開\">銀項鍊</span> 105、<span class=\"jump items\" data-view=\"items\" data-detail=\"金戒指@3383\" title=\"在物品大全中打開\">金戒指</span> 90、<span class=\"jump items\" data-view=\"items\" data-detail=\"金項鍊@3385\" title=\"在物品大全中打開\">金項鍊</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"太極護符@3390\" title=\"在物品大全中打開\">太極護符</span> 120、<span class=\"jump items\" data-view=\"items\" data-detail=\"八卦護符@3388\" title=\"在物品大全中打開\">八卦護符</span> 250、<span class=\"jump items\" data-view=\"items\" data-detail=\"遁影浮沙@3047\" title=\"在物品大全中打開\">遁影浮沙</span> 250、<span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span> 50</li><li>藥鋪：<span class=\"jump items\" data-view=\"items\" data-detail=\"解病萬靈丹@3025\" title=\"在物品大全中打開\">解病萬靈丹</span> 30、<span class=\"jump items\" data-view=\"items\" data-detail=\"解僵針@3026\" title=\"在物品大全中打開\">解僵針</span> 40、<span class=\"jump items\" data-view=\"items\" data-detail=\"茴香茶@3029\" title=\"在物品大全中打開\">茴香茶</span> 20、<span class=\"jump items\" data-view=\"items\" data-detail=\"青色藥材@3083\" title=\"在物品大全中打開\">青色藥材</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"紫藤葉@3069\" title=\"在物品大全中打開\">紫藤葉</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span> 35、<span class=\"jump items\" data-view=\"items\" data-detail=\"鳳尾草液@3002\" title=\"在物品大全中打開\">鳳尾草液</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"姜黃粉@3007\" title=\"在物品大全中打開\">姜黃粉</span> 100、<span class=\"jump items\" data-view=\"items\" data-detail=\"柴胡乾葛草@3008\" title=\"在物品大全中打開\">柴胡乾葛草</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@3011\" title=\"在物品大全中打開\">還靈丹</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span> 70</li><li>武器店：<span class=\"jump items\" data-view=\"items\" data-detail=\"青鋼劍@3204\" title=\"在物品大全中打開\">青鋼劍</span> 520、<span class=\"jump items\" data-view=\"items\" data-detail=\"昆吾劍@3205\" title=\"在物品大全中打開\">昆吾劍</span> 640、<span class=\"jump items\" data-view=\"items\" data-detail=\"映霞鋼環@3221\" title=\"在物品大全中打開\">映霞鋼環</span> 400、<span class=\"jump items\" data-view=\"items\" data-detail=\"柳葉刀@3244\" title=\"在物品大全中打開\">柳葉刀</span> 450、<span class=\"jump items\" data-view=\"items\" data-detail=\"飛斧@3257\" title=\"在物品大全中打開\">飛斧</span> 70、<span class=\"jump items\" data-view=\"items\" data-detail=\"飛刀@3258\" title=\"在物品大全中打開\">飛刀</span> 100、<span class=\"jump items\" data-view=\"items\" data-detail=\"流雲針@3259\" title=\"在物品大全中打開\">流雲針</span> 180</li></ul>"}, {"chapter": "東海", "title": "魚肚與氐人國", "text": "魚肚與氐人國\n# 流程\n1. 上船出海。\n   - 先和阿雪說話：阿雪好感度 +1\n   - 先和玉兒說話：玉兒好感度 +1\n2. 被一條大鯨魚吞下去。\n   - 先和阿雪說話：阿雪好感度 +1\n   - 先和玉兒說話：玉兒好感度 +1\n3. 走出魚肚迷宮，打倒兩名氐人族戰士，氐人族女王出面制止，請眾人到宮殿。\n4. 女王說氐人族正受黑龍王威脅，請眾人除掉黑龍王，事成後帶大家去仙山島。\n5. 出宮殿到左下找女王，坐小鯨魚到東海海底，進貝殼海。\n# 魚肚\n- 水象晶礦：第一畫面最下邊的石頭，通道正下方（隱藏）\n- 還魄丹：寶箱\n- 延胡索之花：地上 藥材\n- 鳳尾草液：寶箱\n- 鹿茸膏：寶箱\n- 庖丁菜刀：寶箱（法寶，4500 成長，分解指令）\n- 五結簪：寶箱\n# 氐人國\n- 三葉雪桑果：左下屋內，左上的櫃子（隱藏）DOMO\n- 遁影浮沙：右上屋內，左上的櫃子（隱藏）\n- 珍珠：宮殿左邊房間的床（隱藏）\n- 鹿茸膏：武器店旁的白色海螺殼（隱藏）\n# 商店\n- 雜貨店：金戒指 90、玉戒指 120、金項鍊 150、珍珠戒指 200、八卦護符 250、安神定志丸 80、化雪奇石 130、符紙鶴 50、鳳尾草液 80、金創藥 150、柴胡乾葛草 200、還靈丹 80、靈神天藥 180、還魄丹 70\n- 武器店：藏瓔環 600、鴛鴦刀 540、森羅烏帽 200、形意環帶 220、龍鱗手套 120、聖輪法鐲 200、蛟鱗衣 450、武衛鎧 430、鱗靴 155、飛刀 100、流雲針 180、輪刃 260", "html": "<h3>流程</h3><ol><li>上船出海。<ul><li>先和阿雪說話：阿雪好感度 +1</li><li>先和玉兒說話：玉兒好感度 +1</li></ul></li><li>被一條大鯨魚吞下去。<ul><li>先和阿雪說話：阿雪好感度 +1</li><li>先和玉兒說話：玉兒好感度 +1</li></ul></li><li>走出魚肚迷宮，打倒兩名<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"氐人族戰士@49\" title=\"在神魔異事錄中打開\">氐人族戰士</span>，氐人族女王出面制止，請眾人到宮殿。</li><li>女王說氐人族正受黑龍王威脅，請眾人除掉黑龍王，事成後帶大家去仙山島。</li><li>出宮殿到左下找女王，坐小鯨魚到東海海底，進貝殼海。</li></ol><h3>魚肚</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"水象晶礦@3080\" title=\"在物品大全中打開\">水象晶礦</span>：第一畫面最下邊的石頭，通道正下方（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"延胡索之花@3070\" title=\"在物品大全中打開\">延胡索之花</span>：地上 <span class=\"tag herb\">藥材</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鳳尾草液@3002\" title=\"在物品大全中打開\">鳳尾草液</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"庖丁菜刀@3175\" title=\"在物品大全中打開\">庖丁菜刀</span>：寶箱（法寶，4500 成長，分解指令）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"五結簪@3277\" title=\"在物品大全中打開\">五結簪</span>：寶箱</li></ul><h3>氐人國</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"三葉雪桑果@3037\" title=\"在物品大全中打開\">三葉雪桑果</span>：左下屋內，左上的櫃子（隱藏）<span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"遁影浮沙@3047\" title=\"在物品大全中打開\">遁影浮沙</span>：右上屋內，左上的櫃子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"珍珠@3093\" title=\"在物品大全中打開\">珍珠</span>：宮殿左邊房間的床（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span>：武器店旁的白色海螺殼（隱藏）</li></ul><h3>商店</h3><ul><li>雜貨店：<span class=\"jump items\" data-view=\"items\" data-detail=\"金戒指@3383\" title=\"在物品大全中打開\">金戒指</span> 90、<span class=\"jump items\" data-view=\"items\" data-detail=\"玉戒指@3384\" title=\"在物品大全中打開\">玉戒指</span> 120、<span class=\"jump items\" data-view=\"items\" data-detail=\"金項鍊@3385\" title=\"在物品大全中打開\">金項鍊</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"珍珠戒指@3386\" title=\"在物品大全中打開\">珍珠戒指</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"八卦護符@3388\" title=\"在物品大全中打開\">八卦護符</span> 250、<span class=\"jump items\" data-view=\"items\" data-detail=\"安神定志丸@3027\" title=\"在物品大全中打開\">安神定志丸</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"化雪奇石@3028\" title=\"在物品大全中打開\">化雪奇石</span> 130、<span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span> 50、<span class=\"jump items\" data-view=\"items\" data-detail=\"鳳尾草液@3002\" title=\"在物品大全中打開\">鳳尾草液</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"柴胡乾葛草@3008\" title=\"在物品大全中打開\">柴胡乾葛草</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@3011\" title=\"在物品大全中打開\">還靈丹</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"靈神天藥@3012\" title=\"在物品大全中打開\">靈神天藥</span> 180、<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span> 70</li><li>武器店：<span class=\"jump items\" data-view=\"items\" data-detail=\"藏瓔環@3222\" title=\"在物品大全中打開\">藏瓔環</span> 600、<span class=\"jump items\" data-view=\"items\" data-detail=\"鴛鴦刀@3245\" title=\"在物品大全中打開\">鴛鴦刀</span> 540、<span class=\"jump items\" data-view=\"items\" data-detail=\"森羅烏帽@3278\" title=\"在物品大全中打開\">森羅烏帽</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"形意環帶@3279\" title=\"在物品大全中打開\">形意環帶</span> 220、<span class=\"jump items\" data-view=\"items\" data-detail=\"龍鱗手套@3332\" title=\"在物品大全中打開\">龍鱗手套</span> 120、<span class=\"jump items\" data-view=\"items\" data-detail=\"聖輪法鐲@3333\" title=\"在物品大全中打開\">聖輪法鐲</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"蛟鱗衣@3298\" title=\"在物品大全中打開\">蛟鱗衣</span> 450、<span class=\"jump items\" data-view=\"items\" data-detail=\"武衛鎧@3299\" title=\"在物品大全中打開\">武衛鎧</span> 430、<span class=\"jump items\" data-view=\"items\" data-detail=\"鱗靴@3358\" title=\"在物品大全中打開\">鱗靴</span> 155、<span class=\"jump items\" data-view=\"items\" data-detail=\"飛刀@3258\" title=\"在物品大全中打開\">飛刀</span> 100、<span class=\"jump items\" data-view=\"items\" data-detail=\"流雲針@3259\" title=\"在物品大全中打開\">流雲針</span> 180、<span class=\"jump items\" data-view=\"items\" data-detail=\"輪刃@3260\" title=\"在物品大全中打開\">輪刃</span> 260</li></ul>"}, {"chapter": "東海", "title": "貝殼海與黑龍王", "text": "貝殼海與黑龍王\n# 流程\n1. 貝殼海裡的貝殼可以打掉，不打比較不會迷路。\n2. 出貝殼海，往上進龍宮，打倒守衛的蝦兵和魚兵，再進龍宮打倒黑龍王。\n3. 黑龍王騙玉兒崆峒印能讓死去的親人復活，玉兒取下崆峒印，氐人族變回原形、老態龍鍾。玉兒決定親自向女王道歉。\n4. 回氐人國前先把玉兒身上重要的法寶卸下。玉兒自責，用刀毀了自己的容貌，傷重幾乎失明。\n5. 幾天後玉兒傷勢較穩，女王過意不去，親自送一行人到仙山島。\n# 貝殼海\n- 靈界指標：寶箱，第一區\n- 金創藥：寶箱，第一區\n- 雨皇花：第一區出口前的另一條路，兩邊有海螺的地方，左側的紅海草（隱藏）\n- 神祕果：寶箱，第二區 DOMO\n- 龍鱗手套：寶箱，第二區\n- 第一區把一隻貓鬼屍打到快死時牠會求饒，選擇放過牠。檮杌\n# 東海海底\n- 靈虛扇：出貝殼海後，左上一團黑黑的地方（隱藏）（法寶，3000 成長，抵抗所有狀態）", "html": "<h3>流程</h3><ol><li>貝殼海裡的貝殼可以打掉，不打比較不會迷路。</li><li>出貝殼海，往上進龍宮，打倒守衛的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蝦兵@59\" title=\"在神魔異事錄中打開\">蝦兵</span>和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"魚兵@58\" title=\"在神魔異事錄中打開\">魚兵</span>，再進龍宮打倒<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"黑龍王@50\" title=\"在神魔異事錄中打開\">黑龍王</span>。</li><li>黑龍王騙玉兒崆峒印能讓死去的親人復活，玉兒取下崆峒印，氐人族變回原形、老態龍鍾。玉兒決定親自向女王道歉。</li><li>回氐人國前先把玉兒身上重要的法寶卸下。玉兒自責，用刀毀了自己的容貌，傷重幾乎失明。</li><li>幾天後玉兒傷勢較穩，女王過意不去，親自送一行人到仙山島。</li></ol><h3>貝殼海</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@3094\" title=\"在物品大全中打開\">靈界指標</span>：寶箱，第一區</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span>：寶箱，第一區</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"雨皇花@3089\" title=\"在物品大全中打開\">雨皇花</span>：第一區出口前的另一條路，兩邊有海螺的地方，左側的紅海草（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>：寶箱，第二區 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"龍鱗手套@3332\" title=\"在物品大全中打開\">龍鱗手套</span>：寶箱，第二區</li><li>第一區把一隻<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"貓鬼屍@195\" title=\"在神魔異事錄中打開\">貓鬼屍</span>打到快死時牠會求饒，選擇放過牠。<span class=\"tag beast\">檮杌</span></li></ul><h3>東海海底</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈虛扇@3153\" title=\"在物品大全中打開\">靈虛扇</span>：出貝殼海後，左上一團黑黑的地方（隱藏）（法寶，3000 成長，抵抗所有狀態）</li></ul>"}, {"chapter": "東海", "title": "仙山島與百草澗", "text": "仙山島與百草澗\n# 流程\n1. 往北進仙山島山道。玉兒發高燒，休息幾天，退燒後繼續走。\n2. 晚上休息時，玉兒已經完全失明。\n   - 先去看阿雪：阿雪好感度 +5\n   - 先和玉兒說話：玉兒好感度 +1\n3. 玉兒高燒不退，靖仇到百草澗找七種退燒的藥草：虎杖、血鳳藤、苦膽木、白藥子、羊蹄草、安息香、香薷。\n4. 煮藥給玉兒喝，沒用。\n5. 阿雪想到神農鼎，兩人再去百草澗各採一份，用神農鼎煮，還是沒用。阿雪割下一塊臂肉一起煮，玉兒終於退燒。\n6. 第二天穿過百草澗到對奕亭，仙人正在下棋，等了兩天兩夜，然翁要靖仇到天外村的然翁居再談。出對奕亭，往下再往上到天外村。\n# 仙山島山道\n- 靈神天藥：第一場景下方的小瀑布（隱藏）\n- 靈界指標：寶箱\n- 龍骨木：寶箱上方的樹（隱藏）藥材\n- 輪迴盤：寶箱\n- 解病萬靈丹：寶箱\n- 羅勒草：地上\n- 乾坤袋：寶箱（法寶，2900 成長，偷竊指令，每偷一次法寶經驗 +5）\n- 柴胡乾葛草：地上\n- 菟絲魔子：地上 藥材\n- 金創藥：第一場景出口上方的草（隱藏）\n- 凌霄果：第二場景山崖右邊的樹（隱藏）DOMO\n- 嘉果：崖下橋頭左邊上方（隱藏）DOMO\n- 遇到兩個樂仙女時，選擇不解釋。檮杌\n# 往百草澗\n- 海檬果：寶箱 DOMO\n- 金創藥：寶箱\n- 鹿茸膏：寶箱\n# 百草澗的七種藥草\n- 虎杖：入口下邊的草叢（隱藏）\n- 血鳳藤：橋旁的山壁（隱藏）\n- 苦膽木：大石頭下（隱藏）\n- 白藥子：階梯盡頭（隱藏）\n- 羊蹄草：道路盡頭（隱藏）\n- 安息香、香薷：山壁上（隱藏）\n# 對奕亭\n- 白狐披風：靈芝樹下（隱藏）（最好的衣服，每回合恢復生命、靈力、體力各 5%）", "html": "<h3>流程</h3><ol><li>往北進仙山島山道。玉兒發高燒，休息幾天，退燒後繼續走。</li><li>晚上休息時，玉兒已經完全失明。<ul><li>先去看阿雪：阿雪好感度 +5</li><li>先和玉兒說話：玉兒好感度 +1</li></ul></li><li>玉兒高燒不退，靖仇到百草澗找七種退燒的藥草：<span class=\"jump items\" data-view=\"items\" data-detail=\"虎杖@3120\" title=\"在物品大全中打開\">虎杖</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"血鳳藤@3121\" title=\"在物品大全中打開\">血鳳藤</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"苦膽木@3122\" title=\"在物品大全中打開\">苦膽木</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"白藥子@3126\" title=\"在物品大全中打開\">白藥子</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"羊蹄草@3124\" title=\"在物品大全中打開\">羊蹄草</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"安息香@3125\" title=\"在物品大全中打開\">安息香</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"香薷@3123\" title=\"在物品大全中打開\">香薷</span>。</li><li>煮藥給玉兒喝，沒用。</li><li>阿雪想到神農鼎，兩人再去百草澗各採一份，用神農鼎煮，還是沒用。阿雪割下一塊臂肉一起煮，玉兒終於退燒。</li><li>第二天穿過百草澗到對奕亭，仙人正在下棋，等了兩天兩夜，然翁要靖仇到天外村的然翁居再談。出對奕亭，往下再往上到天外村。</li></ol><h3>仙山島山道</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈神天藥@3012\" title=\"在物品大全中打開\">靈神天藥</span>：第一場景下方的小瀑布（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@3094\" title=\"在物品大全中打開\">靈界指標</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"龍骨木@3068\" title=\"在物品大全中打開\">龍骨木</span>：寶箱上方的樹（隱藏）<span class=\"tag herb\">藥材</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@3017\" title=\"在物品大全中打開\">輪迴盤</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"解病萬靈丹@3025\" title=\"在物品大全中打開\">解病萬靈丹</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羅勒草@3001\" title=\"在物品大全中打開\">羅勒草</span>：地上</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"乾坤袋@3165\" title=\"在物品大全中打開\">乾坤袋</span>：寶箱（法寶，2900 成長，偷竊指令，每偷一次法寶經驗 +5）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"柴胡乾葛草@3008\" title=\"在物品大全中打開\">柴胡乾葛草</span>：地上</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"菟絲魔子@3072\" title=\"在物品大全中打開\">菟絲魔子</span>：地上 <span class=\"tag herb\">藥材</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span>：第一場景出口上方的草（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"凌霄果@3024\" title=\"在物品大全中打開\">凌霄果</span>：第二場景山崖右邊的樹（隱藏）<span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@3023\" title=\"在物品大全中打開\">嘉果</span>：崖下橋頭左邊上方（隱藏）<span class=\"tag domo\">DOMO</span></li><li>遇到兩個<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"樂仙女@132\" title=\"在神魔異事錄中打開\">樂仙女</span>時，選擇不解釋。<span class=\"tag beast\">檮杌</span></li></ul><h3>往百草澗</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"海檬果@3066\" title=\"在物品大全中打開\">海檬果</span>：寶箱 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span>：寶箱</li></ul><h3>百草澗的七種藥草</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"虎杖@3120\" title=\"在物品大全中打開\">虎杖</span>：入口下邊的草叢（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"血鳳藤@3121\" title=\"在物品大全中打開\">血鳳藤</span>：橋旁的山壁（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"苦膽木@3122\" title=\"在物品大全中打開\">苦膽木</span>：大石頭下（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"白藥子@3126\" title=\"在物品大全中打開\">白藥子</span>：階梯盡頭（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羊蹄草@3124\" title=\"在物品大全中打開\">羊蹄草</span>：道路盡頭（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"安息香@3125\" title=\"在物品大全中打開\">安息香</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"香薷@3123\" title=\"在物品大全中打開\">香薷</span>：山壁上（隱藏）</li></ul><h3>對奕亭</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"白狐披風@3325\" title=\"在物品大全中打開\">白狐披風</span>：靈芝樹下（隱藏）（最好的衣服，每回合恢復生命、靈力、體力各 5%）</li></ul>"}, {"chapter": "東海", "title": "天外村", "text": "天外村\n# 流程\n1. 到然翁居求古月聖幫忙，被拒絕，但他提醒靖仇到東皇巔找百年地稔根醫治玉兒。\n   - 先和阿雪說話：阿雪好感度 +1\n   - 先和玉兒說話：玉兒好感度 +1\n2. 玉兒又發燒，然翁安排眾人休息。\n   - 先和阿雪說話：阿雪好感度 +1\n   - 先和玉兒說話：玉兒好感度 +4\n3. 到左上房間休息。深夜玉兒傷勢惡化，靖仇用自己的臂肉熬藥也沒用。\n   - 先和阿雪說話：阿雪好感度 +2\n   - 先和玉兒說話：玉兒好感度 +1\n4. 靖仇出門找百年地稔根，失足掉下山崖，被然翁救回。阿雪懇求古月聖，古月聖終於答應救人。\n5. 靖仇醒來後和阿雪說話，到庭院找古月聖：要兩人到西母峰採一棵血露蟠桃。出天外村往西到西母峰。\n# 物品\n- 晷日天輪：然翁居庭院左上角的石頭（隱藏）（男性最好的手套）\n- 五彩石項鍊：入口門右邊的樹下（隱藏）（女性最好的飾品）\n# DOMO 工作室\n- 天外村左上的水井通到 DOMO 工作室，見DOMO工作室。\n- 怪圖二：左上的電腦，夜晚才拿得到（隱藏）\n- 怪圖一：中央的電腦，夜晚才拿得到（隱藏）\n- 呼拉圈：最右邊角落，白天才拿得到（隱藏）（阿雪最強的武器，熟練後攻擊力很高，但不容易練）\n- 中央電腦旁那台電腦的密碼是 1202，可以看一些怪圖。是不是夜晚，看窗外的景色就知道。\n# 商店\n- 雜貨店：玉戒指 120、八卦護符 250、白玉飛天珮 230、阿修羅之森 350、白皙葫蘆 400、符紙鶴 50\n- 藥鋪：解病萬靈丹 30、解僵針 40、安神定志丸 80、茴香茶 20、溶石魔羽 120、三葉雪桑果 110、赤色藥材 180、鳳尾草液 80、金創藥 150、鹿茸膏 350、柴胡乾葛草 200、還靈丹 80、靈神天藥 180、地稔根 250、還魄丹 70\n- 武器店：藏瓔環 600、瑑瓊環 780、鴛鴦刀 540、宿鐵刀 630、飛刀 100、流雲針 180、輪刃 260、翔羽葉 380", "html": "<h3>流程</h3><ol><li>到然翁居求古月聖幫忙，被拒絕，但他提醒靖仇到東皇巔找百年地稔根醫治玉兒。<ul><li>先和阿雪說話：阿雪好感度 +1</li><li>先和玉兒說話：玉兒好感度 +1</li></ul></li><li>玉兒又發燒，然翁安排眾人休息。<ul><li>先和阿雪說話：阿雪好感度 +1</li><li>先和玉兒說話：玉兒好感度 +4</li></ul></li><li>到左上房間休息。深夜玉兒傷勢惡化，靖仇用自己的臂肉熬藥也沒用。<ul><li>先和阿雪說話：阿雪好感度 +2</li><li>先和玉兒說話：玉兒好感度 +1</li></ul></li><li>靖仇出門找百年地稔根，失足掉下山崖，被然翁救回。阿雪懇求古月聖，古月聖終於答應救人。</li><li>靖仇醒來後和阿雪說話，到庭院找古月聖：要兩人到西母峰採一棵血露蟠桃。出天外村往西到西母峰。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"晷日天輪@3352\" title=\"在物品大全中打開\">晷日天輪</span>：然翁居庭院左上角的石頭（隱藏）（男性最好的手套）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"五彩石項鍊@3398\" title=\"在物品大全中打開\">五彩石項鍊</span>：入口門右邊的樹下（隱藏）（女性最好的飾品）</li></ul><h3>DOMO 工作室</h3><ul><li>天外村左上的水井通到 DOMO 工作室，見<span class=\"goto\" data-title=\"DOMO工作室\">DOMO工作室</span>。</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"怪圖二@3193\" title=\"在物品大全中打開\">怪圖二</span>：左上的電腦，夜晚才拿得到（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"怪圖一@3192\" title=\"在物品大全中打開\">怪圖一</span>：中央的電腦，夜晚才拿得到（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"呼拉圈@3232\" title=\"在物品大全中打開\">呼拉圈</span>：最右邊角落，白天才拿得到（隱藏）（阿雪最強的武器，熟練後攻擊力很高，但不容易練）</li><li>中央電腦旁那台電腦的密碼是 1202，可以看一些怪圖。是不是夜晚，看窗外的景色就知道。</li></ul><h3>商店</h3><ul><li>雜貨店：<span class=\"jump items\" data-view=\"items\" data-detail=\"玉戒指@3384\" title=\"在物品大全中打開\">玉戒指</span> 120、<span class=\"jump items\" data-view=\"items\" data-detail=\"八卦護符@3388\" title=\"在物品大全中打開\">八卦護符</span> 250、<span class=\"jump items\" data-view=\"items\" data-detail=\"白玉飛天珮@3391\" title=\"在物品大全中打開\">白玉飛天珮</span> 230、<span class=\"jump items\" data-view=\"items\" data-detail=\"阿修羅之森@3062\" title=\"在物品大全中打開\">阿修羅之森</span> 350、<span class=\"jump items\" data-view=\"items\" data-detail=\"白皙葫蘆@3056\" title=\"在物品大全中打開\">白皙葫蘆</span> 400、<span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span> 50</li><li>藥鋪：<span class=\"jump items\" data-view=\"items\" data-detail=\"解病萬靈丹@3025\" title=\"在物品大全中打開\">解病萬靈丹</span> 30、<span class=\"jump items\" data-view=\"items\" data-detail=\"解僵針@3026\" title=\"在物品大全中打開\">解僵針</span> 40、<span class=\"jump items\" data-view=\"items\" data-detail=\"安神定志丸@3027\" title=\"在物品大全中打開\">安神定志丸</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"茴香茶@3029\" title=\"在物品大全中打開\">茴香茶</span> 20、<span class=\"jump items\" data-view=\"items\" data-detail=\"溶石魔羽@3030\" title=\"在物品大全中打開\">溶石魔羽</span> 120、<span class=\"jump items\" data-view=\"items\" data-detail=\"三葉雪桑果@3037\" title=\"在物品大全中打開\">三葉雪桑果</span> 110、<span class=\"jump items\" data-view=\"items\" data-detail=\"赤色藥材@3084\" title=\"在物品大全中打開\">赤色藥材</span> 180、<span class=\"jump items\" data-view=\"items\" data-detail=\"鳳尾草液@3002\" title=\"在物品大全中打開\">鳳尾草液</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span> 350、<span class=\"jump items\" data-view=\"items\" data-detail=\"柴胡乾葛草@3008\" title=\"在物品大全中打開\">柴胡乾葛草</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@3011\" title=\"在物品大全中打開\">還靈丹</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"靈神天藥@3012\" title=\"在物品大全中打開\">靈神天藥</span> 180、<span class=\"jump items\" data-view=\"items\" data-detail=\"地稔根@3022\" title=\"在物品大全中打開\">地稔根</span> 250、<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span> 70</li><li>武器店：<span class=\"jump items\" data-view=\"items\" data-detail=\"藏瓔環@3222\" title=\"在物品大全中打開\">藏瓔環</span> 600、<span class=\"jump items\" data-view=\"items\" data-detail=\"瑑瓊環@3223\" title=\"在物品大全中打開\">瑑瓊環</span> 780、<span class=\"jump items\" data-view=\"items\" data-detail=\"鴛鴦刀@3245\" title=\"在物品大全中打開\">鴛鴦刀</span> 540、<span class=\"jump items\" data-view=\"items\" data-detail=\"宿鐵刀@3246\" title=\"在物品大全中打開\">宿鐵刀</span> 630、<span class=\"jump items\" data-view=\"items\" data-detail=\"飛刀@3258\" title=\"在物品大全中打開\">飛刀</span> 100、<span class=\"jump items\" data-view=\"items\" data-detail=\"流雲針@3259\" title=\"在物品大全中打開\">流雲針</span> 180、<span class=\"jump items\" data-view=\"items\" data-detail=\"輪刃@3260\" title=\"在物品大全中打開\">輪刃</span> 260、<span class=\"jump items\" data-view=\"items\" data-detail=\"翔羽葉@3261\" title=\"在物品大全中打開\">翔羽葉</span> 380</li></ul>"}, {"chapter": "東海", "title": "西母峰", "text": "西母峰\n# 流程\n1. 阿雪摘下蟠桃時，刑天出現。刑天可偷神木之精（生命 +100），偷到之前先別打：打掉一定的血量後牠會放大絕招。\n2. 打倒刑天後，靖仇和阿雪爭著替對方受罰，然翁出現：這是王母娘娘的試驗，只有肯為別人犧牲的人才能摘蟠桃。\n3. 回然翁居，進內室用血露蟠桃加神農鼎煉出赤玉晶，拿給玉兒吞下，古月聖再注入桃花功力，玉兒完全康復。\n4. 三天後和玉兒說話，玉兒歸隊。古月聖答應去伏魔山救陳輔，到對奕亭找他：要眾人到海中建木取盤古巨斧對付饕餮，並給七角海笛。\n5. 到地圖左上的莫支灘吹七角海笛，喚來藍晶，坐小鯨魚往下到海中建木。先和阿雪說話，阿雪好感度 +5。\n# 物品\n- 千月星痕：入口往左後的下一個場景，最下面道路的正中央往上調查（隱藏）\n- 靈界指標：寶箱\n- 輪迴盤：寶箱\n- 天山雪蓮：地上\n- 活骨靈藥：寶箱\n- 仙魄香：兩條溪夾著的場景，最左邊的紅樹下（隱藏）\n- 虎爪鞋：寶箱\n- 血露蟠桃：山頂（隱藏）\n- 花妖問的問題要答對：不是同一種族，蝠精妖。檮杌", "html": "<h3>流程</h3><ol><li>阿雪摘下蟠桃時，<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"刑天@29\" title=\"在神魔異事錄中打開\">刑天</span>出現。<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"刑天@29\" title=\"在神魔異事錄中打開\">刑天</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"神木之精@3042\" title=\"在物品大全中打開\">神木之精</span>（生命 +100），偷到之前先別打：打掉一定的血量後牠會放大絕招。</li><li>打倒刑天後，靖仇和阿雪爭著替對方受罰，然翁出現：這是王母娘娘的試驗，只有肯為別人犧牲的人才能摘蟠桃。</li><li>回然翁居，進內室用血露蟠桃加神農鼎煉出<span class=\"jump items\" data-view=\"items\" data-detail=\"赤玉晶@3144\" title=\"在物品大全中打開\">赤玉晶</span>，拿給玉兒吞下，古月聖再注入桃花功力，玉兒完全康復。</li><li>三天後和玉兒說話，玉兒歸隊。古月聖答應去伏魔山救陳輔，到對奕亭找他：要眾人到海中建木取盤古巨斧對付饕餮，並給<span class=\"jump items\" data-view=\"items\" data-detail=\"七角海笛@3130\" title=\"在物品大全中打開\">七角海笛</span>。</li><li>到地圖左上的莫支灘吹七角海笛，喚來藍晶，坐小鯨魚往下到海中建木。先和阿雪說話，阿雪好感度 +5。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"千月星痕@3206\" title=\"在物品大全中打開\">千月星痕</span>：入口往左後的下一個場景，最下面道路的正中央往上調查（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@3094\" title=\"在物品大全中打開\">靈界指標</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@3017\" title=\"在物品大全中打開\">輪迴盤</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天山雪蓮@3013\" title=\"在物品大全中打開\">天山雪蓮</span>：地上</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"活骨靈藥@3041\" title=\"在物品大全中打開\">活骨靈藥</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"仙魄香@3014\" title=\"在物品大全中打開\">仙魄香</span>：兩條溪夾著的場景，最左邊的紅樹下（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"虎爪鞋@3359\" title=\"在物品大全中打開\">虎爪鞋</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"血露蟠桃@3129\" title=\"在物品大全中打開\">血露蟠桃</span>：山頂（隱藏）</li><li>花妖問的問題要答對：不是同一種族，蝠精妖。<span class=\"tag beast\">檮杌</span></li></ul>"}, {"chapter": "東海", "title": "海中建木", "text": "海中建木\n# 流程\n1. 沿著巨木走到頂，打倒盤古，得盤古巨斧。盤古可偷舍利子（靈力 +20，智慧 +5）。\n2. 回對奕亭找古月聖，回然翁居休息一晚，出來和古月聖說話，然翁用御劍術載眾人到伏魔山。\n   - 先和阿雪說話：阿雪好感度 +1\n   - 先和玉兒說話：玉兒好感度 +1\n# 物品\n- 活骨靈藥：寶箱\n- 入地金牛粉：寶箱\n- 符紙鶴：寶箱\n- 金創藥：寶箱\n- 陰陽鏡：放水上箱子那個場景的最左邊、黑色的地方（隱藏）（法寶，3200 成長，天雷指令）\n- 溶石魔羽：寶箱\n- 硫磺：寶箱\n- 靈神天藥：寶箱\n- 嘉果：寶箱\n- 天仙酒：寶箱\n- 龍骨木：寶箱\n- 阿修羅之森：映月之光前一個場景，下方被樹擋住處的右上方（隱藏）\n- 玄武之沂：映月之光左邊（隱藏）（法寶，2500 成長，抗水 80%）\n# 偷竊\n- 雪女可偷不老之泉水（生命 +40）。\n- 茶仙可偷五色石南葉（體力 +20）。\n# 支線：黃志榮與楊志豪\n- 坐小鯨魚到仙山島右下角的小灣，找到黃志榮，一直說話到他願意回去，黃志榮歸隊。見DOMO組員。\n- 到氐人國轉進東海海底，進龍宮左邊的貝殼（龍宮密道），找到楊志豪，回答「游泳」，楊志豪歸隊。\n# 龍宮密道\n- 金元五體丹：入口下邊尖石的右側（隱藏）\n- 神祕果：寶箱 DOMO\n- 水象晶礦：寶箱\n- 符紙鶴：迷路海，水道往上的兩條通道之一（隱藏）\n- 符紙鶴：迷路海，另一條通道（隱藏）\n- 這裡的蝦兵、魚兵、蟹將每隻給 20 點法寶經驗，適合練法寶（例如乾坤袋）。", "html": "<h3>流程</h3><ol><li>沿著巨木走到頂，打倒<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"盤古@52\" title=\"在神魔異事錄中打開\">盤古</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"盤古巨斧@3104\" title=\"在物品大全中打開\">盤古巨斧</span>。<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"盤古@52\" title=\"在神魔異事錄中打開\">盤古</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"舍利子@3040\" title=\"在物品大全中打開\">舍利子</span>（靈力 +20，智慧 +5）。</li><li>回對奕亭找古月聖，回然翁居休息一晚，出來和古月聖說話，然翁用御劍術載眾人到伏魔山。<ul><li>先和阿雪說話：阿雪好感度 +1</li><li>先和玉兒說話：玉兒好感度 +1</li></ul></li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"活骨靈藥@3041\" title=\"在物品大全中打開\">活骨靈藥</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"入地金牛粉@3021\" title=\"在物品大全中打開\">入地金牛粉</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"陰陽鏡@3178\" title=\"在物品大全中打開\">陰陽鏡</span>：放水上箱子那個場景的最左邊、黑色的地方（隱藏）（法寶，3200 成長，天雷指令）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"溶石魔羽@3030\" title=\"在物品大全中打開\">溶石魔羽</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"硫磺@3075\" title=\"在物品大全中打開\">硫磺</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈神天藥@3012\" title=\"在物品大全中打開\">靈神天藥</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@3023\" title=\"在物品大全中打開\">嘉果</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天仙酒@3049\" title=\"在物品大全中打開\">天仙酒</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"龍骨木@3068\" title=\"在物品大全中打開\">龍骨木</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"阿修羅之森@3062\" title=\"在物品大全中打開\">阿修羅之森</span>：映月之光前一個場景，下方被樹擋住處的右上方（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"玄武之沂@3168\" title=\"在物品大全中打開\">玄武之沂</span>：映月之光左邊（隱藏）（法寶，2500 成長，抗水 80%）</li></ul><h3>偷竊</h3><ul><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"雪女@130\" title=\"在神魔異事錄中打開\">雪女</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"不老之泉水@3036\" title=\"在物品大全中打開\">不老之泉水</span>（生命 +40）。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"茶仙@131\" title=\"在神魔異事錄中打開\">茶仙</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"五色石南葉@3035\" title=\"在物品大全中打開\">五色石南葉</span>（體力 +20）。</li></ul><h3>支線：黃志榮與楊志豪</h3><ul><li>坐小鯨魚到仙山島右下角的小灣，找到黃志榮，一直說話到他願意回去，黃志榮歸隊。見<span class=\"goto\" data-title=\"DOMO組員\">DOMO組員</span>。</li><li>到氐人國轉進東海海底，進龍宮左邊的貝殼（龍宮密道），找到楊志豪，回答「游泳」，楊志豪歸隊。</li></ul><h3>龍宮密道</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金元五體丹@3050\" title=\"在物品大全中打開\">金元五體丹</span>：入口下邊尖石的右側（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>：寶箱 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"水象晶礦@3080\" title=\"在物品大全中打開\">水象晶礦</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span>：迷路海，水道往上的兩條通道之一（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span>：迷路海，另一條通道（隱藏）</li><li>這裡的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蝦兵@59\" title=\"在神魔異事錄中打開\">蝦兵</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"魚兵@58\" title=\"在神魔異事錄中打開\">魚兵</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"蟹將@60\" title=\"在神魔異事錄中打開\">蟹將</span>每隻給 20 點法寶經驗，適合練法寶（例如乾坤袋）。</li></ul>"}, {"chapter": "東海", "title": "伏魔山救師", "text": "伏魔山救師\n# 流程\n1. 進山洞，來到陳輔被冰封的地方。古月聖救出陳輔，用盤古巨斧把饕餮送到異空間。\n2. 古月聖先治療陳輔。\n   - 先和阿雪說話：阿雪好感度 +1\n   - 先和玉兒說話：玉兒好感度 +1\n3. 靖仇進山洞取得崑崙古鏡。回到然翁居，古月聖順便幫阿雪激發潛能。\n   - 先和阿雪說話：阿雪好感度 +1\n   - 先和玉兒說話：玉兒好感度 +1\n4. 到對奕亭找然翁：當初設下青春不老結界的正是然翁。他要眾人去氐人國請他們準備好崆峒印，幾天後親自去設結界。\n5. 到莫支灘坐小鯨魚到地圖右上的大鯨魚，進氐人國。女王說崆峒印已被宇文拓奪走。\n6. 回然翁居找然翁：靖仇所說的九五之陣其實是失卻之陣，只會讓人失去最重要的記憶。玉兒建議把神農鼎和崑崙鏡放在仙人處，陳輔強烈反對，還要靖仇和胡人玉兒斷絕來往，雙方爭執，陳輔氣得走了出去。\n7. 到莫支灘和人說話，再到對奕亭找到師父：不可把鼎交給玉兒，要立刻去集齊五樣神器，靖仇只好答應。\n8. 回然翁居道別，然翁說陳輔已功力盡失，要靖仇多忍讓，並把盤古巨斧交給靖仇，用來經大禹傳送點往返人界。\n9. 從仙山島下方的仙界傳送點回人界江南地區，往下進江都。\n# 物品\n- 天山雪蓮：巨劍的劍尖（隱藏）\n- 神祕果：寶箱，山洞 DOMO\n- 鹿茸膏：寶箱\n- 硝石：寶箱\n- 300 兩：寶箱\n- 夜叉肩帶：寶箱，左上角的山洞（法寶，2800 成長，回氣指令）", "html": "<h3>流程</h3><ol><li>進山洞，來到陳輔被冰封的地方。古月聖救出陳輔，用盤古巨斧把饕餮送到異空間。</li><li>古月聖先治療陳輔。<ul><li>先和阿雪說話：阿雪好感度 +1</li><li>先和玉兒說話：玉兒好感度 +1</li></ul></li><li>靖仇進山洞取得<span class=\"jump items\" data-view=\"items\" data-detail=\"崑崙古鏡@3139\" title=\"在物品大全中打開\">崑崙古鏡</span>。回到然翁居，古月聖順便幫阿雪激發潛能。<ul><li>先和阿雪說話：阿雪好感度 +1</li><li>先和玉兒說話：玉兒好感度 +1</li></ul></li><li>到對奕亭找然翁：當初設下青春不老結界的正是然翁。他要眾人去氐人國請他們準備好崆峒印，幾天後親自去設結界。</li><li>到莫支灘坐小鯨魚到地圖右上的大鯨魚，進氐人國。女王說崆峒印已被宇文拓奪走。</li><li>回然翁居找然翁：靖仇所說的九五之陣其實是失卻之陣，只會讓人失去最重要的記憶。玉兒建議把神農鼎和崑崙鏡放在仙人處，陳輔強烈反對，還要靖仇和胡人玉兒斷絕來往，雙方爭執，陳輔氣得走了出去。</li><li>到莫支灘和人說話，再到對奕亭找到師父：不可把鼎交給玉兒，要立刻去集齊五樣神器，靖仇只好答應。</li><li>回然翁居道別，然翁說陳輔已功力盡失，要靖仇多忍讓，並把盤古巨斧交給靖仇，用來經大禹傳送點往返人界。</li><li>從仙山島下方的仙界傳送點回人界江
