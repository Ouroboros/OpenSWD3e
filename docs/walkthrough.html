南地區，往下進江都。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天山雪蓮@3013\" title=\"在物品大全中打開\">天山雪蓮</span>：巨劍的劍尖（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>：寶箱，山洞 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"硝石@3074\" title=\"在物品大全中打開\">硝石</span>：寶箱</li><li>300 兩：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"夜叉肩帶@3163\" title=\"在物品大全中打開\">夜叉肩帶</span>：寶箱，左上角的山洞（法寶，2800 成長，回氣指令）</li></ul>"}, {"chapter": "江南", "title": "江都與大禹水道", "text": "江都與大禹水道\n# 流程\n1. 和客棧門口的人說話，得知會稽郡也被毀了。進客棧休息（90 兩）。\n   - 先和阿雪說話：阿雪好感度 +1\n   - 先和玉兒說話：玉兒好感度 +1\n2. 出來在江都橋上遇到白鹿精，請他占卜三樣神器的下落。靖仇決定先去長沙找崆峒印。\n   - 伏羲琴：在敦煌石窟，難如登天\n   - 崆峒印：在長沙宇文拓手中，有貴人相助\n   - 女媧石：飄忽不定\n3. 白鹿精說去長沙可走大禹水道，要先到杏山茅屋找他的朋友喬岱娘。\n4. 回客棧告訴師父，到江都左上方的杏山找喬岱娘，她幫眾人打開大禹水道，並拜託靖仇在長沙幫她買瓊花種子。身上已經有瓊花種子時去找她，會跳過打開水道的劇情而卡關。\n5. 出杏山往東南進大禹水道，出來後往西進長沙。\n# 江都\n- 靈界指標：寶箱，城內右下\n- 珍珠：右下寶箱往下再往右的暗道（隱藏）\n- 雲生碧燄巾：同一條暗道（隱藏）\n# 大禹水道\n- 300 兩：寶箱\n- 炭粉：寶箱\n- 可以順便收些紅蝙蝠當護駕。\n# 支線：羅國成\n1. 在河邊和羅國成說話，再和左下玩球的小女孩說話。\n2. 到東邊的房子找雨虹，回河邊找羅國成，再找雨虹，回河邊和兩人說話，羅國成歸隊。見DOMO組員。\n# 支線：翠鬟\n- 和橋上的翠鬟說話，給她珍珠，得七合龍爪花（力量 +8，耐力 +5，敏捷 +3）。\n# 支線：小業子與陳盈君\n- 用石敢神石回大梁，和掛著的小業子玩猜拳，連贏三次得金塊，小業子歸隊。可以贏了就存檔、輸了就讀檔。\n- 到大梁客棧二樓，花 2000 兩向老闆的女兒買下石貓，用溶石魔羽解開小貓的石化，陳盈君歸隊。\n# 其他\n- 買了石敢神石以後可以回黑山鎮完成李瞳兒的支線（全部收集的話）。\n- 江都原野遇到兩隻火光獸和丁格時，選擇離開，不救他。之後會遇到兩隻火光獸和丁格變成的冤魂。饕餮\n- 蘆家渡這時多賣鬼煞胡刀 970、七絕苗刀 1080。七絕苗刀是玉兒在虛空之門之前最強的武器。各地雜貨商也都加賣石敢神石。\n# 商店\n- 雜貨店：珍珠戒指 200、八卦護符 250、辟邪戒指 260、白玉飛天珮 230、化雪奇石 130、遁影浮沙 250、符紙鶴 50、石敢神石 60、輪迴盤 280\n- 藥鋪：解病萬靈丹 30、解僵針 40、安神定志丸 80、茴香茶 20、三葉雪桑果 110、活骨靈藥 140、黑色藥材 200、金創藥 150、鹿茸膏 350、柴胡乾葛草 200、靈神天藥 180、地稔根 250、還魄丹 70\n- 武器店：形意環帶 220、金剛斗笠 280、法藏 300、玉蓮衣 500、木戌甲 800、虎爪鞋 160、斷形鞋 200", "html": "<h3>流程</h3><ol><li>和客棧門口的人說話，得知會稽郡也被毀了。進客棧休息（90 兩）。<ul><li>先和阿雪說話：阿雪好感度 +1</li><li>先和玉兒說話：玉兒好感度 +1</li></ul></li><li>出來在江都橋上遇到白鹿精，請他占卜三樣神器的下落。靖仇決定先去長沙找崆峒印。<ul><li>伏羲琴：在敦煌石窟，難如登天</li><li>崆峒印：在長沙宇文拓手中，有貴人相助</li><li>女媧石：飄忽不定</li></ul></li><li>白鹿精說去長沙可走大禹水道，要先到杏山茅屋找他的朋友喬岱娘。</li><li>回客棧告訴師父，到江都左上方的杏山找喬岱娘，她幫眾人打開大禹水道，並拜託靖仇在長沙幫她買瓊花種子。身上已經有<span class=\"jump items\" data-view=\"items\" data-detail=\"瓊花種子@3131\" title=\"在物品大全中打開\">瓊花種子</span>時去找她，會跳過打開水道的劇情而卡關。</li><li>出杏山往東南進大禹水道，出來後往西進長沙。</li></ol><h3>江都</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@3094\" title=\"在物品大全中打開\">靈界指標</span>：寶箱，城內右下</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"珍珠@3093\" title=\"在物品大全中打開\">珍珠</span>：右下寶箱往下再往右的暗道（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"雲生碧燄巾@3060\" title=\"在物品大全中打開\">雲生碧燄巾</span>：同一條暗道（隱藏）</li></ul><h3>大禹水道</h3><ul><li>300 兩：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"炭粉@3076\" title=\"在物品大全中打開\">炭粉</span>：寶箱</li><li>可以順便收些<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"紅蝙蝠@218\" title=\"在神魔異事錄中打開\">紅蝙蝠</span>當護駕。</li></ul><h3>支線：羅國成</h3><ol><li>在河邊和羅國成說話，再和左下玩球的小女孩說話。</li><li>到東邊的房子找雨虹，回河邊找羅國成，再找雨虹，回河邊和兩人說話，羅國成歸隊。見<span class=\"goto\" data-title=\"DOMO組員\">DOMO組員</span>。</li></ol><h3>支線：翠鬟</h3><ul><li>和橋上的翠鬟說話，給她<span class=\"jump items\" data-view=\"items\" data-detail=\"珍珠@3093\" title=\"在物品大全中打開\">珍珠</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"七合龍爪花@3044\" title=\"在物品大全中打開\">七合龍爪花</span>（力量 +8，耐力 +5，敏捷 +3）。</li></ul><h3>支線：小業子與陳盈君</h3><ul><li>用<span class=\"jump items\" data-view=\"items\" data-detail=\"石敢神石@3046\" title=\"在物品大全中打開\">石敢神石</span>回大梁，和掛著的小業子玩猜拳，連贏三次得<span class=\"jump items\" data-view=\"items\" data-detail=\"金塊@3063\" title=\"在物品大全中打開\">金塊</span>，小業子歸隊。可以贏了就存檔、輸了就讀檔。</li><li>到大梁客棧二樓，花 2000 兩向老闆的女兒買下石貓，用<span class=\"jump items\" data-view=\"items\" data-detail=\"溶石魔羽@3030\" title=\"在物品大全中打開\">溶石魔羽</span>解開小貓的石化，陳盈君歸隊。</li></ul><h3>其他</h3><ul><li>買了<span class=\"jump items\" data-view=\"items\" data-detail=\"石敢神石@3046\" title=\"在物品大全中打開\">石敢神石</span>以後可以回黑山鎮完成李瞳兒的支線（全部收集的話）。</li><li>江都原野遇到兩隻<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"火光獸@172\" title=\"在神魔異事錄中打開\">火光獸</span>和丁格時，選擇離開，不救他。之後會遇到兩隻火光獸和丁格變成的冤魂。<span class=\"tag beast\">饕餮</span></li><li>蘆家渡這時多賣<span class=\"jump items\" data-view=\"items\" data-detail=\"鬼煞胡刀@3250\" title=\"在物品大全中打開\">鬼煞胡刀</span> 970、<span class=\"jump items\" data-view=\"items\" data-detail=\"七絕苗刀@3251\" title=\"在物品大全中打開\">七絕苗刀</span> 1080。七絕苗刀是玉兒在虛空之門之前最強的武器。各地雜貨商也都加賣<span class=\"jump items\" data-view=\"items\" data-detail=\"石敢神石@3046\" title=\"在物品大全中打開\">石敢神石</span>。</li></ul><h3>商店</h3><ul><li>雜貨店：<span class=\"jump items\" data-view=\"items\" data-detail=\"珍珠戒指@3386\" title=\"在物品大全中打開\">珍珠戒指</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"八卦護符@3388\" title=\"在物品大全中打開\">八卦護符</span> 250、<span class=\"jump items\" data-view=\"items\" data-detail=\"辟邪戒指@3389\" title=\"在物品大全中打開\">辟邪戒指</span> 260、<span class=\"jump items\" data-view=\"items\" data-detail=\"白玉飛天珮@3391\" title=\"在物品大全中打開\">白玉飛天珮</span> 230、<span class=\"jump items\" data-view=\"items\" data-detail=\"化雪奇石@3028\" title=\"在物品大全中打開\">化雪奇石</span> 130、<span class=\"jump items\" data-view=\"items\" data-detail=\"遁影浮沙@3047\" title=\"在物品大全中打開\">遁影浮沙</span> 250、<span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span> 50、<span class=\"jump items\" data-view=\"items\" data-detail=\"石敢神石@3046\" title=\"在物品大全中打開\">石敢神石</span> 60、<span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@3017\" title=\"在物品大全中打開\">輪迴盤</span> 280</li><li>藥鋪：<span class=\"jump items\" data-view=\"items\" data-detail=\"解病萬靈丹@3025\" title=\"在物品大全中打開\">解病萬靈丹</span> 30、<span class=\"jump items\" data-view=\"items\" data-detail=\"解僵針@3026\" title=\"在物品大全中打開\">解僵針</span> 40、<span class=\"jump items\" data-view=\"items\" data-detail=\"安神定志丸@3027\" title=\"在物品大全中打開\">安神定志丸</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"茴香茶@3029\" title=\"在物品大全中打開\">茴香茶</span> 20、<span class=\"jump items\" data-view=\"items\" data-detail=\"三葉雪桑果@3037\" title=\"在物品大全中打開\">三葉雪桑果</span> 110、<span class=\"jump items\" data-view=\"items\" data-detail=\"活骨靈藥@3041\" title=\"在物品大全中打開\">活骨靈藥</span> 140、<span class=\"jump items\" data-view=\"items\" data-detail=\"黑色藥材@3087\" title=\"在物品大全中打開\">黑色藥材</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span> 350、<span class=\"jump items\" data-view=\"items\" data-detail=\"柴胡乾葛草@3008\" title=\"在物品大全中打開\">柴胡乾葛草</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"靈神天藥@3012\" title=\"在物品大全中打開\">靈神天藥</span> 180、<span class=\"jump items\" data-view=\"items\" data-detail=\"地稔根@3022\" title=\"在物品大全中打開\">地稔根</span> 250、<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span> 70</li><li>武器店：<span class=\"jump items\" data-view=\"items\" data-detail=\"形意環帶@3279\" title=\"在物品大全中打開\">形意環帶</span> 220、<span class=\"jump items\" data-view=\"items\" data-detail=\"金剛斗笠@3280\" title=\"在物品大全中打開\">金剛斗笠</span> 280、<span class=\"jump items\" data-view=\"items\" data-detail=\"法藏@3281\" title=\"在物品大全中打開\">法藏</span> 300、<span class=\"jump items\" data-view=\"items\" data-detail=\"玉蓮衣@3300\" title=\"在物品大全中打開\">玉蓮衣</span> 500、<span class=\"jump items\" data-view=\"items\" data-detail=\"木戌甲@3301\" title=\"在物品大全中打開\">木戌甲</span> 800、<span class=\"jump items\" data-view=\"items\" data-detail=\"虎爪鞋@3359\" title=\"在物品大全中打開\">虎爪鞋</span> 160、<span class=\"jump items\" data-view=\"items\" data-detail=\"斷形鞋@3360\" title=\"在物品大全中打開\">斷形鞋</span> 200</li></ul>"}, {"chapter": "江南", "title": "長沙與寒音剎", "text": "長沙與寒音剎\n# 流程\n1. 到下方的種子店花 100 兩買瓊花種子，出來看到獨孤寧珂。和她說話，再進江雲樓說話：宇文拓正前往南嶺鬼窟取女媧石，崆峒印交給斛律安和上官震遠保管。雙方約好裡應外合，奪取營中的崆峒印。\n2. 出長沙到西北的隋軍軍營，一路打進去，遇上斛律安，被他打敗（斛律安可偷蜂王露，體力 +50）。斛律安喝了寧珂給的山泉水，全身無力，只好先撤。他的攻擊不高，自己太強的話，把補血的防具脫掉讓他打倒。打完記得按右上的石碑恢復。\n3. 進營中打倒上官震遠，他從密道逃走。\n4. 進密道，先到右下按下把手，再從右上出去，穿過巨木陣。下一個場景的尖刺碰到會受傷。\n5. 寧珂出現殺了上官震遠，眾人從他手中拿到崆峒龍印。寧珂邀眾人到大興共商大計，並給武關令牌。\n6. 出密道後到杏山把瓊花種子給喬岱娘，得奇魄古玉（法寶，3500 成長，蓄勁指令）。\n7. 到江都找師父，靖仇想把崆峒印還給氐人族，陳輔嚴詞拒絕，要自己保管。到長沙往西北，經武關到大興。\n# 軍營密道\n- 符紙鶴：寶箱\n- 輪迴盤：寶箱\n# 支線：神樹與王福生\n1. 和路上的水雲兒說話，到長沙西北的神樹（寒音剎祕密水道）。\n2. 寒音剎外左上角有御夫錄（隱藏）（法寶，2000 成長，投擲指令）。\n3. 進寒音剎找王福生，給他符紙鶴，王福生歸隊。見DOMO組員。\n4. 這裡的山鬼王可偷玉山佛甲草（靈力 +15）：遇到兩隻食屍鬼和一隻乾麑子時，先打倒上面那隻食屍鬼，剩下兩隻會融合成山鬼王。\n5. 長沙被毀前沒觸發這條支線的話，之後可以到江都找雲遊道士觸發。\n- 嘉果：寶箱\n- 鹿茸膏：寶箱\n- 300 兩：寶箱\n- 靈界指標：寶箱\n- 仙蓮子：寶箱\n- 符紙鶴：寶箱\n- 神祕果：寶箱 DOMO\n# 商店\n- 武器店：頎崟巨環 960、湛盧 750、虛奘鋼棍 660、鬼眼法刀 750、流雲針 180、翔羽葉 380、旋流刺 500\n- 雜貨店：和江都一樣\n- 藥鋪：和江都一樣，沒有黑色藥材", "html": "<h3>流程</h3><ol><li>到下方的種子店花 100 兩買<span class=\"jump items\" data-view=\"items\" data-detail=\"瓊花種子@3131\" title=\"在物品大全中打開\">瓊花種子</span>，出來看到獨孤寧珂。和她說話，再進江雲樓說話：宇文拓正前往南嶺鬼窟取女媧石，崆峒印交給斛律安和上官震遠保管。雙方約好裡應外合，奪取營中的崆峒印。</li><li>出長沙到西北的隋軍軍營，一路打進去，遇上<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"斛律安@15\" title=\"在神魔異事錄中打開\">斛律安</span>，被他打敗（<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"斛律安@15\" title=\"在神魔異事錄中打開\">斛律安</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"蜂王露@3038\" title=\"在物品大全中打開\">蜂王露</span>，體力 +50）。斛律安喝了寧珂給的山泉水，全身無力，只好先撤。他的攻擊不高，自己太強的話，把補血的防具脫掉讓他打倒。打完記得按右上的石碑恢復。</li><li>進營中打倒<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"上官震遠@18\" title=\"在神魔異事錄中打開\">上官震遠</span>，他從密道逃走。</li><li>進密道，先到右下按下把手，再從右上出去，穿過巨木陣。下一個場景的尖刺碰到會受傷。</li><li>寧珂出現殺了上官震遠，眾人從他手中拿到<span class=\"jump items\" data-view=\"items\" data-detail=\"崆峒龍印@3108\" title=\"在物品大全中打開\">崆峒龍印</span>。寧珂邀眾人到大興共商大計，並給<span class=\"jump items\" data-view=\"items\" data-detail=\"武關令牌@3185\" title=\"在物品大全中打開\">武關令牌</span>。</li><li>出密道後到杏山把<span class=\"jump items\" data-view=\"items\" data-detail=\"瓊花種子@3131\" title=\"在物品大全中打開\">瓊花種子</span>給喬岱娘，得<span class=\"jump items\" data-view=\"items\" data-detail=\"奇魄古玉@3152\" title=\"在物品大全中打開\">奇魄古玉</span>（法寶，3500 成長，蓄勁指令）。</li><li>到江都找師父，靖仇想把崆峒印還給氐人族，陳輔嚴詞拒絕，要自己保管。到長沙往西北，經武關到大興。</li></ol><h3>軍營密道</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@3017\" title=\"在物品大全中打開\">輪迴盤</span>：寶箱</li></ul><h3>支線：神樹與王福生</h3><ol><li>和路上的水雲兒說話，到長沙西北的神樹（寒音剎祕密水道）。</li><li>寒音剎外左上角有<span class=\"jump items\" data-view=\"items\" data-detail=\"御夫錄@3179\" title=\"在物品大全中打開\">御夫錄</span>（隱藏）（法寶，2000 成長，投擲指令）。</li><li>進寒音剎找王福生，給他<span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span>，王福生歸隊。見<span class=\"goto\" data-title=\"DOMO組員\">DOMO組員</span>。</li><li>這裡的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"山鬼王@191\" title=\"在神魔異事錄中打開\">山鬼王</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"玉山佛甲草@3043\" title=\"在物品大全中打開\">玉山佛甲草</span>（靈力 +15）：遇到兩隻<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"食屍鬼@180\" title=\"在神魔異事錄中打開\">食屍鬼</span>和一隻<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"乾麑子@194\" title=\"在神魔異事錄中打開\">乾麑子</span>時，先打倒上面那隻食屍鬼，剩下兩隻會融合成山鬼王。</li><li>長沙被毀前沒觸發這條支線的話，之後可以到江都找雲遊道士觸發。</li></ol><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@3023\" title=\"在物品大全中打開\">嘉果</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span>：寶箱</li><li>300 兩：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@3094\" title=\"在物品大全中打開\">靈界指標</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"仙蓮子@3018\" title=\"在物品大全中打開\">仙蓮子</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>：寶箱 <span class=\"tag domo\">DOMO</span></li></ul><h3>商店</h3><ul><li>武器店：<span class=\"jump items\" data-view=\"items\" data-detail=\"頎崟巨環@3224\" title=\"在物品大全中打開\">頎崟巨環</span> 960、<span class=\"jump items\" data-view=\"items\" data-detail=\"湛盧@3207\" title=\"在物品大全中打開\">湛盧</span> 750、<span class=\"jump items\" data-view=\"items\" data-detail=\"虛奘鋼棍@3235\" title=\"在物品大全中打開\">虛奘鋼棍</span> 660、<span class=\"jump items\" data-view=\"items\" data-detail=\"鬼眼法刀@3247\" title=\"在物品大全中打開\">鬼眼法刀</span> 750、<span class=\"jump items\" data-view=\"items\" data-detail=\"流雲針@3259\" title=\"在物品大全中打開\">流雲針</span> 180、<span class=\"jump items\" data-view=\"items\" data-detail=\"翔羽葉@3261\" title=\"在物品大全中打開\">翔羽葉</span> 380、<span class=\"jump items\" data-view=\"items\" data-detail=\"旋流刺@3262\" title=\"在物品大全中打開\">旋流刺</span> 500</li><li>雜貨店：和江都一樣</li><li>藥鋪：和江都一樣，沒有<span class=\"jump items\" data-view=\"items\" data-detail=\"黑色藥材@3087\" title=\"在物品大全中打開\">黑色藥材</span></li></ul>"}, {"chapter": "江南", "title": "大興", "text": "大興\n# 流程\n1. 進獨孤郡王府左上的房間找寧珂，她已派人去查伏羲琴的下落，並安排眾人住下。\n2. 到宇文太師府找劉元，得知涪陵郡被毀，拿到秘密地圖和信函。推算下一個萬靈血陣的目標是長沙。\n3. 回府向師父說明，要去長沙阻止，陳輔仍斥責靖仇應以復國為先。靖仇堅持要去，陳輔決定同行。\n4. 到長沙軍營一路殺進去，還是晚了一步，萬靈血陣已發動。在軍營中心遇到宇文拓，被他打敗（宇文拓可偷七合龍爪花）。\n5. 陳輔衝出來保護靖仇，被劍氣所傷，宇文拓把陳輔冰封，要靖仇三天內交出兩件神器。\n6. 阿雪提議找仙人幫忙，到江都經人界傳送點到天外村。進然翁居和小婢女說話，仙人都不在。\n   - 先和阿雪說話：阿雪好感度 +1\n   - 先和玉兒說話：玉兒好感度 +1\n7. 決定先交出神器救師父。到隋軍軍營找宇文拓交出神器，他把陳輔交還。送師父回江都客棧休養，再到大興向寧珂道歉。\n8. 寧珂說女媧石在巴蜀古王墓，給長壽關令牌。出大興往西南，經長壽關到巴蜀古王墓。\n# 物品\n- 綠色慧星碎片：獨孤郡王府涼亭的右下（隱藏），要先做大興的支線裡的貪官支線\n# 支線：林耀元\n- 進天外村入口左邊的房子，和牆上隱藏的林耀元說話，給他三滴材質片，林耀元歸隊。見DOMO組員。\n# 商店\n- 雜貨店：紅雀鐲 240、辟邪戒指 260、五鬼戒指 300、白玉飛天珮 230、化雪奇石 130、遁影浮沙 250、符紙鶴 50、石敢神石 60、輪迴盤 280\n- 武器商：法藏 300、龍鱗盔 360、狂獅戰腕 180、烏蠶衣 660、龍騰靴 220\n- 藥鋪：解病萬靈丹 30、解僵針 40、安神定志丸 80、茴香茶 20、破元仙露 150、活骨靈藥 140、金創藥 150、鹿茸膏 350、三葉雪桑果 110、柴胡乾葛草 200、千年何首烏 400、還靈丹 80、靈神天藥 180、地稔根 250、還魄丹 70", "html": "<h3>流程</h3><ol><li>進獨孤郡王府左上的房間找寧珂，她已派人去查伏羲琴的下落，並安排眾人住下。</li><li>到宇文太師府找劉元，得知涪陵郡被毀，拿到<span class=\"jump items\" data-view=\"items\" data-detail=\"秘密地圖@3116\" title=\"在物品大全中打開\">秘密地圖</span>和信函。推算下一個萬靈血陣的目標是長沙。</li><li>回府向師父說明，要去長沙阻止，陳輔仍斥責靖仇應以復國為先。靖仇堅持要去，陳輔決定同行。</li><li>到長沙軍營一路殺進去，還是晚了一步，萬靈血陣已發動。在軍營中心遇到<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"宇文拓@7\" title=\"在神魔異事錄中打開\">宇文拓</span>，被他打敗（<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"宇文拓@7\" title=\"在神魔異事錄中打開\">宇文拓</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"七合龍爪花@3044\" title=\"在物品大全中打開\">七合龍爪花</span>）。</li><li>陳輔衝出來保護靖仇，被劍氣所傷，宇文拓把陳輔冰封，要靖仇三天內交出兩件神器。</li><li>阿雪提議找仙人幫忙，到江都經人界傳送點到天外村。進然翁居和小婢女說話，仙人都不在。<ul><li>先和阿雪說話：阿雪好感度 +1</li><li>先和玉兒說話：玉兒好感度 +1</li></ul></li><li>決定先交出神器救師父。到隋軍軍營找宇文拓交出神器，他把陳輔交還。送師父回江都客棧休養，再到大興向寧珂道歉。</li><li>寧珂說女媧石在巴蜀古王墓，給<span class=\"jump items\" data-view=\"items\" data-detail=\"長壽關令牌@3149\" title=\"在物品大全中打開\">長壽關令牌</span>。出大興往西南，經長壽關到巴蜀古王墓。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"綠色慧星碎片@3187\" title=\"在物品大全中打開\">綠色慧星碎片</span>：獨孤郡王府涼亭的右下（隱藏），要先做<span class=\"goto\" data-title=\"大興的支線\">大興的支線</span>裡的貪官支線</li></ul><h3>支線：林耀元</h3><ul><li>進天外村入口左邊的房子，和牆上隱藏的林耀元說話，給他<span class=\"jump items\" data-view=\"items\" data-detail=\"三滴材質片@3150\" title=\"在物品大全中打開\">三滴材質片</span>，林耀元歸隊。見<span class=\"goto\" data-title=\"DOMO組員\">DOMO組員</span>。</li></ul><h3>商店</h3><ul><li>雜貨店：<span class=\"jump items\" data-view=\"items\" data-detail=\"紅雀鐲@3335\" title=\"在物品大全中打開\">紅雀鐲</span> 240、<span class=\"jump items\" data-view=\"items\" data-detail=\"辟邪戒指@3389\" title=\"在物品大全中打開\">辟邪戒指</span> 260、<span class=\"jump items\" data-view=\"items\" data-detail=\"五鬼戒指@3392\" title=\"在物品大全中打開\">五鬼戒指</span> 300、<span class=\"jump items\" data-view=\"items\" data-detail=\"白玉飛天珮@3391\" title=\"在物品大全中打開\">白玉飛天珮</span> 230、<span class=\"jump items\" data-view=\"items\" data-detail=\"化雪奇石@3028\" title=\"在物品大全中打開\">化雪奇石</span> 130、<span class=\"jump items\" data-view=\"items\" data-detail=\"遁影浮沙@3047\" title=\"在物品大全中打開\">遁影浮沙</span> 250、<span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span> 50、<span class=\"jump items\" data-view=\"items\" data-detail=\"石敢神石@3046\" title=\"在物品大全中打開\">石敢神石</span> 60、<span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@3017\" title=\"在物品大全中打開\">輪迴盤</span> 280</li><li>武器商：<span class=\"jump items\" data-view=\"items\" data-detail=\"法藏@3281\" title=\"在物品大全中打開\">法藏</span> 300、<span class=\"jump items\" data-view=\"items\" data-detail=\"龍鱗盔@3282\" title=\"在物品大全中打開\">龍鱗盔</span> 360、<span class=\"jump items\" data-view=\"items\" data-detail=\"狂獅戰腕@3334\" title=\"在物品大全中打開\">狂獅戰腕</span> 180、<span class=\"jump items\" data-view=\"items\" data-detail=\"烏蠶衣@3302\" title=\"在物品大全中打開\">烏蠶衣</span> 660、<span class=\"jump items\" data-view=\"items\" data-detail=\"龍騰靴@3361\" title=\"在物品大全中打開\">龍騰靴</span> 220</li><li>藥鋪：<span class=\"jump items\" data-view=\"items\" data-detail=\"解病萬靈丹@3025\" title=\"在物品大全中打開\">解病萬靈丹</span> 30、<span class=\"jump items\" data-view=\"items\" data-detail=\"解僵針@3026\" title=\"在物品大全中打開\">解僵針</span> 40、<span class=\"jump items\" data-view=\"items\" data-detail=\"安神定志丸@3027\" title=\"在物品大全中打開\">安神定志丸</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"茴香茶@3029\" title=\"在物品大全中打開\">茴香茶</span> 20、<span class=\"jump items\" data-view=\"items\" data-detail=\"破元仙露@3031\" title=\"在物品大全中打開\">破元仙露</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"活骨靈藥@3041\" title=\"在物品大全中打開\">活骨靈藥</span> 140、<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span> 350、<span class=\"jump items\" data-view=\"items\" data-detail=\"三葉雪桑果@3037\" title=\"在物品大全中打開\">三葉雪桑果</span> 110、<span class=\"jump items\" data-view=\"items\" data-detail=\"柴胡乾葛草@3008\" title=\"在物品大全中打開\">柴胡乾葛草</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"千年何首烏@3009\" title=\"在物品大全中打開\">千年何首烏</span> 400、<span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@3011\" title=\"在物品大全中打開\">還靈丹</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"靈神天藥@3012\" title=\"在物品大全中打開\">靈神天藥</span> 180、<span class=\"jump items\" data-view=\"items\" data-detail=\"地稔根@3022\" title=\"在物品大全中打開\">地稔根</span> 250、<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span> 70</li></ul>"}, {"chapter": "江南", "title": "大興的支線", "text": "大興的支線\n# 蘭律閣的猜謎\n- 聽城門的黃三娘和杜六姑說話，到利人市蘭律閣和古董商猜謎。答完第四題就結束，所以第四題留到最後：\n- 第一題「海燈」，得石敢神石。\n- 第二題「風箏」，得三葉雪桑果。\n- 第三題「算盤」，得河車丸。\n- 第四題「爆竹」，得三滴材質片。\n# 糖葫蘆與鮑弘修\n1. 聽利人市藥鋪前的小孩說話。\n2. 依序調查酒店的招牌、宇文太師府門上的匾額、藥鋪的狗皮藥膏招牌、大興城門的門牌，得糖葫蘆。\n3. 用糖葫蘆加黏怪煉出鮑弘修，鮑弘修歸隊。見DOMO組員。\n# 比武台\n- 聽城門的小孩說話，到利人市比武台，照「天下第一」四個字的順序按 25 次，得活靈芝（靈力 +40）。\n# 唐耕武與連楓兒\n- 和利人市比武台旁的唐耕武與連楓兒說話，資助 3000 兩，他們說有傳家寶放在洛陽。到洛陽才拿得到，見洛陽。\n# 貪官與慧星碎片\n- 聽利人市酒樓二樓的奸商和貪官說話，到獨孤郡王府調查涼亭右下角，得綠色慧星碎片。\n# 長孫燕兒\n1. 和利人市客棧二樓的長孫燕兒說話，再和旁邊的酒客說話，得知柴紹住在大興城郊。\n2. 再和長孫燕兒說話，得紅雀鐲。", "html": "<h3>蘭律閣的猜謎</h3><ul><li>聽城門的黃三娘和杜六姑說話，到利人市蘭律閣和古董商猜謎。答完第四題就結束，所以第四題留到最後：</li><li>第一題「海燈」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"石敢神石@3046\" title=\"在物品大全中打開\">石敢神石</span>。</li><li>第二題「風箏」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"三葉雪桑果@3037\" title=\"在物品大全中打開\">三葉雪桑果</span>。</li><li>第三題「算盤」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"河車丸@3034\" title=\"在物品大全中打開\">河車丸</span>。</li><li>第四題「爆竹」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"三滴材質片@3150\" title=\"在物品大全中打開\">三滴材質片</span>。</li></ul><h3>糖葫蘆與鮑弘修</h3><ol><li>聽利人市藥鋪前的小孩說話。</li><li>依序調查酒店的招牌、宇文太師府門上的匾額、藥鋪的狗皮藥膏招牌、大興城門的門牌，得<span class=\"jump items\" data-view=\"items\" data-detail=\"糖葫蘆@3191\" title=\"在物品大全中打開\">糖葫蘆</span>。</li><li>用<span class=\"jump items\" data-view=\"items\" data-detail=\"糖葫蘆@3191\" title=\"在物品大全中打開\">糖葫蘆</span>加<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"黏怪@216\" title=\"在神魔異事錄中打開\">黏怪</span>煉出鮑弘修，鮑弘修歸隊。見<span class=\"goto\" data-title=\"DOMO組員\">DOMO組員</span>。</li></ol><h3>比武台</h3><ul><li>聽城門的小孩說話，到利人市比武台，照「天下第一」四個字的順序按 25 次，得<span class=\"jump items\" data-view=\"items\" data-detail=\"活靈芝@3039\" title=\"在物品大全中打開\">活靈芝</span>（靈力 +40）。</li></ul><h3>唐耕武與連楓兒</h3><ul><li>和利人市比武台旁的唐耕武與連楓兒說話，資助 3000 兩，他們說有傳家寶放在洛陽。到洛陽才拿得到，見<span class=\"goto\" data-title=\"洛陽\">洛陽</span>。</li></ul><h3>貪官與慧星碎片</h3><ul><li>聽利人市酒樓二樓的奸商和貪官說話，到獨孤郡王府調查涼亭右下角，得<span class=\"jump items\" data-view=\"items\" data-detail=\"綠色慧星碎片@3187\" title=\"在物品大全中打開\">綠色慧星碎片</span>。</li></ul><h3>長孫燕兒</h3><ol><li>和利人市客棧二樓的長孫燕兒說話，再和旁邊的酒客說話，得知柴紹住在大興城郊。</li><li>再和長孫燕兒說話，得<span class=\"jump items\" data-view=\"items\" data-detail=\"紅雀鐲@3335\" title=\"在物品大全中打開\">紅雀鐲</span>。</li></ol>"}, {"chapter": "江南", "title": "巴蜀古王墓", "text": "巴蜀古王墓\n# 流程\n1. 入口前的古墓守護神可以買賣，也能幫全員恢復。\n2. 遇到斛律安，打倒他。往前走，阿雪頭痛，看到許多異象。玉兒去取水，靖仇往上去拿女媧靈石。\n3. 斛律安挾持阿雪，要靖仇拿女媧石交換。玉兒從後偷襲救下阿雪，但斛律安還是搶到女媧石，傳給宇文拓。\n4. 宇文拓一拿就知道不是真的女媧石：原來宇文拓就是崑崙鏡轉世。為免部下再犧牲，他決定親自去敦煌取伏羲琴。\n5. 回大興前先把阿雪重要的裝備卸下。進獨孤郡王府右邊的房間，師父因為丟了兩件神器大罵一頓。\n6. 和寧珂說話，到她房裡再說話，阿雪身體不適離隊休息。進右上的房間和寧珂說話，到藥鋪請宋大夫來看，是憂慮過度。\n7. 到大廳和寧珂說話，她說三樣神器放在皇家寶庫，帶眾人到皇家寶庫秘道。\n# 物品\n- 硫磺：寶箱\n- 土象晶礦：寶箱，林克敏旁邊\n- 山蛇莓：寶箱 DOMO\n- 蟠桃：寶箱，第三場景左下方，整面牆中間附近穿過去 DOMO\n- 鹿茸膏：寶箱\n- 黃色慧星碎片：寶箱，上下分岔路走上面，下一個場景箱子右邊的牆中間附近穿過去\n- 嘉果：寶箱\n- 金塊：寶箱\n- 可以收些酒妖、布妖，以後煉金塊。\n# 支線：林克敏\n1. 進來後第一個彎道右轉直走，進黑色背景的隱藏步道傳送，找到林克敏。\n2. 打倒他的寵物，林克敏歸隊。見DOMO組員。\n3. 出現的寵物：\n   - 檮杌的條件都達成：檮杌，見隱藏頭目\n   - 否則：當扈、茶仙、火光獸、瘧鬼\n# 支線：藍色慧星碎片\n- 映月之光之後、遇得到布妖的場景，遇到地仙和兩隻瘧鬼時，回答「移動最左邊的 6」，得藍色慧星碎片。檮杌\n# 商店\n- 古墓守護神：解病萬靈丹 30、解僵針 40、安神定志丸 80、茴香茶 20、破元仙露 150、活骨靈藥 140、金創藥 150、鹿茸膏 350、柴胡乾葛草 200、千年何首烏 400、還靈丹 80、靈神天藥 180、嘉果 480、仙蓮子 700", "html": "<h3>流程</h3><ol><li>入口前的古墓守護神可以買賣，也能幫全員恢復。</li><li>遇到<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"斛律安@15\" title=\"在神魔異事錄中打開\">斛律安</span>，打倒他。往前走，阿雪頭痛，看到許多異象。玉兒去取水，靖仇往上去拿<span class=\"jump items\" data-view=\"items\" data-detail=\"女媧靈石@3109\" title=\"在物品大全中打開\">女媧靈石</span>。</li><li>斛律安挾持阿雪，要靖仇拿女媧石交換。玉兒從後偷襲救下阿雪，但斛律安還是搶到女媧石，傳給宇文拓。</li><li>宇文拓一拿就知道不是真的女媧石：原來宇文拓就是崑崙鏡轉世。為免部下再犧牲，他決定親自去敦煌取伏羲琴。</li><li>回大興前先把阿雪重要的裝備卸下。進獨孤郡王府右邊的房間，師父因為丟了兩件神器大罵一頓。</li><li>和寧珂說話，到她房裡再說話，阿雪身體不適離隊休息。進右上的房間和寧珂說話，到藥鋪請宋大夫來看，是憂慮過度。</li><li>到大廳和寧珂說話，她說三樣神器放在皇家寶庫，帶眾人到皇家寶庫秘道。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"硫磺@3075\" title=\"在物品大全中打開\">硫磺</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"土象晶礦@3082\" title=\"在物品大全中打開\">土象晶礦</span>：寶箱，林克敏旁邊</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"山蛇莓@3067\" title=\"在物品大全中打開\">山蛇莓</span>：寶箱 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"蟠桃@3019\" title=\"在物品大全中打開\">蟠桃</span>：寶箱，第三場景左下方，整面牆中間附近穿過去 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"黃色慧星碎片@3188\" title=\"在物品大全中打開\">黃色慧星碎片</span>：寶箱，上下分岔路走上面，下一個場景箱子右邊的牆中間附近穿過去</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@3023\" title=\"在物品大全中打開\">嘉果</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金塊@3063\" title=\"在物品大全中打開\">金塊</span>：寶箱</li><li>可以收些<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"酒妖@161\" title=\"在神魔異事錄中打開\">酒妖</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"布妖@160\" title=\"在神魔異事錄中打開\">布妖</span>，以後煉金塊。</li></ul><h3>支線：林克敏</h3><ol><li>進來後第一個彎道右轉直走，進黑色背景的隱藏步道傳送，找到林克敏。</li><li>打倒他的寵物，林克敏歸隊。見<span class=\"goto\" data-title=\"DOMO組員\">DOMO組員</span>。</li><li>出現的寵物：<ul><li>檮杌的條件都達成：<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"檮杌@55\" title=\"在神魔異事錄中打開\">檮杌</span>，見<span class=\"goto\" data-title=\"隱藏頭目\">隱藏頭目</span></li><li>否則：<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"當扈@150\" title=\"在神魔異事錄中打開\">當扈</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"茶仙@131\" title=\"在神魔異事錄中打開\">茶仙</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"火光獸@172\" title=\"在神魔異事錄中打開\">火光獸</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"瘧鬼@190\" title=\"在神魔異事錄中打開\">瘧鬼</span></li></ul></li></ol><h3>支線：藍色慧星碎片</h3><ul><li>映月之光之後、遇得到<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"布妖@160\" title=\"在神魔異事錄中打開\">布妖</span>的場景，遇到<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"地仙@129\" title=\"在神魔異事錄中打開\">地仙</span>和兩隻<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"瘧鬼@190\" title=\"在神魔異事錄中打開\">瘧鬼</span>時，回答「移動最左邊的 6」，得<span class=\"jump items\" data-view=\"items\" data-detail=\"藍色慧星碎片@3189\" title=\"在物品大全中打開\">藍色慧星碎片</span>。<span class=\"tag beast\">檮杌</span></li></ul><h3>商店</h3><ul><li>古墓守護神：<span class=\"jump items\" data-view=\"items\" data-detail=\"解病萬靈丹@3025\" title=\"在物品大全中打開\">解病萬靈丹</span> 30、<span class=\"jump items\" data-view=\"items\" data-detail=\"解僵針@3026\" title=\"在物品大全中打開\">解僵針</span> 40、<span class=\"jump items\" data-view=\"items\" data-detail=\"安神定志丸@3027\" title=\"在物品大全中打開\">安神定志丸</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"茴香茶@3029\" title=\"在物品大全中打開\">茴香茶</span> 20、<span class=\"jump items\" data-view=\"items\" data-detail=\"破元仙露@3031\" title=\"在物品大全中打開\">破元仙露</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"活骨靈藥@3041\" title=\"在物品大全中打開\">活骨靈藥</span> 140、<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span> 350、<span class=\"jump items\" data-view=\"items\" data-detail=\"柴胡乾葛草@3008\" title=\"在物品大全中打開\">柴胡乾葛草</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"千年何首烏@3009\" title=\"在物品大全中打開\">千年何首烏</span> 400、<span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@3011\" title=\"在物品大全中打開\">還靈丹</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"靈神天藥@3012\" title=\"在物品大全中打開\">靈神天藥</span> 180、<span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@3023\" title=\"在物品大全中打開\">嘉果</span> 480、<span class=\"jump items\" data-view=\"items\" data-detail=\"仙蓮子@3018\" title=\"在物品大全中打開\">仙蓮子</span> 700</li></ul>"}, {"chapter": "江南", "title": "皇家寶庫", "text": "皇家寶庫\n# 流程\n1. 在寶庫右上的房間找到三樣神器和虎符令牌。\n2. 回秘道口和寧珂說話後回府，陳輔看到三樣神器樂不可支。\n3. 到右上的房間找阿雪，阿雪卻說宇文拓才是對的，希望靖仇把神器還給宇文拓，靖仇莫名其妙。\n4. 第二天玉兒說阿雪不見了。到右上的房間，發現女媧石壓著阿雪的白髮。和寧珂說話，寧珂認為阿雪背叛了。\n5. 到大興城門和西北的玄武門問衛兵，都沒看到阿雪。回來找寧珂，嫣紅進來說宇文拓已帶回伏羲琴，阿雪帶著神器投奔了宇文府。\n6. 到宇文太師府問右邊的衛兵，得知宇文拓派兵到靈武郡要發動萬靈血陣。經長壽關往西北，過萌葭關往北到靈武郡。\n# 物品\n- 金創藥：寶箱，秘道第一區\n- 化雪奇石：寶箱，秘道第一區\n- 輪迴盤：寶箱，秘道第一區\n- 歸靈指套：秘道第二區左邊突出的石壁（隱藏）（法寶，3200 成長，逆攻指令）\n- 軒轅菜刀：寶庫右下房間，右下的櫃子（隱藏）\n- 烏蠶手套：右邊房間，下邊的櫃子（隱藏）\n- 珍珠：左下房間，右上的財物堆（隱藏）\n- 湛盧：左上房間，左上的箱子（隱藏）\n- 遇到飛賊王，選擇阻止他。渾沌", "html": "<h3>流程</h3><ol><li>在寶庫右上的房間找到三樣神器和<span class=\"jump items\" data-view=\"items\" data-detail=\"虎符令牌@3135\" title=\"在物品大全中打開\">虎符令牌</span>。</li><li>回秘道口和寧珂說話後回府，陳輔看到三樣神器樂不可支。</li><li>到右上的房間找阿雪，阿雪卻說宇文拓才是對的，希望靖仇把神器還給宇文拓，靖仇莫名其妙。</li><li>第二天玉兒說阿雪不見了。到右上的房間，發現女媧石壓著阿雪的白髮。和寧珂說話，寧珂認為阿雪背叛了。</li><li>到大興城門和西北的玄武門問衛兵，都沒看到阿雪。回來找寧珂，嫣紅進來說宇文拓已帶回伏羲琴，阿雪帶著神器投奔了宇文府。</li><li>到宇文太師府問右邊的衛兵，得知宇文拓派兵到靈武郡要發動萬靈血陣。經長壽關往西北，過萌葭關往北到靈武郡。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span>：寶箱，秘道第一區</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"化雪奇石@3028\" title=\"在物品大全中打開\">化雪奇石</span>：寶箱，秘道第一區</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@3017\" title=\"在物品大全中打開\">輪迴盤</span>：寶箱，秘道第一區</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"歸靈指套@3151\" title=\"在物品大全中打開\">歸靈指套</span>：秘道第二區左邊突出的石壁（隱藏）（法寶，3200 成長，逆攻指令）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"軒轅菜刀@3248\" title=\"在物品大全中打開\">軒轅菜刀</span>：寶庫右下房間，右下的櫃子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"烏蠶手套@3336\" title=\"在物品大全中打開\">烏蠶手套</span>：右邊房間，下邊的櫃子（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"珍珠@3093\" title=\"在物品大全中打開\">珍珠</span>：左下房間，右上的財物堆（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"湛盧@3207\" title=\"在物品大全中打開\">湛盧</span>：左上房間，左上的箱子（隱藏）</li><li>遇到<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"飛賊王@203\" title=\"在神魔異事錄中打開\">飛賊王</span>，選擇阻止他。<span class=\"tag beast\">渾沌</span></li></ul>"}, {"chapter": "江南", "title": "靈武與玉兒之死", "text": "靈武與玉兒之死\n# 流程\n1. 出靈武到西北的隋軍大營（先把要買的買好），打倒韓騰（韓騰可偷活靈芝）。阿雪拿著軒轅劍來阻止，靈武郡還是被毀了。\n2. 回獨孤郡王府，寧珂說有一條通往太師府的密道，但靖仇以為阿雪被宇文拓控制，已無心再和他作對。\n3. 晚上寧珂告訴玉兒，阿雪是因為她才離開的。玉兒決定夜裡潛入太師府帶回阿雪，讓靖仇和阿雪在一起。\n4. 穿過密道找到阿雪，阿雪說出真相，玉兒把這些寫成一封信，要交給靖仇：\n   - 赤貫星即將劃破天空，會引來另一個世界的妖魔，必須集齊五樣神器補天。\n   - 阿雪自己就是女媧石轉世，必須留下來幫宇文拓。\n5. 出密道前先把玉兒的裝備全部卸下。寧珂知道玉兒已明白真相，把玉兒打成重傷，燒掉了信。阿雪剛好出來看到玉兒，靖仇也趕到，以為玉兒是阿雪打傷的，帶著玉兒到然翁居求仙人醫治。\n6. 和阿如說話，古月聖不在，阿如出去找然翁，用御劍術找古月聖回來。玉兒醒來要靖仇找信，信已不在。玉兒要靖仇原諒阿雪，然後過世了。\n7. 三小時後古月聖趕回，玉兒已無氣息，只能把她收進水晶棺永保肉身。三天後到對奕亭找古月聖，回然翁居把水晶棺裝進煉妖壺，準備帶她回北方的故鄉。\n8. 和仙人道別，回大興獨孤郡王府，進左上的房間找寧珂：宇文拓和阿雪已前往洛陽的通天觀，但靖仇已心力交瘁，不想再管。到右邊的房間找師父，師父也不再強求，陪他一起回北方。\n9. 在門口和寧珂道別，從西北的玄武城門出大興往北。夜裡在橋邊紮營時聽到呼救聲，到左邊打退盜匪。\n10. 靖仇想起玉兒，吹笛排解，引來知音人李世民。李世民邀靖仇到太原共商大事，天亮後往北到太原。\n# 靈武\n- 渡沙之珠：賀連碧的支線\n# 支線：賀連碧與張孝全\n1. 和賀連碧說話，出城到右上的迷津沙綠洲找她的父親，再回靈武和兩人說話，得渡沙之珠。\n2. 回迷津沙綠洲，往右穿過迷津沙（身上沒有渡沙之珠會多走五個畫面）。\n3. 找到張孝全，給他 7000 兩，張孝全歸隊。見DOMO組員。\n# 河道斷崖\n- 玄能臂環：營區最右邊發亮的地方（隱藏）（法寶，3000 成長，吸命）\n# 商店\n- 武器商：純鈞 860、勝邪 1000、九金烏圈 1180、烏金骨朵 750、鬼眼法刀 750、翔羽葉 380、旋流刺 500、飛蝗石 650\n- 雜貨商：五鬼戒指 300、白玉飛天珮 230、解病萬靈丹 30、解僵針 40、安神定志丸 80、化雪奇石 130、遁影浮沙 250、符紙鶴 50、石敢神石 60、金創藥 150、鹿茸膏 350、柴胡乾葛草 200、還靈丹 80、靈神天藥 180、地稔根 250、還魄丹 70、輪迴盤 280", "html": "<h3>流程</h3><ol><li>出靈武到西北的隋軍大營（先把要買的買好），打倒<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"韓騰@16\" title=\"在神魔異事錄中打開\">韓騰</span>（<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"韓騰@16\" title=\"在神魔異事錄中打開\">韓騰</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"活靈芝@3039\" title=\"在物品大全中打開\">活靈芝</span>）。阿雪拿著軒轅劍來阻止，靈武郡還是被毀了。</li><li>回獨孤郡王府，寧珂說有一條通往太師府的密道，但靖仇以為阿雪被宇文拓控制，已無心再和他作對。</li><li>晚上寧珂告訴玉兒，阿雪是因為她才離開的。玉兒決定夜裡潛入太師府帶回阿雪，讓靖仇和阿雪在一起。</li><li>穿過密道找到阿雪，阿雪說出真相，玉兒把這些寫成一封信，要交給靖仇：<ul><li>赤貫星即將劃破天空，會引來另一個世界的妖魔，必須集齊五樣神器補天。</li><li>阿雪自己就是女媧石轉世，必須留下來幫宇文拓。</li></ul></li><li>出密道前先把玉兒的裝備全部卸下。寧珂知道玉兒已明白真相，把玉兒打成重傷，燒掉了信。阿雪剛好出來看到玉兒，靖仇也趕到，以為玉兒是阿雪打傷的，帶著玉兒到然翁居求仙人醫治。</li><li>和阿如說話，古月聖不在，阿如出去找然翁，用御劍術找古月聖回來。玉兒醒來要靖仇找信，信已不在。玉兒要靖仇原諒阿雪，然後過世了。</li><li>三小時後古月聖趕回，玉兒已無氣息，只能把她收進水晶棺永保肉身。三天後到對奕亭找古月聖，回然翁居把水晶棺裝進煉妖壺，準備帶她回北方的故鄉。</li><li>和仙人道別，回大興獨孤郡王府，進左上的房間找寧珂：宇文拓和阿雪已前往洛陽的通天觀，但靖仇已心力交瘁，不想再管。到右邊的房間找師父，師父也不再強求，陪他一起回北方。</li><li>在門口和寧珂道別，從西北的玄武城門出大興往北。夜裡在橋邊紮營時聽到呼救聲，到左邊打退盜匪。</li><li>靖仇想起玉兒，吹笛排解，引來知音人李世民。李世民邀靖仇到太原共商大事，天亮後往北到太原。</li></ol><h3>靈武</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"渡沙之珠@3142\" title=\"在物品大全中打開\">渡沙之珠</span>：賀連碧的支線</li></ul><h3>支線：賀連碧與張孝全</h3><ol><li>和賀連碧說話，出城到右上的迷津沙綠洲找她的父親，再回靈武和兩人說話，得<span class=\"jump items\" data-view=\"items\" data-detail=\"渡沙之珠@3142\" title=\"在物品大全中打開\">渡沙之珠</span>。</li><li>回迷津沙綠洲，往右穿過迷津沙（身上沒有渡沙之珠會多走五個畫面）。</li><li>找到張孝全，給他 7000 兩，張孝全歸隊。見<span class=\"goto\" data-title=\"DOMO組員\">DOMO組員</span>。</li></ol><h3>河道斷崖</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"玄能臂環@3156\" title=\"在物品大全中打開\">玄能臂環</span>：營區最右邊發亮的地方（隱藏）（法寶，3000 成長，吸命）</li></ul><h3>商店</h3><ul><li>武器商：<span class=\"jump items\" data-view=\"items\" data-detail=\"純鈞@3208\" title=\"在物品大全中打開\">純鈞</span> 860、<span class=\"jump items\" data-view=\"items\" data-detail=\"勝邪@3209\" title=\"在物品大全中打開\">勝邪</span> 1000、<span class=\"jump items\" data-view=\"items\" data-detail=\"九金烏圈@3225\" title=\"在物品大全中打開\">九金烏圈</span> 1180、<span class=\"jump items\" data-view=\"items\" data-detail=\"烏金骨朵@3236\" title=\"在物品大全中打開\">烏金骨朵</span> 750、<span class=\"jump items\" data-view=\"items\" data-detail=\"鬼眼法刀@3247\" title=\"在物品大全中打開\">鬼眼法刀</span> 750、<span class=\"jump items\" data-view=\"items\" data-detail=\"翔羽葉@3261\" title=\"在物品大全中打開\">翔羽葉</span> 380、<span class=\"jump items\" data-view=\"items\" data-detail=\"旋流刺@3262\" title=\"在物品大全中打開\">旋流刺</span> 500、<span class=\"jump items\" data-view=\"items\" data-detail=\"飛蝗石@3263\" title=\"在物品大全中打開\">飛蝗石</span> 650</li><li>雜貨商：<span class=\"jump items\" data-view=\"items\" data-detail=\"五鬼戒指@3392\" title=\"在物品大全中打開\">五鬼戒指</span> 300、<span class=\"jump items\" data-view=\"items\" data-detail=\"白玉飛天珮@3391\" title=\"在物品大全中打開\">白玉飛天珮</span> 230、<span class=\"jump items\" data-view=\"items\" data-detail=\"解病萬靈丹@3025\" title=\"在物品大全中打開\">解病萬靈丹</span> 30、<span class=\"jump items\" data-view=\"items\" data-detail=\"解僵針@3026\" title=\"在物品大全中打開\">解僵針</span> 40、<span class=\"jump items\" data-view=\"items\" data-detail=\"安神定志丸@3027\" title=\"在物品大全中打開\">安神定志丸</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"化雪奇石@3028\" title=\"在物品大全中打開\">化雪奇石</span> 130、<span class=\"jump items\" data-view=\"items\" data-detail=\"遁影浮沙@3047\" title=\"在物品大全中打開\">遁影浮沙</span> 250、<span class=\"jump items\" data-view=\"items\" data-detail=\"符紙鶴@3045\" title=\"在物品大全中打開\">符紙鶴</span> 50、<span class=\"jump items\" data-view=\"items\" data-detail=\"石敢神石@3046\" title=\"在物品大全中打開\">石敢神石</span> 60、<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span> 350、<span class=\"jump items\" data-view=\"items\" data-detail=\"柴胡乾葛草@3008\" title=\"在物品大全中打開\">柴胡乾葛草</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"還靈丹@3011\" title=\"在物品大全中打開\">還靈丹</span> 80、<span class=\"jump items\" data-view=\"items\" data-detail=\"靈神天藥@3012\" title=\"在物品大全中打開\">靈神天藥</span> 180、<span class=\"jump items\" data-view=\"items\" data-detail=\"地稔根@3022\" title=\"在物品大全中打開\">地稔根</span> 250、<span class=\"jump items\" data-view=\"items\" data-detail=\"還魄丹@3016\" title=\"在物品大全中打開\">還魄丹</span> 70、<span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@3017\" title=\"在物品大全中打開\">輪迴盤</span> 280</li></ul>"}, {"chapter": "北方", "title": "太原", "text": "太原\n# 流程\n1. 在城門和李世民說話，到唐國公府找李世民，進書房遇到張烈。靖仇說出玉兒過世的經過，張烈加入，一起去洛陽阻止宇文拓。\n2. 張烈和李靖交代一些事，和師父說話後出來向李世民道別。\n3. 出唐府大門，張烈說要到雲崗石窟拿能對抗宇文拓的東西，給汰玉如來，有它才能進石窟。出太原往西進雲崗石窟。可以先到東萊把張烈練到 50 級。\n# 物品\n- 姜公膽：街道中央的盆栽（隱藏）（法寶，2000 成長，連擊指令）\n# 支線：胡商阿里\n- 和胡商阿里一直說話，最後給他看軒轅菜刀，得七情束。\n# 支線：布行老闆娘柔娘\n- 給她天蠶裝（天蠶絲帶、天蠶絲衣）得泥蚣袍，給烏蠶裝（烏蠶手套、烏蠶衣）得萱華柔甲，兩套都給得天珠武鎧（每回合恢復 5% 靈力）。\n- 兩套都能煉化出來，最好拿天珠武鎧。煉不出天蠶絲衣的話，到洛陽才買得到。\n# 提示\n- 多買一些震嶽巨鎚，以後煉金塊用。\n# 商店\n- 防具商：龍鱗盔 360、天蠶絲帶 370、烏蠶手套 280、靈蛇手套 260、烏蠶衣 660、龍鬚衣 620、龍騰靴 220、蛇皮短靴 240、五行鞋 400\n- 武器商：純鈞 860、勝邪 1000、九金烏圈 1180、烏金骨朵 750、震嶽巨鎚 870、日月乾坤圈 800、翔羽葉 380、旋流刺 500、飛蝗石 650\n- 雜貨商：和靈武一樣", "html": "<h3>流程</h3><ol><li>在城門和李世民說話，到唐國公府找李世民，進書房遇到張烈。靖仇說出玉兒過世的經過，張烈加入，一起去洛陽阻止宇文拓。</li><li>張烈和李靖交代一些事，和師父說話後出來向李世民道別。</li><li>出唐府大門，張烈說要到雲崗石窟拿能對抗宇文拓的東西，給<span class=\"jump items\" data-view=\"items\" data-detail=\"汰玉如來@3136\" title=\"在物品大全中打開\">汰玉如來</span>，有它才能進石窟。出太原往西進雲崗石窟。可以先到東萊把張烈練到 50 級。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"姜公膽@3162\" title=\"在物品大全中打開\">姜公膽</span>：街道中央的盆栽（隱藏）（法寶，2000 成長，連擊指令）</li></ul><h3>支線：胡商阿里</h3><ul><li>和胡商阿里一直說話，最後給他看<span class=\"jump items\" data-view=\"items\" data-detail=\"軒轅菜刀@3248\" title=\"在物品大全中打開\">軒轅菜刀</span>，得<span class=\"jump items\" data-view=\"items\" data-detail=\"七情束@3290\" title=\"在物品大全中打開\">七情束</span>。</li></ul><h3>支線：布行老闆娘柔娘</h3><ul><li>給她天蠶裝（<span class=\"jump items\" data-view=\"items\" data-detail=\"天蠶絲帶@3283\" title=\"在物品大全中打開\">天蠶絲帶</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"天蠶絲衣@3306\" title=\"在物品大全中打開\">天蠶絲衣</span>）得<span class=\"jump items\" data-view=\"items\" data-detail=\"泥蚣袍@3319\" title=\"在物品大全中打開\">泥蚣袍</span>，給烏蠶裝（<span class=\"jump items\" data-view=\"items\" data-detail=\"烏蠶手套@3336\" title=\"在物品大全中打開\">烏蠶手套</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"烏蠶衣@3302\" title=\"在物品大全中打開\">烏蠶衣</span>）得<span class=\"jump items\" data-view=\"items\" data-detail=\"萱華柔甲@3320\" title=\"在物品大全中打開\">萱華柔甲</span>，兩套都給得<span class=\"jump items\" data-view=\"items\" data-detail=\"天珠武鎧@3321\" title=\"在物品大全中打開\">天珠武鎧</span>（每回合恢復 5% 靈力）。</li><li>兩套都能煉化出來，最好拿天珠武鎧。煉不出天蠶絲衣的話，到洛陽才買得到。</li></ul><h3>提示</h3><ul><li>多買一些<span class=\"jump items\" data-view=\"items\" data-detail=\"震嶽巨鎚@3237\" title=\"在物品大全中打開\">震嶽巨鎚</span>，以後煉金塊用。</li></ul><h3>商店</h3><ul><li>防具商：<span class=\"jump items\" data-view=\"items\" data-detail=\"龍鱗盔@3282\" title=\"在物品大全中打開\">龍鱗盔</span> 360、<span class=\"jump items\" data-view=\"items\" data-detail=\"天蠶絲帶@3283\" title=\"在物品大全中打開\">天蠶絲帶</span> 370、<span class=\"jump items\" data-view=\"items\" data-detail=\"烏蠶手套@3336\" title=\"在物品大全中打開\">烏蠶手套</span> 280、<span class=\"jump items\" data-view=\"items\" data-detail=\"靈蛇手套@3337\" title=\"在物品大全中打開\">靈蛇手套</span> 260、<span class=\"jump items\" data-view=\"items\" data-detail=\"烏蠶衣@3302\" title=\"在物品大全中打開\">烏蠶衣</span> 660、<span class=\"jump items\" data-view=\"items\" data-detail=\"龍鬚衣@3303\" title=\"在物品大全中打開\">龍鬚衣</span> 620、<span class=\"jump items\" data-view=\"items\" data-detail=\"龍騰靴@3361\" title=\"在物品大全中打開\">龍騰靴</span> 220、<span class=\"jump items\" data-view=\"items\" data-detail=\"蛇皮短靴@3362\" title=\"在物品大全中打開\">蛇皮短靴</span> 240、<span class=\"jump items\" data-view=\"items\" data-detail=\"五行鞋@3363\" title=\"在物品大全中打開\">五行鞋</span> 400</li><li>武器商：<span class=\"jump items\" data-view=\"items\" data-detail=\"純鈞@3208\" title=\"在物品大全中打開\">純鈞</span> 860、<span class=\"jump items\" data-view=\"items\" data-detail=\"勝邪@3209\" title=\"在物品大全中打開\">勝邪</span> 1000、<span class=\"jump items\" data-view=\"items\" data-detail=\"九金烏圈@3225\" title=\"在物品大全中打開\">九金烏圈</span> 1180、<span class=\"jump items\" data-view=\"items\" data-detail=\"烏金骨朵@3236\" title=\"在物品大全中打開\">烏金骨朵</span> 750、<span class=\"jump items\" data-view=\"items\" data-detail=\"震嶽巨鎚@3237\" title=\"在物品大全中打開\">震嶽巨鎚</span> 870、<span class=\"jump items\" data-view=\"items\" data-detail=\"日月乾坤圈@3264\" title=\"在物品大全中打開\">日月乾坤圈</span> 800、<span class=\"jump items\" data-view=\"items\" data-detail=\"翔羽葉@3261\" title=\"在物品大全中打開\">翔羽葉</span> 380、<span class=\"jump items\" data-view=\"items\" data-detail=\"旋流刺@3262\" title=\"在物品大全中打開\">旋流刺</span> 500、<span class=\"jump items\" data-view=\"items\" data-detail=\"飛蝗石@3263\" title=\"在物品大全中打開\">飛蝗石</span> 650</li><li>雜貨商：和靈武一樣</li></ul>"}, {"chapter": "北方", "title": "雲崗石窟", "text": "雲崗石窟\n# 流程\n1. 在某個房間把汰玉如來放到桌上，打開天梯。\n2. 穿過天梯，往右上到洛陽。\n# 物品\n- 歎雲竹環：寶箱\n- 日月乾坤圈：寶箱\n- 羅漢伏魔杵：寶箱\n- 舍利子：進去後左下石室的右上（隱藏）\n- 仙魄香：寶箱\n- 千年何首烏：寶箱\n# 支線：吳東興\n1. 入口前一團黑黑的地方，左轉進隱藏的洞穴。\n2. 找到吳東興，給他三色慧星碎片（綠色慧星碎片、黃色慧星碎片、藍色慧星碎片），吳東興歸隊。見DOMO組員。\n- 麒麟竭：寶箱，隱藏洞穴\n- 仙爐灰：寶箱，隱藏洞穴\n# 其他\n- 木橋上要和劍仙戰鬥過。渾沌\n- 這裡的旋龜、魍魎、山鬼都能煉魔劍客，可以多收幾隻。", "html": "<h3>流程</h3><ol><li>在某個房間把<span class=\"jump items\" data-view=\"items\" data-detail=\"汰玉如來@3136\" title=\"在物品大全中打開\">汰玉如來</span>放到桌上，打開天梯。</li><li>穿過天梯，往右上到洛陽。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"歎雲竹環@3226\" title=\"在物品大全中打開\">歎雲竹環</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"日月乾坤圈@3264\" title=\"在物品大全中打開\">日月乾坤圈</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羅漢伏魔杵@3239\" title=\"在物品大全中打開\">羅漢伏魔杵</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"舍利子@3040\" title=\"在物品大全中打開\">舍利子</span>：進去後左下石室的右上（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"仙魄香@3014\" title=\"在物品大全中打開\">仙魄香</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"千年何首烏@3009\" title=\"在物品大全中打開\">千年何首烏</span>：寶箱</li></ul><h3>支線：吳東興</h3><ol><li>入口前一團黑黑的地方，左轉進隱藏的洞穴。</li><li>找到吳東興，給他三色慧星碎片（<span class=\"jump items\" data-view=\"items\" data-detail=\"綠色慧星碎片@3187\" title=\"在物品大全中打開\">綠色慧星碎片</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"黃色慧星碎片@3188\" title=\"在物品大全中打開\">黃色慧星碎片</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"藍色慧星碎片@3189\" title=\"在物品大全中打開\">藍色慧星碎片</span>），吳東興歸隊。見<span class=\"goto\" data-title=\"DOMO組員\">DOMO組員</span>。</li></ol><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"麒麟竭@3010\" title=\"在物品大全中打開\">麒麟竭</span>：寶箱，隱藏洞穴</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"仙爐灰@3015\" title=\"在物品大全中打開\">仙爐灰</span>：寶箱，隱藏洞穴</li></ul><h3>其他</h3><ul><li>木橋上要和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"劍仙@128\" title=\"在神魔異事錄中打開\">劍仙</span>戰鬥過。<span class=\"tag beast\">渾沌</span></li><li>這裡的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"旋龜@170\" title=\"在神魔異事錄中打開\">旋龜</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"魍魎@178\" title=\"在神魔異事錄中打開\">魍魎</span>、<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"山鬼@179\" title=\"在神魔異事錄中打開\">山鬼</span>都能煉魔劍客，可以多收幾隻。</li></ul>"}, {"chapter": "北方", "title": "洛陽", "text": "洛陽\n# 流程\n1. 出洛陽往下到通天塔，門口被地龍陰火封住。\n2. 回洛陽，在客棧前遇到小小，到客棧二樓找寧珂，再到城門找李靖。\n3. 進上方的糾髯客宅，張烈把全部財產交給李靖，輔佐李世民開國，並從李靖那裡拿到泛雲龍玉。\n4. 回通天塔，用泛雲龍玉滅掉地龍陰火，進塔。\n# 物品\n- 紅寶石戒指：客棧左邊的石塊（隱藏）\n# 支線：唐耕武的傳家寶\n- 在大興資助過唐耕武 3000 兩的話，右上的樹叢有三清符筆（隱藏）（法寶，3200 成長，融合指令：先召喚護駕，再用三清符筆選任一活物，有等級限制）。\n# 支線：松韻居\n1. 少東托你問三個夥計為什麼辭工。\n2. 進寶：身上有千月星痕的話，可以賣他 1500 兩，只有一次機會。\n3. 阿三，兩種給法擇一：\n   - 給金項鍊、金戒指、翠玉金釵：得靈蛇手套\n   - 給金塊加 500 兩：得仙蓮子\n4. 回覆少東，得武神魂玉（法寶，1800 成長，群攻指令）。\n# 支線：高玉玫\n- 到客棧找高玉玫，依序點選「南飛雁過樓，雁過樓前去，前樓過雁飛，過雁飛南遠」這二十個字，高玉玫歸隊。見DOMO組員。身上有 50 個以上神祕果時，她會說你改過遊戲，不會歸隊。\n# 支線：古維然的藥材\n- 在市集和古維然說話，五色藥材（青色藥材、赤色藥材、黃色藥材、白色藥材、黑色藥材）各給一份得神祕果，各給三份得神木之精（生命 +100）。\n- 身上沒有白色藥材的話，等小業子歸隊後到 DOMO 工作室（夜晚）找他拿，見DOMO組員。\n# 支線：月娃與劉馨韓\n1. 和怡春院的老鴇說話幾次，得知月娃被郡主關住。\n2. 到大興的獨孤家道觀（宇文太師府後面），打倒怪物救出月娃，得 99 套軒轅伏魔錄。\n3. 和劉馨韓說話，給她九種果子：桑果、蟠桃、野石榴、嘉果、凌霄果、三葉雪桑果、海檬果、山蛇莓、神祕果，劉馨韓歸隊。見DOMO組員。\n- 金塊：寶箱，獨孤家道觀\n- 玄武之沂：寶箱，獨孤家道觀（法寶，2500 成長，抗水 80%）\n- 炸藥：寶箱，獨孤家道觀\n- 仙爐灰：香爐裡（隱藏），獨孤家道觀\n- 千年蔘心丹：寶箱，獨孤家道觀\n- 海檬果：寶箱，獨孤家道觀\n# 支線：朱榮敏\n- 到長沙往右走到海灘，找朱榮敏，身上有 99 套軒轅伏魔錄就能讓他歸隊（書不會收走）。見DOMO組員。\n# 商店\n- 武器商：魚腸 950、巨闕 1200、震嶽巨鎚 870、上星玄鐵棒 980、麟火吞月刀 880、金霞兜 450、般若裟腕 320、加卡達鐲 340、青電臂 390、冰晶腕 450、南蠻戰衣 650、蒼蟒錦衣 720、天蠶絲衣 760、銀絲戰袍 820、金繭甲 880、青溥寶甲 1000、冰雕鞋 290、菟縱鞋 380、七星法靴 310、鳳羽靴 340、日月乾坤圈 800、飛爪 920、飛蝗石 650\n- 雜貨店：白玉飛天珮 230、五鬼戒指 300、白玉龍紋珮 270、鳳霞韘 340、化雪奇石 130、溶石魔羽 120、遁影浮沙 250、硝石 30、硫磺 20、炭粉 15、火筒 10、符紙鶴 50、石敢神石 60、輪迴盤 280\n- 藥鋪：解病萬靈丹 30、解僵針 40、安神定志丸 80、茴香茶 20、破元仙露 150、七葉蓮 300、河車丸 200、金創藥 150、鹿茸膏 350、千年蔘心丹 500、柴胡乾葛草 200、千年何首烏 400、靈神天藥 180、天山雪蓮 400、地稔根 250", "html": "<h3>流程</h3><ol><li>出洛陽往下到通天塔，門口被地龍陰火封住。</li><li>回洛陽，在客棧前遇到小小，到客棧二樓找寧珂，再到城門找李靖。</li><li>進上方的糾髯客宅，張烈把全部財產交給李靖，輔佐李世民開國，並從李靖那裡拿到<span class=\"jump items\" data-view=\"items\" data-detail=\"泛雲龍玉@3132\" title=\"在物品大全中打開\">泛雲龍玉</span>。</li><li>回通天塔，用泛雲龍玉滅掉地龍陰火，進塔。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"紅寶石戒指@3092\" title=\"在物品大全中打開\">紅寶石戒指</span>：客棧左邊的石塊（隱藏）</li></ul><h3>支線：唐耕武的傳家寶</h3><ul><li>在大興資助過唐耕武 3000 兩的話，右上的樹叢有<span class=\"jump items\" data-view=\"items\" data-detail=\"三清符筆@3155\" title=\"在物品大全中打開\">三清符筆</span>（隱藏）（法寶，3200 成長，融合指令：先召喚護駕，再用三清符筆選任一活物，有等級限制）。</li></ul><h3>支線：松韻居</h3><ol><li>少東托你問三個夥計為什麼辭工。</li><li>進寶：身上有<span class=\"jump items\" data-view=\"items\" data-detail=\"千月星痕@3206\" title=\"在物品大全中打開\">千月星痕</span>的話，可以賣他 1500 兩，只有一次機會。</li><li>阿三，兩種給法擇一：<ul><li>給<span class=\"jump items\" data-view=\"items\" data-detail=\"金項鍊@3385\" title=\"在物品大全中打開\">金項鍊</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"金戒指@3383\" title=\"在物品大全中打開\">金戒指</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"翠玉金釵@3275\" title=\"在物品大全中打開\">翠玉金釵</span>：得<span class=\"jump items\" data-view=\"items\" data-detail=\"靈蛇手套@3337\" title=\"在物品大全中打開\">靈蛇手套</span></li><li>給<span class=\"jump items\" data-view=\"items\" data-detail=\"金塊@3063\" title=\"在物品大全中打開\">金塊</span>加 500 兩：得<span class=\"jump items\" data-view=\"items\" data-detail=\"仙蓮子@3018\" title=\"在物品大全中打開\">仙蓮子</span></li></ul></li><li>回覆少東，得<span class=\"jump items\" data-view=\"items\" data-detail=\"武神魂玉@3164\" title=\"在物品大全中打開\">武神魂玉</span>（法寶，1800 成長，群攻指令）。</li></ol><h3>支線：高玉玫</h3><ul><li>到客棧找高玉玫，依序點選「南飛雁過樓，雁過樓前去，前樓過雁飛，過雁飛南遠」這二十個字，高玉玫歸隊。見<span class=\"goto\" data-title=\"DOMO組員\">DOMO組員</span>。身上有 50 個以上<span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>時，她會說你改過遊戲，不會歸隊。</li></ul><h3>支線：古維然的藥材</h3><ul><li>在市集和古維然說話，五色藥材（<span class=\"jump items\" data-view=\"items\" data-detail=\"青色藥材@3083\" title=\"在物品大全中打開\">青色藥材</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"赤色藥材@3084\" title=\"在物品大全中打開\">赤色藥材</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"黃色藥材@3085\" title=\"在物品大全中打開\">黃色藥材</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"白色藥材@3086\" title=\"在物品大全中打開\">白色藥材</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"黑色藥材@3087\" title=\"在物品大全中打開\">黑色藥材</span>）各給一份得<span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>，各給三份得<span class=\"jump items\" data-view=\"items\" data-detail=\"神木之精@3042\" title=\"在物品大全中打開\">神木之精</span>（生命 +100）。</li><li>身上沒有<span class=\"jump items\" data-view=\"items\" data-detail=\"白色藥材@3086\" title=\"在物品大全中打開\">白色藥材</span>的話，等小業子歸隊後到 DOMO 工作室（夜晚）找他拿，見<span class=\"goto\" data-title=\"DOMO組員\">DOMO組員</span>。</li></ul><h3>支線：月娃與劉馨韓</h3><ol><li>和怡春院的老鴇說話幾次，得知月娃被郡主關住。</li><li>到大興的獨孤家道觀（宇文太師府後面），打倒怪物救出月娃，得 99 套<span class=\"jump items\" data-view=\"items\" data-detail=\"軒轅伏魔錄@3190\" title=\"在物品大全中打開\">軒轅伏魔錄</span>。</li><li>和劉馨韓說話，給她九種果子：<span class=\"jump items\" data-view=\"items\" data-detail=\"桑果@3006\" title=\"在物品大全中打開\">桑果</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"蟠桃@3019\" title=\"在物品大全中打開\">蟠桃</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"野石榴@3020\" title=\"在物品大全中打開\">野石榴</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@3023\" title=\"在物品大全中打開\">嘉果</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"凌霄果@3024\" title=\"在物品大全中打開\">凌霄果</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"三葉雪桑果@3037\" title=\"在物品大全中打開\">三葉雪桑果</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"海檬果@3066\" title=\"在物品大全中打開\">海檬果</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"山蛇莓@3067\" title=\"在物品大全中打開\">山蛇莓</span>、<span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>，劉馨韓歸隊。見<span class=\"goto\" data-title=\"DOMO組員\">DOMO組員</span>。</li></ol><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金塊@3063\" title=\"在物品大全中打開\">金塊</span>：寶箱，獨孤家道觀</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"玄武之沂@3168\" title=\"在物品大全中打開\">玄武之沂</span>：寶箱，獨孤家道觀（法寶，2500 成長，抗水 80%）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"炸藥@3073\" title=\"在物品大全中打開\">炸藥</span>：寶箱，獨孤家道觀</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"仙爐灰@3015\" title=\"在物品大全中打開\">仙爐灰</span>：香爐裡（隱藏），獨孤家道觀</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"千年蔘心丹@3005\" title=\"在物品大全中打開\">千年蔘心丹</span>：寶箱，獨孤家道觀</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"海檬果@3066\" title=\"在物品大全中打開\">海檬果</span>：寶箱，獨孤家道觀</li></ul><h3>支線：朱榮敏</h3><ul><li>到長沙往右走到海灘，找朱榮敏，身上有 99 套<span class=\"jump items\" data-view=\"items\" data-detail=\"軒轅伏魔錄@3190\" title=\"在物品大全中打開\">軒轅伏魔錄</span>就能讓他歸隊（書不會收走）。見<span class=\"goto\" data-title=\"DOMO組員\">DOMO組員</span>。</li></ul><h3>商店</h3><ul><li>武器商：<span class=\"jump items\" data-view=\"items\" data-detail=\"魚腸@3210\" title=\"在物品大全中打開\">魚腸</span> 950、<span class=\"jump items\" data-view=\"items\" data-detail=\"巨闕@3211\" title=\"在物品大全中打開\">巨闕</span> 1200、<span class=\"jump items\" data-view=\"items\" data-detail=\"震嶽巨鎚@3237\" title=\"在物品大全中打開\">震嶽巨鎚</span> 870、<span class=\"jump items\" data-view=\"items\" data-detail=\"上星玄鐵棒@3238\" title=\"在物品大全中打開\">上星玄鐵棒</span> 980、<span class=\"jump items\" data-view=\"items\" data-detail=\"麟火吞月刀@3249\" title=\"在物品大全中打開\">麟火吞月刀</span> 880、<span class=\"jump items\" data- =\"七葉蓮@3032\" title=\"在物品大全中打開\">七葉蓮</span> 300、<span class=\"jump items\" data-view=\"items\" data-detail=\"河車丸@3034\" title=\"在物品大全中打開\">河車丸</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span> 350、<span class=\"jump items\" data-view=\"items\" data-detail=\"千年蔘心丹@3005\" title=\"在物品大全中打開\">千年蔘心丹</span> 500、<span class=\"jump items\" data-view=\"items\" data-detail=\"柴胡乾葛草@3008\" title=\"在物品大全中打開\">柴胡乾葛草</span> 200、<span class=\"jump items\" data-view=\"items\" data-detail=\"千年何首烏@3009\" title=\"在物品大全中打開\">千年何首烏</span> 400、<span class=\"jump items\" data-view=\"items\" data-detail=\"靈神天藥@3012\" title=\"在物品大全中打開\">靈神天藥</span> 180、<span class=\"jump items\" data-view=\"items\" data-detail=\"天山雪蓮@3013\" title=\"在物品大全中打開\">天山雪蓮</span> 400、<span class=\"jump items\" data-view=\"items\" data-detail=\"地稔根@3022\" title=\"在物品大全中打開\">地稔根</span> 250</li></ul>"}, {"chapter": "北方", "title": "通天塔（第一次）", "text": "通天塔（第一次）\n# 流程\n1. 六樓看到一堆人被殺，要上樓時韓騰擋路，打倒他（韓騰可偷活靈芝）。韓騰發勁擊中陳輔的腳，陳輔要靖仇別管他，先上樓阻止宇文拓。\n2. 九樓之後就是塔頂。DOMO 工作室的任務還沒完成的話，現在回去完成，和宇文拓打過以後就做不了了。\n3. 到塔頂打倒宇文拓（宇文拓可偷七合龍爪花）。原來他只用了十分之一的力量，拿出全力後打敗靖仇和張烈。\n4. 寧珂挾持阿雪出現，宇文拓被眾人圍攻，一分神被靖仇砍斷右臂。寧珂撿起軒轅劍，要大家欣賞第二次天狗蝕月。赤貫星劃破蒼穹，妖魔傾巢而出。阿雪奪下軒轅劍，帶大家突圍。\n5. 兩天後靖仇醒來，知道了一切，愧疚不已：寧珂是西方魔界之王的女魔將，殺死玉兒的也是她。師父還在通天塔，張烈說那裡已成魔界，無人生還。\n6. 靖仇想到去仙山島找仙人或許能挽回，出山洞找傳送點。見魔界傳送點。\n# 物品\n- 靈界指標：寶箱，二樓\n- 千年何首烏：寶箱，二樓\n- 干將：三樓寶箱，遇到飛賊王，選擇不讓給他，打贏得到 渾沌\n- 凌霄果：寶箱，四樓\n- 仙蓮子：寶箱，四樓\n- 鹿茸膏：寶箱，四樓\n- 神祕果：寶箱，五樓 DOMO\n- 珍珠：寶箱，五樓\n- 地脈血泉：寶箱，七樓往左\n- 活靈芝：寶箱，七樓往左（靈力 +40）\n- 鹿茸膏：寶箱，七樓往右\n- 麒麟竭：寶箱，八樓\n- 天山雪蓮：寶箱，八樓\n- 柳葉飛刀：寶箱，九樓\n- 雨皇花：寶箱，九樓（全部恢復）\n- 四樓要遇到一場戰鬥，張烈說「宇文拓為了護塔竟召來那麼多妖魔鬼怪」。渾沌", "html": "<h3>流程</h3><ol><li>六樓看到一堆人被殺，要上樓時<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"韓騰@16\" title=\"在神魔異事錄中打開\">韓騰</span>擋路，打倒他（<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"韓騰@16\" title=\"在神魔異事錄中打開\">韓騰</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"活靈芝@3039\" title=\"在物品大全中打開\">活靈芝</span>）。韓騰發勁擊中陳輔的腳，陳輔要靖仇別管他，先上樓阻止宇文拓。</li><li>九樓之後就是塔頂。DOMO 工作室的任務還沒完成的話，現在回去完成，和宇文拓打過以後就做不了了。</li><li>到塔頂打倒<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"宇文拓@7\" title=\"在神魔異事錄中打開\">宇文拓</span>（<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"宇文拓@7\" title=\"在神魔異事錄中打開\">宇文拓</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"七合龍爪花@3044\" title=\"在物品大全中打開\">七合龍爪花</span>）。原來他只用了十分之一的力量，拿出全力後打敗靖仇和張烈。</li><li>寧珂挾持阿雪出現，宇文拓被眾人圍攻，一分神被靖仇砍斷右臂。寧珂撿起軒轅劍，要大家欣賞第二次天狗蝕月。赤貫星劃破蒼穹，妖魔傾巢而出。阿雪奪下軒轅劍，帶大家突圍。</li><li>兩天後靖仇醒來，知道了一切，愧疚不已：寧珂是西方魔界之王的女魔將，殺死玉兒的也是她。師父還在通天塔，張烈說那裡已成魔界，無人生還。</li><li>靖仇想到去仙山島找仙人或許能挽回，出山洞找傳送點。見<span class=\"goto\" data-title=\"魔界傳送點\">魔界傳送點</span>。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@3094\" title=\"在物品大全中打開\">靈界指標</span>：寶箱，二樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"千年何首烏@3009\" title=\"在物品大全中打開\">千年何首烏</span>：寶箱，二樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"干將@3212\" title=\"在物品大全中打開\">干將</span>：三樓寶箱，遇到<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"飛賊王@203\" title=\"在神魔異事錄中打開\">飛賊王</span>，選擇不讓給他，打贏得到 <span class=\"tag beast\">渾沌</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"凌霄果@3024\" title=\"在物品大全中打開\">凌霄果</span>：寶箱，四樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"仙蓮子@3018\" title=\"在物品大全中打開\">仙蓮子</span>：寶箱，四樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span>：寶箱，四樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>：寶箱，五樓 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"珍珠@3093\" title=\"在物品大全中打開\">珍珠</span>：寶箱，五樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"地脈血泉@3033\" title=\"在物品大全中打開\">地脈血泉</span>：寶箱，七樓往左</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"活靈芝@3039\" title=\"在物品大全中打開\">活靈芝</span>：寶箱，七樓往左（靈力 +40）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span>：寶箱，七樓往右</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"麒麟竭@3010\" title=\"在物品大全中打開\">麒麟竭</span>：寶箱，八樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天山雪蓮@3013\" title=\"在物品大全中打開\">天山雪蓮</span>：寶箱，八樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"柳葉飛刀@3266\" title=\"在物品大全中打開\">柳葉飛刀</span>：寶箱，九樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"雨皇花@3089\" title=\"在物品大全中打開\">雨皇花</span>：寶箱，九樓（全部恢復）</li><li>四樓要遇到一場戰鬥，張烈說「宇文拓為了護塔竟召來那麼多妖魔鬼怪」。<span class=\"tag beast\">渾沌</span></li></ul>"}, {"chapter": "魔界", "title": "魔界傳送點", "text": "魔界傳送點\n# 流程\n1. 往西北經魔界傳送點到仙山島，進然翁居找然翁，他也沒有辦法。\n2. 到莫支灘找古月聖，他提出兩個方法：\n   1. 到通天塔毀掉五顆血珠，免得結界裂痕繼續擴大。\n   2. 根本之道：用崑崙鏡回到過去，集齊琴、鼎、印、鏡、石五樣神器封補結界裂痕。\n3. 眾人開始收集五樣神器，並設法救出宇文拓。\n# 其他\n- 原野上要遇到三隻雪球怪。渾沌\n- 當扈可偷活靈芝（靈力 +40）。\n# 天外村的商店\n天外村這時賣更好的裝備和藥品：\n- 雜貨店：白玉飛天珮 230、五鬼戒指 300、白玉龍紋珮 270、鳳霞韘 340、化雪奇石 130、溶石魔羽 120、遁影浮沙 250、符紙鶴 50、輪迴盤 280\n- 藥鋪：解病萬靈丹 30、解僵針 40、安神定志丸 80、茴香茶 20、破元仙露 150、七葉蓮 300、河車丸 200、活骨靈藥 140、金創藥 150、鹿茸膏 350、千年蔘心丹 500、柴胡乾葛草 200、千年何首烏 400、麒麟竭 600、天山雪蓮 400、仙魄香 600、嘉果 480、仙蓮子 700\n- 武器商：魚腸 950、巨闕 1200、九金烏圈 1180、茶羅骨環 1300、上星玄鐵棒 980、混天連珠鎚 1100、麟火吞月刀 880、七絕苗刀 1080、天蠶絲帶 370、金霞兜 450、般若裟腕 320、加卡達鐲 340、青電臂 390、冰晶腕 450、天蠶絲衣 760、銀絲戰袍 820、金繭甲 880、青溥寶甲 1000、冰雕鞋 290、菟縱鞋 380、七星法靴 310、鳳羽靴 340、金項鍊 150、飛爪 920、柳葉飛刀 1150", "html": "<h3>流程</h3><ol><li>往西北經魔界傳送點到仙山島，進然翁居找然翁，他也沒有辦法。</li><li>到莫支灘找古月聖，他提出兩個方法：<ol><li>到通天塔毀掉五顆血珠，免得結界裂痕繼續擴大。</li><li>根本之道：用崑崙鏡回到過去，集齊琴、鼎、印、鏡、石五樣神器封補結界裂痕。</li></ol></li><li>眾人開始收集五樣神器，並設法救出宇文拓。</li></ol><h3>其他</h3><ul><li>原野上要遇到三隻<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"雪球怪@174\" title=\"在神魔異事錄中打開\">雪球怪</span>。<span class=\"tag b ems\" data-view=\"items\" data-detail=\"七絕苗刀@3251\" title=\"在物品大全中打開\">七絕苗刀</span> 1080、<span class=\"jump items\" data-view=\"items\" data-detail=\"天蠶絲帶@3283\" title=\"在物品大全中打開\">天蠶絲帶</span> 370、<span class=\"jump items\" data-view=\"items\" data-detail=\"金霞兜@3284\" title=\"在物品大全中打開\">金霞兜</span> 450、<span class=\"jump items\" data-view=\"items\" data-detail=\"般若裟腕@3338\" title=\"在物品大全中打開\">般若裟腕</span> 320、<span class=\"jump items\" data-view=\"items\" data-detail=\"加卡達鐲@3339\" title=\"在物品大全中打開\">加卡達鐲</span> 340、<span class=\"jump items\" data-view=\"items\" data-detail=\"青電臂@3340\" title=\"在物品大全中打開\">青電臂</span> 390、<span class=\"jump items\" data-view=\"items\" data-detail=\"冰晶腕@3342\" title=\"在物品大全中打開\">冰晶腕</span> 450、<span class=\"jump items\" data-view=\"items\" data-detail=\"天蠶絲衣@3306\" title=\"在物品大全中打開\">天蠶絲衣</span> 760、<span class=\"jump items\" data-view=\"items\" data-detail=\"銀絲戰袍@3307\" title=\"在物品大全中打開\">銀絲戰袍</span> 820、<span class=\"jump items\" data-view=\"items\" data-detail=\"金繭甲@3308\" title=\"在物品大全中打開\">金繭甲</span> 880、<span class=\"jump items\" data-view=\"items\" data-detail=\"青溥寶甲@3309\" title=\"在物品大全中打開\">青溥寶甲</span> 1000、<span class=\"jump items\" data-view=\"items\" data-detail=\"冰雕鞋@3364\" title=\"在物品大全中打開\">冰雕鞋</span> 290、<span class=\"jump items\" data-view=\"items\" data-detail=\"菟縱鞋@3365\" title=\"在物品大全中打開\">菟縱鞋</span> 380、<span class=\"jump items\" data-view=\"items\" data-detail=\"七星法靴@3366\" title=\"在物品大全中打開\">七星法靴</span> 310、<span class=\"jump items\" data-view=\"items\" data-detail=\"鳳羽靴@3367\" title=\"在物品大全中打開\">鳳羽靴</span> 340、<span class=\"jump items\" data-view=\"items\" data-detail=\"金項鍊@3385\" title=\"在物品大全中打開\">金項鍊</span> 150、<span class=\"jump items\" data-view=\"items\" data-detail=\"飛爪@3265\" title=\"在物品大全中打開\">飛爪</span> 920、<span class=\"jump items\" data-view=\"items\" data-detail=\"柳葉飛刀@3266\" title=\"在物品大全中打開\">柳葉飛刀</span> 1150</li></ul>"}, {"chapter": "魔界", "title": "殤魂塔", "text": "殤魂塔\n# 流程\n1. 經仙山島右下的傳送點，到魔界左下的殤魂塔。\n2. 打倒千年狐狸精尉遲嫣紅（尉遲嫣紅可偷紫玉冰晶），得崆峒龍印。\n# 物品\n- 靈界指標：寶箱\n- 凌霄果：寶箱\n- 大葉合歡散：寶箱\n- 火象晶礦：寶箱\n- 風神符：下面兩個寶箱的同一個場景，從上面的路下來往左、靠近階梯的地方（隱藏）\n- 冥海神石：寶箱\n- 火麟披風：映月之光那個場景最右下的壁雕（隱藏）", "html": "<h3>流程</h3><ol><li>經仙山島右下的傳送點，到魔界左下的殤魂塔。</li><li>打倒千年狐狸精<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"尉遲嫣紅@20\" title=\"在神魔異事錄中打開\">尉遲嫣紅</span>（<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"尉遲嫣紅@20\" title=\"在神魔異事錄中打開\">尉遲嫣紅</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"紫玉冰晶@3054\" title=\"在物品大全中打開\">紫玉冰晶</span>），得<span class=\"jump items\" data-view=\"items\" data-detail=\"崆峒龍印@3108\" title=\"在物品大全中打開\">崆峒龍印</span>。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@3094\" title=\"在物品大全中打開\">靈界指標</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"凌霄果@3024\" title=\"在物品大全中打開\">凌霄果</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"大葉合歡散@3071\" title=\"在物品大全中打開\">大葉合歡散</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"火象晶礦@3081\" title=\"在物品大全中打開\">火象晶礦</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"風神符@3052\" title=\"在物品大全中打開\">風神符</span>：下面兩個寶箱的同一個場景，從上面的路下來往左、靠近階梯的地方（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"冥海神石@3096\" title=\"在物品大全中打開\">冥海神石</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"火麟披風@3059\" title=\"在物品大全中打開\">火麟披風</span>：映月之光那個場景最右下的壁雕（隱藏）</li></ul>"}, {"chapter": "魔界", "title": "螫魂塔", "text": "螫魂塔\n# 流程\n1. 回仙山島，經左下的傳送點到魔界東北的螫魂塔。\n2. 打倒千年琵琶精單小小（單小小可偷羅剎食日鈸），得神農銅鼎。\n# 物品\n- 千年蔘心丹：寶箱\n- 羅剎食日鈸：寶箱\n- 天仙酒：寶箱\n- 柳葉飛刀：寶箱\n- 神祕果：寶箱 DOMO\n- 竹葉符衣：寶箱\n- 紫金冠：寶箱\n- 七仙神針：打倒飛賊王得到（法寶，1800 成長，同一場戰鬥可以自動復活一次）\n- 映月之光那個場景的邪僧屍是很好的護駕，記得收幾隻。", "html": "<h3>流程</h3><ol><li>回仙山島，經左下的傳送點到魔界東北的螫魂塔。</li><li>打倒千年琵琶精<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"單小小@19\" title=\"在神魔異事錄中打開\">單小小</span>（<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"單小小@19\" title=\"在神魔異事錄中打開\">單小小</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"羅剎食日鈸@3057\" title=\"在物品大全中打開\">羅剎食日鈸</span>），得<span class=\"jump items\" data-view=\"items\" data-detail=\"神農銅鼎@3107\" title=\"在物品大全中打開\">神農銅鼎</span>。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"千年蔘心丹@3005\" title=\"在物品大全中打開\">千年蔘心丹</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"羅剎食日鈸@3057\" title=\"在物品大全中打開\">羅剎食日鈸</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天仙酒@3049\" title=\"在物品大全中打開\">天仙酒</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"柳葉飛刀@3266\" title=\"在物品大全中打開\">柳葉飛刀</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>：寶箱 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"竹葉符衣@3310\" title=\"在物品大全中打開\">竹葉符衣</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"紫金冠@3286\" title=\"在物品大全中打開\">紫金冠</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"七仙神針@3183\" title=\"在物品大全中打開\">七仙神針</span>：打倒<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"飛賊王@203\" title=\"在神魔異事錄中打開\">飛賊王</span>得到（法寶，1800 成長，同一場戰鬥可以自動復活一次）</li><li>映月之光那個場景的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"邪僧屍@222\" title=\"在神魔異事錄中打開\">邪僧屍</span>是很好的護駕，記得收幾隻。</li></ul>"}, {"chapter": "魔界", "title": "通天塔（第二次）", "text": "通天塔（第二次）\n# 流程\n1. 回仙山島，經左上的傳送點到魔界北邊的通天塔，遇到程咬金和秦叔寶，但塔前的魔界妖火擋住進不去。\n2. 回然翁居找古月聖，他跟著眾人到通天塔滅掉妖火。李世民和程、秦二人已帶人在塔下等候。\n3. 古月聖要靖仇等人去救宇文拓，其他人去拿伏羲琴，他自己先到塔頂佈下失卻之陣。\n4. 六樓見到宇文拓，阿雪除去血繭救下他，從他口中得知一切真相。\n5. 獨孤寧珂出現，打倒她（獨孤寧珂可偷活靈芝）。寧珂原想吃下惡魔之果，但心裡對宇文拓存著愛意，不願變成醜陋的模樣，最後被宇文拓所殺。\n6. 到塔頂，古月聖佈陣完畢。靖仇放好兩樣神器、和眾人說話後，古月聖發動失卻之陣，回到赤貫星劃破蒼穹之前的塔頂。和張烈、阿雪說話，兩人加入。\n7. 收好三樣神器，把軒轅劍插在中央，和古月聖說話，發動巴別之陣。陳輔出現，責問靖仇為什麼幫宇文拓擺九五之陣，要上前拉他。陣式即將發動，靖仇只好出掌擊退陳輔，被傳送到虛空之門。\n# 物品\n- 仙蓮子：寶箱，二樓\n- 雨皇花：寶箱，二樓\n- 七葉蓮：寶箱，二樓\n- 天羅咒環：寶箱，三樓\n- 碧英之腕：寶箱，三樓\n- 金創藥：寶箱，四樓\n- 火象晶礦：寶箱，四樓\n- 柴胡乾葛草：寶箱，五樓\n- 木象晶礦：寶箱，五樓\n- 金塊：寶箱，七樓\n- 五雷神機：寶箱，七樓\n- 蟠桃：寶箱，七樓\n- 莫邪：寶箱，七樓\n- 鏡舞：寶箱，八樓\n- 天仙酒：寶箱，八樓\n- 輪迴盤：寶箱，九樓\n- 詛咒魔戒：寶箱，九樓\n- 綑鍊鞋：寶箱，塔頂右邊\n- 四樓的尼梅亞獅可偷蜂王露（體力 +50）。\n# 渾沌\n- 出通天塔回寒音剎，條件都達成的話會遇到渾沌，見隱藏頭目。", "html": "<h3>流程</h3><ol><li>回仙山島，經左上的傳送點到魔界北邊的通天塔，遇到程咬金和秦叔寶，但塔前的魔界妖火擋住進不去。</li><li>回然翁居找古月聖，他跟著眾人到通天塔滅掉妖火。李世民和程、秦二人已帶人在塔下等候。</li><li>古月聖要靖仇等人去救宇文拓，其他人去拿伏羲琴，他自己先到塔頂佈下失卻之陣。</li><li>六樓見到宇文拓，阿雪除去血繭救下他，從他口中得知一切真相。</li><li><span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"獨孤寧珂@10\" title=\"在神魔異事錄中打開\">獨孤寧珂</span>出現，打倒她（<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"獨孤寧珂@10\" title=\"在神魔異事錄中打開\">獨孤寧珂</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"活靈芝@3039\" title=\"在物品大全中打開\">活靈芝</span>）。寧珂原想吃下惡魔之果，但心裡對宇文拓存著愛意，不願變成醜陋的模樣，最後被宇文拓所殺。</li><li>到塔頂，古月聖佈陣完畢。靖仇放好兩樣神器、和眾人說話後，古月聖發動失卻之陣，回到赤貫星劃破蒼穹之前的塔頂。和張烈、阿雪說話，兩人加入。</li><li>收好三樣神器，把軒轅劍插在中央，和古月聖說話，發動巴別之陣。陳輔出現，責問靖仇為什麼幫宇文拓擺九五之陣，要上前拉他。陣式即將發動，靖仇只好出掌擊退陳輔，被傳送到虛空之門。</li></ol><h3>物品</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"仙蓮子@3018\" title=\"在物品大全中打開\">仙蓮子</span>：寶箱，二樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"雨皇花@3089\" title=\"在物品大全中打開\">雨皇花</span>：寶箱，二樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"七葉蓮@3032\" title=\"在物品大全中打開\">七葉蓮</span>：寶箱，二樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天羅咒環@3228\" title=\"在物品大全中打開\">天羅咒環</span>：寶箱，三樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"碧英之腕@3341\" title=\"在物品大全中打開\">碧英之腕</span>：寶箱，三樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金創藥@3003\" title=\"在物品大全中打開\">金創藥</span>：寶箱，四樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"火象晶礦@3081\" title=\"在物品大全中打開\">火象晶礦</span>：寶箱，四樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"柴胡乾葛草@3008\" title=\"在物品大全中打開\">柴胡乾葛草</span>：寶箱，五樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"木象晶礦@3079\" title=\"在物品大全中打開\">木象晶礦</span>：寶箱，五樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"金塊@3063\" title=\"在物品大全中打開\">金塊</span>：寶箱，七樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"五雷神機@3267\" title=\"在物品大全中打開\">五雷神機</span>：寶箱，七樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"蟠桃@3019\" title=\"在物品大全中打開\">蟠桃</span>：寶箱，七樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"莫邪@3213\" title=\"在物品大全中打開\">莫邪</span>：寶箱，七樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鏡舞@3287\" title=\"在物品大全中打開\">鏡舞</span>：寶箱，八樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天仙酒@3049\" title=\"在物品大全中打開\">天仙酒</span>：寶箱，八樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"輪迴盤@3017\" title=\"在物品大全中打開\">輪迴盤</span>：寶箱，九樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"詛咒魔戒@3395\" title=\"在物品大全中打開\">詛咒魔戒</span>：寶箱，九樓</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"綑鍊鞋@3368\" title=\"在物品大全中打開\">綑鍊鞋</span>：寶箱，塔頂右邊</li><li>四樓的<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"尼梅亞獅@149\" title=\"在神魔異事錄中打開\">尼梅亞獅</span>可偷<span class=\"jump items\" data-view=\"items\" data-detail=\"蜂王露@3038\" title=\"在物品大全中打開\">蜂王露</span>（體力 +50）。</li></ul><h3>渾沌</h3><ul><li>出通天塔回寒音剎，條件都達成的話會遇到<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"渾沌@57\" title=\"在神魔異事錄中打開\">渾沌</span>，見<span class=\"goto\" data-title=\"隱藏頭目\">隱藏頭目</span>。</li></ul>"}, {"chapter": "赤貫星", "title": "虛空之門", "text": "虛空之門\n# 冰幻迷宮\n- 800 兩：寶箱\n- 鹿茸膏：寶箱\n- 天山雪蓮：寶箱\n- 麒麟竭：第二場景往上的冰晶處（隱藏）\n- 雨皇花：寶箱\n- 嘉果：寶箱\n- 飛爪：寶箱，北邊場景冰梯前的左邊\n- 蛟精奇腕：寶箱\n- 龍泉：最後一個場景入口的左下角（隱藏）\n# 血腥地獄通道\n- 鹿茸膏：寶箱\n- 神祕果：寶箱 DOMO\n- 靈界指標：寶箱\n- 鈦銧奇鞋：出口前的寶箱\n- 之前沒救丁格的話，丁格會在出口前的寶箱出現，選「不會」，他會招來怪物。饕餮的條件都達成的話，出現的是饕餮，打贏另得泥蚣袍，見隱藏頭目。\n# 沙漠通道\n- 三教霞光鏡：寶箱\n- 玄天鎖妖圈：寶箱\n- 天雷聚陽鼎：寶箱\n- 炎陽靈珠：寶箱\n- 先往北到幻之商肆買東西。\n- 打開幻之商肆左上的箱子，和北斗星君打三回合不死（可以用玉佛印），得五行盤（法寶，500 成長，戰鬥中更換屬性）。\n# 商店：幻之商肆\n- 工匠：茶羅骨環 1300、御衡鎮日刀 1250、大夏龍雀 1800、聖獸玲瓏冠 600、北斗箍環 680、七情束 710、天仙頭巾 800、蓮腕釧 520、藍堂護手 540、雨雲之腕 580、仙風膀 600、血玉手套 630、雀羽隱雲 670、雪蠶護手 700、紫堂殼 980、虹紗羽 1080、修羅鬥鎧 1100、靈幻流鎧 1160、罡氣披搏 1250、血殷長袍 1300、神秘斗篷 1600、玄雪絲衣 1480、萱華柔甲 1800、無痕鞋 380、踏風草鞋 480、泰山神鞋 400、繡花葉鞋 450、飛爪 920、柳葉飛刀 1150、五雷神機 1420\n- 雜貨商：火麟披風 420、雲生碧燄巾 280、天雷聚陽鼎 300、阿修羅之森 350、冥海神石 250、符紙鶴 50、輪刃 260、翔羽葉 380\n- 藥商：解僵針 40、安神定志丸 80、化雪奇石 130、溶石魔羽 120、破元仙露 150、七葉蓮 300、河車丸 200、三葉雪桑果 110、鹿茸膏 350、千年蔘心丹 500、千年何首烏 400、麒麟竭 600、仙魄香 600、仙爐灰 1000、嘉果 480、輪迴盤 280、仙蓮子 700\n# 支線：靖仇最強的劍\n- 拿到龍泉、泰阿、工布後回幻之商肆交給工匠，再選一種晶礦決定造哪一把：\n- 火象晶礦：赤龍牙（攻擊 +270，敏捷 +2，炎灼 8 回合）\n- 水象晶礦：封雪刃（攻擊 +270，防禦 +2，冰凍 4 回合）", "html": "<h3>冰幻迷宮</h3><ul><li>800 兩：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天山雪蓮@3013\" title=\"在物品大全中打開\">天山雪蓮</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"麒麟竭@3010\" title=\"在物品大全中打開\">麒麟竭</span>：第二場景往上的冰晶處（隱藏）</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"雨皇花@3089\" title=\"在物品大全中打開\">雨皇花</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"嘉果@3023\" title=\"在物品大全中打開\">嘉果</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"飛爪@3265\" title=\"在物品大全中打開\">飛爪</span>：寶箱，北邊場景冰梯前的左邊</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"蛟精奇腕@3343\" title=\"在物品大全中打開\">蛟精奇腕</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"龍泉@3214\" title=\"在物品大全中打開\">龍泉</span>：最後一個場景入口的左下角（隱藏）</li></ul><h3>血腥地獄通道</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鹿茸膏@3004\" title=\"在物品大全中打開\">鹿茸膏</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"神祕果@3088\" title=\"在物品大全中打開\">神祕果</span>：寶箱 <span class=\"tag domo\">DOMO</span></li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"靈界指標@3094\" title=\"在物品大全中打開\">靈界指標</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"鈦銧奇鞋@3369\" title=\"在物品大全中打開\">鈦銧奇鞋</span>：出口前的寶箱</li><li>之前沒救丁格的話，丁格會在出口前的寶箱出現，選「不會」，他會招來怪物。饕餮的條件都達成的話，出現的是<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"饕餮@56\" title=\"在神魔異事錄中打開\">饕餮</span>，打贏另得<span class=\"jump items\" data-view=\"items\" data-detail=\"泥蚣袍@3319\" title=\"在物品大全中打開\">泥蚣袍</span>，見<span class=\"goto\" data-title=\"隱藏頭目\">隱藏頭目</span>。</li></ul><h3>沙漠通道</h3><ul><li><span class=\"jump items\" data-view=\"items\" data-detail=\"三教霞光鏡@3058\" title=\"在物品大全中打開\">三教霞光鏡</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"玄天鎖妖圈@3229\" title=\"在物品大全中打開\">玄天鎖妖圈</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"天雷聚陽鼎@3061\" title=\"在物品大全中打開\">天雷聚陽鼎</span>：寶箱</li><li><span class=\"jump items\" data-view=\"items\" data-detail=\"炎陽靈珠@3055\" title=\"在物品大全中打開\">炎陽靈珠</span>：寶箱</li><li>先往北到幻之商肆買東西。</li><li>打開幻之商肆左上的箱子，和<span class=\"jump bestiary\" data-view=\"bestiary\" data-detail=\"北斗星君@103\" title=\"在神魔異事錄中打開\">北斗星君</span>打三回合不死（可以用<span class=\"jump items\" data-view=\"items\" data-detail=\"玉佛印@3048\" title=\"在物品大全中打開\">玉佛印</span>），得<span class=\"jump items\" data-view=\"items\" data-detail=\"五行盤@3184\" title=\"在物品大全中打開\">五行盤</span>（法寶，500 成長，戰鬥中更換屬性）。</li></ul><h3>商店：幻之商肆</h3><ul><li>工匠：<span class=\"jump items\" data-view=\"items\" data-detail=\"茶羅骨環@3227\" title=\"在物品大全中打開\">茶羅骨環</span> 1300、<span class=\"jump items\" data-view=\"items\" data-detail=\"御衡鎮日刀@3252\" title=\"在物品大全中打開\">御衡鎮日刀</span> 1250、<span class=\"jump items\" data-view=\"items\" data-detail=\"大夏龍雀@3254\" title=\"在物品大全中打開\">大夏龍雀</span> 1800、<span class=\"jump items\" data-view=\"items\" data-detail=\"聖獸玲瓏冠@3288\" title=\"在物品大全中打開\">聖獸玲瓏冠</span> 600、<span class=\"jump items\" data-view=\"items\" data-d
