<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>事件一覽</title>
<style>
:root {
  --gold: #a89048;
  --gold-dark: #6a5420;
  --gold-light: #f0e848;
  --text: #c8b888;
  --dim: #988a62;
  --panel: #100f08;
  --ink: #3a2008;
  --kai: "BiauKai", "DFKai-SB", "標楷體", "KaiTi", "STKaiti", "Kaiti TC", serif;
  --ming: "PMingLiU", "MingLiU", "新細明體", "Songti TC", "Noto Serif TC", "Noto Serif CJK TC", serif;
}

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; overflow: hidden; }

body {
  font-family: var(--ming);
  color: var(--text);
  background:
    radial-gradient(ellipse at 15% 20%, rgba(255, 220, 150, 0.45), transparent 50%),
    radial-gradient(ellipse at 85% 80%, rgba(110, 50, 10, 0.4), transparent 55%),
    radial-gradient(ellipse at 50% 55%, rgba(150, 80, 20, 0.25), transparent 45%),
    radial-gradient(ellipse at 5% 90%, rgba(90, 40, 10, 0.35), transparent 40%),
    repeating-linear-gradient(90deg, rgba(90, 40, 10, 0.12) 0 1px, transparent 1px 80px),
    linear-gradient(160deg, #e0b070 0%, #cc9450 45%, #b07834 100%);
}

.book {
  position: absolute;
  left: 0;
  top: 0;
  width: 1180px;
  height: 870px;
  padding: 12px 12px 8px;
  display: flex;
  flex-direction: column;
  transform-origin: 0 0;
}

.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  border-top: 2px solid rgba(255, 230, 180, 0.5);
  background: repeating-linear-gradient(90deg, rgba(255, 230, 180, 0.3) 0 1px, transparent 1px 80px);
  height: 64px;
  flex: none;
  padding: 0 12px 4px 6px;
}

h1 {
  margin: 0;
  font-family: var(--kai);
  font-size: 44px;
  letter-spacing: 6px;
  color: var(--ink);
  text-shadow: 2px 2px 0 rgba(255, 230, 180, 0.45), 0 0 8px rgba(255, 230, 180, 0.35);
  font-weight: bold;
}

.tools { display: flex; align-items: center; gap: 10px; padding-bottom: 6px; }

.tools input {
  font-family: var(--ming);
  font-size: 18px;
  width: 300px;
  padding: 4px 8px;
  color: #f0e0a8;
  background: rgba(16, 15, 8, 0.85);
  border: 2px solid var(--gold);
  outline: none;
}

.tools input::placeholder { color: var(--dim); }

.layout {
  display: grid;
  grid-template-columns: 116px 1fr;
  gap: 0 14px;
  margin-top: 8px;
  flex: 1;
  min-height: 0;
}

.tabs {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 10px;
  margin-right: -20px;
  z-index: 1;
}

.tab {
  font-family: var(--kai);
  font-size: 19px;
  padding: 6px 19px 6px 12px;
  color: #2c3410;
  background: linear-gradient(90deg, #5c7034, #889c58);
  --edge: #b89838;
  border: 1px solid #000;
  border-right: none;
  border-radius: 10px 0 0 10px;
  box-shadow: inset 0 0 0 2px var(--edge);
  cursor: pointer;
  user-select: none;
  text-align: center;
  white-space: nowrap;
}

.tab small { display: block; font-family: var(--ming); font-size: 13px; }

.tab.chosen {
  color: #181800;
  background: linear-gradient(90deg, #b8d050, #eef488);
  --edge: #b07818;
  font-weight: bold;
}

.layout .page { z-index: 2; }

.frame {
  --corner: linear-gradient(var(--gold-light), var(--gold-light));
  background:
    var(--corner) left top / 9px 3px no-repeat,
    var(--corner) left top / 3px 9px no-repeat,
    var(--corner) right top / 9px 3px no-repeat,
    var(--corner) right top / 3px 9px no-repeat,
    var(--corner) left bottom / 9px 3px no-repeat,
    var(--corner) left bottom / 3px 9px no-repeat,
    var(--corner) right bottom / 9px 3px no-repeat,
    var(--corner) right bottom / 3px 9px no-repeat,
    var(--panel);
  border: 2px solid var(--gold);
  box-shadow: inset 0 0 0 1px #000, 0 0 0 1px #000;
  position: relative;
}

.page { display: flex; flex-direction: column; min-height: 0; padding: 14px 8px 12px 24px; }

.page .title {
  flex: none;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-family: var(--kai);
  font-size: 30px;
  line-height: 42px;
  color: #f0e0a8;
  border-bottom: 1px solid var(--gold-dark);
  margin-right: 16px;
  padding-bottom: 4px;
}

.pager { display: flex; align-items: center; gap: 8px; font-family: var(--ming); font-size: 16px; color: var(--dim); }

.pager button {
  font-family: var(--kai);
  font-size: 17px;
  color: #f0e0a8;
  background: rgba(168, 144, 72, 0.2);
  border: 1px solid var(--gold);
  padding: 1px 12px;
  cursor: pointer;
}

.pager button:disabled { color: var(--dim); border-color: var(--gold-dark); cursor: default; }

.page .body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  scrollbar-gutter: stable;
  padding: 4px 14px 10px 0;
  scrollbar-color: var(--gold) #000;
  font-size: 17px;
  line-height: 28px;
}

.event { padding: 10px 0 12px; border-bottom: 1px solid rgba(168, 144, 72, 0.35); }
.event.marked { background: rgba(240, 232, 72, 0.08); }

.event .head { display: flex; gap: 14px; align-items: baseline; }
.event .number { font-family: var(--kai); font-size: 24px; color: var(--gold-light); min-width: 64px; }
.event .where { color: #f0e0a8; overflow-wrap: anywhere; }
.event .where.none { color: var(--dim); }

.event dl { margin: 4px 0 0 78px; display: grid; grid-template-columns: auto 1fr; gap: 0 12px; }
.event dt { font-family: var(--kai); color: var(--gold); white-space: nowrap; }
.event dd { margin: 0; overflow-wrap: anywhere; }

.event .lines { margin: 6px 0 0 78px; color: var(--text); }
.event .lines p { margin: 0 0 4px; white-space: pre-line; overflow-wrap: anywhere; }
.event .lines p::before { content: "「"; color: var(--dim); }
.event .lines p::after { content: "」"; color: var(--dim); }
.event details summary { cursor: pointer; color: var(--gold); font-size: 15px; }

.event a { color: var(--gold-light); text-decoration: none; cursor: pointer; }
.event a:hover { text-decoration: underline; }

.empty { color: var(--dim); padding: 20px 0; }

.hint { flex: none; margin-top: 6px; font-size: 13px; color: #3a2008; text-align: right; }
</style>
</head>
<body>
<div class="book">
  <div class="top">
    <div class="tools"><input id="search" type="search" placeholder="搜尋編號、地圖、物品或台詞"></div>
    <h1>事件一覽</h1>
  </div>
  <div class="layout">
    <div class="tabs" id="tabs"><div class="tab" data-at="0">第一卷<small>1–1999</small></div><div class="tab" data-at="1">第二卷<small>2000–3999</small></div><div class="tab" data-at="2">第三卷<small>4000–5999</small></div><div class="tab" data-at="3">第四卷<small>6000–7999</small></div></div>
    <div class="frame page">
      <div class="title"><span id="heading"></span><span class="pager"><button id="previous">上一頁</button><span id="pages"></span><button id="next">下一頁</button></span></div>
      <div class="body" id="body"></div>
    </div>
  </div>
  <div class="hint">編號可填入作弊畫面（調試模式 Ctrl+F4）的號碼欄，按「劇情」直接執行　←→ 翻頁　↑↓ PgUp / PgDn 捲動</div>
</div>

琴、崆峒印這幾樣東西，您會卜卦，可不可以幫我們卜一下它們在哪兒呢？","嗯，妳這就問對人了────\n好，我就來免費替各位卜個一卦看看吧？","奇怪………無法感應到？\n我再試一次──────","啊，有了有了────\n終於捕捉到它們的線索了！","您真厲害，請問它們在什麼地方？","你們這三樣物品應該都是上古神器，靈力悠遠，我也很難卜出它們確實方位───所以只能將我得到之卦辭告訴各位。","伏羲琴位於敦煌石窟內，有強大千佛之力護守───「若欲得之，難勝登天」。","崆峒印目前在朝廷手中，被當今太師擁有，但你們若到長沙郡一趟，自可「巧遇貴人，探囊得之」────","至於女媧石，行蹤最為飄渺不定，似乎與各位相依相隨，但卻又「大興失之，大滅得之」。","▲▲哥哥，這位陸哥哥究竟在說什麼呀？","不難不難，大致的意思我大概都明白了。","琴在敦煌，印在長沙，石不知在什麼鬼地方───大致就是如此，對吧？","完全正確，就是這樣的意思。","啊，阿仇………還真看不出來你也滿有幾把刷子的嘛！","既然陸大哥已告訴了我們那麼多的消息，接下來我們要怎麼做呢？","照陸大哥的提示來看，琴在敦煌，卻不易獲得；印在長沙，可探囊得之；石則不知在何方───","這樣看來，我們當然似乎是先去長沙一趟，先找崆峒印的好。","不過……如果那印果真是握在宇文太師手中，我們要從他手上搶回，恐也不是什麼容易的事。","陸大哥剛才提到會有貴人相助───我倒想去看看「貴人」究竟是誰，以及如何幫我們「探囊得之」？","好呀好呀────\n這我也很有興趣，我們大家就先去長沙郡吧！","啊，真是太謝謝您了────\n您給我們的提示真是太有幫助了。","不客氣………不過要去長沙，路上滿危險的，我知道一條叫做大禹水路的祕密通道，可以直通那兒。","大禹水路────？","那兒的入口目前被藤蔓封閉，如你們打算走那裡，不妨到西邊杏山茅屋找我一位朋友喬岱娘，只有她有能力可為各位打開藤蔓。","謝謝陸大哥，那我們回去跟師父說一聲，就立刻啟程去長沙吧。","陸大哥，真是太謝謝您了！","不客氣！","喬姑娘口中的爹爹，其實是一位人族的老樵夫………","幾年前杏山大旱時，他看見深山中的一棵杏樹快枯死了，覺得很不忍，就天天特地從山谷的河底挑水，上來為它澆灌。","那棵杏樹就是喬姑娘的原形………所以喬姑娘為了報恩，就化成人形，來照顧這一位兒子們後來都死於朝廷傜役的孤單老人。"],"where":["江都（地圖 178）的角色（編號 165，座標 47,33）"],"openedBy":[],"givenBy":[]},{"id":166,"facts":[["得失","瓊花種子 -1、奇魄古玉 +1"]],"opens":[],"gives":[],"lines":["請問這裡有一位叫喬岱娘的姑娘嗎？","奴家便是，請問公子何事？","喬姑娘，我們是江都卜卦的陸仲愷大哥介紹來的，有事想要麻煩您。","啊，原來是陸兄的朋友啊？\n有什麼事情嗎？","陸大哥幫我們卜卦找到一個線索，我們要尋線到長沙郡，陸大哥建議我們來找妳，詢問關於大禹水路之事。","原來如此………奴家明白了。","大禹水路是夏帝大禹以前疏通九州水患時，挖鑿的疏通水道遺跡，不過目前已經荒廢了。","奴家會吩咐在那兒的藤蔓樹精朋友為各位將入口藤蔓打開………稍後各位過去那兒，應該就可以直接進去了。","這是太好了，我們該怎樣感謝妳才好呢？","嗯………請你們幫我一個小忙好了。","奴家的老父平日酷愛蒔花，他老人家米壽即至，奴家想送他一株名叫瓊花之奇花當壽禮────","瓊花色白如玉，芳香若蘭，聽說長沙可買得海外之瓊花種子，因此想託請各位，去為奴家帶些兒回來。","哈哈～～～當然沒問題！\n妳真的是好孝順呀。","喬姑娘，您認識陸大哥，又認識大禹水路附近的藤蔓精，請問妳也是妖精一族的嗎？","是的，奴家是八百年的杏樹精。","瓊花種子的事情，就拜託各位了。","喬姑娘，\n我們將您要的瓊花種子帶回來了！","啊，謝謝您！\n為了表示感謝，奴家送給您奇魄古玉。","謝謝妳，喬姑娘。","謝謝你們────\n爹看見這些瓊花的種子，不知道會有多高興！"],"where":["杏山（地圖 188）的角色（編號 166，座標 25,22）"],"openedBy":[],"givenBy":[]},{"id":167,"facts":[],"opens":[],"gives":[],"lines":["走開走開～～\n閒雜百姓不要隨便靠近這裡！"],"where":["長沙郡隋營（地圖 257）的隱藏物品（編號 167，座標 40,16）","長沙郡隋營（地圖 257）的角色（編號 168，座標 39,19）"],"openedBy":[],"givenBy":[]},{"id":169,"facts":[["得失","金錢 -100、瓊花種子 +1"]],"opens":[],"gives":[170],"lines":["來來來───本店什麼奇花異樹子都有，來──","對不起，請問你們這裡有在賣瓊花種子嗎？","哈哈────\n那當然，本店什麼子都有！","瓊花種兒需一百兩銀子───\n〔買了〕／〔不買〕","對不起，您的銀兩不足！","得到瓊花種子","公子啊，您知要買花該買瓊花，公子您也確是有眼光。","江都聽說也栽有瓊花，連當今皇上這次下江南也是為了看瓊花呢！","對不起，請問您……這長沙郡外怎麼那麼多士兵呢？","啊，公子您不知道嗎？這是當今朝廷太師的部隊，來到長沙了！","太師？\n難道是……宇文太師？","對對對，就是那個宇文太師………他們好像剛平定會稽的叛亂，立刻又移駐此地。","老闆，您說士兵們是來此平定叛變，這附近也有盜匪在叛亂嗎？","老實說，好像是沒有啊……所以這才奇怪呀！","聽說北方中原那兒盜匪已鬧得朝廷也束手無策，但我們江南是還好啦……","那您知道之前宇文太師的部隊去會稽郡平亂，結果那兒反而全毀的事嗎？","曉得啊，這當然知道。","皇上對此事非常生氣，皇上本想到江都之後，繼續南下會稽遊玩的……","聽說江都的王世充趁這機會，還打算推薦一位天竺高僧給皇上當新的國師呢。","什麼，新的國師？","是啊，宇文太師過去地位十分崇隆……但看來他的胡作非為，讓自己國師地位有危險嘍！","有需要的話，再來哦！","下次再來哦！"],"where":["長沙郡花圃（地圖 198）的角色（編號 169，座標 15,9）"],"openedBy":[],"givenBy":[]},{"id":170,"facts":[],"opens":[],"gives":[171,172],"lines":["郡主、獨孤郡主────","啊，你不是……之前那位▲▲公子，以及小雪姑娘和拓跋姑娘嗎？","真高興郡主還記得我們，沒想到那麼巧，在長沙郡竟然能又遇到郡主。","郡主，郡主……","大街之上宇文太師的耳目甚多，您是否要請這幾位朋友換個地方再聊？","嗯……嫣紅，妳說的很對！","對不起，▲▲公子─────\n大街不好長談，我想請各位到前面江雲樓找個位子，大家再好好敘敘吧？","郡主，如果您有事忙，我們就不多打攪您了！","不不，不妨礙的……","其實能在這裡見到你們真好………\n我有重要之事一定要告訴你們幾位，請務必過來和我碰頭！","▲▲公子，請坐、請坐！","郡主，方才您說有要事告訴我們，請問究竟是什麼事？","上次我們分別時，不是約好要一起遏止宇文太師的野心，大家還記得嗎？","嗯，當然記得了………","宇文太師目標與我們一致，都是要取得九五之陣所需之五樣上古神器，不過他的目的，卻是讓自己當上皇帝。","你們知道嗎？\n那個宇文太師，前些時候親自到東海一趟，成功奪到了崆峒印！","啊，這件事情郡主也曉得？","嗯，這是當然了…………","我擔心宇文太師的野心，所以上次別後，我就私下偷偷派人潛入他部隊內當刺候！","據我派去之人的描述────宇文太師當日以黃金劍將海水一劈為二，挾萬鈞之勢，擊敗那兒的龍族，輕易就搶到了崆峒龍印！","……………","更讓我擔心的是：宇文太師最近還查出了女媧石下落，前幾日親自出發往南嶺鬼窟去，打算一舉奪取女媧石！","什麼，連女媧石也……………","而且，我還聽說他順利查出另一樣神器伏羲琴可能被藏在河西沙漠，似乎最近也打算派遣部隊，去那兒將它取得！","這個宇文太師怎這麼厲害，竟連伏羲琴在河西的事，他也都知道？","記得▲▲公子曾告訴過我：完成「九五之陣」的神器共伏羲琴、神農鼎、崆峒印、崑崙鏡、女媧石五樣，一轉眼之間，宇文太師就將擁有三樣了！","嗯，此事確實十分嚴重────\n謝謝郡主及時告訴給我們這些消息。","不過郡主大可放心………因為我們手上除了上次您還我們的神農鼎外，我們還有剛剛取得的崑崙鏡！","只要這兩樣神器不被他給奪去，我們就仍握有一定優勢───","啊，你們竟然搶到崑崙鏡了呀？\n這怎麼可能─────","是呀，郡主不曉得我們也很厲害吧？","呃……奇怪！\n崑崙鏡不是應該是……不，算了！","…………？","總而言之，▲▲公子，你們能掌握有剩下的兩樣神器，這真是太好了───","那今後保護這兩樣神器之事，就全交給你們，拜託各位了。","放心，郡主─────\n就算犧牲生命，我們也不會隨便讓宇文太師把它們奪走的！","其實………今日我真正最想要告訴各位的不是上面那些壞消息，而是一個上好的大消息！","上好的大消息………？","是的………就我所知，宇文太師目前人至南方找尋女媧石，而他部隊，則屯駐在長沙附近等他回來───","目前他營中只有他的兩位部下斛律安和上官震遠在鎮守，負責保護他剛由東海所奪到手之崆峒印！","所以，郡主的意思是……？","「天下無敵，宇文太師」───\n直接與宇文太師硬碰硬為敵，這是天下最不智之事，但是呢……","宇文太師可犯了一個大大大錯───他出遠門之時，竟沒將如此重要的崆峒印隨身帶著，卻只交給自己的部下保管………","哈，我明白了────\n郡主的意思是，希望我們不妨趁著這難得的機會，去把神印奪回來？","了不起～～\n不愧是聰明的拓跋姑娘，一下子就會意了！","郡主，真感謝妳每次都幫我們很大的忙，我們很願意去試試看！","啊，真的嗎─────\n謝謝▲▲公子！","能認識你們這幾位有志一同、願意挺身和我一起阻止宇文太師野心的夥伴們，真是太好了！","請獨孤郡主別這麼說，其實該道謝的人，應該是我們才對呢！","我南下之前，表舅（隋煬帝）給了我一個太師令牌，讓我能隨時出入宇文太師軍營………也許我還可以暗中接應你們！","你們午後到長沙郡西北方攻營，我在營內一聽到你們攻進來，就設法接應你們───","嗯，我們明白了──────\n就依郡主的計劃而行吧！","謝謝各位………\n繼續久留恐啟人疑竇，那我先告辭，明日營寨裡見吧────","太好了，阿仇────\n只要崆峒印能奪回來，我們就能將它還給女王，讓她們重新恢復青春！","是呀，哈哈！\n原來卜卦所說的貴人，就是指寧珂小郡主？"],"where":[],"openedBy":[],"givenBy":[169]},{"id":171,"facts":[],"opens":[],"gives":[],"lines":["歡迎各位，請三位就座。"],"where":[],"openedBy":[],"givenBy":[170]},{"id":172,"facts":[],"opens":[],"gives":[],"lines":["歡迎各位，請三位就座。"],"where":[],"openedBy":[],"givenBy":[170]},{"id":173,"facts":[["換地圖","隋軍郡營內（地圖 200）、長沙郡隋營（地圖 256）"]],"opens":[],"gives":[],"lines":["同一時間，隋軍主營內……","啟稟斛律大人，萬靈血陣法已配置齊備，就只等明日時辰來臨。","好，明白────\n上官將軍辛苦了。","斛律大人………每次萬靈血都會奪去數萬無辜百姓生命，究竟宇文大人是為了什麼？","此點本將也不知……但宇文大人有提過：此乃為了我族千年之存續而為！","為了我族之存續……？\n難不成宇文大人想恢復被先皇禪讓（篡位）之周室（北周）宇文氏？","本將向來敬重宇文大人，是以並無多問………","但只要是宇文大人所吩咐之事，本將即便犧牲生命，也要戮力達成！","兩位將軍辛苦了！","寧珂郡主──？","兩位將軍這幾日都在忙，人家特地帶了湘山之山泉水，慰勞兩位將軍。","寧珂郡主，您好意我們心領……但我們是為了宇文大人而忙，沒理由受您慰勞。","可是……你們這幾日都不陪人家打獵玩耍，人家無聊快死了嘛！","郡主，此乃公事！\n您想要玩家家酒請找您那兩位婢女就可以了！","上官將軍，你別這樣說嘛～～","郡主，您這樣有事沒事老跟我們部隊四處跑，又要大家不時陪您玩，對我們而言十分困擾！","可是人家……人家……","真搞不懂宇文大人當初為何不向皇上拒絕，害我們得帶著這位麻煩丫頭走？","你、你太過分了啦！\n人家只是好心帶了山泉水給你們喝，你們卻～～","郡、郡主───\n獨孤郡主！","上官將軍啊………郡主可是陛下最疼愛之表甥女，宇文大人也處處讓她，你委實犯不著與她過不去。","對不起，屬下知錯───","來，郡主───\n本將來喝妳辛苦為我們帶回的山泉水……別哭別哭！","嗚……你們真的願意喝？","斛律安喝下山泉水","郡主，這不是喝了嗎？\n上官將軍要不要也喝上一杯？","我不喝───\n都幾歲了，還搞這種家家酒？"],"where":["隋軍郡營內（地圖 200）的角色（編號 18，座標 20,14）","長沙郡隋營（地圖 256）的隱藏物品（編號 173，座標 114,15）"],"openedBy":[],"givenBy":[]},{"id":174,"facts":[["換地圖","隋軍郡營內（地圖 200）、長沙郡隋營（地圖 199）"],["戰鬥","121（斛律安）"]],"opens":[],"gives":[],"lines":["同一時間，隋軍主營寨內……","啟稟斛律將軍和上官將軍，有……有敵人攻了進來───","什麼───？","這可能是與上次泰山頂之敵人相同，衝著我們萬靈血而來──","好，那就由本將親自迎戰，活逮他們徹底調查！","寧珂小郡主，此處危險，妳先回去避難吧。","那兩位將軍請自己小心哦！","上官將軍，宇文大人交託給我們保管的崆峒印就交給你來看守了，切記千萬不得有閃失！","是，屬下遵命………","阿仇，敵人主營就在前方，我們一口氣攻進去吧─────","哼───不用了！","啊，你是───────","吾乃宇文大人旗下太師府二虎將之一斛律安───這次就由本座當你們這幾些小鼠輩對手！","哼，小小鼠輩─────\n如此實力，也敢來我大隋軍營劫營？","可惡……沒想到竟然會這麼強！","說────你們到底是誰派來的？\n為何要與宇文大人處處作對？","哼……你還敢問我們為什麼？\n你自己不就是當初在魔王砦偷走我們神鼎的其中一人嗎？","魔王砦─────？\n那是什麼？","哼，你還不承認？\n當時你不是和宇文太師，以及一位老將軍，到魔王砦去…………","笑話────\n宇文大人、韓老將軍以及本將，何時去過你們什麼魔王砦了？","…………？","少說廢話────\n本將才要將你們直接拿下，問問你們這到底是怎麼一回事！","嗚────怎麼回事？\n我的頭………","全身力氣都消失了────這、這到底怎一回事？","混帳，我明白了───────\n是山泉水……剛才的山泉水有問題！","哼……少趁我之危！\n今日就先放過你們，改天體力恢復再收拾你們────","這……到底怎麼一回事？","這一定是郡主做了什麼手腳，暗中接應我們吧？"],"where":["長沙郡隋營（地圖 199）的隱藏物品（編號 174，座標 5,16）"],"openedBy":[],"givenBy":[]},{"id":175,"facts":[["戰鬥","122（上官震遠）"]],"opens":[],"gives":[],"lines":["何方盜匪，竟敢偷襲我大隋宇文太師營寨？","其實也沒什麼事………只是來找您來拿崆峒印的！","哼……這是宇文大人冒生命危險到東海所取得之不世神器───決不能讓你們得到！","可惡，竟然還有密道────\n他帶著崆峒印從這裡逃走了！","阿仇，我們立刻追上去！"],"where":[],"openedBy":[3706],"givenBy":[]},{"id":176,"facts":[],"opens":[],"gives":[177],"lines":["同一時間，祕道另一端……","宇文大人……屬下誓死也要為您護衛崆峒印！","嗚……嗚嗚……","什麼人？","郡主───？","原來是上官將軍，人家好害怕哦……","寧珂小郡主，妳不是避難去了嗎？\n怎會在這裡？","嗚……剛才人半路聽到敵人攻破軍營，嚇得躲到這裡面來……嗚……","剛才聽到了上官將軍聲音，才敢出來……嗚……","唉，妳也真是………","軍隊本就不是妳們這樣金枝玉葉小女子所該來的……郡主這下明白了吧？","人家……人家明白了……將軍請保護我離開……人家以後再也不敢跟了……嗚嗚……","好吧，別哭別哭────\n敵人很快就要追來了，妳跟在我後面走吧！","哇啊──","郡主，妳……妳為何要這樣做？","我說上官將軍啊，人之將死，就安心去吧，不需知道太多─────","嘻……崆峒印落入我們手中，這下我的宇文大人可要頭大不已吧？","此時，▲▲靖仇三人………"],"where":["軍營密道（地圖 205）的隱藏物品（編號 176，座標 31,98）"],"openedBy":[],"givenBy":[]},{"id":177,"facts":[["得失","崆峒龍印 +1"]],"opens":[],"gives":[],"lines":["郡主────","你們終於來了，▲▲公子？","郡主，這是怎麼一回事─────\n這不是剛才的將軍嗎？","是啊是啊………","剛才我經過此地，發現他因為重傷，倒地氣絕身亡了，而且手上還緊緊握著崆峒印呢！","…………","得到崆峒印","謝謝妳，郡主─────\n多虧妳幫忙，我們才能這麼順利奪到這一顆神印！","▲▲公子，那以後這只神印就交給你們了───","▲▲公子如此一來，就握有五神器中兩樣（鼎與印），足以與宇文太師勢均力敵。","獨孤姊姊少說了一樣喔！\n我們還有崑崙鏡呢！","哈哈………對對！\n我們手上應該是共有三樣神器才對，我真是的！","真是太謝謝郡主了─────\n不曉得該如何感謝妳才好。","對了，▲▲公子………\n接下來你們要去哪兒找其他幾樣神器呢？","目前還剩最後兩樣神器────既然宇文太師到南嶺去找女媧石了，我們應該是先去找伏羲琴才是。","伏羲琴在敦煌石窟，你們北上一定要經過大興（隋朝首都，即長安城），你們要不要乾脆和我一塊兒到京城去呀？","啊，去京城大興── 沒錯………形容得好。\n那接下來就委屈各位了。","古月仙人……除了我和張大哥之外，玉兒姊姊她也要擔任嗎！","她體內同時貫注了伏羲琴與女媧石之力，會造成陣法紊亂，所以由我代她擔任其中一方位。","對不起，仙人………給您添了麻煩。","別替我擔心─────\n倒是你們，可都有犧牲自己最大心願之決心了？","哈哈哈，當然─────\n小事一樁，仙人萬勿掛念。","很好────","宇文拓在上面布陣，還需一時辰才能執行………你們先休息一會兒，時辰到了我們馬上開始。"],"where":["赤貫星最核心（地圖 413）的隱藏物品（編號 528，座標 12,68）"],"openedBy":[],"givenBy":[]},{"id":529,"facts":[],"opens":[],"gives":[],"lines":["▲▲公子，接下來再次麻煩你，將伏羲琴、神農鼎和崆峒印放在它們該放的方位上。","古月仙人，我也一起過去看！","不，你的體力已瀕極限………還是慎重一點，留在此地吧。"],"where":[],"openedBy":[],"givenBy":[528]},{"id":530,"facts":[],"opens":[],"gives":[],"lines":["張兄，你對必須放棄自己最大心願一事，尚能坦然吧？","哈哈─────\n仙人，連未弱冠之李公子都能如此義無反顧，我堂堂張烈，又豈會後人？","張兄不愧是豪傑之器──────\n不過，敢問您最大心願不知為何？","晚輩最大心願嗎………？","那就是由我親手締造一個人人可安居樂業、無憂自在之太平盛世！","好一個宏大夢想，令人贊許────","對了，古月仙人………\n在入陣之前，晚輩有一要事想託付仙人，不知可否？","張兄請說……","以天數來看，之前那位李世民公子，應是中原未來之天子───","以天數推算，應是如此……但天數從來也非全然絕對之事。","古月仙人，李公子英氣煥發，氣宇不凡，但不知為何，他卻也有著逼父殺兄之相───","晚輩擔心，屆時李公子若得天下，倘若心有所私，恐將重演楊廣歷史，使暴政重現，天下蒼生將再次塗炭！","……………","晚輩此次入陣，理當失去所有關於問鼎天下之雄心壯志────","是以晚輩懇求仙人，倘若未來李公子成一代暴君，荼害生民，願仙人代晚輩挺身誅之！","好，我應承你─────","未來李世民若得天下，當他有昏暴之徵時，我將代你讓他染疾而亡………你可安心。","感謝仙人！\n既得仙人此言，那晚輩就再也沒有任何遺憾了────","唉，說實在的，這位獨孤姑娘雖然可惡，但她也相當了不起…………能夠自己一個人在異域，這樣戰至最後一刻！","張大哥，你怎麼突然又有這樣的感慨呢？","愚兄父親是突厥人，母親是漢人……愚兄尚年幼時，父親被一位漢人官吏出賣而死，母親帶著愚兄，吃盡千辛萬苦，躲至河西避難。","愚兄父親部落，也被那位官吏唆使其他部族襲擊兼併，衰弱不彰……後來愚兄年長，才由母親口中得知這些往事，因此決心替父親重振聲威。","但愚兄勢孤力單，部落也早已分崩離析──雖然最後愚兄成功殺死仇人，重振父親部落，但愚兄充分能體會獨孤郡主當時那種孤單、寂寞之感。","張大哥…………","張兄，你對必須放棄自己最大心願一事，尚能坦然吧？","哈哈─────\n仙人，連未弱冠之李公子都能如此義無反顧，我堂堂張烈，又豈會後人？","張兄不愧是豪傑之器──────\n不過，敢問您最大心願不知為何？","晚輩最大心願嗎………？","那就是由我親手締造一個人人可安居樂業、無憂自在之太平盛世！","好一個宏大夢想，令人贊許────","對了，古月仙人………\n在入陣之前，晚輩有一要事想託付仙人，不知可否？","張兄請說……","以天數來看，之前那位李世民公子，應是中原未來之天子───","以天數推算，應是如此……但天數從來也非全然絕對之事。","古月仙人，李公子英氣煥發，氣宇不凡，但不知為何，他卻也有著逼父殺兄之相───","晚輩擔心，屆時李公子若得天下，倘若心有所私，恐將重演楊廣歷史，使暴政重現，天下蒼生將再次塗炭！","……………","晚輩此次入陣，理當失去所有關於問鼎天下之雄心壯志────","是以晚輩懇求仙人，倘若未來李公子成一代暴君，荼害生民，願仙人代晚輩挺身誅之！","好，我應承你─────","未來李世民若得天下，當他有昏暴之徵時，我將代你讓他染疾而亡………你可安心。","感謝仙人！\n既得仙人此言，那晚輩就再也沒有任何遺憾了────"],"where":[],"openedBy":[],"givenBy":[528]},{"id":531,"facts":[],"opens":[],"gives":[],"lines":["小雪，妳還好吧？","我……我還好，請別替我擔心。","阿仇………進入失卻之陣的人都會失去自己的重要心願啊？","是的………我和張大哥都已經抱著這樣的決心了。","那小雪她也會……失去她自己最大的心願嗎？","古月仙人告訴我說不會………他說小雪和宇文拓都是神器轉生，只會消耗他們本身神器力量而已。","沒想到宇文太師竟是這樣一個重情義之人，真是讓我訝異啊────","玉兒姊姊沒經歷魔界降臨世界中的那一段事情，所以才會不明白宇文大哥為什麼會這麼做………"],"where":[],"openedBy":[],"givenBy":[528]},{"id":532,"facts":[],"opens":[],"gives":[],"lines":["▲▲公子，你心中現在最惦念的，是什麼事呢？","我………我自己也說不上來！","其實我好擔心師父的事情……但現在最擔心的，卻是小雪她是否能夠平安無事撐過去………","嗯，我能明白你的感受………","在進入失卻之陣的剎那，它會去找尋你心中真正最惦記之事，然後加以吞噬………就算你努力想自我隱瞞，也是無濟於事。","古月仙人………若被它吞噬了我最惦記之事，我會變得怎麼樣？","如果你最惦記的是你師父…………你會永遠忘記你師父這個人，失去過去與他相處之點點滴滴───永遠成為一個陌生人。","如果你最惦記的是小雪姑娘，情況也是相同，只是───","萬一小雪姑娘不幸變回女媧石，你就連與她重新來過的可能也失去……她將永遠自你生命中消失。","宇文拓感謝仙人成全…………","不必客氣………這就算是我對於你一路來辛苦之小小嘉許吧！","你們三人立刻去中央支柱那兒阻止破壞支柱之人，千萬別讓這次封印大事因此功敗垂成──────"],"where":[],"openedBy":[],"givenBy":[528]},{"id":533,"facts":[["得失","伏羲玉琴 -1"]],"opens":[],"gives":[],"lines":[],"where":["海中建木（地圖 432）的隱藏物品（編號 533，座標 13,32）"],"openedBy":[],"givenBy":[]},{"id":534,"facts":[["得失","神農銅鼎 -1"]],"opens":[],"gives":[],"lines":[],"where":["海中建木（地圖 432）的隱藏物品（編號 534，座標 25,31）"],"openedBy":[],"givenBy":[]},{"id":535,"facts":[["得失","崆峒龍印 -1"]],"opens":[],"gives":[],"lines":[],"where":["海中建木（地圖 432）的隱藏物品（編號 535，座標 24,26）"],"openedBy":[],"givenBy":[]},{"id":536,"facts":[["戰鬥","251（獨孤寧珂）"]],"opens":[],"gives":[537],"lines":["古月仙人，神器都已擺放好了，我們要準備開始了嗎？","正好半時辰也過去了………那就請擔任核心神器的小雪姑娘先進陣中，其他人半時辰之後再入陣。","那我們其他人呢？","小雪姑娘的核心神器力量，須先提早半時辰推動失卻之陣，之後其他的人再行入陣。","小雪……但願妳能平安順利撐過去。","哇啊───","寧珂郡主─────？\n妳……妳還活著？","▲▲公子，您怎麼這麼說………？\n我一直都活得好好的呀！","反倒是你和張大哥是怎麼了？\n為什麼竟然幫起可惡的宇文太師和小雪實現野心，列起九五之陣來？","快，你們立刻阻止她────\n我來替宇文拓療傷！","▲▲公子，這到底是怎麼一回事───","獨孤寧珂………別再耍花招了！\n我們已知道所有真相了，不會再受到妳的欺騙！","我們是伙伴呀，你……你怎麼竟然幫起宇文太師他來對付我了？","獨孤郡主────\n請妳別再演戲了，妳先看看我是誰？","拓跋姑娘────？\n妳……妳不是被宇文太師和小雪姑娘殺死了嗎？","寧珂郡主，真相我們早都清楚了──\n我們信任妳，妳竟利用我們和宇文大哥相爭，最後還親手殺死玉兒姊姊！","我………我………","我們才剛由魔界降臨後之世界好不容易回返此一時點───妳是西方魔界派來之女魔將，自己坦白承認吧！","啊呀呀………真傷腦筋！\n看來你們似乎都已明白事情究竟是怎一回事了，是不是？","好………既然如此，那我就承認吧！\n我的確是西方魔界之王所派來之女魔將，拓跋姑娘也是我親手殺死的！","而且妳這卑鄙的傢伙，還想嫁禍給小雪───光是這一點，我就不能原諒妳！","真遺憾………我本以為天衣無縫，沒想到竟還是被你們發現真相！","我的工作，就是阻止討厭的宇 挑，\n你們絕對不准插手────","是是是────\n我都快想找洞鑽了，何況是出手？","不行不行，那我不打啦～～～～\n只有女娃兒一個，我老程可打不下！","可、可是，你如果不打，\n我的鼎……我的鼎不就………","哈哈～～～～\n那這樣好了，我也下來參戰，你們三個小朋友也全一起下來，這公平吧？","哈哈，你們勝啦～～～～","秦大哥……程大哥……","你們這……根本就是放我們的水嘛！","有什麼關係？\n不過切磋切磋武藝而已呀。","哈哈哈～～～～","既然你們贏了，那個鼎就讓你們帶走吧！","這……實在是很不好意思！","不必掛意啦，我程爺一向敢說敢當，哈哈～～～～","對不起，程大哥────","幹嘛？\n怎突然道歉起來？","其實……本來我來此之前，一直擔心程大哥打輸了，一定會耍賴，拼命抵死不還──不料原來程大哥還得如此爽快！","哈哈～～～～","妳一個女娃兒都如此講信用，我老程怎能賴皮啊？","再說……\n妳這小娃兒也真是太有自信了，怎知我老程一定會輸妳呢？","哈哈───程大哥！\n之前我真是好多地方對您失禮了，對不起，請您原諒。","好說，好說。","秦大哥、程大哥────\n真是謝謝你們的相讓……我們差不多也該告辭，希望大家還有機會見面。","哈哈，後會一定有期～～～～","對啦～～～\n神氣的小妮子，妳自己可也要多保重呀────","誰是神氣的小妮子啊？"],"where":[],"openedBy":[],"givenBy":[2130]},{"id":2133,"facts":[],"opens":[],"gives":[],"lines":["程大哥，你怎麼會想要歸降官軍？","啊，那是秦大哥來說服我的。","他說，他目前在一位叫張須陀的大將手下做事，這位張將軍非常正直，值得去跟隨，於是老子就洗手歸降了！","哦………","上次你們來，見到我與秦大哥在山下客店談事情，就是他以朋友的身份，來勸說我金盆洗手啦！","秦大哥說，再過幾天，張將軍就要帶我們去東都，圍剿那兒一處叫瓦崗寨（翟讓．李密）之盜匪集團。","有機會的話，也許我們在洛陽那兒還會再見面吧？"],"where":[],"openedBy":[],"givenBy":[2132]},{"id":2134,"facts":[],"opens":[],"gives":[],"lines":["秦大哥，當今朝廷這麼腐敗，你們為何還會想替他們征討可憐的百姓呢？","嗯，好問題──\n你這問題，倒問中了我秦瓊心中多年之心事！","朝廷無道，但它畢竟仍代表秩序──\n許多土匪殺人如麻，其實比起朝廷而言，還更加殘忍數十倍！","張大人對那些因朝廷苛政而被迫造反的老百姓，總會盡量招安………就像我們這一次對程老弟這樣！","不過，對那些兇殘不仁的盜匪，張大人就毫不留情圍剿───","因為只有如此，我們才算真正盡到保護生民百姓之職責。","原來如此………","很多事，都須由大處著眼……\n光只憑表象就遽下結論，那是非常危險的。","以我觀之，當今朝廷之上，只有張須陀將軍、楊義臣大人，以及宇文拓太師這幾人，算是能讓我秦瓊由衷心服口服之人────","咦，宇文太師不是一個殘暴的野心家嗎？","殘暴的野心家────？\n不……就我所知，宇文太師並不是你們傳聞中的那個樣子。","………？"],"where":[],"openedBy":[],"givenBy":[2132]},{"id":2135,"facts":[],"opens":[],"gives":[],"lines":["玉兒姊姊，神鼎找回了，煉給公山師伯的藥也煉好了，妳要不要先把神鼎帶回北方去？","呃……那你們接下來打算去哪兒？","我的話，自然是先回雷夏澤去，把丹藥交給公山師伯，等他復原了，再請他到伏魔山去救師父呀。","那妳呢，小雪？","………我？","我……我已經沒地方可以去了，所以▲▲哥哥他要去哪兒，我就只有跟著他走。","好，既然你們兩個在一起，那事情就好辦多了───","什麼事情好辦了？","我還欠你與小雪各一次人情───所以我暫時繼續陪你們一道旅行，直到你師父平安脫險，我再回北方去。","等一下─────\n什麼時候妳欠我們的人情了，怎麼我都不記得？","笨蛋────\n上次龍舟上，你和小雪兩人，不是一起來冒死救我出去的嗎？","啊，原來是這件事呀？\n我早都已經忘記了………","……你們忘記了？","是啊，拓跋姊姊────因為那真的沒什麼呀！","我知道玉兒姊姊心裡一定非常期待早一天將神鼎帶回去………所以龍舟的事，真的就別太掛在心上。","不行不行，你這是什麼鬼話？","從小到大，爹爹就一直教我做人要有恩必報………讓我欠著你們一個人情在，那我拓跋玉兒會一輩子心裡都有牽絆！","但是………","不要再但是、可是的了────\n你是男孩子對不對，怎麼如此的優柔寡斷？","總之，讓我好好還你們一報，我再回北方去，這不就成了？","好吧、好吧～～～\n要還人家的恩情，還要這麼兇………妳這麼想跟的話，那就跟吧。","我哪裡非常想跟，我只是────","拓跋姊姊，真是太好了────","太好什麼？","因為……這樣子拓跋姊姊就還可以再繼續跟我們一起旅行呀！","我剛才真的好擔心，拓跋姊姊妳會不會就這樣，永遠就回北方去了………","你看你看，還是人家小雪多有人情味兒………你多學著點吧，王子大人！","求求妳………不要每次都叫我王子大人好不好？"],"where":["魔王砦（地圖 94）的隱藏物品（編號 2135，座標 29,26）"],"openedBy":[],"givenBy":[]},{"id":2136,"facts":[["換地圖","公山小屋（地圖 32）"]],"opens":[],"gives":[],"lines":["咦……怎麼沒有人？"],"where":["雷夏澤（地圖 31）的隱藏物品（編號 2136，座標 27,21）"],"openedBy":[],"givenBy":[]},{"id":2137,"facts":[],"opens":[],"gives":[],"lines":["風恬浪靜好湖畔，長空白雲伴歌聲；釣杆一彎仙鶴鄉，管他人間雨還晴？","十年蒼蒼老臣心，不若五湖一葉舟。高歌一壺新釀酒，醉抱青山不必歸。","老先生，請問您一下……您曉得公山先生他們一家人到哪去了嗎？","你是說公山鐵嗎？他已病故了……","病故………？\n這、這怎麼可能？什麼時候的事──","啊，已有一段不短之時日了。","這……怎會這樣子？那師父、師父他怎麼辦呢？","你師父怎麼了？","我師父……在伏魔山被一隻叫饕餮的魔物給困住了……只有公山師伯能救他！","哦，饕餮啊……？\n確實也只有公山兄昔日之功力，能夠勉力壓制住牠了……","小朋友啊，你別太沮喪……天底下的事不能預料者多，而不如人意者更多──","你先讓自己平心靜氣一下，再冷靜想想，或許天無絕人之路，會有其他什麼好法子浮現吧？","▲▲哥哥………","對不起，都是我不好────\n都是因我堅持要去魔王砦找程大哥挑戰，所以才耽誤到你的事………","對了，老伯、老伯────","老伯，請問您知道公山師伯他的夫人，現今人在哪兒？","他和孫女一起，好像到大梁去了，但詳細地點老夫也不知。","謝謝您，這樣就很足夠了────也許師伯母知道其他什麼方法，我要去問她。","太好了！","那我們立刻趕往大梁，找你那位師伯母吧！","小朋友，凡是看開一點吧……天底下的事本來就是不可預測者多，而不如意者更多。","像老夫的一位收養多年之義子，生性正直，老夫本來對他多所期待，不料他如今身在廟堂，竟助紂為虐起來！","他不勸諫皇上好好修德愛民，卻投皇上所好，慫恿皇上蓋什麼勞民傷財之通天高塔……真叫老夫慨嘆不已！","十年蒼蒼老臣心，不若五湖一葉舟。高歌一壺新釀酒，醉抱青山不必歸。","風恬浪靜好湖畔，長空白雲伴歌聲；釣杆一彎仙鶴鄉，管他人間雨還晴？"],"where":["雷夏澤（地圖 31）的角色（編號 53，座標 6,32）"],"openedBy":[],"givenBy":[]},{"id":2138,"facts":[],"opens":[],"gives":[2139],"lines":["咦，你不是公山先生的孫女嗎？","啊───！\n你不是半個月前，來找爺爺和奶奶的那一個大哥哥嗎？","太好了！\n請問妳奶奶，她人也在大梁城嗎？","在呀！\n爺爺過世以後，奶奶就帶我來這裡住的。","你們要找她嗎？我帶你們去。"],"where":["大梁城（地圖 68）的角色（編號 2138，座標 20,47）"],"openedBy":[],"givenBy":[]},{"id":2139,"facts":[],"opens":[],"gives":[],"lines":["啊，原來是你呀，孩子！","師伯母，對不起……我回來晚了！","我已知公山師伯過世的事了，真抱歉沒能早一日帶回解藥，治好師伯之劍傷………","唉，傻孩子，別這麼說…………\n生死有命，何況你一定也盡了力，不是嗎？","阿鐵他這一生任俠仗義，富貴不移，活得有聲有色、無愧於心……他是含笑而走的。","師伯母，師伯真是了不起的人！","可不是嗎？\n阿鐵臨終之前，還一直惦記著你和你師父的事呢。","而且……他還留有一封遺書，說是要給你的！","遺書────？","嗯，我怕弄失了，所以一直都帶在身上，你拿去看看吧………","▲▲靖仇得到遺書","字很潦草，這應該是師伯臨終前費力所寫的……我把它唸出來給大家聽。","靖仇賢姪：\n老夫近日身軀遽衰，體內黃金劍氣奔騰不已，恐無以久待至汝歸來，將有愧於汝之殷殷期待也………","饕餮魔獸妖其力甚強，天下能敵之者甚寡矣───吾為汝思，憶起世上尚有能敵饕餮之一人者，汝師有救矣！","東海之上，自古傳有一世外仙島，其上有一仙人，道法、醫術均深不可測───汝若能尋此仙人，央其出手，則更勝老夫之千百倍。","倘若汝師幸而得救，請務必告之曰：切勿與那宇文小廝敵對，誠然以卵擊石，犧牲不值───誡之，誡之！\n公山鐵絕筆","▲▲哥哥……\n你在唸著什麼呀，我怎完全聽不懂？","意思我大致明白──────\n師伯是要我們出東海去找一位仙人，央請他來救師父，對吧？","嗯……正是如此。","但阿鐵也擔心……此一傳聞是我倆師父二十年前告知之事────時移事變，滄海桑田，你們出海是否真能遇著仙人，也不無疑問。","師伯母，能救師父的方法，目前也只剩這一個最後的法子了───不管怎麼說，我都要試試看！","唉……你這孩子……那就自己千萬保重了。","▲▲哥哥！\n原來我們要航行出大海是不是？\n那我們正好就有船呀！","……船？","嗯，師伯母，我們自官軍奪來的一艘運河運輸船。","不成、不成─────\n你們肯定從沒出過大海吧？","大海波濤驚人，不比河川湖泊………一般河船，可無法在大海上行走的！","真的？\n那我們該怎麼辦呢？","大梁城內有一趙姓工匠，昔日曾造渡海東征高麗之海船……你可去拜託他為你改造船隻。","好主意────\n那師伯母，我們立刻出發去找那一位工匠。","靖仇，你這孩子………若你師父知你為了救他，如此盡心費力，那十六年前錐心刺骨之喪孫之痛，必也可得到不少安慰了。","你師伯臨死的前幾日，來了一位意外之訪客。","那位訪客，是我夫妻倆人從未謀面之鬼谷道術同門師兄………他得知你師伯被宇文太師所重傷，特地前來，希望能治好你師伯之傷。","無奈，宇文太師遺留之劍傷實在太可怕了………他再三盡力之後，仍無能為力，於是便誠懇向阿鐵以及老身致歉───","直到此時，我們才曉得──原來他正是昔日朝廷赫赫有名之太僕卿，也正是那宇文太師之養父，名叫楊義臣！","楊義臣是當今朝廷少數忠直之士，去年帶兵平亂，功績卓著，但最後卻為朝廷小人嫉妒，遭讒而被免官。","他雖失了官，仍寄望他尚留朝中、自己向來器重之養子能代他發揮棟樑本色，不料────","他那養子宇文太師，最近一反往昔，竟也慫恿起皇帝，在洛陽蓋什麼通天之塔，勞民傷財、禍國殃民，讓他非常之失望！","他痛心之餘，便在你師伯過世後，向老身借了雷夏澤那兒之草蘆，垂釣隱居，自此再也不問世事……"],"where":[],"openedBy":[],"givenBy":[2138]},{"id":2140,"facts":[["換地圖","大梁港（地圖 67）"],["得失","金錢 -400"]],"opens":[],"gives":[],"lines":["這幾年我動不動被徵去造龍舟，要不就是去東萊，打造出海討伐高麗之軍船。","老百姓都吃不飽了，那些昏官們還要我們龍舟造得比以前豪華，真是他媽的豈有此理～～～","對不起，您是會改造出海船隻的趙姓工匠嗎？","是啊，\n我就是。","我們想麻煩您為我們改造船隻，以便能出海航行，不知行嗎？","這有何難────一共需要四百兩，你要改造嗎？\n〔要〕／〔不要〕","改造船隻花費不便宜，你們可能得先籌足銀兩。","我們想麻煩您為我們改造船隻，以便能出海航行，不知行嗎？","這有何難────一共需要四百兩，你要改造嗎？\n〔要〕／〔不要〕","好，銀兩我收下了，請把你們的船開到大梁港。","好，我們會把船開到大梁港停泊。","三天後，你們就可以來取船了。","三日後，大梁港………","好了，船隻我已改造完畢，隨時都可以出海了。","太謝謝您了！","海上波濤大，航行十分危險，你們務必小心為是。","海上波濤大，航行十分危險，你們務必小心為是。"],"where":["船匠家（地圖 74）的角色（編號 2140，座標 29,17）"],"openedBy":[],"givenBy":[]},{"id":2141,"facts":[["換地圖","船尾甲板（地圖 526）、江北地區（地圖 15）、甲板（地圖 108）"]],"opens":[],"gives":[113,2142,2143],"lines":["現在是打算：\n〔上船逛逛〕\n〔出發到海上尋仙〕","嘩，這就是大海呀────\n第一次看到！","嗯，我也是第一次！\n真沒想到大海這麼寬闊，幾乎看不到邊際───","大海……它好美哦！\n藍得像……像……\n像……","我又有靈感了哦，小雪妳聽好──","青海亙天寬無盡，\n彤雲高展闊我心；\n千丈紅塵美如 ","盤古神憐憫他們遭遇，於是賜予他們力量，並將自己昔日坐騎巨海也賜給他們，我們就從那時起就永遠定居大海之中。","哦………\n原來還有這麼一段往事呀？","其實我們來東海，是想找一位傳說中之仙人，只是沒想到半路竟會被你們巨海給吞進肚子來。","找仙人─────？\n你說的，可是仙山島的那一位仙人？","呃，我也不知道他叫什麼名字………\n您知道關於他的事嗎？","嗯……多少知道一點。\n來，請到我們的宮殿，我慢慢告訴你們吧。"],"where":["魚肚內（地圖 119）的隱藏物品（編號 2147，座標 50,23）"],"openedBy":[],"givenBy":[]},{"id":2148,"facts":[],"opens":[],"gives":[2149],"lines":["嘩────\n妳們的宮殿好美，而且你們這裡的人看起來都好年輕！","不，我們並非真的很年輕………\n而是我們能永遠維持在自己年輕時之樣貌，青春不老。","青春不老………？","七百年前，一位雲遊劍俠，藉著大海中一樣上古神器之力，讓我們氐人族每人都能活至兩百歲高齡，並至死保持年輕美貌，不會老去。","嘩，真的啊？\n能永遠都不會變老，這樣真好───","哈哈～～～～\n小雪好像很感興趣呢，是不是也想青春不老呀？","沒、沒有啦！\n人家只是有點……稍微有點……羨慕她們……而已啦。","唉………年輕美貌又有何用？\n當生命都不保之時，這些東西不過是些全無意義之物罷了。","生命不保───？","是的……其實我們部族，正面臨一個生死攸關的威脅，死去不少族人了。","什麼樣的威脅，是疾病嗎……？","不，是黑龍王………東海中之霸王！","黑龍王那傢伙聽說只要吃我們氐人族的人，就可藉我們青春不老生命力，來替自己延年益壽─────","但由於我們氐人族向來住在大大小小鯨魚內，不易獵捕────黑龍王索性化身為原形，直接吞吃鯨魚，讓我們死傷慘重！","豈有此理，真是太過分了────\n世上竟然有如此自私的傢伙？","那黑龍王雖然老邁，我們仍非他對手………如今族人已被他吞食近三分之一，依然束手無策！","被吃了三分之一？！","是的……\n他今日甚至還妄想襲擊巨海，溫順的巨海被嚇醒上浮，一不小心，就把各位給吞了進來！","哦，原來是這麼一回事────\n總算都明白了。","三位，我這裡有一個冒昧之請，不知你們是否願意答應？","我剛才見你們三位身手不凡，所以，想懇求你們三位，去為我們擊敗黑龍王，好拯救我們之危機────","您說什麼────？！","求求你們───\n只要你們幾位答應，我願意帶各位去仙山島，找尋你們要找的仙人！","等一下，為什麼突然…………","仙山島位於仙人界之桃源仙境中，不是凡人隨便就能找到的───只有像巨海這樣的神獸，才能接近它那兒！","呃……這個……","求求你們！","喂，阿仇，你到底猶豫什麼──？\n人家都遭到存亡的危機，你還袖手旁觀，良心上怎過得去？","呃，我……當然是過不去……\n可是……","我也希望打抱不平，但是萬一我們不敵人家黑龍王，反而觸怒了他───這豈不是讓女王她們反而更加危險了嗎？","各位，請別擔心────\n只要三位願意嘗試看看，不管將來黑龍王怎報復我們，所有責任都由我一個人承擔！","喂，王子大人，趕快做決定好不好？","▲▲哥哥，女王陛下都已經這樣說了，我們是不是應該……","好吧，那我就接受了！\n我們三個去替您試試看擊敗那位黑龍王吧。","謝謝，真是太感謝你們了！\n這一下我們氐人族的命運，終於有救了────","我去吩咐子民們為各位準備上好鯨魚………城中有不少好物品，三位不妨先行逛逛。"],"where":["氐人皇宮（地圖 125）的隱藏物品（編號 2148，座標 35,39）"],"openedBy":[],"givenBy":[]},{"id":2149,"facts":[["換地圖","東海海底（地圖 128）"]],"opens":[],"gives":[2153,2150,3545,3546,3547,3548,3549,3550,3551,3552,3553,3554,3555,3556,3557,3558,3559,3560,3561,3562],"lines":["三位，你們準備好要出發了嗎？\n〔１　還沒有〕\n〔２　已經準備好了〕","對不起，還沒有呢……我們還要再多準備一些東西再出發。","嗯，都準備好了，我們已經隨時都可以出發了！","啊，太好了！","黑龍王他一向住在深海的龍宮中，你們若是要過去他那兒，必須坐這一隻小鯨魚去。","嘩，好可愛的小鯨魚哦！","這兩位小姑娘也會隨你們一塊兒走，替你們操縱這隻魚。","玉兒姊姊，妳在想什麼？","女王大人，我們真的要……坐 facts":[],"opens":[],"gives":[],"lines":["我的夫君和兒子三年前\n就跟隨朝廷的軍隊去東\n征了，到了現在還沒有\n返回，真希望他們不會\n有什麼意外才好……","夫人您放心吧！\n他們吉人天相，\n不會有事的！","希望他們能早日\n回來，我一定煮\n一頓豐盛的迎接\n他們！"],"where":["東萊民房（地圖 353）的角色（編號 4186，座標 20,11）"],"openedBy":[],"givenBy":[]},{"id":4191,"facts":[],"opens":[],"gives":[],"lines":["我們氐人族因為以\n前受到了一位仙人\n施過法術，所以可\n保青春永駐。","都是因為你們這些\n地上人！都是因為\n你們！我本來可以\n永保青春的啊～～"],"where":["氐人國（地圖 120）的角色（編號 4191，座標 58,49）"],"openedBy":[],"givenBy":[]},{"id":4192,"facts":[],"opens":[],"gives":[],"lines":["聽說以前給予我們\n奇特力量的仙人現\n在住在仙山島上，\n不過，只有女王才\n知道正確的位置。","算了，我也不怪你們，\n反正我已經活了七十幾\n歲了，會變回這個樣子\n也是理所當然。","從前年輕了那麼久，\n我也該知足了…"],"where":["氐人國（地圖 120）的角色（編號 4192，座標 59,19）"],"openedBy":[],"givenBy":[]},{"id":4193,"facts":[],"opens":[],"gives":[],"lines":["生活在這個美麗的\n海底多好，才不像\n你們地上人，只會\n打打殺殺的，真是\n野蠻。","你們這些地上人不只\n打打殺殺，還害的我們氐人族變成今天這\n樣，你們要如何對的\n起我們啊！"],"where":["氐人國（地圖 120）的角色（編號 4193，座標 36,24）"],"openedBy":[],"givenBy":[]},{"id":4194,"facts":[],"opens":[],"gives":[],"lines":["聽說地上人現在\n生活在亂世中，\n是真的嗎？","想不到除了地上\n有亂世，這次連\n我們也被牽連，\n我可不想再見到\n你們了！"],"where":["氐人國（地圖 120）的角色（編號 4194，座標 25,36）"],"openedBy":[],"givenBy":[]},{"id":4195,"facts":[],"opens":[],"gives":[],"lines":["幾年前從東海來了\n一個黑龍王，時常\n侵擾我們族人，所\n以我們現在也是生\n活的非常不安。","你們雖然打倒了黑龍王，\n但為什麼要取下崆峒龍印呢？\n事情變成這個樣子，我看\n你們還是快走吧！"],"where":["氐人民房（地圖 121）的角色（編號 4195，座標 20,23）"],"openedBy":[],"givenBy":[]},{"id":4196,"facts":[],"opens":[],"gives":[],"lines":["我們平常都以鯨魚\n作為交通工具，因\n為這是天地之間最\n溫馴的動物啊！","雖然我還年輕，沒有\n變老，不過你們卻害\n我的族人變成這樣，\n我討厭你們！"],"where":["氐人民房（地圖 122）的角色（編號 4196，座標 19,20）"],"openedBy":[],"givenBy":[]},{"id":4197,"facts":[],"opens":[],"gives":[],"lines":["我們氐人族的皇宮\n不錯吧？比起地上\n人的破皇宮要好的\n太多了！瞧！珍珠\n珊瑚垂手可得。","三位大俠，求求\n你們為我們消滅\n可惡的黑龍王！","可惡啊！要是我還有\n那年輕身體的話，一\n定不會放過你們的！","女王為了大家，到深海去尋找其它恢復年輕的方法。"],"where":["氐人皇宮（地圖 125）的角色（編號 4197，座標 34,40）"],"openedBy":[],"givenBy":[]},{"id":4198,"facts":[],"opens":[],"gives":[],"lines":["我們女王可是無所\n不知，你若是有什\n麼問題，她一定有\n辦法替你解答的。","來！看我們女王\n如何懲罰你們！"],"where":["氐人皇宮（地圖 125）的角色（編號 4198，座標 46,40）"],"openedBy":[],"givenBy":[]},{"id":4199,"facts":[],"opens":[],"gives":[],"lines":["這裡是女王的房間，\n女王喜歡樸素，所以\n裡面並沒有你想像的\n華麗。","三位大俠，我的父\n母姊妹，都被那個\n黑龍王給吞了……\n請三位大俠一定要\n替她們報仇！","聽族人們說我們變\n老是你們害的，為\n什麼呢？我看你們\n不像是壞人啊！"],"where":["氐人皇宮（地圖 125）的角色（編號 4199，座標 17,37）"],"openedBy":[],"givenBy":[]},{"id":4200,"facts":[],"opens":[],"gives":[],"lines":["我已經好久沒有見\n到地上人了耶～看\n到你們，又覺得好\n奇怪喔！","啊……女王犧牲了她自己\n的青春，勉強維持了我們\n不至於老死，但是我們變\n老了，這樣和死去不是一\n樣嗎？","咦，\n你變回原來的樣子啦，恭喜你啦。","既然你能變回原來漂亮的樣子，我相信我們也可以。","姑娘，你的傷好了，我們可就安心了。","真羨慕你變回原來漂亮的樣子。","說真的，生為女人，誰不愛漂亮呢。","呼．．．還好，不然我族可要抱憾終生了。","現在發現變老也沒甚麼，家人們不受生命威脅就好。","算了，生老病死是必經的過程，我想有一天我也會變老。","算了，生老病死是必經的過程，我想有一天我也會變老。","最近有個水牛逃到龍宮那，就躲在龍宮的祕道裡。","前一陣子不曉得發生甚麼事，龍宮那打鬥的好兇。","這一陣子，我們也習慣變老的模樣。","不曉得仙人能不能幫我們變回漂亮的樣子。","真希望還能永遠不老。"],"where":["氐人皇宮（地圖 125）的角色（編號 4200，座標 62,37）"],"openedBy":[],"givenBy":[]},{"id":4201,"facts":[],"opens":[],"gives":[],"lines":["我最喜歡美人兒，不過一些美人都送去陪皇帝了，真是可惜。","喲，兄台身旁有美人相伴，您真是豔福不淺喲。","這人怎麼這樣......","這位兄台，您可不可以讓您身旁的美人，陪我喝兩杯。","▲▲哥哥！","這位大哥，\n請你尊重點。","哦...\n捨不得就算了，何必這樣說呢。","放尊重點，\n不然我就不客氣了。","好兇的美人，\n是是是，\n小生這廂有禮了。","哼!!"],"where":["長沙郡（地圖 193）的角色（編號 4201，座標 45,43）"],"openedBy":[],"givenBy":[]},{"id":4202,"facts":[],"opens":[],"gives":[],"lines":["這一帶是古代雲夢大澤，所以四處都是湖。","雲夢澤有許多神話，像巫山神女與楚王的故事就發生在這一帶。"],"where":["長沙郡（地圖 193）的角色（編號 4202，座標 15,79）"],"openedBy":[],"givenBy":[]},{"id":4203,"facts":[],"opens":[],"gives":[],"lines":["我們都靠洞庭湖補魚與灌概為生，湖水也極少氾濫，生活富足。","前一陣子謠傳要把湖圈起來蓋離宮，幸好是謠言，差點把我們嚇壞了。"],"where":["長沙郡（地圖 193）的角色（編號 4203，座標 29,47）"],"openedBy":[],"givenBy":[]},{"id":4204,"facts":[],"opens":[],"gives":[],"lines":["築龍舟，蓋離宮，皇室有那麼多錢嗎？","不夠的話，還不是要加稅，苦的還是小老百姓。","我已經老了，也許看不到隋室的下場。","年輕人，\n睜大眼好好看皇帝的下場吧。"],"where":["長沙郡（地圖 193）的角色（編號 4204，座標 49,40）"],"openedBy":[],"givenBy":[]},{"id":4205,"facts":[],"opens":[],"gives":[],"lines":["小雄，我們去軍營冒險好不好。","別開玩笑了，小心被那些壞軍官打一頓。","小雄說的也對，那些軍官好兇喔。"],"where":["長沙郡（地圖 193）的角色（編號 4205，座標 42,4）"],"openedBy":[],"givenBy":[]},{"id":4206,"facts":[],"opens":[],"gives":[],"lines":["我前一陣子好奇跑到軍營那，被那些軍官臭罵一頓。","我只是看一下下而已，差點被抓起來打。","好在那些軍隊只是暫時住在西北方，要是長住 ":[],"lines":["小兄弟，\n你有煩惱嗎？","人都會有煩惱吧？","那麼，是什麼煩惱呢？\n可以說給我聽嗎？","呃，這個………","哈哈哈……凡夫俗子，\n還是無憂忘慮才好啊～","千里秋水一瞬間，\n天地獨我樂神仙；\n莫問紅塵煩惱事，\n逍遙走遍天外天。","難道…真有人可以沒煩惱的嗎？\n在這個亂世之中………"],"where":["天外村（地圖 157）的角色（編號 4252，座標 75,40）"],"openedBy":[],"givenBy":[]},{"id":4253,"facts":[],"opens":[],"gives":[],"lines":["大哥哥，\n你有喜歡的人嗎？","……為…\n為什麼問這個？","哎呀…因為，\n喜歡就要快快說出來啊！","不然，\n就會跟那隻狐狸一樣……","狐狸？…","初見佳人如琦夢一路風塵竟是空有緣無份結髮情依依不捨斷腸時","……喜歡的人……"],"where":["天外村（地圖 157）的角色（編號 4253，座標 48,18）"],"openedBy":[],"givenBy":[]},{"id":4254,"facts":[],"opens":[],"gives":[],"lines":[],"where":["天外村（地圖 157）的角色（編號 4254，座標 38,67）"],"openedBy":[],"givenBy":[]},{"id":4255,"facts":[],"opens":[],"gives":[],"lines":["你好，真高興可以見到你。","因為你是這一次的英雄，我好羨慕你喔。","她在說甚麼呀.........","天門兄!!\n這天外村真好玩，希望以後也會有這樣的地方。","希望不只是這個世界能讓我們出現，其它的世界也可以。","除了仙界，人界之外，還有其它的世界？"],"where":["天外村（地圖 157）的角色（編號 4255，座標 105,68）"],"openedBy":[],"givenBy":[]},{"id":4256,"facts":[],"opens":[],"gives":[],"lines":["雖然我只是一個小人物，可是我好喜歡阿仇你們這些英雄耶。","謝謝你的誇獎，我都有點不好意思。","不過我也很喜歡素素他們喔....","素素...素素又是誰呀。","貓貓呀，我們出現在這裡會不會讓人眼紅呀。","一定會，我們會被人嫉妒死。","不過我最希望在其它的地方也能出現耶。","他們在說甚麼呀......聽都聽不懂。"],"where":["天外村（地圖 157）的角色（編號 4256，座標 102,68）"],"openedBy":[],"givenBy":[]},{"id":4257,"facts":[],"opens":[],"gives":[],"lines":[],"where":["天外村（地圖 157）的角色（編號 4257，座標 5,47）"],"openedBy":[],"givenBy":[]},{"id":4258,"facts":[],"opens":[],"gives":[],"lines":["ㄟ..小耕，\n別那麼頹廢好不好。","不是頹廢，見到了何然跟古月聖，沒見到江如紅，有些遺憾。","你不說我還沒想到，江如紅到那去了。","沒想到何然也成仙了，可是江如紅到那去了。","說真的，\n他們家的阿如還真像江如紅。"],"where":["天外村（地圖 157）的角色（編號 4258，座標 41,67）"],"openedBy":[],"givenBy":[]},{"id":4259,"facts":[["得失","符紙鶴 +1"]],"opens":[],"gives":[],"lines":["得到符紙鶴"],"where":["迷路海（地圖 532）的隱藏物品（編號 4259，座標 67,20）"],"openedBy":[],"givenBy":[]},{"id":4260,"facts":[["得失","符紙鶴 +1"]],"opens":[],"gives":[],"lines":["得到符紙鶴"],"where":["迷路海（地圖 534）的隱藏物品（編號 4260，座標 31,20）"],"openedBy":[],"givenBy":[]},{"id":4263,"facts":[],"opens":[],"gives":[],"lines":["狐妹呀，\n那兩隻蝴蝶看起來很快樂的樣子。","獨眼兄，\n你又不是蝴蝶，怎知蝴蝶很快樂呢？","你又不是我，怎麼知道我不知蝴蝶快不快樂。","我覺得我們每次抬槓，有幾分像莊先生跟惠先生抬槓的樣子 李世民能文能武，又禮賢下士。","最重要的是二公子不念舊惡，只要真心投奔他，他都會重用。","像李靖早年與唐國公結仇，二公子不但重用他，還化解他跟唐國公的仇怨。","您說，像這樣的人，自然能得到天下英雄敬重。","這下我該怎麼辦呢。","原來人望也可以培養的。","是呀，唐國公的威望可是越來越高了。","這二公子真不簡單。","有機會應當會會二公子。"],"where":["太原城（地圖 514）的角色（編號 4303，座標 30,25）"],"openedBy":[],"givenBy":[]},{"id":4304,"facts":[],"opens":[],"gives":[],"lines":["太原城的規模雖然比不上大興，洛陽等歷代名城，但也是西北方的大城。","若有需要甚麼，到城外的商肆採買，應該就夠了。","李二公子相當好客，若是急需留宿太原，可借他的書房住。"],"where":["太原城（地圖 514）的角色（編號 4304，座標 39,30）"],"openedBy":[],"givenBy":[]},{"id":4305,"facts":[],"opens":[],"gives":[],"lines":["這太原城雖然不大，但是治安倒是蠻好的。","哦....\n怎麼說？","我跟我的兄弟壓鏢到這一帶，倒沒有官兵欺壓人。","鏢局不是只須提防盜匪的嗎？","話是這麼說，但身在亂世，亂兵可比盜匪可怕。","我們幾個鏢局兄弟想在此逗留一陣子，好好想想未來。","我們正考慮還是以保鏢為生，還是加入唐軍，好好闖番功勳。"],"where":["太原城（地圖 514）的角色（編號 4305，座標 46,40）"],"openedBy":[],"givenBy":[]},{"id":4306,"facts":[["得失","天蠶絲帶 -1、天蠶絲衣 -1、泥蚣袍 +1"]],"opens":[],"gives":[],"lines":["來吆，不管你是要蜀郡的綢緞或是巴州的錦幛，我這都有賣。","現在這麼亂，你這怎麼會有蜀緞巴錦。","我們太原城在唐國公李淵大人的治裡下，太平的很。","尤其二公子李世民能文能武，胸襟廣闊，許多英雄來投奔他。","你說，這怎麼會有盜賊，自然各地商人都願意到我們這來。","我生平有個小遺憾，賣布這麼多年，沒能為自已留一套天蠶裝或是烏蠶裝。","您要是有整套的天蠶裝或是烏蠶裝，我願以厚禮交換。","公子您有整套的天蠶裝或是烏蠶裝願跟小女子交換嗎？","〔都沒有〕\n〔有天蠶裝〕\n〔有烏蠶裝〕\n〔兩種都有〕","真可惜，\n兩種都沒有。","如果您那天搜集到了，記得跟小女子交換。","我這有天蠶絲帶，天蠶絲衣。","太好了，我這有泥蚣袍送給您。","多謝。","我才要感謝您呀。","我這有烏蠶手套，330"],"where":["太原城（地圖 514）的角色（編號 4306，座標 3,25）"],"openedBy":[],"givenBy":[]},{"id":4307,"facts":[["得失","七情束 +1"]],"opens":[],"gives":[],"lines":["真謝謝您讓我得償宿願。","真可惜沒機會見到軒轅菜刀呀。","客倌來看看吧，我這有不少珍奇異貨。","說實在的，也只有這太原城，能讓我們這些胡商安心作生意。","在中原作生意這麼多年，倒也看過不少奇珍異寶。","但是有些珍寶一生都沒見到過，不免有些遺憾。","如軒轅黃帝下廚所用的軒轅菜刀，我就沒看到過。","若有人能借我欣賞軒轅菜刀，我願厚禮相贈。","我正好有軒轅菜刀。","真的....\n是傳說中的軒轅菜刀。","真是太感謝您了，我這有份薄禮相贈。","得到七情束","多謝。","真可惜，我也沒見過這柄刀。","真是可惜呀。"],"where":["太原城（地圖 514）的角色（編號 4307，座標 56,37）"],"openedBy":[],"givenBy":[]},{"id":4308,"facts":[],"opens":[],"gives":[],"lines":["大運河，貫南北，揚帆遊玩幾時回。","阿摩鼠，下凡間，白巾一方綑回天。"],"where":["太原城（地圖 514）的角色（編號 4308，座標 35,24）"],"openedBy":[],"givenBy":[]},{"id":4309,"facts":[],"opens":[],"gives":[],"lines":["楊花落，李花開，唐軍一到笑呵呵！","唐軍到，亂兵逃，天下百姓樂陶陶。"],"where":["太原城（地圖 514）的角色（編號 4309，座標 32,24）"],"openedBy":[],"giv "師伯會被官軍打敗？\n師伯的道術，不是比師父還更厲害？","是啊……\n你師伯的鬼谷道術實力，可以說是當今世上最強的了，但是──","不幸他所遇到的對手，並不是一般尋常的將領，而是朝廷來的宇文太師！","宇文太師？","是的────\n那宇文太師實力遠比你師伯更強，你師伯被他重創，勉強逃了回來，從此再沒康復………","真是不敢相信……天底下竟然還有這麼厲害的人？","宇文太師他是當今朝廷的國師，身上擁有一把可怕的黃金劍，一人就可以瞬間擊殺千萬之敵人────","過去只要是由他出手鎮壓之民亂，從沒一次不是立刻被平定───許多人甚至一聽宇文太師之名，馬上不戰自潰！","這麼可怕……？","你師伯的傷，就是當時中了這位宇文太師一劍，至今體內之劍氣還無法驅散───","那……師伯母剛才說的解救方法是？","那把傷了你師伯的可怕之劍，據聞是中原上古神器之一，所以若要消除它的劍氣，也需上古神器的力量───","其他的上古神器────？","若能找到傳說中炎帝昔日煉藥之神農鼎，以它所煉之藥給你師伯服用，就能順利將黃金劍氣驅散────","原來如此，那有什麼難的────\n那個什麼鼎，現在哪兒？","唉……這也就是你師伯最不願讓你冒險之處啊───因為那個鼎現在據說在那宇文太師手上！","什麼───！","不過，這只是傳聞………","師伯母之前為了救你師伯，就只查到這些消息………後來因你師伯病重，師伯母返回照顧他，再沒機會深入去查了。","好，師伯母───我決定了！\n我要得到那個鼎！","師伯仗義而行，才受了重傷，我很希望能替師伯治好病───何況師伯病好了才能去救師父啊。","孩子……\n說實在的，師伯母是又希望你去，又不希望你去啊───","師伯母不必擔心，我已經決定了。","好……孩子，那師伯母把自己知道的事，全告訴你吧。","你此趟可先去北方，找原本保管這神鼎之鮮卑拓拔部落，確認神農鼎是否真如傳聞被宇文太師奪走。","北方鮮卑的拓拔部落嗎………\n嗯，我明白了。","倘若，真的是那宇文太師奪走了神農鼎，那千萬不要與他以命相搏───不然師伯母可無顏面面對你師伯、師父！","我明白了，師伯母放心────\n我會自己斟酌的。","師伯母，我們走了！","啊，孩子……這些給你們吧？","得到往拓拔部落地圖與藥方","神農鼎甚重，你們找到後不必將它帶回，只須用它煉出此帖所載之藥，帶回給你師伯即可。","謝謝師伯母！\n那我們告辭了，師伯母請保重！","唉……你師伯為人非常有正義感，從年輕時就與我一起行俠仗義、濟弱扶傾───","這次若非為了救那些為暴政折磨的百姓，也不會被那宇文狗賊傷成這樣！","神農鼎本來是中原的上古神器之一，在晉亂（五胡亂華）時流落北方，最後被鮮卑人（北魏）世世代代奉為鎮國之寶………","後來高氏篡魏（東魏），北魏元家的忠臣將它帶往北方，不讓高家之人取得，自此神農鼎就一直都在北方草原上────"],"where":[],"openedBy":[203],"givenBy":[]},{"id":4699,"facts":[],"opens":[],"gives":[],"lines":["你們是誰，不可以隨便進屋去。"],"where":[],"openedBy":[204],"givenBy":[]},{"id":4700,"facts":[["得失","不老之泉水 +1"]],"opens":[],"gives":[],"lines":["小妹妹，\n請問這裡就是雷夏澤嗎？","我是公山先生的師姪，來找他老人家的。","這裡就是雷夏澤，爺爺就在屋裡……","你們進屋後，\n先問問奶奶，\n看爺爺見不見你們。","小雪，我們進去找師伯吧。","謝謝你，小妹妹。","進屋後，先問問奶奶，\n看爺爺見不見你們。","大哥哥，\n我們來玩個小遊戲好不好？\n〔好〕／〔不好〕","對不起，我還有急事要辦，改天再玩吧。","好，你要記得改天跟我玩喔。","甚麼樣的小遊戲呢？","這是個猜數字的遊戲，我先跟你說遊戲規則。","我會從０～９中選四個不重覆的數字，讓你來猜。","如果你猜的數字中，有一個位置正確的，我會說１陽。","如果有一個你猜的數字對，但是位置不正確的，我會說１陰。","這樣反覆讓你猜，如果是４陽，你完全猜中了，我會送你一樣小禮物。","遊戲規則告訴你了，你確定要玩嗎？\n〔要玩〕／〔放棄〕","聽起來似乎有點難，改天有空再找你玩吧。","對不起，我還有事要辦，改天再玩吧。","好，你要記得改天跟我玩喔。","大哥哥，你現在要跟我玩猜數字遊戲嘛？\n〔是〕／〔不是〕","你要再聽一次遊戲規則，還是開始猜了\n〔聽規則〕／〔開始猜〕","我會從０～９中選四個不重覆的數字，讓你來猜。","如果你猜的數字中，有一個位置正確的， 宇文拓已天下無敵，恐怕仙界也再沒幾人能與之抗衡了─────","難道……難道我們就真的完全束手無策了？","是的────\n你也不須為了報仇而去他那兒送死，去了不過白白送命罷了。","可惡………真是好可惡！","你也別太沮喪───────\n趁著這段時間，做些你真正想做之事吧，好好把握當下。","我已將你朋友裝入玲瓏水晶棺中，你不妨將她裝入你那只煉妖壺中，帶她回故鄉去吧。","古月仙人，求求您告訴我………真的沒任何法子可以讓拓跋姊姊復活嗎？","人死不能復生，此是天下至理───\n我醫術再高明，也只能醫治活人，斷無讓死去之人復生的道理。","不過，傳說在天上界中，有一處叫伏羲宮殿的地方，裡頭藏有一天女白玉輪之陣，能讓死去之人復活───","真的嗎，仙人────","你先別太高興，聽我慢慢說完。","這個陣乃太古時代，伏羲、女媧愛女死去之時，他倆為了讓她復活而設計的───它同時需要伏羲琴和女媧石兩樣上古神器！","仙人，我願意冒任何危險，去為玉兒姊姊奪取伏羲琴和女媧石───請您告訴我，要如何才能去伏羲宮殿？","說起來，這伏羲宮殿，並不是一般常人所能到達的！","它位於一顆長星在天際劃出之穹蒼裂痕上───那兒是結界的裂縫，是空間與時光的不連續接續地帶，伏羲宮殿就在那兒！","只是那兒屬於天上界，若想到達那裂痕處，還需有「鐘劍斧壺塔」五樣上古神器才行─────","「鐘劍斧壺塔」────\n就是另外五樣上古神器嗎？","是的，但這五樣上古神器中之鐘已幻化為人………你們再怎麼找，恐也很難找齊，來通往天上界了。","是嗎…………\n怎會這樣呢？"],"where":[],"openedBy":[],"givenBy":[5302]},{"id":5306,"facts":[],"opens":[],"gives":[],"lines":["非常遺憾，這一次沒能替你治好妳的同伴…………","但她本就命中注定喪命桃源仙境……你就當作這一段多出來之時光，是上天贈與你與她的寶貴禮物吧？"],"where":[],"openedBy":[],"givenBy":[5305,5307]},{"id":5307,"facts":[],"opens":[],"gives":[5306,5308,439,436,437,438],"lines":["古月仙人，我和玉兒姊姊回去了……","很遺憾沒能幫得上你忙，請自己多多節哀了。","對了，你該不會還想去找那宇文拓報仇吧？","不………\n我明白自己根本不是他對手，我已經放棄了。","師父和我朋友獨孤郡主，他們都還留在大興………","我要回那兒向師父和郡主道歉，然後帶玉兒姊姊回她故鄉，不想再管其他之事了。","這樣也好………可別讓憂愁太啃蝕了自己。"],"where":[],"openedBy":[],"givenBy":[5303]},{"id":5308,"facts":[],"opens":[],"gives":[],"lines":["小朋友啊，我知道你很難過，但一直難過也不是辦法！","你去做一些自己真正想做的事，這樣就不會老一直停在消沈中。"],"where":[],"openedBy":[],"givenBy":[5305,5307]},{"id":5309,"facts":[],"opens":[],"gives":[],"lines":["三爺覺得這一帶不太平靜，把族人遷居到長安以北、太原那一帶去了。"],"where":[],"openedBy":[],"givenBy":[5303]},{"id":5311,"facts":[],"opens":[],"gives":[5313],"lines":["李大哥──────","啊，▲▲賢弟，真高興又見到你！","這一位是我師父，陳輔先生！","陳老伯，您好！","你好，李公子氣宇非凡，果真人中之龍啊。","哪兒的話，老伯過獎了。","▲▲賢弟，我已叫僕役信函交給了東都一帶之人，相信那兒的人絕對不會讓宇文太師太好過。","謝謝你，李大哥！","其實你今日來得巧─────\n我朋友說，有一位氣宇非凡之豪傑，正好今日前來太原想與我見面！","氣宇非凡的豪傑？","是的，正如上次所說，為兄想邀賢弟一道兒過去………那就請賢弟到寒舍一行吧。"],"where":[],"openedBy":[],"givenBy":[444]},{"id":5312,"facts":[],"opens":[],"gives":[],"lines":["公子說要去等朋友，怎麼還沒回來呢。","李二公子氣宇不凡，喜歡結交天下豪傑，又與兄長相善，真是不可多得之人！"],"where":["唐國公府（地圖 260）的角色（編號 5312，座標 39,59）"],"opene 麼最後真相會是這樣？","糟了，師父他還留在通天塔────","來不及了，▲▲小兄弟─────\n別費這個力了！","愚兄昨日到附近高地查看過………\n魔界由通天塔上空而降，那一帶早已淪為魔界之地，無人倖存。","什麼，我不相信─────"],"where":[],"openedBy":[],"givenBy":[5375]},{"id":5377,"facts":[],"opens":[],"gives":[],"lines":["▲▲小兄弟啊………\n我娘子月兒和異姓兄弟李靖夫妻他們人都在洛陽，愚兄昨日也曾想去找他們！","但目前放眼望去，紅色的魔界早已吞食我們整片江山，愚兄最後也只有面對現實，承認自己有心無力………","張大哥，我們到仙山島去─────","仙山島………？","那裡的古月仙人或然翁老仙人，也許曉得有什麼法子可以挽救目前這個局面────","仙人？\n沒想到▲▲小兄弟連仙人也認識？","不管怎麼說，錯誤是我造成的──\n我要去試試看能不能做些什麼，來彌補或挽回！","嗯，說得好──────\n▲▲小兄弟！","愚兄也有一份責任在，若果真能有什麼挽回或補救之法，即使要付出任何代價，愚兄也心甘情願。","▲▲哥哥，我想起來了……\n宇文拓大人曾告訴我，魔界有傳送陣可通至仙界，說若封印失敗、魔界降臨了，叫我可以經由那裡逃到仙界。","太好了────\n那我們就去找找那些傳送陣吧！"],"where":[],"openedBy":[],"givenBy":[5376]},{"id":5378,"facts":[],"opens":[],"gives":[],"lines":["大哥哥，大姊姊！你們的世界怎麼被西方的魔界闖了進來呢，好可怕！"],"where":["然翁居（地圖 151）的角色（編號 5378，座標 21,42）"],"openedBy":[],"givenBy":[]},{"id":5379,"facts":[],"opens":[],"gives":[5380,5382,5381],"lines":["小朋友啊，神州那兒發生什麼事了？\n怎麼竟給西方的魔界給入侵了───","對不起，說起來都是我的錯！\n事情經過是這樣的……","▲▲靖仇把所有經過告訴然翁","喔……原來如此，那可真是不得了的事情。","老夫記得上古時代，也曾發生一次神州與魔界之戰………","戰役之後，中原諸神為防止魔界再度入侵，於是在九州四方，布了神州九天結界───","神州九天結界的力量，能讓西方魔族再無法進入神州之內。","可是仙人………\n這次西方的魔王在結界還沒劃開前，就派了他手下的女魔將獨孤姑娘，成功進入中原地區了呀！","不………神州九天結界的力量很強大的，別小看它！","你說的那位女魔將，如想進入中原地區，除非先轉世為凡人，再用自己的雙腳自西方慢慢走過來………","否則就只有在中原內找個軀體附身一途了！","轉世或附身………？","如轉世的話，她會失去原本的所有記憶和力量，對她而言十分危險………所以她該是以附身的方式吧？","但即便是附身，神州九天結界仍會限制她原本所擁有之強大力量───","在神州土地上，她最多只能施展一些簡單之妖法，沒錯吧？","啊……難怪寧珂郡主每次攻擊，都只能使出一些小型的閃電招術！","瞧瞧，老夫說得多準！","神州九天結界其自古以來，一直如此默默地保護神州人民………但它也是有它弱點的。","最早，天界諸神為神州的百姓列下神州九天結界時，是在兩次天狗蝕月之間，趁一顆叫白貫之長星劃過天際之際所完成的──────","所以反過來，當兩次天狗蝕日之間，天際被另一顆叫赤貫之長星劃過時，由於二力互相拉扯，神州九天結界會因而產生一道裂痕！","兩次天狗蝕日和赤貫貫穿天際───\n這不就是最近的事？","是的，原本這是很罕見之事，也許幾萬年才遇一遭………但真的不巧，你們這時代偏偏就是不幸遇到了這樣的天象！","宇文大人他曉得這件事，所以一年之前就開始四處尋找上古神器，打算把赤貫所劃過的裂痕封補起來！","可是他卻被我們阻撓而功虧一簣──我們真是莫大罪人了！","老仙人，我們能夠做什麼來改變目前的狀況，讓世界恢復原狀嗎？","這老夫就不知該如何處理了…………\n也許古月仙人他會曉得，你們不妨去問問他。","請問古月仙人他現在人在哪裡？","他說他今日去莫支灘走走……\n你們去那裡找找他吧！"],"where":[],"openedBy":[],"givenBy":[5251]},{"id":5380,"facts":[],"opens":[],"gives":[],"lines":["人非聖賢，孰能無過………\n老夫年輕時也犯了很類似之大錯，當年也差點讓世界毀滅！","所以你們不必太自責，只要全心去想想如何把問題彌補，這才最是重要。"],"where":[],"openedBy":[],"givenBy":[5379]},{"id":5381,"facts":[],"opens":[],"gives":[],"lines":["古月仙人跑去海灘那兒，說要去仔細觀察你們那兒發生之事！"],"where":[],"openedBy":[],"givenBy":[5379]},{"id":5382,"facts":[],"opens":[],"gives":[5384],"lines":["古月仙人………！","我知道你們此來是為了什麼事………\n是神州結界被西方魔界打開之事？","是的………","▲▲靖仇把詳情告訴古月仙人","我明白了…………\n說起來，這也不能算是你們的錯。","古月仙人，我真的很抱歉為世界帶來這樣的災難………我能做些什麼來彌補嗎？","魔界都降臨了，神州結界也已破裂，這個時點做什麼，都已來不及……","敢問仙人，難道這個世界，就真的已無可救藥了嗎？","也並非沒有………目前有兩個選擇，是你們可以努力的方向！","其一，目前結界裂痕開得並非十分之大，對方主魔界還無法穿越，相信對方一定也仍在努力擴大裂痕當中──","你們可以到神州結界裂痕正下方的一座高塔上去，把塔上的六顆血珠徹底破壞掉，就能阻止主魔界的降臨！","古月仙人，那第二個方法呢？","第二個方法是治本之道………先去找到琴鼎印鏡石五樣上古神器，把赤貫星劃出之結界裂痕重新完封起來。","可是古月仙人………\n您剛才也說魔界已經降臨了，結界已經破裂，現在封印已來不及了啊！","不錯………\n在這時點上，結界早已破了，即使你們收集齊琴鼎印鏡石五樣上古神器，對大局也是無濟於事！","但是，我要藉著宇文拓本身的崑崙鏡力量，讓大家回到過去赤貫尚未劃出結界裂痕之前────在那一時點，去封印赤貫星！","回到過去─────？","是的………\n崑崙鏡擁有穿梭時間之能力，回到過去把問題徹底解決，這是最好的解決方式。\n仙界有一些和魔界相通的傳送點，你們可以利用哪些傳送點去找宇文拓。","太謝謝您了，古月仙人─────\n我們這就立刻去辦！"],"where":[],"openedBy":[],"givenBy":[5379]},{"id":5383,"facts":[["得失","軒轅劍 -1"]],"opens":[],"gives":[],"lines":["等一下………\n軒轅劍如今是否在你們的手上？","是的，古月仙人！\n它在我們這裡！","不知道為什麼，在我們逃出通天塔之後，這把劍就失去光輝，完全無法發揮它本來力量………","因為它的力量被魔界的六芒結界暫時壓制住，所以自然無法發揮原本之神器力量。","但是，此劍本身仍擁有無窮之力，我擔憂若你們不慎讓魔界之人奪走它拿去使用，恐天下再無敵手！","啊，古月仙人，我們可以麻煩您替我們保管一下這一把劍嗎？","當然好，我本就是此意。","將軒轅劍交給古月仙人","謝謝仙人，那我們出發了！"],"where":["莫支灘（地圖 559）的隱藏物品（編號 5383，座標 43,22）"],"openedBy":[],"givenBy":[]},{"id":5384,"facts":[],"opens":[],"gives":[],"lines":["中原上古神器共有十樣，分別是東皇鐘、軒轅劍、盤古斧、煉妖壺、昊天塔、伏羲琴、神農鼎、崆峒印、崑崙鏡、女媧石。","其中之鐘、劍、塔都曾化為人形，但因某個事件，劍和塔再度失去力量而化為原形────","目前東皇鐘雖仍維持人之形態，但除了少數人之外，沒人知曉如今她在何方。","要封印赤貫星所劃出的結界裂痕，只有抵達赤貫核心去執行失卻之陣，如此才能成功。","但要通往赤貫，需先以鐘劍斧壺塔五神器執行虛空之陣，才能打開由人間穿越神州結界的「虛空之路」，抵達位於天上界的赤貫星！","不幸的是，東皇鐘如今不知飄泊至何方，「虛空之陣」五神器再怎麼樣，也無法集齊了──────","那位魔界來的女魔將，不知是怎麼刺穿神州結界，讓西方魔界長驅直入、直接降臨神州大地的………我一直十分好奇。","古月仙人，我不明白您的意思……難道不是赤貫劃過了天際，然後天空就裂開了嗎？","不，應該要這樣說吧─────\n光是天狗蝕日以及赤貫劃過天際，神州結界只會產生裂痕而已，倒不至於馬上就裂開來。","這裂痕就好像雞蛋殼上出現之裂痕，蛋殼雖未破，但也變得十分脆弱，只要有人在它上頭一戳，就馬上輕易破碎………這裂痕就叫天之痕。","但跟據我這幾日觀察，西方魔界在天狗蝕日之後，當場就直接降臨而下……","這表示神州結界當時不只是出現裂痕而已，而是當場就被人給刺穿了！","被人刺穿…………？","是的，那位女魔將不知使用什麼樣的方法，趁著神州結界產生裂痕同時，當場狠狠給它一擊，當下就把結界擊裂───────","此外還有其他地方我也不明白───\n就是宇文拓究竟是找到什麼方法，來代替原本需要虛空之陣才能辦到之「虛空之路」通往天上界？"],"where":[],"openedBy":[],"givenBy":[5382]},{"id":5385,"facts":[["戰鬥","200（單小小）"]],"opens":[],"gives":[],"lines":["哈哈，▲▲公子，我們真有緣，竟然又再次見面了！","妳是……\n單小小姑娘？","叮咚～～～～\n▲▲公子答對了！","其實我和嫣紅是被寧珂小姐降服的中原妖魔，我是千年琵琶精，而嫣紅她千年狐狸精！","小小姑娘，今日我們是要來奪取神農鼎，如果可以，希望我們能不必兵戎相見！","郡主吩咐過，在她的主子降臨前，要好好守護所有上古神器！","除非你們打敗我，否則休想從這裡帶走神農鼎！"],"where":["螫魂塔（地圖 294）的隱藏物品（編號 5385，座標 42,27）"],"openedBy":[],"givenBy":[]},{"id":5386,"facts":[["得失","神農銅鼎 +1"]],"opens":[],"gives":[5392],"lines":["得到神農鼎"],"where":["螫魂塔（地圖 294）的角色（編號 5386，座標 20,28）"],"openedBy":[],"givenBy":[]},{"id":5387,"facts":[["戰鬥","193（尉遲嫣紅）"]],"opens":[],"gives":[],"lines":["你竟然還活著呀，▲▲公子？","妳是……\n尉遲嫣紅？","沒錯………但我如今的身份，是寧珂大人手下的女魔將！","順便告訴你們吧……我是千年狐狸精，擁有化身能力！","當初在魔王砦偷走神農鼎，以及裝成寧珂大人，好讓你去太師府和宇文拓衝突，都是我的傑作！","妳───","大王的主魔界七天之後即將降臨，這個世界是我們的了！"],"where":["殤魂塔（地圖 418）的隱藏物品（編號 5387，座標 43,24）"],"openedBy":[],"givenBy":[]},{"id":5388,"facts":[["得失","崆峒龍印 +1"]],"opens":[],"gives":[],"lines":["得到崆峒印"],"where":["殤魂塔（地圖 418）的角色（編號 5388，座標 64,24）"],"openedBy":[],"givenBy":[]},{"id":5392,"facts":[],"opens":[],"gives":[],"lines":["哈哈～～\n這不是▲▲靖仇小兄弟嗎？","啊，程大哥────────\n您平安無事？","哈哈，老子武功如此高強，當然還活著………少把你程大哥看得那麼扁！","太好了，程大哥和秦大哥───\n我以為所有的人都已經被這些妖魔殺死和吃掉了！","不，其實也差不多………\n這附近一帶可幾乎快沒活著的人呢！","突然之間，世界就變成這樣……\n妖魔活動的範圍越來越廣，倖存的人也越來越少！","是呀是呀，老子總算還懂得一點點武術，給他好不容易殺了幾隻妖魔，終於殘存下來………","目前老子和秦大哥四處尋找到一些其他的倖存者，大家組織了一個反抗隊伍………今天我們是來堪察敵人大本營的！","太好了，程大哥與秦大哥───\n能夠又看到你們，我真的好高興！","對啦……上次那個拿著長刀、神氣的小姑娘呢？","玉兒姊姊她………已經不在人世了。","▲▲靖仇把玉兒之事情告知眾人","哦……那娃兒也真是情義中人，死得轟轟烈烈！","秦大哥、程大哥，其實我們已經知道有一個方法，能"],"where":["通天塔（地圖 394）的角色（編號 5391，座標 7,56）","通天塔（地圖 394）的角色（編號 5392，座標 31,56）"],"openedBy":[],"givenBy":[5386]},{"id":5393,"facts":[],"opens":[],"gives":[],"lines":["大哥哥，大姊姊！你們大家真是好辛苦哦～～～"],"where":["然翁居大廳（地圖 152）的角色（編號 5393，座標 16,20）"],"openedBy":[],"givenBy":[]},{"id":5394,"facts":[],"opens":[],"gives":[5395],"lines":["哦，你們回來了？","古月仙人、然翁老仙人─────\n我們已找到了神農鼎和崆峒印！","最後一樣神器以及宇文拓，應該都在通天塔內………","但通天塔下有一道妖火保護著，我們無法接近，所以想請教仙人究竟該如何做。","哦，什麼顏色的妖火？","我想想………\n感覺上跟萬靈血的六芒星陣的火光顏色挺像的！","那是由西方魔法所造出之魔界妖火，不易破解───我看我就直接走一遭吧！","真的嗎？\n謝謝古月仙人──────","我離開的這段時間，我負責看守的那隻魔物，就麻煩你代替我注意一下。","有何問題？\n你儘管放心吧！","好，那我們就出發前往通天塔吧！","加油吧，祝你們一路順利！"],"where":[],"openedBy":[],"givenBy":[]},{"id":5395,"facts":[],"opens":[],"gives":[5397,5398,5399,5400],"lines":["秦大哥、程大哥─────","哈哈，▲▲賢弟────────\n沒想到在這種地方，還能遇見你！","李大哥，你也平安沒事？","喔，沒想到你也認識這位李世民小老弟呀？","李世民是我們反抗組織中，年紀最小但也最有為之一位！","是啊～～～～～\n所以秦大哥最近把大本營全交給他帶料，帶著我安心出來，找尋其他的倖存者。","呵呵……真是英雄出少年！\n再度幸會了，李兄弟。","那接下來，就麻煩古月仙人幫我們消滅這妖火了。","以古月仙人之名，魔界妖火退卻──","喔喔，好厲害………這青衣書生是誰呀？","魔界妖火已熄────────\n接下來，大家最主要工作，是最短時間內，找出最後神器伏羲琴，以及救出宇文拓！","為節省時間，搶在主魔界降臨之前完成，我們兵分三路───▲▲公子負責找宇文拓，其他人負責找伏羲琴，大家到塔頂取齊，明白了嗎？","那仙人您呢？","我直接去塔頂去布失卻之陣………\n因失卻之陣需一個時辰之布陣時間，並非隨時馬上能進行。","明白了，全依這位仙人之吩咐！"],"where":["通天塔（地圖 394）的角色（編號 5394，座標 29,54）","通天塔（地圖 394）的角色（編號 5395，座標 9,54）"],"openedBy":[],"givenBy":[5394]},{"id":5396,"facts":[],"opens":[],"gives":[5410],"lines":["宇文拓………？","我來把這繭化開─────","你們是…………？","我是之前一直處處與你作對，還偷襲砍斷你手臂的那位▲▲靖仇────","今日特地來救你出去的！","▲▲靖仇…………？\n啊，就是小雪姑娘那位伙伴？","是的，我們已經知道所有事情真相，懇請你原諒！","是嗎……你們都知道了？","但我失敗了………\n神州結界已裂……如今可能……做什麼都來不及了………","還來得及的，請你放心────","我們去請教過仙人，仙人說只要藉著你的崑崙鏡力量，回到魔界降臨前之過去，重新把神州結界封補，那就行了！","對呀……我自己崑崙鏡主要力量就是穿梭時光，何以沒想到還有這法……咳……咳咳………","宇文大人，您體力都被剛才血繭吸收了，您別太激動。","謝謝妳………小雪姑娘！","可是要回過去，還是得琴鼎印鏡石五樣上古神器，列出「失卻之陣」才能辦到───那些神器都被獨孤寧珂她奪走了！","宇文大哥別擔心，崆峒印和神農鼎我們都已奪回了，伏羲琴大家也正在找尋中，五神器馬上全到齊！","謝謝你們……如今我體力盡失，不能多做什麼，其他事就全拜託你們了！","都怪我們愚昧………說來實在愧悔難當！","請別這樣說………楊素師父十五年前臨終時，把赤貫之事告訴我，我也是疑信參半──","去年年尾，赤貫於天際現身，我才真正決心耗損大量元神，以自己崑崙鏡之預視能力去弄清此事────","結果……我見到西方魔界穿過神州結界，降臨神州大地───全如師父所說！","我明白事態嚴重………此後我就再也不管隋家天下安危什麼的，轉而全心尋找上古神器，只想阻止這場危機。","我們過去一直誤會你是為了自己野心才去奪取神器的，所以處處作對！","你們是被獨孤寧珂利用了………說起來，連我自己也是一樣，從頭到尾都被她算計得團團轉！","呃，連你也被她所騙………？","▲▲哥哥，張大哥………我們先讓宇文大人休息一下吧，等他體力恢復了，我們再趕到塔頂。"],"where":["通天塔內（地圖 584）的角色（編號 8，座標 47,22）"],"openedBy":[],"givenBy":[]},{"id":5397,"facts":[],"opens":[],"gives":[],"lines":["哈哈，小老弟，你知道嗎………？\n回到過去之後，老子最大的願望就是好好開宴痛快大吃一頓～～～"],"where":[],"openedBy":[],"givenBy":[5395]},{"id":5398,"facts":[],"opens":[],"gives":[],"lines":["真希望這場人間浩劫，能就此順利了結………這可比人間任何功名利祿都更讓我如今覺得值得珍惜！"],"where":[],"openedBy":[],"givenBy":[5395]},{"id":5399,"facts":[],"opens":[],"gives":[],"lines":["▲▲賢弟………這次浩劫，讓我最敬愛之父親與大哥都被這妖魔給殺害了，讓我好悲痛！","如果真能順利回到過去，我最大之心願，就是更加孝順父親，友愛大哥，好好珍惜天下再沒更寶貴的親情。","李大哥，我相信你既然有這一番心，他們一定很高興。"],"where":[],"openedBy":[],"givenBy":[5395]},{"id":5400,"facts":[],"opens":[],"gives":[5403,5404,5401,5402,5406],"lines":["仙人，這次真的很謝謝您！","我原本一直以為，琴鼎印鏡石排列出來的，是能夠讓我復國的九五之陣。","世上根本沒有什麼九五之陣，只有虛空之陣和失卻之陣。","虛空之陣和失卻之陣是上古諸神們，利用中原神器的特殊力量，所設計出之兩套特殊陣法───","它主要是利用神器之間彼此不同的排列方式來構成………如果以琴鼎印鏡石來說────","將這五樣神器收集齊全，隨著核心神器的不同，同樣是失卻之陣，就可展現全然不同的五種效果！","五種不同效果………？","如以伏羲琴為核心的失卻之陣，就能達到操控人心之作用，至於其他四樣的神器───────","以神農鼎為核心，就能煉化仙藥，\n以崆峒印為核心，就能不老不死，\n以崑崙鏡為核心，就能穿越時間，\n以女媧石為核心，就能重生結界。","我們等一下要返回過去時光，就是要以崑崙鏡為核心……","至於若是要封印天之痕，就要以女媧石為核心。","找到宇文拓了嘛？","還沒有耶!!","那快點去找到他，時間不多了。","古月仙人─────","你們也順利找到宇文拓了？","不止不止────\n還遇上了那一個獨孤寧珂，順道一起也把她也消滅了！","我們剛才遵仙人吩咐，費好大氣力才把六顆血珠都破壞了，沒想到你們幾位竟然更了不起，連元凶都消滅了！","哈哈哈，小兄弟～～～\n伏羲琴老子也給找到了，大家都做得不錯嘛───","好……那我們接下來，就開始最重要的神器布陣工作！","請小雪姑娘站到小圈內，宇文拓站在中央圈子中。","請▲▲公子將另外兩樣神器，放在剩下的兩個小圈子內，如此「失卻之陣」即會開始運轉，此過程至少需半時辰左右──────","我來觀察適當之天時………其他人先休息片刻，我待會有重要之事，要向各位宣布。"],"where":[],"openedBy":[],"givenBy":[5395]},{"id":5401,"facts":[],"opens":[],"gives":[],"lines":["▲▲哥哥，我覺得……也許獨孤姊姊是壞人，可是剛才她死去前的眼神好悲哀哦！"],"where":[],"openedBy":[],"givenBy":[5400]},{"id":5402,"facts":[],"opens":[],"gives":[],"lines":["哈哈哈，天下豪傑何其多，不料今日因了人間的患難，竟然同心協力齊聚一堂！"],"where":[],"openedBy":[],"givenBy":[5400]},{"id":5403,"facts":[["得失","崆峒龍印 -1"]],"opens":[],"gives":[],"lines":[],"where":[],"openedBy":[],"givenBy":[5400]},{"id":5404,"facts":[["得失","神農銅鼎 -1"]],"opens":[],"gives":[],"lines":[],"where":[],"openedBy":[],"givenBy":[5400]},{"id":5406,"facts":[["換地圖","通天塔頂（地圖 283）"],["得失","軒轅劍 +1"]],"opens":[],"gives":[454,455,456,457,452,451,453],"lines":["郡主，也許妳還手的話，還有機會可逃走的，妳真是太傻了───！","好了………\n時辰差不多了，我們差不多要開始進行失卻之陣了，請大家仔細聽我的解釋。","要完成失卻之陣，需要在場的各位做某種重大之犧牲………所以我須先徵詢各位之同意！","犧牲……？\n是犧牲生命嗎？","不……不是犧牲生命，是比生命還更寶貴之犧牲！","失卻之陣之所以有此名，原因正由於在它列陣之時，除了核心神器之外，四神器各需一名凡人來擔任所謂的「護守者」────","護守者？","是的………擔任護守者之人，當他進入此陣之剎那，會永遠失去他心中對於自己最大願望的所有記憶或心性，來提供此陣所需之力量─────","仙人，您的意思是說……\n若要執行失卻之陣的人，就等於他必須永遠失去自己最大之願望，是這樣子嗎？","是的，正是如此………！","此乃極重大之犧牲，所以我想徵詢在場各位，是否有人願意？","哈哈哈，這有什麼問題？\n如今整個人間都變成這樣了，就由我李世民來當第一位自願者吧───","哈哈哈～～\n李公子這般年少，都能如此地爽快答應，那就容在下張烈屈居第二名！","仙人，我也願意────","不用說，老子也一份────","很好………大家不必如此爭先恐後！","等一會，我們需要連續進行兩次不同的失卻之陣────","其一就在此地，為了讓各位能返回過去時點，另一在赤貫星上，為的是封印天之痕！","所以我想第一次的列陣，就先由李、秦、程三位朋友來負責吧！","謝謝仙人，樂意之至─────","仙人，那在下呢？","別急………赤貫星上，還有許多需要您來協助之處！","好，我們該開始了…………\n請各位按我吩咐之方位，至陣內一一站定吧！","好，失卻之陣啟動，我們返回魔界降臨之前────","啊，這裡不是原來的通天塔頂嗎？","嗯───\n我們已回到過去的時間了，這是赤貫即將把天空劃開前的時點……","很抱歉，我目前的體力只能送大家到這裡………","謝謝你，這就很足夠了………\n等一下我來幫你恢復一些體力吧。","李大哥、秦大哥、程大哥他們為什麼都消失不見了？","他們都回到當初在此一個時點時，他們原來的所在之處去了───","當然……也同時失去了他們原本自己所最惦念之事的所有回憶！","…………","接下來，我須替宇文拓他恢復一下體力，預防他會體力不支………就先麻煩你幫我把軒轅劍，插在六芒星陣的中央，並把其它神器收起來吧。","得到軒轅劍"],"where":[],"openedBy":[],"givenBy":[5400]},{"id":5410,"facts":[["換地圖","通天塔內（地圖 576）"],["戰鬥","215（獨孤寧珂）"]],"opens":[],"gives":[],"lines":["剛才宇文兄提到了被獨孤姑娘所誑騙算計，請問究竟是怎一回事？","想要把結界裂痕彌縫起來，需要前往天上界的赤貫核心，在那兒執行「失卻之陣」才能竟功！","可是要通往天上界，需要鐘劍斧壺塔這五樣神器才行………","不幸我再怎麼找，除了本來就有的軒轅劍之外，最重要的鐘怎麼也下落不明！","我正在無計可施時，獨孤郡主她主動來向我建議說：","她曉得一些西方魔法能夠替代這些失蹤之神器………她的方法叫做「巴別之路」。","巴別之路………？","她方法是以大地六芒星代替東皇鐘，\n天狗蝕日代替盤古斧────","萬靈血代替煉妖壺，通天塔代替昊天塔───最後再加上原本我就有的軒轅劍。","原來萬靈血、通天塔全都是寧珂郡主她自己建議的─────","當時，她不斷慫恿著我………","由於萬靈血太傷天害理，通天塔過於勞民傷財，違背我之原則良知。","我心中反覆掙扎很久，不知是否該接受─────","寧珂郡主竟是告訴我們：她最初是因看不慣你為了自己野心，濫殺無辜收集萬靈血，所以才決心幫助我們！","獨孤郡主就是這樣的人………\n她工於心計，最擅長操縱他人互相對立，等雙方鬥到你死我活、兩敗俱傷之時，她才由中漁利。","不過，宇文兄弟為何最後還是接受了她所提議的萬靈血以及通天塔……？","我思考很久，最後憶起師父生前一再告訴我：「承擔大事者，要能以大局為念，不懼背負惡名，以力拯更多之人」──────","在下明白了──────\n所以宇文兄最後決心寧願自己背上所有惡名，也要為世人來封印裂痕？","是的………感謝你們終能明白我這一路走來之苦處！","宇文大人呀，您把自己說得可真是好委屈呀！","寧珂郡主────────","呵呵………▲▲公子，好久不見了！\n你覺得我的新模樣可否好看啊？","寧珂郡主………虧我們一直把妳當成知心朋友，原來妳一直在利用我們，還殺死玉兒姊姊！","哈哈，▲▲公子～～\n這正所謂「吾寧鬥智不鬥力」───","我當時力量被神州結界給封起來了，不及你和宇文大人，所以只好用點腦兒，讓你們兩群人自個兒互咬！","可惡，妳─────","宇文大人，我這麼好心留下你的命，苦苦懇求你加入我們魔界………你竟在背後挑撥我和▲▲公子美好的感情，真是過分哦！","我不知道妳為什麼不肯殺我，但既然妳留下我的命，未來總有一天妳一定會為此後悔的────","喔，真是豪情萬丈、氣壯山河───\n不愧是我最仰慕的宇文大人！","來吧，少多說廢話了────\n如今神州結界已破，我力量再也不受限制，就讓你們看看我真正實力吧！","獨孤寧珂，妳輸了─────\n今天妳要為妳這一段時間內所做之罪孽償罪！","償罪…………\n我可還沒完全輸呢！","我來中原前，大王曾給我撒旦之果，吞下它後我能變為真正之惡魔，增加百倍力量，你們少逼我────","獨孤寧珂，妳想吃就吃吧────\n吃下那果子以後，正好讓妳外貌變得和妳的心一樣的醜陋！","宇文大人…………！","獨孤寧珂，也許我自己也是滿身之罪業，但今日我還是非殺了妳不可，替天下人除害───","宇文大人……你……你……","把妳那個撒旦之果吞下去啊────\n妳受傷，我也十分虛弱，我們兩人正好來個公平的最後了斷！","我……我……","少再玩花招！\n妳再不出手，那我可要集中我如今全力先攻擊了───","我輸了……宇文大人……我還是無法在你面前吃下它……哈哈……我辜負了……大王………","她死了，宇文兄弟─────\n元凶已滅，所有恩怨都已結束了！","為什麼……為什麼妳不還手？\n撒旦之果的力量這麼可怕，妳還大有機會還擊的啊，妳為什麼卻還手都不還手────","宇文大哥，你怎麼了…………\n她不是罪有應得嗎？","我……我明白她為什麼不願吃下那果子………還有………她這段時間為什麼不願殺死我………","………？","各位，時間緊迫萬分───\n我們必須爭取時間了，別再耽擱！","仙人吩咐我們須趕在主魔界降臨之前回返過去，我們該上塔頂去。","獨孤郡主…………\n宇文拓在此謝謝妳的不殺之恩！"],"where":[],"openedBy":[],"givenBy":[5396]},{"id":5664,"facts":[],"opens":[],"gives":[],"lines":["再這樣下去，村子怎麼住人啊！"],"where":[],"openedBy":[],"givenBy":[]},{"id":5666,"facts":[],"opens":[],"gives":[],"lines":["又要犧牲一個女孩了，唉！"],"where":[],"openedBy":[],"givenBy":[]},{"id":5669,"facts":[],"opens":[],"gives":[],"lines":["每年的河神祭，總是讓村裡不得安寧，卻也不見得有好日子可以過……"],"where":[],"openedBy":[],"givenBy":[]},{"id":6001,"facts":[["換地圖","月河村大夫家（地圖 20）"]],"opens":[],"gives":[],"lines":[],"where":["月河村（地圖 16）的地區「進月代夫」","月河村（地圖 16）的地區「進月代夫」"],"openedBy":[],"givenBy":[]},{"id":6002,"facts":[["換地圖","月河村（地圖 16）"]],"opens":[],"gives":[],"lines":[],"where":["月河村大夫家（地圖 20）的地區「出月大夫」"],"openedBy":[],"givenBy":[]},{"id":6003,"facts":[["換地圖","月河村旅店一樓（地圖 18）"]],"opens":[],"gives":[],"lines":[],"where":["月河村（地圖 16）的地區「進月旅」","月河村（地圖 16）的地區「進月旅」"],"openedBy":[],"givenBy":[]},{"id":6004,"facts":[["換地圖","月河村（地圖 16）"]],"opens":[],"gives":[],"lines":[],"where":["月河村旅店一樓（地圖 18）的地區「出月旅」"],"openedBy":[],"givenBy":[]},{"id":6005,"facts":[["換地圖","月河村旅店二樓（地圖 19）"]],"opens":[],"gives":[],"lines":[],"where":["月河村旅店一樓（地圖 18）的地區「進月旅二」"],"openedBy":[],"givenBy":[]},{"id":6006,"facts":[["換地圖","月河村旅店一樓（地圖 18）"]],"opens":[],"gives":[],"lines":[],"where":["月河村旅店二樓（地圖 19）的地區「出月旅二」"],"openedBy":[],"givenBy":[]},{"id":6007,"facts":[["換地圖","月河村雜貨店（地圖 17）"]],"opens":[],"gives":[],"lines":[],"w const PAGE_SIZE = 40;
const $ = id => document.getElementById(id);
const byId = new Map(DATA.events.map(event => [event.id, event]));
const tabs = [...document.querySelectorAll('.tab')];
const FILE_EVENTS = 2000;

let shownTab = 0;
let shownPage = 0;
let list = [];
let marked = 0;

function fileOf(id) {
  return Math.min(Math.floor(id / FILE_EVENTS), tabs.length - 1);
}

function escaped(text) {
  return text.replace(/[&<>"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[character]);
}

function eventLinks(ids) {
  return ids.map(id => `<a data-event="${id}">${id}</a>`).join('、');
}

// An event as a block: its number and where it is set off, its facts, the events it opens or hands on, its lines.
function eventHtml(event) {
  const where = event.where.length
    ? `<span class="where">${event.where.map(escaped).join('；')}</span>`
    : '<span class="where none">不在地圖上，由其他事件開啟或交給角色</span>';
  const facts = event.facts.map(([label, text]) => [label, escaped(text)]);

  if (event.openedBy.length) {
    facts.push(['開啟它的', eventLinks(event.openedBy)]);
  }

  if (event.givenBy.length) {
    facts.push(['交給角色的', eventLinks(event.givenBy)]);
  }

  if (event.opens.length) {
    facts.push(['開啟', eventLinks(event.opens)]);
  }

  if (event.gives.length) {
    facts.push(['交給角色', eventLinks(event.gives)]);
  }

  const lines = event.lines.map(line => `<p>${escaped(line)}</p>`);
  const shown = lines.slice(0, 3).join('');
  const rest = lines.length > 3
    ? `<details><summary>其餘 ${lines.length - 3} 句台詞</summary>${lines.slice(3).join('')}</details>`
    : '';
  return `<div class="event${event.id === marked ? ' marked' : ''}" id="event${event.id}">`
    + `<div class="head"><span class="number">${event.id}</span>${where}</div>`
    + (facts.length ? `<dl>${facts.map(([label, text]) => `<dt>${label}</dt><dd>${text}</dd>`).join('')}</dl>` : '')
    + (lines.length ? `<div class="lines">${shown}${rest}</div>` : '')
    + '</div>';
}

// What the search finds: the event of a number, else every event whose places, facts or lines hold the words.
function found(text) {
  const words = text.trim().split(/\s+/).filter(Boolean);

  if (words.length === 1 && /^\d+$/.test(words[0]) && byId.has(Number(words[0]))) {
    return [byId.get(Number(words[0]))];
  }

  return DATA.events.filter(event => {
    const all = [event.id, ...event.where, ...event.facts.flat(), ...event.lines].join('\n');
    return words.every(word => all.includes(word));
  });
}

function render(scrollTo) {
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  shownPage = Math.min(shownPage, pages - 1);
  const shown = list.slice(shownPage * PAGE_SIZE, (shownPage + 1) * PAGE_SIZE);
  $('body').innerHTML = shown.length ? shown.map(eventHtml).join('') : '<div class="empty">沒有符合的事件</div>';
  $('pages').textContent = `${shownPage + 1} / ${pages}`;
  $('previous').disabled = shownPage === 0;
  $('next').disabled = shownPage === pages - 1;
  const query = $('search').value.trim();
  $('heading').textContent = query
    ? `搜尋「${query}」：${list.length} 個事件`
    : `${DATA.tabs[shownTab].label}　事件 ${DATA.tabs[shownTab].range}（${list.length} 個）`;
  const target = scrollTo ? $(`event${scrollTo}`) : null;
  $('body').scrollTop = target ? target.offsetTop - $('body').offsetTop - 8 : 0;
}

function showTab(at) {
  shownTab = at;
  tabs.forEach((tab, index) => tab.classList.toggle('chosen', index === at && !$('search').value.trim()));
  list = DATA.events.filter(event => fileOf(event.id) === at);
  shownPage = 0;
  render();
}

// An event shown on its tab's page, marked; the search cleared.
function showEvent(id) {
  if (!byId.has(id)) {
    return;
  }

  $('search').value = '';
  marked = id;
  showTab(fileOf(id));
  shownPage = Math.floor(list.findIndex(event => event.id === id) / PAGE_SIZE);
  render(id);
  keepPlace(String(id));
}

function search() {
  const query = $('search').value.trim();
  tabs.forEach((tab, index) => tab.classList.toggle('chosen', index === shownTab && !query));

  if (!query) {
    showTab(shownTab);
    return;
  }

  list = found(query);
  shownPage = 0;
  render();
}

// The event shown kept in the address (and in the home page's, which opens it there), so that its link can be copied.
function keepPlace(detail) {
  history.replaceState(null, '', `${location.search}#${encodeURIComponent(detail)}`);

  if (window.parent !== window) {
    window.parent.postMessage({ shown: 'events', detail }, '*');
  }
}

function addressed() {
  try {
    return decodeURIComponent(location.hash.slice(1));
  } catch {
    return '';
  }
}

function showAddressed() {
  const id = Number(addressed());

  if (byId.has(id)) {
    showEvent(id);
  } else {
    showTab(0);
  }
}

function turnPage(step) {
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  const next = Math.min(Math.max(shownPage + step, 0), pages - 1);

  if (next !== shownPage) {
    shownPage = next;
    render();
  }
}

// The book keeps its size: scaled whole to fit the window, centred.
function fit() {
  const book = document.querySelector('.book');
  const scale = Math.min(innerWidth / book.offsetWidth, innerHeight / book.offsetHeight);
  const left = (innerWidth - book.offsetWidth * scale) / 2;
  const top = (innerHeight - book.offsetHeight * scale) / 2;
  book.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
}

$('tabs').addEventListener('click', event => {
  const tab = event.target.closest('.tab');

  if (tab) {
    $('search').value = '';
    marked = 0;
    showTab(Number(tab.dataset.at));
    keepPlace(DATA.tabs[shownTab].label);
  }
});

$('body').addEventListener('click', event => {
  const link = event.target.closest('a[data-event]');

  if (link) {
    showEvent(Number(link.dataset.event));
  }
});

$('previous').addEventListener('click', () => turnPage(-1));
$('next').addEventListener('click', () => turnPage(1));
$('search').addEventListener('input', search);

document.addEventListener('keydown', event => {
  if (event.target === $('search')) {
    return;
  }

  const body = $('body');
  const page = body.clientHeight - 40;
  const keys = {
    ArrowUp: () => { body.scrollTop -= 40; },
    ArrowDown: () => { body.scrollTop += 40; },
    PageUp: () => { body.scrollTop -= page; },
    PageDown: () => { body.scrollTop += page; },
    ArrowLeft: () => turnPage(-1),
    ArrowRight: () => turnPage(1),
  };

  if (keys[event.key]) {
    keys[event.key]();
    event.preventDefault();
  }
});

addEventListener('resize', fit);
addEventListener('hashchange', showAddressed);
fit();
showAddressed();
</script>
